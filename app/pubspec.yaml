name: dzr_builder
description: "DZR Builder — companion app NATIVE DZR CloudBuilder. Build APK Flutter/Kotlin, live progress, riwayat + download APK, leaderboard. Tanpa WebView sama sekali."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP native (bukan webview!) — komunikasi ke REST API bot
  dio: ^5.4.3
  # File picker native (SAF Android) — pilih ZIP project
  file_picker: ^8.1.2
  # Storage key lokal (native SharedPreferences)
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generator icon launcher (mipmap semua densitas) dari assets/icon.png
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0B0B10"
  adaptive_icon_foreground: "assets/icon.png"
