name: Build APK Kotlin Native

# ═══════════════════════════════════════════════════════════════════════════
#  DZR CloudBuilder — Mode build #2: Android NATIVE (Kotlin/Java + Gradle)
#  100% TERPISAH dari build.yml (Flutter):
#   • GAK ADA Flutter SDK — gak di-install, gak dipanggil, gak di-emulate
#   • APK dibangun murni ./gradlew assembleRelease (atau gradle fallback)
#   • Signing stable per-user DISALIN dari build.yml (keystores/u<id>.jks +
#     keytool generate + commit ke repo + zipalign + apksigner) — Android-
#     generic, identik hasilnya dengan jalur Flutter.
#   • Bot (index.js) yang deliver APK — workflow CUMA upload artifact
#     (anti APK dobel, konsisten dgn build.yml).
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Android native (Kotlin/Java)'
        required: true
      tag:
        description: 'Build tag'
        required: true
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      build_format:
        description: 'Output format'
        required: false
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
      icon_url:
        description: 'Icon URL'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''
      keystore_id:
        description: 'v6.2 ID keystore per user (mis. 12345 → keystores/u12345.jks). Kosong = keystore global.'
        required: false
        default: ''

      license:
        description: '🛡️ v4.3 Benteng Lisensi (anti-repack): "on" = pasang LicenseGuard (cek signature asli runtime). Kosong = off.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    # Native Gradle build umumnya lebih cepet dari Flutter, tapi project
    # gede + download dependencies pertama kali bisa lama — 25 menit biar
    # longgar (bot nunggu 27 menit di sisi dia).
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      INPUT_APP_NAME: ${{ inputs.app_name }}
      INPUT_ZIP_URL: ${{ inputs.zip_url }}
      INPUT_CHAT_ID: ${{ inputs.chat_id }}
      INPUT_BOT_TOKEN: ${{ inputs.bot_token }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_ICON_URL: ${{ inputs.icon_url }}
      INPUT_BUILD_TYPE: ${{ inputs.build_type }}
      INPUT_BUILD_FORMAT: ${{ inputs.build_format }}
      INPUT_KEYSTORE_ID: ${{ inputs.keystore_id }}

    steps:
      # ── ⚠️ SESUAI PROMPT: GAK ADA step install Flutter di workflow ini ──
      # Android SDK + build-tools (zipalign/apksigner) udah pre-installed di
      # ubuntu-latest (ANDROID_HOME). JDK 17 buat Gradle.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── ⚡ Rolling cache (pola sama dgn build.yml): key per run_id + prefix
      # restore → cache selalu ke-update, dependency gradle makin cepet. ──
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gkotlin-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gkotlin-v1-${{ runner.os }}-

      # ── ⚡ v3.4: TUNE GRADLE (request owner: "build makin cepet") ──
      # Parallel task + build cache + heap pas — dampak langsung ke fase
      # configure/compile/dex Gradle. Aman buat semua project Kotlin.
      - name: Tune Gradle (speed)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'GPROP'
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          GPROP
          echo "⚡ gradle.properties tuning dipasang (parallel + caching + heap 3g)"

      - name: Download + Extract + Locate Project
        run: |
          # ── Download (identik dgn build.yml) ──
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o project.zip \
            --retry 3 --retry-delay 2 --retry-connrefused \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "$INPUT_ZIP_URL")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Download failed! HTTP $HTTP_CODE"
            exit 1
          fi
          MAGIC=$(od -A n -t x1 -N 4 project.zip 2>/dev/null | tr -d ' ')
          if ! echo "$MAGIC" | grep -qi "^504b"; then
            echo "ERROR: Not a valid ZIP file!"
            exit 1
          fi
          echo "ZIP: $(du -sh project.zip | cut -f1)"

          # ── Extract ──
          mkdir -p project
          if ! unzip -q project.zip -d project; then
            echo "ERROR: Extraction failed!"
            exit 1
          fi

          # ── Cari project dir: settings.gradle(.kts) / build.gradle(.kts) ──
          # (padanan PROJECT_DIR dgn pubspec.yaml di build.yml — cari root
          # dulu, terus maxdepth 3 buat ZIP yang di-bungkus folder)
          PROJECT_DIR=""
          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ] \
             || [ -f "project/build.gradle" ] || [ -f "project/build.gradle.kts" ]; then
            PROJECT_DIR="project"
          else
            INNER=$(find project -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) | head -1)
            if [ -n "$INNER" ]; then
              PROJECT_DIR=$(dirname "$INNER")
            fi
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No settings.gradle / build.gradle found (bukan project Android native?)"
            ls -R project | head -40
            exit 1
          fi
          echo "Project: $PROJECT_DIR"
          rsync -a --remove-source-files "$PROJECT_DIR/" . 2>/dev/null || {
            cp -r "$PROJECT_DIR"/* . 2>/dev/null || true
            cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
          }
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ] \
             && [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: Gradle files missing setelah extract!"
            exit 1
          fi
          rm -rf project project.zip

          # ── gradlew: exec permission + fallback tanpa wrapper ──
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          elif command -v gradle >/dev/null 2>&1; then
            echo "⚠️ gradlew gak ada di ZIP → pake system gradle ($(gradle --version 2>/dev/null | grep Gradle | head -1))"
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          else
            echo "ERROR: Project gak bawa gradlew DAN system gradle gak ada."
            exit 1
          fi

          # ── Sanity: minimal ada module app/ (build.gradle di root doang gak cukup) ──
          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            MODULE_G=$(find . -maxdepth 2 \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "./build.gradle*" | head -1)
            if [ -n "$MODULE_G" ]; then
              echo "ℹ️ Module app bukan 'app/' — ketemu: $MODULE_G (biarin, gradle yang atur)"
            else
              echo "WARNING: gak nemu module-level build.gradle — build mungkin gagal (project multi-module gak standar?)"
            fi
          fi

      # ── 🩺 v3.8.0: DOKTER BUILD (auto-repair pra-build) — request owner:
      # "kalo kurang apa gitu otomatis di cek apa yang kurang baru tambahin
      # semua biar bisa biar user gak usah bolak balik fix". Ini dia dia:
      # permission ilang, label/icon kosong, launcher activity gak ke-daftar,
      # namespace/applicationId kosong (WAJIB di AGP 8), sdk literal ke tua,
      # wrapper ilang, icon launcher ilang (auto-generate premium). Primum
      # non nocere: nilai yang udah di-set user GAK disentuh. ──
      - name: Doctor (auto-repair project)
        run: |
          python3 << 'PYDOC'
          import glob, os, re

          APP = os.environ.get('INPUT_APP_NAME', 'MyApp') or 'MyApp'
          applied = []

          def xml_esc(s):
              return (str(s).replace('&', '&amp;').replace('<', '&lt;')
                      .replace('>', '&gt;').replace('"', '&quot;'))

          # ── cari manifest utama (module terdangkal) ──
          mans = sorted(glob.glob('*/src/main/AndroidManifest.xml')) + ['src/main/AndroidManifest.xml']
          MAN = next((p for p in mans if os.path.isfile(p)), None)
          if MAN:
              src = open(MAN, encoding='utf-8').read()
              tagm = re.search(r'<application\b[^>]*>', src)
              if not tagm:
                  print('DOC: manifest rusak (gak ada <application>) — dokter runner gak nerjemahin, biarin gradle yang protes')
              else:
                  tag = tagm.group(0)
                  newtag = tag
                  if 'android.permission.INTERNET' not in src:
                      src = re.sub(r'(<application\b)',
                                   '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                                   '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n\\1', src, count=1)
                      applied.append('permission INTERNET ke-inject')
                      tagm = re.search(r'<application\b[^>]*>', src)
                      tag = tagm.group(0)
                      newtag = tag
                  if 'android:label=' not in tag:
                      newtag = newtag.replace('<application', '<application android:label="' + xml_esc(APP) + '"', 1)
                      applied.append('android:label="' + APP + '" ke-inject')
                  if 'android:icon=' not in tag:
                      newtag = newtag.replace('<application', '<application android:icon="@mipmap/ic_launcher"', 1)
                      applied.append('android:icon=@mipmap/ic_launcher ke-inject')
                  if newtag != tag:
                      src = src.replace(tag, newtag, 1)
                      tag = newtag
                  if 'android.intent.category.LAUNCHER' not in src:
                      mainc = None
                      for root, _, files in os.walk('.'):
                          if '/build/' in root.replace(os.sep, '/'):
                              continue
                          for f in files:
                              if f in ('MainActivity.kt', 'MainActivity.java'):
                                  mainc = os.path.join(root, f)
                      if mainc:
                          cls = os.path.splitext(mainc)[0].replace(os.sep, '.').lstrip('.')
                          act = ('        <activity\n            android:name="' + cls + '"\n'
                                 '            android:exported="true">\n'
                                 '            <intent-filter>\n'
                                 '                <action android:name="android.intent.action.MAIN"/>\n'
                                 '                <category android:name="android.intent.category.LAUNCHER"/>\n'
                                 '            </intent-filter>\n        </activity>\n    ')
                          src = src.replace('</application>', act + '</application>', 1)
                          applied.append('MainActivity (' + cls + ') ke-daftar + intent launcher')
                      else:
                          print('DOC: WARNING — gak ada intent LAUNCHER dan class MainActivity gak ketemu')
                  open(MAN, 'w', encoding='utf-8').write(src)
                  # label @string/app_name tapi strings.xml gak punya → inject
                  lm = re.search(r'android:label\s*=\s*"@string/([a-zA-Z0-9_]+)"', src)
                  if lm:
                      vdir = os.path.join(os.path.dirname(MAN), 'res', 'values')
                      spath = os.path.join(vdir, 'strings.xml')
                      old = open(spath, encoding='utf-8').read() if os.path.isfile(spath) else ''
                      if ('name="' + lm.group(1) + '"') not in old:
                          os.makedirs(vdir, exist_ok=True)
                          item = '    <string name="' + lm.group(1) + '">' + xml_esc(APP) + '</string>'
                          open(spath, 'w', encoding='utf-8').write(
                              old.replace('<resources>', '<resources>\n' + item) if '<resources>' in old
                              else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n' + item + '\n</resources>\n')
                          applied.append('strings.xml: ' + lm.group(1) + '="' + APP + '" ke-inject')

          # ── module gradle: applicationId + floor sdk + migrasi namespace ──
          pkg = None
          mods = [p for p in sorted(glob.glob('*/build.gradle') + glob.glob('*/build.gradle.kts'))
                  if 'defaultConfig' in (open(p, encoding='utf-8').read())]
          if MAN and os.path.isfile(MAN):
              pm = re.search(r'<application\b[^>]*\spackage\s*=\s*"([^"]+)"', open(MAN, encoding='utf-8').read())
              if pm:
                  pkg = pm.group(1)
          for p in mods:
              src = open(p, encoding='utf-8').read()
              orig = src
              am = re.search(r'applicationId\s*=?\s*["\']([^"\']+)["\']', src)
              if am and not pkg:
                  pkg = am.group(1)
              if not re.search(r'(?m)^\s*applicationId\s*=?\s*["\'][^"\']+["\']', src) and pkg:
                  src = re.sub(r'(?m)^([ \t]*)defaultConfig\s*\{',
                               lambda m: m.group(0) + '\n' + m.group(1) + '    applicationId "' + pkg + '"', src, count=1)
                  applied.append('applicationId "' + pkg + '" ke-inject (' + p + ')')
              for kind, floor in (('compileSdk', 34), ('minSdk', 23), ('targetSdk', 34)):
                  def _floor(m):
                      n = int(m.group(2))
                      if n < floor:
                          applied.append(kind + ' ' + str(n) + ' -> ' + str(floor) + ' (' + p + ')')
                          return m.group(1) + str(floor)
                      return m.group(0)
                  src = re.sub(r'(?m)(' + kind + r'\s*=?\s*)(\d+)', _floor, src)
              if src != orig:
                  open(p, 'w', encoding='utf-8').write(src)

          # migrasi namespace (AGP 8 wajib): inject ke module + buang package attr
          if pkg and mods:
              p = mods[0]
              src = open(p, encoding='utf-8').read()
              if not re.search(r'(?m)^\s*namespace\s*=?\s*["\']', src) and re.search(r'(?m)^([ \t]*)android\s*\{', src):
                  src = re.sub(r'(?m)^([ \t]*)android\s*\{',
                               lambda m: m.group(0) + '\n' + m.group(1) + '    namespace "' + pkg + '"', src, count=1)
                  if MAN and os.path.isfile(MAN):
                      msrc = open(MAN, encoding='utf-8').read()
                      tagm = re.search(r'<application\b[^>]*>', msrc)
                      if tagm and ' package="' in tagm.group(0):
                          msrc = msrc.replace(tagm.group(0), re.sub(r'\s+package\s*=\s*"[^"]+"', '', tagm.group(0)), 1)
                          open(MAN, 'w', encoding='utf-8').write(msrc)
                  open(p, 'w', encoding='utf-8').write(src)
                  applied.append('namespace "' + pkg + '" ke-inject + package attr dibersihin (siap AGP 8)')

          for a in applied:
              print('DOC: ' + a)
          if not applied:
              print('DOC: project sehat — gak ada yang perlu dibenerin')
          PYDOC

          # ── wrapper ilang total → inject Gradle 8.7 (gradlew bakal jalan) ──
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ] && [ -f "gradlew" ]; then
            mkdir -p gradle/wrapper
            printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip\nvalidateDistributionUrl=true\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties
            echo "DOC: gradle-wrapper.properties ilang → ke-inject (Gradle 8.7)"
          fi

          # ── icon launcher ilang → generate premium (gradient + inisial) ──
          if [ -z "$(find . -path '*res/mipmap*' -name 'ic_launcher*' -not -path '*/build/*' 2>/dev/null)" ] && [ -z "$(find . -path '*res/drawable*' -name 'ic_launcher*' -not -path '*/build/*' 2>/dev/null)" ]; then
            python3 -c "import PIL" 2>/dev/null || pip3 install -q pillow || true
            python3 << 'PILGEN'
          import glob, hashlib, os

          try:
              from PIL import Image, ImageDraw, ImageFont
          except Exception:
              print('PILGEN: pillow gak tersedia — icon dilewat (non-fatal)')
              raise SystemExit(0)

          APP = os.environ.get('INPUT_APP_NAME', 'MyApp') or 'MyApp'
          h = int(hashlib.md5(APP.encode()).hexdigest(), 16)
          hue1, hue2 = h % 360, (h % 360 + 55) % 360

          def hsl(hdeg, s, l):
              s /= 100; l /= 100
              k = lambda n: (n + hdeg / 30) % 12
              f = lambda n: l - s * min(l, 1 - l) * max(-1, min(k(n) - 3, 9 - k(n), 1))
              return tuple(int(255 * x) for x in (f(0), f(8), f(4)))

          c1, c2 = hsl(hue1, 72, 52), hsl(hue2, 70, 40)
          S = 512
          img = Image.new('RGB', (S, S))
          d = ImageDraw.Draw(img)
          for y in range(S):
              t = y / (S - 1)
              d.line([(0, y), (S, y)], fill=tuple(int(a + (b - a) * t) for a, b in zip(c1, c2)))
          d.ellipse((-S * 0.25, S * 0.55, S * 0.9, S * 1.6), outline=(255, 255, 255), width=10)

          words = [w for w in APP.split() if w][:2]
          ini = ''.join(w[0] for w in words).upper() or 'AP'
          font = None
          for fp in ('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',
                     '/usr/share/fonts/truetype/freefont/FreeSansBold.ttf'):
              if os.path.isfile(fp):
                  font = ImageFont.truetype(fp, 200)
                  break
          if font is None:
              font = ImageFont.load_default()
          tb = d.textbbox((0, 0), ini, font=font)
          d.text(((S - (tb[2] - tb[0])) / 2 - tb[0], (S - (tb[3] - tb[1])) / 2 - tb[1]), ini,
                 fill=(255, 255, 255), font=font)

          # module dir dari manifest ketemu
          mans = sorted(glob.glob('*/src/main/AndroidManifest.xml'))
          base = os.path.dirname(os.path.dirname(os.path.dirname(mans[0]))) if mans else 'app'
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for q, px in sizes.items():
              odir = os.path.join(base, 'res', 'mipmap-' + q)
              os.makedirs(odir, exist_ok=True)
              img.resize((px, px), Image.LANCZOS).save(os.path.join(odir, 'ic_launcher.png'))
          print('PILGEN: icon premium "' + ini + '" ke-generate ke ' + base + '/res/mipmap-*')
          PILGEN
          else
            echo "DOC: icon launcher udah ada — gak disentuh"
          fi

      # ── 🩺 v3.8.0: KFIX.PY — dokter REAKTIF pas build gagal (pola bldfix.py
      # di build.yml). Baca error gradle → patch toolchain/project → retry.
      # Jangkar: wrapper gradle, AGP (+migrasi namespace), Kotlin plugin,
      # compileSdk/minSdk, SDK location. ──
      - name: Write Kotlin Doctor helper (kfix.py)
        run: |
          cat > /tmp/kfix.py <<'PYKFIX'
          import glob, os, re

          err = os.environ.get('BLD_ERR', '')
          applied = []
          V = r'(\d+(?:\.\d+)*)'

          def vkey(v):
              return [int(x) for x in v.split('.') if x.isdigit()]

          def rewrite(path, fn):
              src = open(path, encoding='utf-8').read()
              out = fn(src)
              if out != src:
                  open(path, 'w', encoding='utf-8').write(out)
                  return True
              return False

          def bump_wrapper(target):
              n = 0
              p = 'gradle/wrapper/gradle-wrapper.properties'
              if os.path.isfile(p):
                  cur = None
                  mm = re.search(r'gradle-' + V + r'-(bin|all)\.zip', open(p, encoding='utf-8').read())
                  if mm:
                      cur = mm.group(1)
                  if cur is None or vkey(cur) < vkey(target):
                      # dist gradle gak ada X.Y.0 (8.14.0->8.14) DAN gak ada bare X (8.0 tetap 8.0)
                      dist = re.sub(r'(\.0)+$', '', target) if target.count('.') >= 2 else target
                      url = 'https\\://services.gradle.org/distributions/gradle-' + dist + '-' + (mm.group(2) if mm else 'bin') + '.zip'
                      def _w(src):
                          src = re.sub(r'(?m)^distributionUrl\s*=.*$', 'distributionUrl=' + url, src)
                          return re.sub(r'(?m)^distributionSha256Sum\s*=.*\n?', '', src)
                      n += rewrite(p, _w)
                      applied.append('Gradle wrapper ' + str(cur) + ' -> ' + target)
              return n

          def gradle_for_agp(v):
              kv = vkey(v)
              if kv < [8, 0]:   return '7.5'
              if kv < [8, 2]:   return '8.0'
              if kv < [8, 3]:   return '8.2'
              if kv < [8, 4]:   return '8.4'
              if kv < [8, 5]:   return '8.6'
              if kv < [8, 7]:   return '8.7'
              if kv < [8, 8]:   return '8.9'
              if kv < [8, 9]:   return '8.10'
              return '8.11'

          def gradle_files():
              return ['settings.gradle', 'settings.gradle.kts', 'build.gradle', 'build.gradle.kts'] + \
                     glob.glob('*/build.gradle') + glob.glob('*/build.gradle.kts') + \
                     glob.glob('buildSrc/*/build.gradle') + glob.glob('buildSrc/*/build.gradle.kts')

          def bump_agp(target):
              n = 0
              pat_classpath = re.compile(r'(classpath\s+["\']com\.android\.tools\.build:gradle:)' + V + r'(["\'])')
              pat_plugin = re.compile(r'((?:id|alias)\s+\(?["\']com\.android\.application["\']\)?\s+version\s+["\'])' + V + r'(["\'])')
              def _p(src):
                  return pat_plugin.sub(lambda m: m.group(1) + target + m.group(2), src)
              def _c(src):
                  return pat_classpath.sub(lambda m: m.group(1) + target + m.group(2), src)
              for p in gradle_files():
                  if os.path.isfile(p):
                      n += rewrite(p, _p) + rewrite(p, _c)
              if n:
                  applied.append('AGP -> ' + target)
                  # AGP 8+ butuh Gradle pasangan-nya + namespace di module
                  n += bump_wrapper(gradle_for_agp(target))
                  if vkey(target) >= vkey('8.0'):
                      n += migrate_namespace()
              return n

          def migrate_namespace():
              n = 0
              MAN = None
              for cand in sorted(glob.glob('*/src/main/AndroidManifest.xml')):
                  MAN = cand
                  break
              pkg = None
              if MAN:
                  msrc = open(MAN, encoding='utf-8').read()
                  pm = re.search(r'<application\b[^>]*?\spackage\s*=\s*"([^"]+)"', msrc)
                  if pm:
                      pkg = pm.group(1)
              for p in glob.glob('*/build.gradle') + glob.glob('*/build.gradle.kts'):
                  src = open(p, encoding='utf-8').read()
                  if 'namespace' in src or not re.search(r'(?m)^([ \t]*)android\s*\{', src):
                      continue
                  use = pkg
                  if not use:
                      am = re.search(r'applicationId\s*=?\s*["\']([^"\']+)["\']', src)
                      if am:
                          use = am.group(1)
                  if not use:
                      continue
                  def _ns(m):
                      return m.group(0) + '\n' + m.group(1) + '    namespace "' + use + '"'
                  src2 = re.sub(r'(?m)^([ \t]*)android\s*\{', _ns, src, count=1)
                  open(p, 'w', encoding='utf-8').write(src2)
                  if MAN:
                      msrc = open(MAN, encoding='utf-8').read()
                      tm = re.search(r'<application\b[^>]*>', msrc)
                      if tm and ' package="' in tm.group(0):
                          msrc = msrc.replace(tm.group(0), re.sub(r'\s+package\s*=\s*"[^"]+"', '', tm.group(0)), 1)
                          open(MAN, 'w', encoding='utf-8').write(msrc)
                  applied.append('namespace "' + use + '" ke-inject (' + p + ')')
                  n += 1
              return n

          def bump_compile_sdk(target):
              n = 0
              for p in glob.glob('*/build.gradle') + glob.glob('*/build.gradle.kts'):
                  src = open(p, encoding='utf-8').read()
                  def _b(m):
                      nonlocal n
                      if int(m.group(2)) < int(target):
                          n += 1
                          applied.append('compileSdk ' + m.group(2) + ' -> ' + target + ' (' + p + ')')
                          return m.group(1) + target
                      return m.group(0)
                  src2 = re.sub(r'(?m)(compileSdk\w*\s*=?\s*)(\d+)', _b, src)
                  if src2 != src:
                      open(p, 'w', encoding='utf-8').write(src2)
              return n

          def bump_min_sdk(target):
              n = 0
              for p in glob.glob('*/build.gradle') + glob.glob('*/build.gradle.kts'):
                  src = open(p, encoding='utf-8').read()
                  def _b(m):
                      nonlocal n
                      if int(m.group(2)) < int(target):
                          n += 1
                          applied.append('minSdk ' + m.group(2) + ' -> ' + target + ' (' + p + ')')
                          return m.group(1) + target
                      return m.group(0)
                  src2 = re.sub(r'(?m)(minSdk\w*\s*=?\s*)(\d+)', _b, src)
                  if src2 != src:
                      open(p, 'w', encoding='utf-8').write(src2)
              return n

          def bump_kotlin(target):
              n = 0
              pat_cp = re.compile(r'(classpath\s+["\']org\.jetbrains\.kotlin:kotlin-gradle-plugin:)' + V + r'(["\'])')
              pat_id = re.compile(r'((?:id|alias)\s+\(?["\']org\.jetbrains\.kotlin\.(?:android|jvm|multiplatform)["\']\)?\s+version\s+["\'])' + V + r'(["\'])')
              for p in gradle_files():
                  if os.path.isfile(p):
                      src = open(p, encoding='utf-8').read()
                      out = pat_cp.sub(lambda m: m.group(1) + target + m.group(2), src)
                      out = pat_id.sub(lambda m: m.group(1) + target + m.group(2), out)
                      if out != src:
                          open(p, 'w', encoding='utf-8').write(out)
                          n += 1
              if n:
                  applied.append('Kotlin plugin -> ' + target)
              return n

          # ── 1) Gradle ke tua / JDK mismatch ──
          m = re.search(r'Minimum supported Gradle version is ' + V, err) \
              or re.search(r'requires Gradle ' + V, err) \
              or re.search(r'Gradle version ' + V + r' is required', err)
          if m and bump_wrapper(m.group(1)):
              pass
          m2 = re.search(r'Unsupported class file major version (\d+)', err)
          if m2:
              major = int(m2.group(1))
              bump_wrapper('8.7' if major >= 61 else '7.6')
          # ── 2) AGP ke tua / namespace ──
          m = re.search(r'Minimum supported AGP version is ' + V, err) \
              or re.search(r'Android Gradle Plugin version .{0,20}minimum supported version of ' + V, err) \
              or re.search(r'requires Android Gradle Plugin ' + V, err)
          if m:
              tgt = m.group(1)
              if vkey(tgt) < vkey('8.2.2'):
                  tgt = '8.2.2'
              bump_agp(tgt)
          if 'Namespace not specified' in err or 'namespace not specified' in err.lower() \
             or 'package="com' in err and 'no longer supported' in err:
              migrate_namespace()
          # ── 3) compileSdk / minSdk ──
          m = re.search(r'requires compileSdk(?: version)? ' + r'(\d+)', err) \
              or re.search(r'compileSdk (\d+) is (?:lower|older)', err) \
              or re.search(r'platforms;android-(\d+)', err)
          if m and int(m.group(1)) >= 34:
              bump_compile_sdk(m.group(1))
          m = re.search(r'cannot be smaller than version (\d+) declared in library', err) \
              or re.search(r'minSdkVersion (\d+) is required', err)
          if m:
              bump_min_sdk(m.group(1))
          # ── 4) Kotlin plugin ke tua ──
          m = re.search(r'minimum supported Kotlin(?: plugin)? version is ' + V, err) \
              or re.search(r'Kotlin version ' + V + r' is (?:too old|not supported)', err)
          if m and vkey(m.group(1)) >= vkey('1.9'):
              bump_kotlin(m.group(1))
          # ── 5) SDK location ilang ──
          if 'SDK location not found' in err and not os.path.isfile('local.properties'):
              sdk = os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT') or ''
              if sdk:
                  open('local.properties', 'w', encoding='utf-8').write('sdk.dir=' + sdk.replace('\\', '\\\\') + '\n')
                  applied.append('local.properties sdk.dir ke-inject')

          print('KFIX: ' + ('; '.join(applied) if applied else 'gak ada pola error yang kebaca'))
          print('KFIX_APPLIED=' + str(len(applied)))
          PYKFIX
          echo "🩺 kfix.py siap (dokter reaktif build)"

      # ── 🤖 v3.3: ALIGN versionCode → RUN NUMBER (syarat kanal OTA) ──
      # Semantik OTA bot: versionCode = GitHub run number (naik terus, rantai
      # update-over-install aman). Project user biasanya versionCode statis (1)
      # → update kedua bakal ditolak Android (INSTALL_FAILED_VERSION_DOWNGRADE).
      # Patch best-effort di module build.gradle(.kts): ganti/inject
      # versionCode+versionName. Hasil diverifikasi aapt di step kanal OTA —
      # gak nempel = kanal di-skip (non-fatal, build tetap jalan).
      - name: Align versionCode to run number (OTA)
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        run: |
          python3 << 'PYEOF'
          import glob, os, re
          run_no = int(os.environ.get('GITHUB_RUN_NUMBER', '1'))
          patched, injected = [], []
          for path in sorted(glob.glob('*/build.gradle') + glob.glob('*/build.gradle.kts')):
              src = open(path, encoding='utf-8').read()
              if 'defaultConfig' not in src:
                  continue
              orig = src
              # ganti versionCode/versionName literal (groovy & kts: dengan/tanpa '=')
              src = re.sub(r'(?m)^(\s*versionCode\s*=?\s*)\d+', lambda m: m.group(1) + str(run_no), src)
              src = re.sub(r'(?m)^(\s*versionName\s*=?\s*)"[^"]*"', lambda m: m.group(1) + '"3.0.%d"' % run_no, src)
              # module gak punya versionCode sama sekali → inject ke defaultConfig
              if not re.search(r'(?m)^\s*versionCode\s*=?\s*\d+', src):
                  def _inject(m):
                      ind = m.group(1)
                      return (m.group(0) + '\n' + ind + '    versionCode = ' + str(run_no)
                              + '\n' + ind + '    versionName = "3.0.' + str(run_no) + '"')
                  src = re.sub(r'(?m)^([ \t]*)defaultConfig\s*\{', _inject, src, count=1)
                  injected.append(path)
              if src != orig:
                  open(path, 'w', encoding='utf-8').write(src)
                  patched.append(path)
          print('versionCode →', run_no, '| patched:', patched or 'GAK ADA', '| injected:', injected or '-')
          PYEOF

      # ── 🔨 Build + DOKTER REAKTIF (v3.8.0, max 3x) ──
      # Dulu: retry bodoh (sleep 5, error yang sama 3x 🤡). Sekarang: gagal
      # → kfix.py analisa errornya → patch toolchain/project → retry. Gak ada
      # fix yang cocok? berhenti terang-terangan (bot kirim log ke owner).
      # ── 🛡️ v4.3 BENTENG LISENSI — tulis helper guard (murah, selalu jalan) ──
      - name: Write License Guard helper
        run: |
          cat > /tmp/dzr_license_guard.py <<'DZRGUARD'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          # 🛡️ DZR CloudBuilder v4.3.0 — BENTENG LISENSI (anti-repack guard installer)
          # Jalan di GitHub Actions SEBELUM compile (step "Benteng Lisensi"):
          #   1. ambil keystore per-user (terenkripsi di repo) → dekrip → SHA-256 cert
          #      (keystore belum ada? generate + commit terenkripsi, race-guard —
          #       identik pola signing block, biar signature konsisten)
          #   2. tulis LicenseGuard.kt / .java (EXPECTED = sha cert) di package launcher
          #   3. patch onCreate → LicenseGuard.check(this) SETELAH super.onCreate
          # Runtime: app cek signature APK-nya sendiri; beda dari asli = layar merah
          # "APK TIDAK SAH" + mati (fail-closed). Repack/re-sign orang lain = kekang.
          # Env: GUARD_MODE=flutter|kotlin · INPUT_KEYSTORE_ID · GH_TOKEN · GH_REPO ·
          #      KS_ENC_KEY · KS_PASS · KS_PASS_OLD · (GUARD_OFFLINE=1 utk test lokal)
          import os, sys, json, base64, glob, re, subprocess, urllib.request, urllib.error

          def fail(msg):
              print("=== BUILD FAILED: " + msg + " ===")
              sys.exit(1)

          MODE = os.environ.get("GUARD_MODE", "flutter").strip()
          GH_TOKEN = os.environ.get("GH_TOKEN", "")
          GH_REPO = os.environ.get("GH_REPO", "")
          KS_ENC_KEY = os.environ.get("KS_ENC_KEY", "")
          KS_PASS = os.environ.get("KS_PASS", "")
          KS_PASS_OLD = os.environ.get("KS_PASS_OLD", "")
          KID = re.sub(r"[^a-zA-Z0-9]", "", os.environ.get("INPUT_KEYSTORE_ID", "") or "")
          OFFLINE = os.environ.get("GUARD_OFFLINE", "") == "1"
          API = "https://api.github.com/repos/" + GH_REPO + "/contents/"

          KT_GUARD = """// 🛡️ Benteng Lisensi v4.3 — auto-generated oleh DZR CloudBuilder
          // Verifikasi signature asli: app hasil repack / re-sign ilegal = nolak jalan.
          package __PKG__

          object LicenseGuard {
              private const val EXPECTED = "__SHA__"

              @JvmStatic
              fun check(activity: android.app.Activity) {
                  try {
                      val pm = activity.packageManager
                      val pi = pm.getPackageInfo(
                          activity.packageName,
                          android.content.pm.PackageManager.GET_SIGNATURES
                      )
                      val sigs = pi.signatures
                      if (sigs == null || sigs.isEmpty()) { fail(activity); return }
                      val md = java.security.MessageDigest.getInstance("SHA-256")
                      val hex = md.digest(sigs[0].toByteArray())
                          .joinToString("") { String.format("%02x", it) }
                      if (!hex.equals(EXPECTED, ignoreCase = true)) fail(activity)
                  } catch (t: Throwable) {
                      fail(activity)
                  }
              }

              private fun fail(a: android.app.Activity) {
                  try {
                      val pad = android.widget.LinearLayout(a)
                      pad.orientation = android.widget.LinearLayout.VERTICAL
                      pad.gravity = android.view.Gravity.CENTER
                      pad.setBackgroundColor(0xFFB00020.toInt())
                      val tv = android.widget.TextView(a)
                      tv.text = "APK TIDAK SAH\\n\\nBuild ini bukan rilis resmi —\\naplikasi sudah dimodifikasi tanpa izin.\\n\\nSilakan install versi asli dari pengembang."
                      tv.setTextColor(-1)
                      tv.textSize = 16f
                      tv.gravity = android.view.Gravity.CENTER
                      tv.setPadding(64, 64, 64, 64)
                      pad.addView(tv)
                      a.setContentView(pad)
                  } catch (_: Throwable) {
                  }
                  try { a.finishAffinity() } catch (_: Throwable) {
                  }
                  android.os.Process.killProcess(android.os.Process.myPid())
              }
          }
          """

          JAVA_GUARD = """// 🛡️ Benteng Lisensi v4.3 — auto-generated oleh DZR CloudBuilder
          // Verifikasi signature asli: app hasil repack / re-sign ilegal = nolak jalan.
          package __PKG__;

          public final class LicenseGuard {
              private static final String EXPECTED = "__SHA__";

              public static void check(android.app.Activity activity) {
                  try {
                      android.content.pm.PackageManager pm = activity.getPackageManager();
                      android.content.pm.PackageInfo pi = pm.getPackageInfo(
                              activity.getPackageName(),
                              android.content.pm.PackageManager.GET_SIGNATURES);
                      if (pi.signatures == null || pi.signatures.length == 0) { fail(activity); return; }
                      java.security.MessageDigest md = java.security.MessageDigest.getInstance("SHA-256");
                      byte[] d = md.digest(pi.signatures[0].toByteArray());
                      StringBuilder sb = new StringBuilder();
                      for (byte b : d) sb.append(String.format("%02x", b));
                      if (!EXPECTED.equalsIgnoreCase(sb.toString())) fail(activity);
                  } catch (Throwable t) {
                      fail(activity);
                  }
              }

              private static void fail(final android.app.Activity a) {
                  try {
                      android.widget.LinearLayout pad = new android.widget.LinearLayout(a);
                      pad.setOrientation(android.widget.LinearLayout.VERTICAL);
                      pad.setGravity(android.view.Gravity.CENTER);
                      pad.setBackgroundColor(0xFFB00020);
                      android.widget.TextView tv = new android.widget.TextView(a);
                      tv.setText("APK TIDAK SAH\\n\\nBuild ini bukan rilis resmi —\\naplikasi sudah dimodifikasi tanpa izin.\\n\\nSilakan install versi asli dari pengembang.");
                      tv.setTextColor(0xFFFFFFFF);
                      tv.setTextSize(16f);
                      tv.setGravity(android.view.Gravity.CENTER);
                      tv.setPadding(64, 64, 64, 64);
                      pad.addView(tv);
                      a.setContentView(pad);
                  } catch (Throwable ignore) { }
                  try { a.finishAffinity(); } catch (Throwable ignore) { }
                  android.os.Process.killProcess(android.os.Process.myPid());
              }
          }
          """

          def sh(cmd):
              return subprocess.run(cmd, capture_output=True)

          def gh_get(path):
              if OFFLINE:
                  return 404, None
              req = urllib.request.Request(API + path + "?ref=main", headers={
                  "Authorization": "Bearer " + GH_TOKEN,
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "dzr-license-guard"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.getcode(), json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception as e:
                  print("⚠️ gh_get error: " + str(e))
                  return 0, None

          def gh_put(path, content_b64, msg):
              if OFFLINE:
                  return 0
              body = json.dumps({"message": msg, "content": content_b64, "branch": "main"}).encode()
              req = urllib.request.Request(API + path, data=body, headers={
                  "Authorization": "Bearer " + GH_TOKEN,
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "dzr-license-guard"}, method="PUT")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.getcode()
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception as e:
                  print("⚠️ gh_put error: " + str(e))
                  return 0

          def obtain_keystore():
              # → siapkan /tmp/guard_ks.enc (ciphertext, ditangani decrypt_and_sha)
              #   atau /tmp/guard_ks.jks langsung (generate fresh / OFFLINE test)
              ks_path = ("keystores/u" + KID + ".jks.enc") if KID else "signing/global-v2.jks.enc"
              print("🔐 [Lisensi] Keystore target: " + ks_path)
              code, js = gh_get(ks_path)
              if code == 200 and js and js.get("content"):
                  open("/tmp/guard_ks.enc", "wb").write(base64.b64decode(js["content"]))
                  return
              # ── Keystore belum ada → generate + commit TERENKRIPSI (race guard) ──
              # Identik pola signing block: generate → enkrip → PUT; PUT gagal (race
              # build lain) → GET balik yang di repo biar signature KONSISTEN.
              print("🔐 [Lisensi] Keystore belum ada — generate baru + commit (terenkripsi)...")
              if not os.path.exists("/tmp/guard_ks.jks") or os.path.getsize("/tmp/guard_ks.jks") == 0:
                  r = sh(["keytool", "-genkeypair", "-v", "-keystore", "/tmp/guard_ks.jks",
                          "-alias", "dzr", "-keyalg", "RSA", "-keysize", "2048",
                          "-validity", "10950", "-storepass", KS_PASS, "-keypass", KS_PASS,
                          "-dname", "CN=DZR CloudBuilder, OU=Deruzuan, O=DZR, L=Jakarta, C=ID"])
                  if r.returncode != 0 or not os.path.exists("/tmp/guard_ks.jks") or os.path.getsize("/tmp/guard_ks.jks") == 0:
                      fail("gak bisa generate keystore (keytool): " + r.stderr.decode("utf-8", "replace")[:200])
              if OFFLINE:
                  print("🔐 [Lisensi] OFFLINE test — pake keystore lokal doang")
                  return
              enc = sh(["openssl", "enc", "-aes-256-cbc", "-pbkdf2", "-iter", "600000", "-salt",
                        "-in", "/tmp/guard_ks.jks", "-pass", "pass:" + KS_ENC_KEY])
              if enc.returncode != 0 or not enc.stdout:
                  fail("gak bisa enkrip keystore buat commit")
              put = gh_put(ks_path, base64.b64encode(enc.stdout).decode(),
                           "chore: signing keystore (license guard bootstrap, encrypted at rest)")
              if put in (200, 201):
                  print("🔐 [Lisensi] Keystore baru disimpen terenkripsi (" + ks_path + ")")
              else:
                  code2, js2 = gh_get(ks_path)
                  if code2 == 200 and js2 and js2.get("content"):
                      open("/tmp/guard_ks.enc", "wb").write(base64.b64decode(js2["content"]))
                      print("🔐 [Lisensi] Race guard: pake keystore dari repo (identik)")
                      return
                  fail("keystore gak bisa disimpan/diambil (HTTP " + str(put) + ") — stop biar signature konsisten")

          def decrypt_and_sha():
              if os.path.exists("/tmp/guard_ks.enc"):
                  d = sh(["openssl", "enc", "-d", "-aes-256-cbc", "-pbkdf2", "-iter", "600000",
                          "-in", "/tmp/guard_ks.enc", "-out", "/tmp/guard_ks.jks",
                          "-pass", "pass:" + KS_ENC_KEY])
                  if d.returncode != 0 or not os.path.exists("/tmp/guard_ks.jks") or os.path.getsize("/tmp/guard_ks.jks") == 0:
                      fail("keystore terenkripsi ada tapi GAGAL didekrip (cek secret KS_ENC_KEY)")
              pass_used = None
              for cand in (KS_PASS, KS_PASS_OLD):
                  if cand and sh(["keytool", "-list", "-keystore", "/tmp/guard_ks.jks",
                                  "-storepass", cand, "-alias", "dzr"]).returncode == 0:
                      pass_used = cand
                      break
              if not pass_used:
                  fail("keystore didekrip tapi pass gak cocok (KS_PASS/KS_PASS_OLD salah)")
              r = sh(["keytool", "-list", "-v", "-keystore", "/tmp/guard_ks.jks",
                      "-storepass", pass_used, "-alias", "dzr"])
              m = re.search(r"SHA256:\s*([0-9A-Fa-f:]{64,})", r.stdout.decode("utf-8", "replace"))
              if not m:
                  fail("SHA-256 cert gak kebaca dari keytool output")
              sha = m.group(1).replace(":", "").strip().lower()
              if len(sha) != 64:
                  fail("SHA-256 cert panjang aneh: " + str(len(sha)))
              return sha

          def pkg_from_source(body, fallback):
              m = re.search(r"^\s*package\s+([\w.]+)", body, re.M)
              return m.group(1) if m else fallback

          def find_flutter_target():
              cands = sorted(glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True))
              if not cands:
                  cands = sorted(glob.glob("android/app/src/main/kotlin/**/*Activity.kt", recursive=True))
              if not cands:
                  fail("MainActivity gak ketemu di project Flutter (android/ belum ke-generate?)")
              src = cands[0]
              body = open(src, encoding="utf-8", errors="replace").read()
              return src, body, pkg_from_source(body, "com.dzrbuild.app")

          def find_kotlin_native_target():
              mans = [p for p in glob.glob("**/src/main/AndroidManifest.xml", recursive=True)
                      if os.path.isfile(p) and "/build/" not in p]
              mans = [p for p in mans if "LAUNCHER" in open(p, encoding="utf-8", errors="replace").read()]
              if not mans:
                  fail("AndroidManifest launcher gak ketemu — project native bentuknya gak standar")
              mp = mans[0]
              mbody = open(mp, encoding="utf-8", errors="replace").read()
              mpkg = ""
              mmp = re.search(r'package="([^"]+)"', mbody)
              if mmp:
                  mpkg = mmp.group(1)
              acts = re.findall(r"<activity[^>]*android:name=\"([^\"]+)\"", mbody)
              target = None
              for mm in re.finditer(r"<activity[^>]*>", mbody):
                  blk_start = mm.start()
                  blk_end = mbody.find("</activity>", blk_start)
                  if blk_end < 0:
                      blk_end = min(blk_start + 2000, len(mbody))
                  blk = mbody[blk_start:blk_end]
                  nm = re.search(r'android:name="([^"]+)"', mm.group(0))
                  if nm and "LAUNCHER" in blk:
                      target = nm.group(1)
                      break
              if not target and acts:
                  target = acts[0]  # fallback: activity pertama
              if not target:
                  fail("activity launcher gak ketemu di AndroidManifest")
              if target.startswith("."):
                  fqcn = mpkg + target
              elif "." in target:
                  fqcn = target
              else:
                  fqcn = (mpkg + "." + target) if mpkg else target
              rel = fqcn.replace(".", "/")
              hits = []
              for ext in (".kt", ".java"):
                  hits += [p for p in glob.glob("**/" + rel + ext, recursive=True) if "/build/" not in p]
              if not hits:
                  fail("source " + fqcn + " (.kt/.java) gak ketemu — gak bisa pasang guard")
              src = sorted(hits)[0]
              body = open(src, encoding="utf-8", errors="replace").read()
              return src, body, fqcn

          def write_guard(dirname, pkg, sha, is_java):
              fn = "LicenseGuard.java" if is_java else "LicenseGuard.kt"
              tpl = JAVA_GUARD if is_java else KT_GUARD
              out = os.path.join(dirname, fn)
              open(out, "w", encoding="utf-8").write(tpl.replace("__PKG__", pkg).replace("__SHA__", sha))
              return out

          def patch_source(src, body, sha, pkg, is_java):
              if "LicenseGuard.check" in body:
                  print("ℹ️ [Lisensi] " + src + " udah ada guard — skip patch (idempotent)")
                  write_guard(os.path.dirname(src), pkg, sha, is_java)  # sha tetap segar
                  return "(existing)"
              gpath = write_guard(os.path.dirname(src), pkg, sha, is_java)
              if is_java:
                  m = re.search(r"super\.onCreate\(([^)]*)\)\s*;", body)
                  if not m:
                      fail("super.onCreate gak ketemu di " + src + " — lisensi butuh onCreate standar")
                  body2 = body[:m.end()] + "\n        LicenseGuard.check(this);" + body[m.end():]
              else:
                  m = re.search(r"super\.onCreate\(([^)]*)\)", body)
                  if m:
                      body2 = body[:m.end()] + "\n        LicenseGuard.check(this)" + body[m.end():]
                  else:
                      # template Flutter modern: class tanpa onCreate → tambahkan method
                      stripped = body.rstrip()
                      if not stripped.endswith("}"):
                          fail("MainActivity.kt struktur aneh — gak bisa sisip onCreate")
                      inject = ("\n    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n"
                                "        super.onCreate(savedInstanceState)\n"
                                "        LicenseGuard.check(this)\n"
                                "    }\n")
                      idx = stripped.rfind("}")
                      body2 = stripped[:idx] + inject + "}\n"
              open(src, "w", encoding="utf-8").write(body2)
              return gpath

          def main():
              if MODE not in ("flutter", "kotlin"):
                  fail("GUARD_MODE gak dikenal: " + MODE)
              if not KS_ENC_KEY:
                  fail("secret KS_ENC_KEY gak ada di env")
              obtain_keystore()
              sha = decrypt_and_sha()
              print("🔑 [Lisensi] SHA-256 cert: " + sha[:16] + "…")
              if MODE == "flutter":
                  src, body, pkg = find_flutter_target()
                  is_java = False
              else:
                  src, body, pkg = find_kotlin_native_target()
                  is_java = src.endswith(".java")
              out = patch_source(src, body, sha, pkg, is_java)
              print("🛡️ [Lisensi] Benteng terpasang: " + src + " + " + (out or "(existing)"))
              print("🛡️ [Lisensi] Package: " + pkg + " · expected " + sha[:16] + "… · OK")

          if __name__ == "__main__":
              main()
          DZRGUARD
      # ── 🛡️ v4.3: pasang guard ke source SEBELUM compile (kalau license=on) ──
      - name: Benteng Lisensi (anti-repack guard)
        if: ${{ inputs.license == 'on' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KS_ENC_KEY: ${{ secrets.KS_ENC_KEY }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_PASS_OLD: ${{ secrets.KS_PASS_OLD }}
          GUARD_MODE: kotlin
        run: python3 /tmp/dzr_license_guard.py
      - name: Build APK (Gradle assemble)
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        run: |
          TYPE=$(echo "$INPUT_BUILD_TYPE" | tr 'a-z' 'A-Z' | head -c 1)$(echo "$INPUT_BUILD_TYPE" | cut -c2-)
          BUILD_OK=false
          ATTEMPT=0
          while [ "$ATTEMPT" -lt 3 ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "🔨 ${GRADLE_CMD} assemble${TYPE} — percobaan $ATTEMPT/3"
            if ${GRADLE_CMD} "assemble${TYPE}" --no-daemon --stacktrace 2>&1 | tee build_output.txt; then
              BUILD_OK=true
              break
            fi
            echo "🩺 build gagal (percobaan $ATTEMPT/3) — dokter analisa error..."
            KFIX_OUT=$(BLD_ERR="$(tail -c 4000 build_output.txt)" python3 /tmp/kfix.py 2>&1) || true
            echo "$KFIX_OUT"
            if ! echo "$KFIX_OUT" | grep -q "KFIX_APPLIED=[1-9]"; then
              echo "🩺 gak ada perbaikan otomatis yang cocok — berhenti, biar bot yang laporkan."
              break
            fi
            sleep 3
          done
          if [ "$BUILD_OK" != "true" ]; then
            echo "=== BUILD FAILED ==="
            tail -50 build_output.txt
            exit 1
          fi
          # Kumpulin hasil APK ke folder stabil (path output native gradle bisa
          # beda-beda antar project — jangan nebak-nebak di step signing/upload)
          mkdir -p apk_out
          find . \( -path "*/build/outputs/apk/*" -o -path "*/build/intermediates/*" \) -name "*.apk" -not -path "*intermediates*" -exec cp -f {} apk_out/ \; 2>/dev/null || true
          if [ -z "$(ls -A apk_out 2>/dev/null)" ]; then
            echo "ERROR: Gak ada APK hasil build!"
            find . -name "*.apk" | head -10
            exit 1
          fi
          echo "APK terkumpul:"; ls -lh apk_out/

      - name: Build AAB (Gradle bundle)
        if: inputs.build_format == 'aab' || inputs.build_format == 'both'
        run: |
          TYPE=$(echo "$INPUT_BUILD_TYPE" | tr 'a-z' 'A-Z' | head -c 1)$(echo "$INPUT_BUILD_TYPE" | cut -c2-)
          BUILD_OK=false
          ATTEMPT=0
          while [ "$ATTEMPT" -lt 3 ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "🔨 ${GRADLE_CMD} bundle${TYPE} — percobaan $ATTEMPT/3"
            if ${GRADLE_CMD} "bundle${TYPE}" --no-daemon --stacktrace 2>&1 | tee build_output_aab.txt; then
              BUILD_OK=true
              break
            fi
            echo "🩺 build AAB gagal (percobaan $ATTEMPT/3) — dokter analisa error..."
            KFIX_OUT=$(BLD_ERR="$(tail -c 4000 build_output_aab.txt)" python3 /tmp/kfix.py 2>&1) || true
            echo "$KFIX_OUT"
            if ! echo "$KFIX_OUT" | grep -q "KFIX_APPLIED=[1-9]"; then
              echo "🩺 gak ada perbaikan otomatis yang cocok — berhenti."
              break
            fi
            sleep 3
          done
          if [ "$BUILD_OK" != "true" ]; then
            echo "=== AAB BUILD FAILED ==="
            tail -50 build_output_aab.txt
            exit 1
          fi
          mkdir -p aab_out
          find . -path "*/build/outputs/bundle/*" -name "*.aab" -exec cp -f {} aab_out/ \; 2>/dev/null || true
          if [ -z "$(ls -A aab_out 2>/dev/null)" ]; then
            echo "ERROR: Gak ada AAB hasil build!"
            exit 1
          fi
          echo "AAB terkumpul:"; ls -lh aab_out/

      # ─── 🔐 v6.2 → v6.6: STABLE SIGNING per user — DISALIN IDENTIK dari build.yml ────
      # Keystore per user (keystores/u<id>.jks) di R2 PRIVATE bucket → fetch
      # via AWS CLI (creds = GitHub Secrets) → gak ada / gak valid dgn pass →
      # FAIL LOUD atau generate+upload (build pertama). GAK LAGI commit ke repo!
      # Sign: zipalign -p 4 + apksigner (build-tools terbaru di ANDROID_HOME).
      # MURNI Android-generic — gak ada sangkut paut Flutter.
      - name: Stable signing (Kotlin native)
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_PASS_OLD: ${{ secrets.KS_PASS_OLD }}
          KS_ENC_KEY: ${{ secrets.KS_ENC_KEY }}
        run: |
          APK=$(ls -t apk_out/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "WARNING: APK gak ketemu buat re-sign (skip, non-fatal)"
            exit 0
          fi

          # ── path keystore per user (sanitasi ketat: cuma alfanumerik) ──
          KID=$(printf '%s' "${INPUT_KEYSTORE_ID:-}" | tr -cd 'a-zA-Z0-9')
          if [ -n "$KID" ]; then
            KS_ENC_PATH="keystores/u${KID}.jks.enc"
            echo "🔐 Keystore PER-USER: $KS_ENC_PATH"
          else
            KS_ENC_PATH="signing/global-v2.jks.enc"
            echo "🔐 Keystore GLOBAL (keystore_id kosong): $KS_ENC_PATH"
          fi

          # ── 🔐 v6.6: keystore per user dari file TERENKRIPSI di repo ──
          # Format: AES-256-CBC + PBKDF2 (600k iter) via openssl — kunci dekrip
          # (KS_ENC_KEY) cuma di GitHub Secrets. Keystore lama (dibuat sebelum
          # rotasi password) divalidasi dgn KS_PASS_OLD biar app lama tetap
          # bisa update. Decrypt/validasi gagal = FAIL LOUD (JANGAN regenerate).
          KS_ENC="$KS_ENC_PATH"
          KS=/tmp/keystore.jks
          rm -f "$KS" /tmp/ks.enc
          # ⚠️ Gak ada actions/checkout di workflow ini → keberadaan .enc dicek
          # via GitHub API (file keystore GAK PERNAH ada di disk runner!)
          ENC_HTTP=$(curl -sL -o /tmp/ks_enc.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/contents/${KS_ENC}?ref=main")
          if [ "$ENC_HTTP" = "200" ]; then
            python3 -c "import json,base64;open('/tmp/ks.enc','wb').write(base64.b64decode(json.load(open('/tmp/ks_enc.json'))['content']))" 2>/dev/null || true
          fi
          if [ "$ENC_HTTP" = "200" ] && [ -s /tmp/ks.enc ]; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in /tmp/ks.enc -out "$KS" -pass pass:"$KS_ENC_KEY" 2>/dev/null || [ ! -s "$KS" ]; then
              echo "=== BUILD FAILED: keystore terenkripsi ada tapi GAGAL didekrip (cek secret KS_ENC_KEY) ==="
              exit 1
            fi
            KS_USE_PASS=""
            if keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias dzr >/dev/null 2>&1; then
              KS_USE_PASS="$KS_PASS"
            elif [ -n "$KS_PASS_OLD" ] && keytool -list -keystore "$KS" -storepass "$KS_PASS_OLD" -alias dzr >/dev/null 2>&1; then
              KS_USE_PASS="$KS_PASS_OLD"
              echo "ℹ️ Keystore legacy (pass lama) — tetep dipake biar app ter-install lama tetap bisa update"
            fi
            if [ -z "$KS_USE_PASS" ]; then
              echo "=== BUILD FAILED: keystore didekrip tapi pass gak cocok (KS_PASS/KS_PASS_OLD salah) ==="
              echo "JANGAN regenerate! Cek secrets — salah pass = app ter-install gak bisa update."
              exit 1
            fi
            echo "Keystore stabil: DIPAKE dari $KS_ENC (dekripsi OK)"
          else
            echo "Keystore belum ada — generate BARU + commit TERENKRIPSI ($KS_ENC)..."
            keytool -genkeypair -v -keystore "$KS" -alias dzr -keyalg RSA -keysize 2048 \
              -validity 10950 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=DZR CloudBuilder, OU=Deruzuan, O=DZR, L=Jakarta, C=ID" >/dev/null 2>&1
            ENC_B64=$(openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$KS" -pass pass:"$KS_ENC_KEY" | base64 -w0)
            PAYLOAD=$(python3 -c "import json,sys;print(json.dumps({'message':'chore: stable signing keystore (encrypted at rest)','content':sys.argv[1],'branch':'main'}))" "$ENC_B64")
            PUT_HTTP=$(curl -sL -o /tmp/ks_put.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              -d "$PAYLOAD" "https://api.github.com/repos/${GH_REPO}/contents/${KS_ENC}")
            KS_USE_PASS="$KS_PASS"
            if [ "$PUT_HTTP" != "200" ] && [ "$PUT_HTTP" != "201" ]; then
              echo "Commit gagal (HTTP $PUT_HTTP) — kemungkinan race build lain, coba ambil yang di repo..."
              ENC_HTTP=$(curl -sL -o /tmp/ks_enc.json -w "%{http_code}" \
                -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GH_REPO}/contents/${KS_ENC}?ref=main")
              if [ "$ENC_HTTP" = "200" ]; then
                python3 -c "import json,base64;open('/tmp/ks.enc','wb').write(base64.b64decode(json.load(open('/tmp/ks_enc.json'))['content']))" 2>/dev/null || true
              fi
              if [ "$ENC_HTTP" = "200" ] && [ -s /tmp/ks.enc ] \
                && openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in /tmp/ks.enc -out "$KS" -pass pass:"$KS_ENC_KEY" 2>/dev/null \
                && [ -s "$KS" ] && keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias dzr >/dev/null 2>&1; then
                echo "🔐 Race guard: pake keystore dari repo (identik)"
              else
                echo "=== BUILD FAILED: keystore gak bisa disimpan/diambil — stop biar signature konsisten ==="
                exit 1
              fi
            else
              echo "🔐 Keystore baru disimpen TERENKRIPSI di repo ($KS_ENC)"
            fi
          fi

          if [ -s "$KS" ] && ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* >/dev/null 2>&1; then
            BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)
            if [ -x "$BT/zipalign" ] && [ -x "$BT/apksigner" ]; then
              cp "$APK" /tmp/pre_sign.apk
              "$BT/zipalign" -f -p 4 /tmp/pre_sign.apk /tmp/aligned.apk
              "$BT/apksigner" sign --ks "$KS" --ks-key-alias dzr \
                --ks-pass "pass:$KS_USE_PASS" --key-pass "pass:$KS_USE_PASS" \
                --out "$APK" /tmp/aligned.apk
              "$BT/apksigner" verify "$APK" \
                && echo "✅ APK Kotlin ke-sign keystore stabil (jalur native)" \
                || echo "WARNING: verify gagal (non-fatal, APK tetep ke-upload)"
            else
              echo "WARNING: zipalign/apksigner gak ada (skip re-sign)"
            fi
          else
            echo "WARNING: keystore/build-tools gak siap (skip re-sign, non-fatal)"
          fi

      # ── 🤖 v3.3: KANAL OTA KOTLIN (paritas dgn Web2APK) ──
      # Release apk-<pkg>: app.apk rolling + APK ber-versi + build-info.json
      # + delta patch bsdiff (worth-it < 75%) + guard anti-race (CUR_VC).
      # pkg/versionCode dibaca LANGSUNG DARI APK (aapt) — bukan dianggep.
      # build-info.json ikut nyempil di apk_out/ → artifact → bot jadi tau
      # package asli app user & nulis manifest updates/<pkg>.json.
      # NON-FATAL: gagal di step mana pun = build tetap sukses & APK tetap
      # ke-kirim bot ke user — cuma kanal OTA-nya gak ke-update.
      - name: OTA channel (Kotlin native)
        if: (inputs.build_format == 'apk' || inputs.build_format == 'both') && inputs.build_type == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # pipefail-safe (v3.4): pipeline gagal tetap lanjut → skip, gak bikin build gagal
          APK="$(ls -t apk_out/*.apk 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then echo "ℹ️ Gak ada APK — kanal OTA skip"; exit 0; fi
          RUN_NO="${GITHUB_RUN_NUMBER:-1}"
          BTD="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$BTD" ] || [ ! -x "$BTD/aapt" ]; then echo "ℹ️ aapt gak ada — kanal OTA skip"; exit 0; fi
          BADGE="$($BTD/aapt dump badging "$APK" 2>/dev/null | head -1)"
          # ⚠️ aapt badging: "package: name='...'" — PAKAI SPASI. (bug v3.3.0:
          # pattern "package:name=" tanpa spasi → PKG kosong → kanal selalu skip)
          PKG="$(printf '%s' "$BADGE" | sed -n "s/.*package:[[:space:]]*name='\([^']*\)'.*/\1/p")"
          VC="$(printf '%s' "$BADGE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          if [ -z "$PKG" ] || [ "$VC" != "$RUN_NO" ]; then
            echo "ℹ️ PKG/VC gak cocok (PKG='$PKG' VC='$VC' vs run $RUN_NO) → kanal OTA skip (non-fatal)"
            exit 0
          fi
          echo "🎯 Kanal OTA: apk-$PKG v$RUN_NO"
          cp "$APK" /tmp/app.apk
          cp "$APK" "/tmp/app-3.0.$RUN_NO.apk"
          APK_SHA="$(sha256sum /tmp/app.apk | cut -d' ' -f1)"
          APK_SIZE=$(stat -c%s /tmp/app.apk)

          # ── 🚀 delta patch (pola identik Web2APK: bsdiff → bingkai DZRDELTA) ──
          DELTA_JSON=""
          OLD_VC=""
          if sudo apt-get install -y --no-install-recommends bsdiff >/dev/null 2>&1; then
            rm -f /tmp/old.apk /tmp/bsdiff.raw /tmp/delta.patch /tmp/delta-info.json
            OLD_URL=$(gh api "repos/${GH_REPO}/releases/tags/apk-$PKG" --jq '.assets[] | select((.name|test("^app-[0-9]+\\.[0-9]+\\.[0-9]+\\.apk$"))) | .browser_download_url + " " + .name' 2>/dev/null | awk -v run="$RUN_NO" '{n=$2; sub(/^app-[0-9]+\.[0-9]+\./,"",n); sub(/\.apk$/,"",n); if ((n+0)<(run+0) && (n+0)>best) {best=n+0; u=$1}} END {if (best>0) print u}')
            if [ -z "$OLD_URL" ]; then
              OLD_URL="https://github.com/${GH_REPO}/releases/download/apk-$PKG/app.apk"
            fi
            echo "⬇️  Download APK lama buat delta: $OLD_URL"
            curl -sL --retry 2 --max-time 300 -o /tmp/old.apk "$OLD_URL" || true
            if [ -s /tmp/old.apk ]; then
              OLD_VC="$($BTD/aapt dump badging /tmp/old.apk 2>/dev/null | head -1 | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
            fi
            if [ -s /tmp/old.apk ] && [ -n "$OLD_VC" ] && [ "$OLD_VC" -gt 0 ] && [ "$OLD_VC" -lt "$RUN_NO" ] 2>/dev/null; then
              echo "🔀 Bikin delta patch: v$OLD_VC → v$RUN_NO (bsdiff, bisa 1-3 menit)..."
              if bsdiff /tmp/old.apk /tmp/app.apk /tmp/bsdiff.raw; then
                python3 << 'PYEOF2'
          import struct, bz2, hashlib, json
          src = open('/tmp/bsdiff.raw', 'rb').read()
          assert src[:8] == b'BSDIFF40', 'bukan output bsdiff'
          ctrl_len, diff_len, extra_len, newsize = struct.unpack('>QQQq', src[8:40])
          body = src[40:]
          d1 = bz2.BZ2Decompressor(); c = d1.decompress(body); r1 = d1.unused_data
          d2 = bz2.BZ2Decompressor(); df = d2.decompress(r1); r2 = d2.unused_data
          d3 = bz2.BZ2Decompressor(); ex = d3.decompress(r2); r3 = d3.unused_data
          assert len(c) == ctrl_len and len(df) == diff_len and len(ex) == extra_len, 'ukuran blok bsdiff gak cocok'
          l1 = len(body) - len(r1); l2 = len(r1) - len(r2); l3 = len(r2) - len(r3)
          out = b'DZRDELTA' + struct.pack('<I', 1) + struct.pack('<III', l1, l2, l3) + struct.pack('<q', newsize) + body[:l1] + body[l1:l1+l2] + body[l1+l2:l1+l2+l3]
          open('/tmp/delta.patch', 'wb').write(out)
          sha = hashlib.sha256(out).hexdigest()
          json.dump({'size': len(out), 'sha256': sha, 'newSize': newsize}, open('/tmp/delta-info.json', 'w'))
          print('DZR frame: ctrl=%d diff=%d extra=%d newSize=%d' % (l1, l2, l3, newsize))
          PYEOF2
              else
                echo "WARNING: bsdiff gagal — delta skip (non-fatal)"
              fi
            else
              echo "ℹ️ APK lama gak ketemu/gak valid — delta skip (build pertama kanal ini normal)"
            fi
            if [ -s /tmp/delta.patch ] && [ -s /tmp/delta-info.json ] && [ -n "$OLD_VC" ]; then
              DELTA_SIZE=$(stat -c%s /tmp/delta.patch)
              if [ "$DELTA_SIZE" -lt $((APK_SIZE * 75 / 100)) ]; then
                DELTA_SHA=$(python3 -c "import json;print(json.load(open('/tmp/delta-info.json'))['sha256'])")
                DELTA_JSON=",\"delta\":{\"base\":$OLD_VC,\"url\":\"https://github.com/${GH_REPO}/releases/download/apk-$PKG/delta-${OLD_VC}-${RUN_NO}.patch\",\"sha256\":\"$DELTA_SHA\",\"size\":$DELTA_SIZE}"
                echo "🚀 Delta worth-it: $DELTA_SIZE byte = $((DELTA_SIZE * 100 / APK_SIZE))% dari penuh"
              else
                echo "ℹ️ Delta gak worth-it ($DELTA_SIZE byte) — skip, user unduh penuh"
                rm -f /tmp/delta.patch /tmp/delta-info.json
              fi
            fi
          else
            echo "WARNING: bsdiff gak ke-install — delta skip (non-fatal, update penuh tetap jalan)"
          fi

          printf '{"package":"%s","versionCode":%s,"versionName":"3.0.%s","sha256":"%s","builtAt":"%s","size":%s%s}\n' \
            "$PKG" "$RUN_NO" "$RUN_NO" "$APK_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$APK_SIZE" "$DELTA_JSON" > /tmp/build-info.json
          cp /tmp/build-info.json apk_out/build-info.json
          echo "🔧 build-info.json: v3.0.$RUN_NO sha256=$APK_SHA (nyempil di artifact buat bot)"

          # ── 🛡️ guard anti-race (identik Web2APK v5.9) ──
          CUR_VC=$(curl -sL --max-time 30 "https://github.com/${GH_REPO}/releases/download/apk-$PKG/build-info.json" 2>/dev/null | python3 -c "import json,sys;print(int(json.load(sys.stdin).get('versionCode',0)))" 2>/dev/null || echo 0)
          OTA_FRESH=1
          if [ "$CUR_VC" -ge "$RUN_NO" ] 2>/dev/null && [ "$CUR_VC" -gt 0 ]; then
            OTA_FRESH=0
            echo "⏭️ Kanal OTA udah di v$CUR_VC (>= run ini $RUN_NO) — build stale/rerun, kanal GAK disentuh"
          fi
          if [ "$OTA_FRESH" = "1" ] && gh release view "apk-$PKG" >/dev/null 2>&1; then
            gh release upload "apk-$PKG" /tmp/app.apk --clobber \
              && echo "🔄 Kanal OTA updated: apk-$PKG → app.apk" \
              || echo "WARNING: gh upload gagal (non-fatal)"
            gh release upload "apk-$PKG" "/tmp/app-3.0.$RUN_NO.apk" --clobber \
              && echo "🗂️ APK ber-versi: app-3.0.$RUN_NO.apk (riwayat/rollback)" \
              || echo "WARNING: upload APK ber-versi gagal (non-fatal)"
            if [ -s /tmp/delta.patch ]; then
              gh release upload "apk-$PKG" /tmp/delta.patch --clobber \
                && echo "🚀 Delta asset: delta-${OLD_VC}-${RUN_NO}.patch" \
                || echo "WARNING: upload delta gagal (non-fatal)"
            fi
            gh release upload "apk-$PKG" /tmp/build-info.json --clobber \
              && echo "🔧 build-info.json ter-upload (bot pake ini buat manifest OTA)" \
              || echo "WARNING: upload build-info gagal (non-fatal)"
            if [ -n "$OLD_VC" ]; then
              gh api "repos/${GH_REPO}/releases/tags/apk-$PKG" --jq '.assets[] | select((.name|test("^delta-[0-9]+-[0-9]+\\.patch$"))) | [.id, .name] | @tsv' 2>/dev/null | \
              while IFS=$'\t' read -r aid aname; do
                if [ "$aname" != "delta-${OLD_VC}-${RUN_NO}.patch" ]; then
                  gh api -X DELETE "repos/${GH_REPO}/releases/assets/$aid" >/dev/null 2>&1 || true
                  echo "🧹 Delta lama dibuang: $aname"
                fi
              done
            fi
          elif [ "$OTA_FRESH" = "1" ]; then
            gh release create "apk-$PKG" /tmp/app.apk "/tmp/app-3.0.$RUN_NO.apk" /tmp/build-info.json \
              --title "OTA $PKG" --notes "Build terbaru — kanal auto-update (Kotlin native)" \
              && echo "🔄 Kanal OTA dibuat: apk-$PKG (+ APK ber-versi + build-info)" \
              || echo "WARNING: gh create gagal (non-fatal)"
          fi

      - name: Upload APK
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: |
            apk_out/*.apk
            apk_out/build-info.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload AAB
        if: inputs.build_format == 'aab' || inputs.build_format == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: aab-output
          path: aab_out/*.aab
          retention-days: 7

      # NOTE: GAK ADA step "Send to Telegram" — bot (index.js) yang handle
      # kirim APK ke user + semua notifikasi error (konsisten dgn build.yml,
      # anti dobel kirim).
