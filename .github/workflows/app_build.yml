name: DZR Builder App (native)

# 📱 v3.7.0 — build APK app native "DZR Builder" (companion bot DZR CloudBuilder).
# App = Flutter NATIVE (Material 3, ZERO WebView) — source di folder app/.
# Trigger: manual (workflow_dispatch) + tiap ada perubahan di app/**
# Output: artifact + GitHub Release "dzr-builder-v1.0.0" (APK siap install).

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL REST API server bot (tanpa trailing slash)"
        required: false
        default: "http://66.33.22.227:3000"
  push:
    paths:
      - "app/**"
      - ".github/workflows/app_build.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build DZR Builder APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.2 (cache pub)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # ⚡ ROLLING CACHE (pola terbukti dari build.yml — anti cache beku):
      # restore-keys buat ambil cache TERBARU, abis run nyimpen versi baru.
      - name: Rolling cache (Gradle + pub)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: dzrapp-${{ runner.os }}-gradle-${{ github.run_id }}
          restore-keys: dzrapp-${{ runner.os }}-gradle-

      - name: Gradle tuning (parallel + cache + heap 3g)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'GPROP'
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          GPROP
          echo "⚡ gradle.properties tuning dipasang"

      # ── Generate scaffolding Android (android/ gak disimpen di repo —
      # flutter create cuma NAMBAH file yang kurang, lib/ + pubspec aman) ──
      - name: Generate Android scaffolding
        run: |
          flutter create . --org com.dzrcloud --project-name dzr_builder --platforms android
          # INTERNET permission + label + compileSdk 36 (file_picker butuh SDK 36)
          python3 - <<'PYEOF'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          src = open(p).read()
          if "android.permission.INTERNET" not in src:
              src = src.replace("<application", "    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application", 1)
          src = src.replace('android:label="dzr_builder"', 'android:label="DZR Builder"')
          open(p, "w").write(src)
          g = "android/app/build.gradle.kts" if __import__("os").path.exists("android/app/build.gradle.kts") else "android/app/build.gradle"
          grad = open(g).read()
          grad = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", grad)
          grad = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36", grad)
          open(g, "w").write(grad)
          print("✅ manifest: INTERNET + label | gradle(" + g + "): compileSdk 36")
          PYEOF

      # ── Icon launcher native dari assets/icon.png (mipmap semua densitas) ──
      - name: Generate launcher icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons || echo "⚠️ icon gen gagal (non-fatal — pakai icon default)"

      - name: Build APK Release
        run: |
          flutter build apk --release \
            --dart-define=DZR_API_URL="${{ github.event.inputs.api_url || 'http://66.33.22.227:3000' }}"

      - name: Organize artifact
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/dzr-builder-v1.0.0.apk
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dzr-builder-apk
          path: app/output/dzr-builder-v1.0.0.apk
          retention-days: 30
          if-no-files-found: error

      # ── GitHub Release: tag dzr-builder-v1.0.0 — asset di-replace tiap build ──
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd output
          NOTES="📱 DZR Builder v1.0.0 — app NATIVE (Flutter, tanpa WebView) dari DZR CloudBuilder.

          Fitur:
          - 🔨 Build APK Flutter/Kotlin langsung dari HP (pipeline sama dengan bot)
          - ⚡ Progress build LIVE (poll tiap 4 detik) + tombol cancel
          - 🗂 Riwayat build + download ulang APK (auto-hapus 5 jam)
          - 🏆 Leaderboard builder · 📇 Kartu builder · 🎫 credit
          - 🔑 Login pakai key pribadi dari /getappkey (hash SHA-256 di server)

          Install: download APK → buka → izinkan install dari sumber tidak dikenal → tempel key."
          if gh release view dzr-builder-v1.0.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload dzr-builder-v1.0.0 dzr-builder-v1.0.0.apk -R "$GITHUB_REPOSITORY" --clobber
            echo "✅ release asset di-replace"
          else
            gh release create dzr-builder-v1.0.0 dzr-builder-v1.0.0.apk \
              -R "$GITHUB_REPOSITORY" \
              --title "DZR Builder v1.0.0" \
              --notes "$NOTES"
            echo "✅ release baru dibuat"
          fi
