          # ── 🔧 v5.8.3 R-SYN: kurung gak balans — kode generatoran
          # kepotong di tengah widget tree → CFE "Can't find ')' to match
          # '('" + cascade "Expected ';'" + "missing implementations
          # State.build" (run #81 dashboard_page.dart _buildAccountInfo).
          # v5.8.1/2 baca konteks baris pembuka pakai NOMOR BARIS CFE —
          # RUNTUG: R-FPI nambahin import sebelum R-SYN → baris geser →
          # separator ketuker → repair selalu revert (run #83: 0→0, run
          # #85: 4→4). v5.8.3: stack kurung dihitung LANGSUNG dari file
          # aktual (lexer mini, string + comment aware) — nomor baris CFE
          # cuma buat trigger. Separator dari baris pembuka di file AKTIF
          # (return/await/assignment → ';', lainnya ','). Tetap FAIL-SAFE:
          # dart format --output=none before/after — gak jadi parse-able →
          # revert.
          import subprocess as _sp3

          def _syn_count(path):
              # 0 = file parse-able (exit 0, gak nulis apa-apa); else jumlah
              # baris output yang nyebut file (>= 1).
              try:
                  _r = _sp3.run(['dart', 'format', '--output=none', path], capture_output=True, text=True, timeout=180)
                  if _r.returncode == 0:
                      return 0
                  _txt = (_r.stdout or '') + (_r.stderr or '')
                  _n = 0
                  for _ln in _txt.splitlines():
                      if path in _ln:
                          _n += 1
                  return max(_n, 1)
              except Exception:
                  return -1

          def _unclosed_stack(src):
              # lexer mini Dart: skip string ('..' / ".." + escape), comment
              # // dan /* */ → stack delimiter yang gak ke-tutup (char,
              # no_baris). Interpolation ${...} diperlakukan string biasa —
              # kalau salah hitung, validasi dart format yang nolong.
              _stk = []
              _st = None
              _esc = _lc = _bc = False
              _prev = ''
              _ln = 1
              for _ch in src:
                  if _ch == '\n':
                      _ln += 1
                      _lc = False
                  if _lc:
                      _prev = _ch
                      continue
                  if _bc:
                      if _prev == '*' and _ch == '/':
                          _bc = False
                      _prev = _ch
                      continue
                  if _st:
                      if _esc:
                          _esc = False
                      elif _ch == '\\':
                          _esc = True
                      elif _ch == _st:
                          _st = None
                      _prev = _ch
                      continue
                  if _ch == '/' and _prev == '/':
                      _lc = True
                      _prev = _ch
                      continue
                  if _ch == '*' and _prev == '/':
                      _bc = True
                      _prev = _ch
                      continue
                  if _ch in ('\'', '"'):
                      _st = _ch
                  elif _ch in '([{':
                      _stk.append((_ch, _ln))
                  elif _ch in ')]}':
                      if _stk and _stk[-1][0] == {')': '(', ']': '[', '}': '{'}[_ch]:
                          _stk.pop()
                  _prev = _ch
              return _stk

