          #   - onDownloadRequested: nama salah; yang bener onDownloadStartRequest
          #     (signature sama persis: (controller, DownloadStartRequest)).
          #   - PermissionRequest.grant(): GAK ADA di 6.x — cara yang bener:
          #     callback onPermissionRequest harus RETURN PermissionResponse(
          #     resources: ..., action: PermissionResponseAction.GRANT).
          phantom = re.search(r"No named parameter with the name '(?:onFileChooser|onDownloadRequested)'|'(?:FileChooserParams|FileChooserResult|FileChooserMode)' isn't defined|Method not found: 'FileChooser(?:Params|Result|Mode)'|The method 'grant' isn't defined for the type 'PermissionRequest'", out)
          if phantom:
              for f in err_files:
                  if not os.path.isfile(f):
