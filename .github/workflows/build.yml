          def add_plain_import(f, uri):
              src = read_f(f)
              if ("'" + uri + "'" in src) or ('"' + uri + '"' in src):
                  return False
              line = "import '" + uri + "';"
              _ms = list(re.finditer(r'(?m)^import\s[^;]+;\s*$', src))
              if _ms:
                  src = src[:_ms[-1].end()] + '\n' + line + src[_ms[-1].end():]
              else:
                  src = line + '\n' + src
