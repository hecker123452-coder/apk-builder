              src2 = re.sub(r'const FaIcon\(\s*FaIconData\? icon, \{', 'const FaIcon(\n    IconData? icon, {', src2, count=1)
              src2 = src2.replace('IconData? get icon => _icon?.data;', 'IconData? get icon => _icon;', 1)
              src2 = src2.replace('final IconData? icon = _icon?.data;', 'final IconData? icon = _icon;', 1)
              if src2 != src:
                  with open(p, 'w', encoding='utf-8') as f:
                      f.write(src2)
                  print('FA-NET WIDEN: FaIcon(param IconData?) — IconData & FaIconData dua-duanya diterima')
              else:
                  print('FA-NET WIDEN: pola fa_icon.dart gak dikenali, skip')

          sdk_strip()
          _p = sys.argv[1] if len(sys.argv) > 1 else ''
          _fa_root = ''
          if _p and os.path.isfile(_p):
              # .../font_awesome_flutter-11.x.y/lib/src/icon_data.dart → root paket
              _fa_root = os.path.dirname(os.path.dirname(os.path.dirname(_p)))
              patch_fa_pkg(_p)
          widen_faicon(_fa_root)
          PYFANET2
          FAICON_FILE=""
          for CACHEDIR in "${PUB_CACHE:-$HOME/.pub-cache}" "$HOME/.pub-cache" "$HOME/.pub-cache/hosted/pub.dev"; do
            FAICON_FILE=$(find "$CACHEDIR" -maxdepth 8 -path '*font_awesome_flutter-11*' -name 'icon_data.dart' 2>/dev/null | head -1)
            [ -n "$FAICON_FILE" ] && break
          done
          if [ -n "$FAICON_FILE" ]; then
            echo "── v5.8 FA-NET v2: $FAICON_FILE ──"
            python3 /tmp/fanet2.py "$FAICON_FILE" || true
          else
            echo "FA-NET v2: icon_data.dart FA 11 gak ketemu di pub-cache, skip"
          fi

      # ── 🩺 v3.8.0: DOKTER ICON — input icon_url yang sejak awal nganggur
      # sekarang DIPAKE: icon dari URL → dipasang ke semua mipmap. Gak ada
      # URL + project gak bawa ic_launcher sama sekali → generate premium
      # (gradient + inisial nama app, konsisten dgn auto-icon Web2APK v3.6).
      # Icon yang udah ada di project user GAK disentuh. ──
      - name: Doctor (icon fallback/auto-generate)
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        env:
          DOCTOR_ICON_URL: ${{ inputs.icon_url }}
        run: |
          if [ -n "$(find android -path '*res/mipmap*' -name 'ic_launcher*' -not -path '*/build/*' 2>/dev/null)" ]; then
            echo "🩺 icon launcher udah ada di project — gak disentuh"
            exit 0
          fi
          SRC=""
          if [ -n "$DOCTOR_ICON_URL" ]; then
            if curl -sL --max-time 20 -o /tmp/icon_src.bin "$DOCTOR_ICON_URL"; then
              if file /tmp/icon_src.bin | grep -qiE 'image|bitmap'; then
                SRC=/tmp/icon_src.bin
                echo "🩺 icon dari icon_url ke-download ($(du -h /tmp/icon_src.bin | cut -f1))"
              fi
            fi
          fi
          python3 -c "import PIL" 2>/dev/null || pip3 install -q pillow || true
          DOCTOR_ICON_SRC="$SRC" python3 << 'PILGEN'
          import os

          try:
              from PIL import Image, ImageDraw, ImageFont
          except Exception:
              print('PILGEN: pillow gak tersedia — icon dilewat (non-fatal)')
              raise SystemExit(0)

          APP = os.environ.get('INPUT_APP_NAME', 'MyApp') or 'MyApp'
          SRC = os.environ.get('DOCTOR_ICON_SRC', '')

          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          base = 'android/app'
          if SRC and os.path.isfile(SRC):
              try:
                  img = Image.open(SRC).convert('RGBA')
                  for q, px in sizes.items():
                      odir = os.path.join(base, 'res', 'mipmap-' + q)
                      os.makedirs(odir, exist_ok=True)
                      img.resize((px, px), Image.LANCZOS).save(os.path.join(odir, 'ic_launcher.png'))
                  print('PILGEN: icon dari icon_url kepasang ke mipmap-*')
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  print('PILGEN: icon_url gagal diproses (' + str(e) + ') → fallback generator')

          import hashlib
          h = int(hashlib.md5(APP.encode()).hexdigest(), 16)
          hue1, hue2 = h % 360, (h % 360 + 55) % 360

          def hsl(hdeg, s, l):
              s /= 100; l /= 100
              k = lambda n: (n + hdeg / 30) % 12
              f = lambda n: l - s * min(l, 1 - l) * max(-1, min(k(n) - 3, 9 - k(n), 1))
              return tuple(int(255 * x) for x in (f(0), f(8), f(4)))

          c1, c2 = hsl(hue1, 72, 52), hsl(hue2, 70, 40)
          S = 512
          img = Image.new('RGB', (S, S))
          d = ImageDraw.Draw(img)
          for y in range(S):
              t = y / (S - 1)
              d.line([(0, y), (S, y)], fill=tuple(int(a + (b - a) * t) for a, b in zip(c1, c2)))
          d.ellipse((-S * 0.25, S * 0.55, S * 0.9, S * 1.6), outline=(255, 255, 255), width=10)
          words = [w for w in APP.split() if w][:2]
          ini = ''.join(w[0] for w in words).upper() or 'AP'
          font = None
          for fp in ('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',
                     '/usr/share/fonts/truetype/freefont/FreeSansBold.ttf'):
              if os.path.isfile(fp):
                  font = ImageFont.truetype(fp, 200)
                  break
          if font is None:
              font = ImageFont.load_default()
          tb = d.textbbox((0, 0), ini, font=font)
          d.text(((S - (tb[2] - tb[0])) / 2 - tb[0], (S - (tb[3] - tb[1])) / 2 - tb[1]), ini,
                 fill=(255, 255, 255), font=font)
          for q, px in sizes.items():
              odir = os.path.join(base, 'res', 'mipmap-' + q)
              os.makedirs(odir, exist_ok=True)
              img.resize((px, px), Image.LANCZOS).save(os.path.join(odir, 'ic_launcher.png'))
          print('PILGEN: icon premium "' + ini + '" ke-generate ke android/app/res/mipmap-*')
          PILGEN
          # manifest gak punya android:icon → kasih (biar icon kepasang beneran)
          MAN="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MAN" ] && ! grep -q "android:icon=" "$MAN"; then
            sed -i 's|<application|<application android:icon="@mipmap/ic_launcher"|' "$MAN"
            echo "🩺 android:icon=@mipmap/ic_launcher ke-inject ke manifest"
          fi

      # ── 🛡️ v4.3 BENTENG LISENSI — tulis helper guard (murah, selalu jalan) ──
      - name: Write License Guard helper
        run: |
          cat > /tmp/dzr_license_guard.py <<'DZRGUARD'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          # 🛡️ DZR CloudBuilder v4.3.0 — BENTENG LISENSI (anti-repack guard installer)
          # Jalan di GitHub Actions SEBELUM compile (step "Benteng Lisensi"):
          #   1. ambil keystore per-user (terenkripsi di repo) → dekrip → SHA-256 cert
          #      (keystore belum ada? generate + commit terenkripsi, race-guard —
          #       identik pola signing block, biar signature konsisten)
          #   2. tulis LicenseGuard.kt / .java (EXPECTED = sha cert) di package launcher
          #   3. patch onCreate → LicenseGuard.check(this) SETELAH super.onCreate
          # Runtime: app cek signature APK-nya sendiri; beda dari asli = layar merah
          # "APK TIDAK SAH" + mati (fail-closed). Repack/re-sign orang lain = kekang.
          # Env: GUARD_MODE=flutter|kotlin · INPUT_KEYSTORE_ID · GH_TOKEN · GH_REPO ·
          #      KS_ENC_KEY · KS_PASS · KS_PASS_OLD · (GUARD_OFFLINE=1 utk test lokal)
          import os, sys, json, base64, glob, re, subprocess, urllib.request, urllib.error

          def fail(msg):
              print("=== BUILD FAILED: " + msg + " ===")
              sys.exit(1)

          MODE = os.environ.get("GUARD_MODE", "flutter").strip()
          GH_TOKEN = os.environ.get("GH_TOKEN", "")
          GH_REPO = os.environ.get("GH_REPO", "")
          KS_ENC_KEY = os.environ.get("KS_ENC_KEY", "")
          KS_PASS = os.environ.get("KS_PASS", "")
          KS_PASS_OLD = os.environ.get("KS_PASS_OLD", "")
          KID = re.sub(r"[^a-zA-Z0-9]", "", os.environ.get("INPUT_KEYSTORE_ID", "") or "")
          OFFLINE = os.environ.get("GUARD_OFFLINE", "") == "1"
          API = "https://api.github.com/repos/" + GH_REPO + "/contents/"

          KT_GUARD = """// 🛡️ Benteng Lisensi v4.3 — auto-generated oleh DZR CloudBuilder
          // Verifikasi signature asli: app hasil repack / re-sign ilegal = nolak jalan.
          package __PKG__

          object LicenseGuard {
              private const val EXPECTED = "__SHA__"

              @JvmStatic
              fun check(activity: android.app.Activity) {
                  try {
                      val pm = activity.packageManager
                      val pi = pm.getPackageInfo(
                          activity.packageName,
                          android.content.pm.PackageManager.GET_SIGNATURES
                      )
                      val sigs = pi.signatures
                      if (sigs == null || sigs.isEmpty()) { fail(activity); return }
                      val md = java.security.MessageDigest.getInstance("SHA-256")
                      val hex = md.digest(sigs[0].toByteArray())
                          .joinToString("") { String.format("%02x", it) }
                      if (!hex.equals(EXPECTED, ignoreCase = true)) fail(activity)
                  } catch (t: Throwable) {
                      fail(activity)
                  }
              }

              private fun fail(a: android.app.Activity) {
                  try {
                      val pad = android.widget.LinearLayout(a)
                      pad.orientation = android.widget.LinearLayout.VERTICAL
                      pad.gravity = android.view.Gravity.CENTER
                      pad.setBackgroundColor(0xFFB00020.toInt())
                      val tv = android.widget.TextView(a)
                      tv.text = "APK TIDAK SAH\\n\\nBuild ini bukan rilis resmi —\\naplikasi sudah dimodifikasi tanpa izin.\\n\\nSilakan install versi asli dari pengembang."
                      tv.setTextColor(-1)
                      tv.textSize = 16f
                      tv.gravity = android.view.Gravity.CENTER
                      tv.setPadding(64, 64, 64, 64)
                      pad.addView(tv)
                      a.setContentView(pad)
                  } catch (_: Throwable) {
                  }
                  try { a.finishAffinity() } catch (_: Throwable) {
                  }
                  android.os.Process.killProcess(android.os.Process.myPid())
              }
          }
          """

          JAVA_GUARD = """// 🛡️ Benteng Lisensi v4.3 — auto-generated oleh DZR CloudBuilder
          // Verifikasi signature asli: app hasil repack / re-sign ilegal = nolak jalan.
          package __PKG__;

          public final class LicenseGuard {
              private static final String EXPECTED = "__SHA__";

              public static void check(android.app.Activity activity) {
                  try {
                      android.content.pm.PackageManager pm = activity.getPackageManager();
                      android.content.pm.PackageInfo pi = pm.getPackageInfo(
                              activity.getPackageName(),
                              android.content.pm.PackageManager.GET_SIGNATURES);
                      if (pi.signatures == null || pi.signatures.length == 0) { fail(activity); return; }
                      java.security.MessageDigest md = java.security.MessageDigest.getInstance("SHA-256");
                      byte[] d = md.digest(pi.signatures[0].toByteArray());
                      StringBuilder sb = new StringBuilder();
                      for (byte b : d) sb.append(String.format("%02x", b));
                      if (!EXPECTED.equalsIgnoreCase(sb.toString())) fail(activity);
                  } catch (Throwable t) {
                      fail(activity);
                  }
              }

              private static void fail(final android.app.Activity a) {
                  try {
                      android.widget.LinearLayout pad = new android.widget.LinearLayout(a);
                      pad.setOrientation(android.widget.LinearLayout.VERTICAL);
                      pad.setGravity(android.view.Gravity.CENTER);
                      pad.setBackgroundColor(0xFFB00020);
                      android.widget.TextView tv = new android.widget.TextView(a);
                      tv.setText("APK TIDAK SAH\\n\\nBuild ini bukan rilis resmi —\\naplikasi sudah dimodifikasi tanpa izin.\\n\\nSilakan install versi asli dari pengembang.");
                      tv.setTextColor(0xFFFFFFFF);
                      tv.setTextSize(16f);
                      tv.setGravity(android.view.Gravity.CENTER);
                      tv.setPadding(64, 64, 64, 64);
                      pad.addView(tv);
                      a.setContentView(pad);
                  } catch (Throwable ignore) { }
                  try { a.finishAffinity(); } catch (Throwable ignore) { }
                  android.os.Process.killProcess(android.os.Process.myPid());
              }
          }
          """

          def sh(cmd):
              return subprocess.run(cmd, capture_output=True)

          def gh_get(path):
              if OFFLINE:
                  return 404, None
              req = urllib.request.Request(API + path + "?ref=main", headers={
                  "Authorization": "Bearer " + GH_TOKEN,
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "dzr-license-guard"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.getcode(), json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception as e:
                  print("⚠️ gh_get error: " + str(e))
                  return 0, None

          def gh_put(path, content_b64, msg):
              if OFFLINE:
                  return 0
              body = json.dumps({"message": msg, "content": content_b64, "branch": "main"}).encode()
              req = urllib.request.Request(API + path, data=body, headers={
                  "Authorization": "Bearer " + GH_TOKEN,
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "dzr-license-guard"}, method="PUT")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.getcode()
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception as e:
                  print("⚠️ gh_put error: " + str(e))
                  return 0

          def obtain_keystore():
              # → siapkan /tmp/guard_ks.enc (ciphertext, ditangani decrypt_and_sha)
              #   atau /tmp/guard_ks.jks langsung (generate fresh / OFFLINE test)
              ks_path = ("keystores/u" + KID + ".jks.enc") if KID else "signing/global-v2.jks.enc"
              print("🔐 [Lisensi] Keystore target: " + ks_path)
              code, js = gh_get(ks_path)
              if code == 200 and js and js.get("content"):
                  open("/tmp/guard_ks.enc", "wb").write(base64.b64decode(js["content"]))
                  return
              # ── Keystore belum ada → generate + commit TERENKRIPSI (race guard) ──
              # Identik pola signing block: generate → enkrip → PUT; PUT gagal (race
              # build lain) → GET balik yang di repo biar signature KONSISTEN.
              print("🔐 [Lisensi] Keystore belum ada — generate baru + commit (terenkripsi)...")
              if not os.path.exists("/tmp/guard_ks.jks") or os.path.getsize("/tmp/guard_ks.jks") == 0:
                  r = sh(["keytool", "-genkeypair", "-v", "-keystore", "/tmp/guard_ks.jks",
                          "-alias", "dzr", "-keyalg", "RSA", "-keysize", "2048",
                          "-validity", "10950", "-storepass", KS_PASS, "-keypass", KS_PASS,
                          "-dname", "CN=DZR CloudBuilder, OU=Deruzuan, O=DZR, L=Jakarta, C=ID"])
                  if r.returncode != 0 or not os.path.exists("/tmp/guard_ks.jks") or os.path.getsize("/tmp/guard_ks.jks") == 0:
                      fail("gak bisa generate keystore (keytool): " + r.stderr.decode("utf-8", "replace")[:200])
              if OFFLINE:
                  print("🔐 [Lisensi] OFFLINE test — pake keystore lokal doang")
                  return
              enc = sh(["openssl", "enc", "-aes-256-cbc", "-pbkdf2", "-iter", "600000", "-salt",
                        "-in", "/tmp/guard_ks.jks", "-pass", "pass:" + KS_ENC_KEY])
              if enc.returncode != 0 or not enc.stdout:
                  fail("gak bisa enkrip keystore buat commit")
              put = gh_put(ks_path, base64.b64encode(enc.stdout).decode(),
                           "chore: signing keystore (license guard bootstrap, encrypted at rest)")
              if put in (200, 201):
                  print("🔐 [Lisensi] Keystore baru disimpen terenkripsi (" + ks_path + ")")
              else:
                  code2, js2 = gh_get(ks_path)
                  if code2 == 200 and js2 and js2.get("content"):
                      open("/tmp/guard_ks.enc", "wb").write(base64.b64decode(js2["content"]))
                      print("🔐 [Lisensi] Race guard: pake keystore dari repo (identik)")
                      return
                  fail("keystore gak bisa disimpan/diambil (HTTP " + str(put) + ") — stop biar signature konsisten")

          def decrypt_and_sha():
              if os.path.exists("/tmp/guard_ks.enc"):
                  d = sh(["openssl", "enc", "-d", "-aes-256-cbc", "-pbkdf2", "-iter", "600000",
                          "-in", "/tmp/guard_ks.enc", "-out", "/tmp/guard_ks.jks",
                          "-pass", "pass:" + KS_ENC_KEY])
                  if d.returncode != 0 or not os.path.exists("/tmp/guard_ks.jks") or os.path.getsize("/tmp/guard_ks.jks") == 0:
                      fail("keystore terenkripsi ada tapi GAGAL didekrip (cek secret KS_ENC_KEY)")
              pass_used = None
              for cand in (KS_PASS, KS_PASS_OLD):
                  if cand and sh(["keytool", "-list", "-keystore", "/tmp/guard_ks.jks",
                                  "-storepass", cand, "-alias", "dzr"]).returncode == 0:
                      pass_used = cand
                      break
              if not pass_used:
                  fail("keystore didekrip tapi pass gak cocok (KS_PASS/KS_PASS_OLD salah)")
              r = sh(["keytool", "-list", "-v", "-keystore", "/tmp/guard_ks.jks",
                      "-storepass", pass_used, "-alias", "dzr"])
              m = re.search(r"SHA256:\s*([0-9A-Fa-f:]{64,})", r.stdout.decode("utf-8", "replace"))
              if not m:
                  fail("SHA-256 cert gak kebaca dari keytool output")
              sha = m.group(1).replace(":", "").strip().lower()
              if len(sha) != 64:
                  fail("SHA-256 cert panjang aneh: " + str(len(sha)))
              return sha

          def pkg_from_source(body, fallback):
              m = re.search(r"^\s*package\s+([\w.]+)", body, re.M)
              return m.group(1) if m else fallback

          def find_flutter_target():
              cands = sorted(glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True))
              if not cands:
                  cands = sorted(glob.glob("android/app/src/main/kotlin/**/*Activity.kt", recursive=True))
              if not cands:
                  fail("MainActivity gak ketemu di project Flutter (android/ belum ke-generate?)")
              src = cands[0]
              body = open(src, encoding="utf-8", errors="replace").read()
              return src, body, pkg_from_source(body, "com.dzrbuild.app")

          def find_kotlin_native_target():
              mans = [p for p in glob.glob("**/src/main/AndroidManifest.xml", recursive=True)
                      if os.path.isfile(p) and "/build/" not in p]
              mans = [p for p in mans if "LAUNCHER" in open(p, encoding="utf-8", errors="replace").read()]
              if not mans:
                  fail("AndroidManifest launcher gak ketemu — project native bentuknya gak standar")
              mp = mans[0]
              mbody = open(mp, encoding="utf-8", errors="replace").read()
              mpkg = ""
              mmp = re.search(r'package="([^"]+)"', mbody)
              if mmp:
                  mpkg = mmp.group(1)
              acts = re.findall(r"<activity[^>]*android:name=\"([^\"]+)\"", mbody)
              target = None
              for mm in re.finditer(r"<activity[^>]*>", mbody):
                  blk_start = mm.start()
                  blk_end = mbody.find("</activity>", blk_start)
                  if blk_end < 0:
                      blk_end = min(blk_start + 2000, len(mbody))
                  blk = mbody[blk_start:blk_end]
                  nm = re.search(r'android:name="([^"]+)"', mm.group(0))
                  if nm and "LAUNCHER" in blk:
                      target = nm.group(1)
                      break
              if not target and acts:
                  target = acts[0]  # fallback: activity pertama
              if not target:
                  fail("activity launcher gak ketemu di AndroidManifest")
              if target.startswith("."):
                  fqcn = mpkg + target
              elif "." in target:
                  fqcn = target
              else:
                  fqcn = (mpkg + "." + target) if mpkg else target
              # resolve file via NAMA CLASS pendek — immune terhadap manifest
              # namespace-style (AGP 8+) yang gak punya package="..." attr
              cls_short = target.split(".")[-1]
              hits = []
              for ext in (".kt", ".java"):
                  hits += [p for p in glob.glob("**/" + cls_short + ext, recursive=True) if "/build/" not in p]
              if not hits:
                  fail("source " + cls_short + " (.kt/.java) gak ketemu — gak bisa pasang guard")
              src = sorted(hits)[0]
              body = open(src, encoding="utf-8", errors="replace").read()
              spkg = pkg_from_source(body, "")
              if spkg:
                  return src, body, spkg  # package dari source paling akurat
              # fallback: manifest package + target tanpa nama class
              if target.startswith("."):
                  fqcn = mpkg + target
              elif "." in target:
                  fqcn = target
              else:
                  fqcn = (mpkg + "." + target) if mpkg else target
              if "." not in fqcn:
                  fail("package activity gak bisa ditentuin (manifest gak ada package attr + source gak ada package line)")
              pkg = fqcn[:fqcn.rfind(".")]
              return src, body, pkg

          def write_guard(dirname, pkg, sha, is_java):
              fn = "LicenseGuard.java" if is_java else "LicenseGuard.kt"
              tpl = JAVA_GUARD if is_java else KT_GUARD
              out = os.path.join(dirname, fn)
              open(out, "w", encoding="utf-8").write(tpl.replace("__PKG__", pkg).replace("__SHA__", sha))
              return out

          def patch_source(src, body, sha, pkg, is_java):
              if "LicenseGuard.check" in body:
                  print("ℹ️ [Lisensi] " + src + " udah ada guard — skip patch (idempotent)")
                  write_guard(os.path.dirname(src), pkg, sha, is_java)  # sha tetap segar
                  return "(existing)"
              gpath = write_guard(os.path.dirname(src), pkg, sha, is_java)
              if is_java:
                  m = re.search(r"super\.onCreate\(([^)]*)\)\s*;", body)
                  if not m:
                      fail("super.onCreate gak ketemu di " + src + " — lisensi butuh onCreate standar")
                  body2 = body[:m.end()] + "\n        LicenseGuard.check(this);" + body[m.end():]
              else:
                  m = re.search(r"super\.onCreate\(([^)]*)\)", body)
                  if m:
                      body2 = body[:m.end()] + "\n        LicenseGuard.check(this)" + body[m.end():]
                  else:
                      # template Flutter modern: class tanpa onCreate → tambahkan method
                      stripped = body.rstrip()
                      if not stripped.endswith("}"):
                          fail("MainActivity.kt struktur aneh — gak bisa sisip onCreate")
                      inject = ("\n    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n"
                                "        super.onCreate(savedInstanceState)\n"
                                "        LicenseGuard.check(this)\n"
                                "    }\n")
                      idx = stripped.rfind("}")
                      body2 = stripped[:idx] + inject + "}\n"
              open(src, "w", encoding="utf-8").write(body2)
              return gpath

          def main():
              if MODE not in ("flutter", "kotlin"):
                  fail("GUARD_MODE gak dikenal: " + MODE)
              if not KS_ENC_KEY:
                  fail("secret KS_ENC_KEY gak ada di env")
              obtain_keystore()
              sha = decrypt_and_sha()
              print("🔑 [Lisensi] SHA-256 cert: " + sha[:16] + "…")
              if MODE == "flutter":
                  src, body, pkg = find_flutter_target()
                  is_java = False
              else:
                  src, body, pkg = find_kotlin_native_target()
                  is_java = src.endswith(".java")
              out = patch_source(src, body, sha, pkg, is_java)
              print("🛡️ [Lisensi] Benteng terpasang: " + src + " + " + (out or "(existing)"))
              print("🛡️ [Lisensi] Package: " + pkg + " · expected " + sha[:16] + "… · OK")

          if __name__ == "__main__":
              main()
          DZRGUARD
      # ── 🛡️ v4.3: pasang guard ke source SEBELUM compile (kalau license=on) ──
      - name: Benteng Lisensi (anti-repack guard)
        if: ${{ inputs.license == 'on' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KS_ENC_KEY: ${{ secrets.KS_ENC_KEY }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_PASS_OLD: ${{ secrets.KS_PASS_OLD }}
          GUARD_MODE: flutter
        run: python3 /tmp/dzr_license_guard.py
      - name: Patch Android + Build APK
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        run: |
          # ── 🆕 v5.6: second-chance bootstrap android/ (bila step deps ke-skip) ──
          if [ -d "android" ] && [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "🧹 [bootstrap-2] android/ shell kosong → dihapus"
            rm -rf android
          fi
          if [ ! -d "android" ] && [ -f "pubspec.yaml" ]; then
            echo "🔁 [bootstrap-2] android/ masih gak ada di step build → generate sekarang..."
            PKG_NAME=$(sed -n "s/^name:[[:space:]]*[\"']\{0,1\}\([a-zA-Z0-9_]\+\)[\"']\{0,1\}[[:space:]]*$/\1/p" pubspec.yaml | head -1)
            PKG_NAME=$(echo "$PKG_NAME" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9_]//g')
            case "$PKG_NAME" in "") PKG_NAME="app" ;; [0-9]*) PKG_NAME="a$PKG_NAME" ;; esac
            flutter create --platforms=android --org com.dzrbuild --project-name "$PKG_NAME" . || true
            if [ -d "android" ]; then echo "✅ [bootstrap-2] android/ generated"; else echo "❌ [bootstrap-2] flutter create gagal — build bakal mati di v1 embedding"; fi
          fi
          # ── 🩹 v6.9: V1-EMBEDDING + SCAFFOLD PRE-FLIGHT SWEEP ──
          # Kasus nyata (run #97 AI ASISTEN): ZIP bawa android/ SETENGAH JADI
          # — manifest jadul (meta-data flutterEmbedding cuma di COMMENT /
          # value bukan 2 / application class v1), kadang TANPA gradle config
          # sama sekali. flutter tool nolak instan (0.1s, sebelum gradle):
          # "Build failed due to use of deleted Android v1 embedding."
          # Auto-fix lama cuma nrima manifest polos → gagal ulang → mati.
          # Dua lapis self-heal SEBELUM build pertama:
          #   L1) scaffold invalid (gak ada settings/build.gradle(.kts)) →
          #       regenerate pake flutter create (lib/pubspec/assets aman)
          #   L2) manifest dinormalisasi ke embedding v2 + semua class v1 di
          #       .java/.kt ke-swap
          if [ -d "android" ] && [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ] && [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            echo "🩹 [v1-sweep L1] android/ gak punya gradle config = scaffold invalid → regenerate..."
            PKG_NAME=$(sed -n "s/^name:[[:space:]]*[\"']\{0,1\}\([a-zA-Z0-9_]\+\)[\"']\{0,1\}[[:space:]]*$/\1/p" pubspec.yaml | head -1)
            PKG_NAME=$(echo "$PKG_NAME" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9_]//g')
            case "$PKG_NAME" in "") PKG_NAME="app" ;; [0-9]*) PKG_NAME="a$PKG_NAME" ;; esac
            rm -rf android
            flutter create --platforms=android --org com.dzrbuild --project-name "$PKG_NAME" . || true
            if [ -d "android" ]; then
              echo "✅ [v1-sweep L1] android/ regenerated (v2 fresh)"
              touch /tmp/bldfix_v1_nuked
            else
              echo "⚠️ [v1-sweep L1] flutter create gagal — reactive nuke bakal nyoba lagi"
            fi
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            MANIFEST_V1="android/app/src/main/AndroidManifest.xml"
            python3 - "$MANIFEST_V1" <<'PYV1'
          import re, sys
          mani = sys.argv[1]
          with open(mani, encoding='utf-8', errors='replace') as f:
              t = f.read()
          orig = t
          def _strip_ce(m):
              c = m.group(0)
              return '' if 'flutterEmbedding' in c else c
          t = re.sub(r'<!--.*?-->', _strip_ce, t, flags=re.S)
          def _force2(m):
              return re.sub(r'android:value="[^"]*"', 'android:value="2"', m.group(0))
          t = re.sub(r'<meta-data\s+[^>]*android:name="flutterEmbedding"[^>]*/?>', _force2, t)
          if not re.search(r'<meta-data\s+[^>]*android:name="flutterEmbedding"', t):
              t = re.sub(r'(<application\b[^>]*>)', r'\1\n        <meta-data android:name="flutterEmbedding" android:value="2" />', t, count=1)
          t = t.replace(' android:name="io.flutter.app.FlutterApplication"', '').replace('android:name="io.flutter.app.FlutterApplication" ', '')
          if t != orig:
              with open(mani, 'w', encoding='utf-8') as f:
                  f.write(t)
              print('🩹 [v1-sweep L2] manifest dinormalisasi ke embedding v2')
          else:
              print('🔎 [v1-sweep L2] manifest udah v2-clean')
          PYV1
            for SRCF in $(find android/app/src/main \( -name "*.java" -o -name "*.kt" \) 2>/dev/null); do
              if grep -q "io\.flutter\.app\." "$SRCF" 2>/dev/null; then
                sed -i 's|io\.flutter\.app\.FlutterActivity|io.flutter.embedding.android.FlutterActivity|g; s|io\.flutter\.app\.FlutterApplication|android.app.Application|g; s|\bFlutterApplication\b|Application|g' "$SRCF"
                echo "🩹 [v1-sweep L2] $SRCF: class embedding v1 → v2"
              fi
            done
          fi
          SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && [ -n "$SAFE_APP_NAME" ] && [ "$SAFE_APP_NAME" != "MyApp" ]; then
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"$SAFE_APP_NAME\"|g" "$MANIFEST"
          fi
          # ── 🔐 v6.1: izin INTERNET buat project bootstrap ──
          # Template `flutter create` GAK naro uses-permission INTERNET di
          # main manifest (cuma di debug/profile) → APK release dari project
          # yang gak bawa android/ jalan TANPA izin internet → WebView blank
          # + fetch API/font gagal semua (kasus run #60: arshi layar item).
          # web2apk.yml udah lama inject; jalur ZIP project kelewat.
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <application|' "$MANIFEST"
            echo "🔐 [v6.1] Izin INTERNET + NETWORK_STATE + WIFI_STATE di-inject ke manifest"
          fi
          # ── ⚪ v4.10.2: cleartext buat APK sideload (kelas bug layar putih) ──
          # App project user yang fetch http:// (API lama/gambar) keblokir
          # Android 9+ tanpa flag ini — sama kayak kasus web2apk run #31
          # (localhost server keblokir → putih). Jalur AAB Play SENGAJA
          # gak di-inject (kebijakan cleartext Play).
          if [ -f "$MANIFEST" ] && ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's|<application|<application\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
            grep -q 'usesCleartextTraffic="true"' "$MANIFEST" || { echo "ERROR: inject cleartext gagal (anchor <application gak match)!"; exit 1; }
            echo "⚪ [v4.10.2] usesCleartextTraffic=true ke-inject (APK sideload)"
          fi
          # ── 🔐 v4.11: PERIZINAN PILIHAN USER (fail-loud, gak ada silent no-op) ──
          if [ -n "$INPUT_PERMS" ] && [ -f "$MANIFEST" ]; then
            PERM_BEFORE=$(grep -o 'uses-permission' "$MANIFEST" | wc -l)
            PERM_INJECT=""
            PERM_NINS=0
            IFS=',' read -r -a PERM_ARR <<< "$INPUT_PERMS"
            for RP in "${PERM_ARR[@]}"; do
              RP=$(printf '%s' "$RP" | tr -cd 'a-zA-Z0-9._')
              [ -z "$RP" ] && continue
              case "$RP" in android.permission.*) : ;; *) RP="android.permission.$RP" ;; esac
              if ! grep -q "android:name=\"$RP\"" "$MANIFEST"; then
                PERM_INJECT="$PERM_INJECT    <uses-permission android:name=\"$RP\" />\\n"
                PERM_NINS=$((PERM_NINS+1))
              fi
            done
            if [ -n "$PERM_INJECT" ]; then
              if grep -q '<application' "$MANIFEST"; then
                sed -i "s|<application|$PERM_INJECT<application|" "$MANIFEST"
              else
                # ↩️ manifest tanpa <application> itu SAH (module non-app:
                # benchmark/test/library). uses-permission tetap valid di
                # root manifest → fallback anchor </manifest> (case nyata:
                # kotlin run #16 NanzTube, macrobenchmark manifest).
                sed -i "s|</manifest>|$PERM_INJECT</manifest>|" "$MANIFEST"
                echo "↩️ $MANIFEST: fallback anchor </manifest> (gak ada <application>)"
              fi
              PERM_AFTER=$(grep -o 'uses-permission' "$MANIFEST" | wc -l)
              if [ "$PERM_AFTER" -lt $((PERM_BEFORE + PERM_NINS)) ]; then
                echo "=== BUILD FAILED: inject perizinan gagal (anchor <application & </manifest> dua-duanya gak match) ==="
                exit 1
              fi
              echo "🔐 [v4.11] $PERM_NINS izin pilihan user ke-inject (total uses-permission: $PERM_AFTER)"
            else
              echo "🔐 [v4.11] semua izin pilihan user udah ada di manifest"
            fi
          fi
          # ── ⚙️ v4.8 AGP9 safety net: patch plugin pub-cache lama yang masih
          # pake proguard-android.txt (di-blok AGP 9+). Non-fatal. (APK step)
          find "$HOME/.pub-cache/hosted" -name "build.gradle" -path "*android*" \
            -exec sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" {} + 2>/dev/null || true
          echo "AGP9 proguard safety patch (APK): OK"
          # ── 🆕 v5.6: launcher icon dari config flutter_launcher_icons ──
          # Banyak project (kayak arshi) bawa assets/icon.png + config
          # flutter_launcher_icons di pubspec, tapi icon-nya gak pernah
          # di-generate → APK kelar pake icon Flutter default. Non-fatal:
          # gagal → build lanjut pake icon default. Marker biar AAB step
          # gak ngulang kerja yang sama.
          if [ ! -f ".icons_generated" ] && [ -d "android" ] && grep -qP "^flutter_launcher_icons:\s*$" pubspec.yaml 2>/dev/null; then
            # v6.9: pre-check image_path — config nunjuk file yang gak ada =
            # PathNotFoundException (run #97 assets/icon.png) → skip bersih,
            # pake icon default (non-fatal, gak buang waktu dart run).
            ICON_PATH=$(sed -n "s/^\s*image_path:\s*[\"']\{0,1\}\([^\"'# ]\+\)[\"']\{0,1\}.*/\1/p" pubspec.yaml | head -1)
            if [ -n "$ICON_PATH" ] && [ ! -f "$ICON_PATH" ]; then
              echo "⚠️ flutter_launcher_icons nunjuk ke '$ICON_PATH' yang GAK ADA — skip generate (pake icon default, non-fatal)"
              touch .icons_generated
            else
              echo "🎨 config flutter_launcher_icons ketemu → generate icon launcher..."
              dart run flutter_launcher_icons || echo "⚠️ icon generation gagal (non-fatal) — build lanjut pake icon default"
              touch .icons_generated
            fi
          fi
          # ── 🩹 v6.9 RES-DUP SHIELD: resource nama-sama-ekstensi-beda di res
          # (klasik: ic_launcher.png + ic_launcher.jpg hasil eksport generator
          # icon) → "Duplicate resources" → task merge*Resources mati. Buang
          # dobelnya SEBELUM build (idempoten — jalan 2x hasil sama).
          rm -f /tmp/resdedup_removed
          python3 /tmp/resdedup.py || true
          # ── 🆕 v4.41 DESUGAR: pasca-scaffold/regen → pastikan config
          # desugaring nempel (idempoten; scaffold baru dari flutter create
          # gak bawa desugaring padahal pubspec butuh) ──
          python3 /tmp/desugarfix.py || true
          # ── ⚙️ v5.4/v5.5: build + auto-fix reaktif (max 5 percobaan) ──
          # Toolchain ke tua → bldfix.py. Error kompilasi Dart (API package
          # hasil major-upgrade) → dartfix.py. Terus retry sampai OK.
          # ── ⚡ v4.40 OPTIMASI: scan dulu → apply R8/shrink (idempoten) ──
          if [ "$INPUT_OPTIMIZE" = "true" ]; then
            python3 /tmp/optscan.py || true
            python3 /tmp/optgradle.py apply || true
          fi
          rm -f /tmp/bldfix_applied /tmp/dartfix_applied /tmp/dartfix_pubspec
          BUILD_ATTEMPT=0
          BUILD_OK=false
          while [ "$BUILD_ATTEMPT" -lt 5 ]; do
            BUILD_ATTEMPT=$((BUILD_ATTEMPT+1))
            echo "🔨 flutter build apk — percobaan $BUILD_ATTEMPT/5 ($INPUT_BUILD_TYPE)"
            BUILD_RC=0
            if [ "$INPUT_BUILD_TYPE" = "release" ]; then
              if [ "$INPUT_OPTIMIZE" = "true" ] && [ ! -f /tmp/opt_gradle_undone ]; then
                echo "⚡ Optimasi ON — flutter build apk (obfuscate + tree-shake, percobaan $BUILD_ATTEMPT/5)"
                BUILD_OUT=$(flutter build apk --release --tree-shake-icons --obfuscate --split-debug-info=/tmp/dzr-symbols --build-number="${GITHUB_RUN_NUMBER:-1}" 2>&1) || BUILD_RC=$?
              else
                BUILD_OUT=$(flutter build apk --release --no-tree-shake-icons --build-number="${GITHUB_RUN_NUMBER:-1}" 2>&1) || BUILD_RC=$?
              fi
            else
              BUILD_OUT=$(flutter build apk --debug --no-tree-shake-icons --build-number="${GITHUB_RUN_NUMBER:-1}" 2>&1) || BUILD_RC=$?
            fi
            printf '%s\n' "$BUILD_OUT" | tee build_output.txt
            if [ "$BUILD_RC" -eq 0 ]; then
              BUILD_OK=true
              break
            fi
            echo "⚠️ build gagal (percobaan $BUILD_ATTEMPT/5) → cek toolchain auto-fix..."
            # ⚡ OPT-SELFHEAL v4.40: gagal pas optimasi aktif → rollback + retry polos
            if [ "$INPUT_OPTIMIZE" = "true" ] && [ ! -f /tmp/opt_gradle_undone ]; then
              echo "⚡ SELF-HEAL optimasi: rollback R8/shrink/tree-shake → retry tanpa optimasi"
              touch /tmp/opt_gradle_undone
              python3 /tmp/optgradle.py undo || true
              continue
            fi
            BLD_ERR="$BUILD_OUT" python3 /tmp/bldfix.py || true
            if [ -s /tmp/bldfix_applied ]; then
              echo "🔁 retry build setelah auto-fix: $(head -1 /tmp/bldfix_applied)"
              rm -f /tmp/bldfix_applied
            else
              # ── ⚙️ v5.5: coba heal error kompilasi Dart ──
              python3 /tmp/dartfix.py build_output.txt || true
              if [ -s /tmp/dartfix_applied ]; then
                if [ -s /tmp/dartfix_pubspec ]; then
                  echo "🔁 pub get setelah dependency_overrides ditambahkan..."
                  flutter pub get || true
                fi
                echo "🔁 retry build setelah Dart auto-fix: $(head -1 /tmp/dartfix_applied)"
                rm -f /tmp/dartfix_applied /tmp/dartfix_pubspec
              else
                # ── 🩹 v6.9 RES-DUP reaktif: error "Duplicate resources" →
                # buang dobelnya lalu retry. Dupe gak ketemu di res project
                # (mis. dupe-nya di plugin AAR) → stop, biar bot laporin.
                if grep -qE "Duplicate resources|duplicate value for resource" build_output*.txt 2>/dev/null; then
                  rm -f /tmp/resdedup_removed
                  python3 /tmp/resdedup.py || true
                  if [ -s /tmp/resdedup_removed ]; then
                    echo "🔁 retry build setelah RES-DUP ($(wc -l < /tmp/resdedup_removed) file duplikat kehapus)"
                    rm -f /tmp/resdedup_removed
                    continue
                  fi
                fi
                echo "❌ gak ada auto-fix yang cocok — error asli ada di atas"
                break
              fi
            fi
          done
          rm -f /tmp/bldfix_applied /tmp/dartfix_applied /tmp/dartfix_pubspec
          if [ "$BUILD_OK" != "true" ]; then
            echo "=== BUILD FAILED ==="
            tail -40 build_output.txt
            exit 1
          fi
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1 || find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "=== BUILD FAILED ==="
            tail -30 build_output.txt
            exit 1
          fi
          echo "APK: $APK_PATH ($(du -sh "$APK_PATH" | cut -f1))"
          # ⚡ v4.40: laporan optimasi masuk artifact → bot bacain ke user
          if [ "$INPUT_OPTIMIZE" = "true" ]; then
            python3 /tmp/optreport.py || true
          fi

      # ─── 🔐 v5.9 → v6.6: STABLE SIGNING jalur ZIP project (PER USER) ────
      # v5.9 dulu: SATU keystore global (signing/dzr-release.jks) buat SEMUA
      # user → signature stabil antar build, TAPI semua app semua user share
      # kunci yang sama.
      # v6.2 sekarang: tiap user punya keystore SENDIRI (keystores/u<id>.jks)
      # → rebuild app yang sama = signature SAMA (update-over-install jalan
      # terus), dan app user A gak share kunci sama user B.
      # Fallback aman: keystore_id kosong (dispatch manual lama) = keystore
      # global (keystores/global-v2.jks) — 100% backward compatible.
      # 🔐 v6.6: keystore GAK LAGI ke-commit ke repo (siapapun bisa baca!) —
      # disimpen di R2 PRIVATE bucket, creds lewat GitHub Secrets. Keystore
      # ada tapi gak valid dgn KS_PASS = FAIL LOUD (jangan regenerate!).
      - name: Stable signing (ZIP project)
        if: inputs.build_format == 'apk' || inputs.build_format == 'aab' || inputs.build_format == 'both'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_PASS_OLD: ${{ secrets.KS_PASS_OLD }}
          KS_ENC_KEY: ${{ secrets.KS_ENC_KEY }}
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1 || find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "WARNING: APK gak ketemu buat re-sign (skip, non-fatal)"
            exit 0
          fi

          # ── v6.2: path keystore per user (sanitasi ketat: cuma alfanumerik) ──
          KID=$(printf '%s' "${INPUT_KEYSTORE_ID:-}" | tr -cd 'a-zA-Z0-9')
          if [ -n "$KID" ]; then
            KS_ENC_PATH="keystores/u${KID}.jks.enc"
            echo "🔐 Keystore PER-USER: $KS_ENC_PATH"
          else
            KS_ENC_PATH="signing/global-v2.jks.enc"
            echo "🔐 Keystore GLOBAL (keystore_id kosong): $KS_ENC_PATH"
          fi

          # ── 🔐 v6.6: keystore per user dari file TERENKRIPSI di repo ──
          # Format: AES-256-CBC + PBKDF2 (600k iter) via openssl — kunci dekrip
          # (KS_ENC_KEY) cuma di GitHub Secrets. Keystore lama (dibuat sebelum
          # rotasi password) divalidasi dgn KS_PASS_OLD biar app lama tetap
          # bisa update. Decrypt/validasi gagal = FAIL LOUD (JANGAN regenerate).
          KS_ENC="$KS_ENC_PATH"
          KS=/tmp/keystore.jks
          rm -f "$KS" /tmp/ks.enc
          # ⚠️ Gak ada actions/checkout di workflow ini → keberadaan .enc dicek
          # via GitHub API (file keystore GAK PERNAH ada di disk runner!)
          ENC_HTTP=$(curl -sL -o /tmp/ks_enc.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/contents/${KS_ENC}?ref=main")
          if [ "$ENC_HTTP" = "200" ]; then
            python3 -c "import json,base64;open('/tmp/ks.enc','wb').write(base64.b64decode(json.load(open('/tmp/ks_enc.json'))['content']))" 2>/dev/null || true
          fi
          if [ "$ENC_HTTP" = "200" ] && [ -s /tmp/ks.enc ]; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in /tmp/ks.enc -out "$KS" -pass pass:"$KS_ENC_KEY" 2>/dev/null || [ ! -s "$KS" ]; then
              echo "=== BUILD FAILED: keystore terenkripsi ada tapi GAGAL didekrip (cek secret KS_ENC_KEY) ==="
              exit 1
            fi
            KS_USE_PASS=""
            if keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias dzr >/dev/null 2>&1; then
              KS_USE_PASS="$KS_PASS"
            elif [ -n "$KS_PASS_OLD" ] && keytool -list -keystore "$KS" -storepass "$KS_PASS_OLD" -alias dzr >/dev/null 2>&1; then
              KS_USE_PASS="$KS_PASS_OLD"
              echo "ℹ️ Keystore legacy (pass lama) — tetep dipake biar app ter-install lama tetap bisa update"
            fi
            if [ -z "$KS_USE_PASS" ]; then
              echo "=== BUILD FAILED: keystore didekrip tapi pass gak cocok (KS_PASS/KS_PASS_OLD salah) ==="
              echo "JANGAN regenerate! Cek secrets — salah pass = app ter-install gak bisa update."
              exit 1
            fi
            echo "Keystore stabil: DIPAKE dari $KS_ENC (dekripsi OK)"
          else
            echo "Keystore belum ada — generate BARU + commit TERENKRIPSI ($KS_ENC)..."
            keytool -genkeypair -v -keystore "$KS" -alias dzr -keyalg RSA -keysize 2048 \
              -validity 10950 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=${{ inputs.brand || 'DZR CloudBuilder' }}, OU=Deruzuan, O=${{ inputs.brand || 'DZR' }}, L=Jakarta, C=ID" >/dev/null 2>&1
            ENC_B64=$(openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$KS" -pass pass:"$KS_ENC_KEY" | base64 -w0)
            PAYLOAD=$(python3 -c "import json,sys;print(json.dumps({'message':'chore: stable signing keystore (encrypted at rest)','content':sys.argv[1],'branch':'main'}))" "$ENC_B64")
            PUT_HTTP=$(curl -sL -o /tmp/ks_put.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              -d "$PAYLOAD" "https://api.github.com/repos/${GH_REPO}/contents/${KS_ENC}")
            KS_USE_PASS="$KS_PASS"
            if [ "$PUT_HTTP" != "200" ] && [ "$PUT_HTTP" != "201" ]; then
              echo "Commit gagal (HTTP $PUT_HTTP) — kemungkinan race build lain, coba ambil yang di repo..."
              ENC_HTTP=$(curl -sL -o /tmp/ks_enc.json -w "%{http_code}" \
                -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GH_REPO}/contents/${KS_ENC}?ref=main")
              if [ "$ENC_HTTP" = "200" ]; then
                python3 -c "import json,base64;open('/tmp/ks.enc','wb').write(base64.b64decode(json.load(open('/tmp/ks_enc.json'))['content']))" 2>/dev/null || true
              fi
              if [ "$ENC_HTTP" = "200" ] && [ -s /tmp/ks.enc ] \
                && openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in /tmp/ks.enc -out "$KS" -pass pass:"$KS_ENC_KEY" 2>/dev/null \
                && [ -s "$KS" ] && keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias dzr >/dev/null 2>&1; then
                echo "🔐 Race guard: pake keystore dari repo (identik)"
              else
                echo "=== BUILD FAILED: keystore gak bisa disimpan/diambil — stop biar signature konsisten ==="
                exit 1
              fi
            else
              echo "🔐 Keystore baru disimpen TERENKRIPSI di repo ($KS_ENC)"
            fi
          fi

          if [ -s "$KS" ] && ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* >/dev/null 2>&1; then
            BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)
            if [ -x "$BT/zipalign" ] && [ -x "$BT/apksigner" ]; then
              cp "$APK" /tmp/pre_sign.apk
              "$BT/zipalign" -f -p 4 /tmp/pre_sign.apk /tmp/aligned.apk
              "$BT/apksigner" sign --ks "$KS" --ks-key-alias dzr \
                --ks-pass "pass:$KS_USE_PASS" --key-pass "pass:$KS_USE_PASS" \
                --out "$APK" /tmp/aligned.apk
              "$BT/apksigner" verify "$APK" \
                && echo "✅ APK ke-sign keystore stabil (jalur ZIP)" \
                || echo "WARNING: verify gagal (non-fatal, APK tetep ke-upload)"
            else
              echo "WARNING: zipalign/apksigner gak ada (skip re-sign)"
            fi
          else
            echo "WARNING: keystore/build-tools gak siap (skip re-sign, non-fatal)"
          fi

          # ── 🔏 v4.11: sign AAB juga (Play nolak bundle unsigned) ──
          AAB="$(find build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -1)"
          if [ -n "$AAB" ] && [ -s "$KS" ]; then
            BND_SIGNER="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/bundlesigner 2>/dev/null | sort -V | tail -1)"
            if [ -n "$BND_SIGNER" ] && [ -x "$BND_SIGNER" ]; then
              if "$BND_SIGNER" sign --ks "$KS" --ks-key-alias dzr --ks-pass "pass:$KS_USE_PASS" --out "${AAB%.aab}.signed.aab" "$AAB"; then
                mv "${AAB%.aab}.signed.aab" "$AAB"
                echo "🔏 AAB ke-sign (bundlesigner)"
              else
                echo "WARNING: bundlesigner gagal (non-fatal)"
              fi
            elif command -v jarsigner >/dev/null 2>&1; then
              if jarsigner -keystore "$KS" -storepass "$KS_USE_PASS" "$AAB" dzr >/dev/null 2>&1; then
                echo "🔏 AAB ke-sign (jarsigner)"
              else
                echo "WARNING: jarsigner AAB gagal (non-fatal)"
              fi
            else
              echo "WARNING: bundlesigner/jarsigner gak ada — AAB gak ke-sign"
            fi
          fi

      # ── 🤖 v3.4: OTA channel (Flutter) — paritas build_kotlin.yml ──
      # request owner: "yang bisa update cuma kotlin sama flutter" → build
      # Flutter (ZIP project) sekarang ikut kanal OTA: versionCode udah = run
      # number (via --build-number di step build), step ini: aapt badging →
      # pkg asli → delta bsdiff (DZRDELTA) → upload app.apk + APK ber-versi +
      # build-info.json ke release apk-<pkg> (guard anti-race identik).
      # build-info.json nyempil di artifact → bot nulis manifest OTA.
      # SEMUA cabang non-fatal — gagal OTA gak pernah bikin build gagal.
      - name: OTA channel (Flutter)
        if: (inputs.build_format == 'apk' || inputs.build_format == 'both') && inputs.build_type == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # pipefail-safe: pipeline gagal (gak ada APK) tetap lanjut → skip pesan
          APK="$(ls -t build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then APK="$(find build/app/outputs/apk -name '*.apk' 2>/dev/null | head -1 || true)"; fi
          if [ -z "$APK" ]; then echo "ℹ️ Gak ada APK — kanal OTA skip"; exit 0; fi
          RUN_NO="${GITHUB_RUN_NUMBER:-1}"
          BTD="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$BTD" ] || [ ! -x "$BTD/aapt" ]; then echo "ℹ️ aapt gak ada — kanal OTA skip"; exit 0; fi
          BADGE="$($BTD/aapt dump badging "$APK" 2>/dev/null | head -1)"
          # ⚠️ aapt badging: "package: name='...'" — PAKAI SPASI (pelajaran v3.3.0)
          PKG="$(printf '%s' "$BADGE" | sed -n "s/.*package:[[:space:]]*name='\([^']*\)'.*/\1/p")"
          VC="$(printf '%s' "$BADGE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          if [ -z "$PKG" ] || [ "$VC" != "$RUN_NO" ]; then
            echo "ℹ️ PKG/VC gak cocok (PKG='$PKG' VC='$VC' vs run $RUN_NO) → kanal OTA skip (non-fatal)"
            exit 0
          fi
          echo "🎯 Kanal OTA: apk-$PKG v$RUN_NO"
          cp "$APK" /tmp/app.apk
          cp "$APK" "/tmp/app-3.0.$RUN_NO.apk"
          APK_SHA="$(sha256sum /tmp/app.apk | cut -d' ' -f1)"
          # ── 🔒 v4.11 CRYPT VAULT: enkripsi APK sebelum nyentuh release publik.
          # Gagal enkripsi = FAIL LOUD (plain GAK BOLEH ke-upload ke repo publik).
          ENC_MODE=""
          ENC_JSON=""
          if [ -n "$ENC_KEY" ]; then
            echo "::add-mask::$ENC_KEY"
            if openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 -k "$ENC_KEY" -in /tmp/app.apk -out /tmp/app.apk.enc; then
              ENC_MODE="enc"
              ENC_SHA_ENC="$(sha256sum /tmp/app.apk.enc | cut -d' ' -f1)"
              ENC_JSON=",\"enc\":true,\"enc_alg\":\"AES-256-CBC/PBKDF2-100k\",\"enc_sha256\":\"$ENC_SHA_ENC\""
              echo "🔒 [CRYPT VAULT] app.apk → app.apk.enc OK ($(du -h /tmp/app.apk.enc | cut -f1))"
            else
              echo "=== BUILD FAILED: enkripsi CRYPT VAULT gagal — plain gak boleh ke-upload ==="
              exit 1
            fi
          fi
          APK_SIZE=$(stat -c%s /tmp/app.apk)

          # ── 🚀 delta patch (pola identik build_kotlin.yml: bsdiff → DZRDELTA) ──
          DELTA_JSON=""
          OLD_VC=""
          if sudo apt-get install -y --no-install-recommends bsdiff >/dev/null 2>&1; then
            rm -f /tmp/old.apk /tmp/bsdiff.raw /tmp/delta.patch /tmp/delta-info.json
            OLD_URL=$(gh api "repos/${GH_REPO}/releases/tags/apk-$PKG" --jq '.assets[] | select((.name|test("^app-[0-9]+\\.[0-9]+\\.[0-9]+\\.apk$"))) | .browser_download_url + " " + .name' 2>/dev/null | awk -v run="$RUN_NO" '{n=$2; sub(/^app-[0-9]+\.[0-9]+\./,"",n); sub(/\.apk$/,"",n); if ((n+0)<(run+0) && (n+0)>best) {best=n+0; u=$1}} END {if (best>0) print u}')
            if [ -z "$OLD_URL" ]; then
              OLD_URL="https://github.com/${GH_REPO}/releases/download/apk-$PKG/app.apk"
            fi
            echo "⬇️  Download APK lama buat delta: $OLD_URL"
            curl -sL --retry 2 --max-time 300 -o /tmp/old.apk "$OLD_URL" || true
            if [ -s /tmp/old.apk ]; then
              OLD_VC="$($BTD/aapt dump badging /tmp/old.apk 2>/dev/null | head -1 | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
            fi
            if [ -s /tmp/old.apk ] && [ -n "$OLD_VC" ] && [ "$OLD_VC" -gt 0 ] && [ "$OLD_VC" -lt "$RUN_NO" ] 2>/dev/null && [ -z "$ENC_MODE" ]; then
              echo "🔀 Bikin delta patch: v$OLD_VC → v$RUN_NO (bsdiff, bisa 1-3 menit)..."
              if bsdiff /tmp/old.apk /tmp/app.apk /tmp/bsdiff.raw; then
                python3 << 'PYEOF2'
          import struct, bz2, hashlib, json, sys
          try:
            src = open('/tmp/bsdiff.raw', 'rb').read()
            if src[:8] != b'BSDIFF40':
              raise ValueError('bukan output bsdiff: %r' % src[:8])
            ctrl_len, diff_len, extra_len, newsize = struct.unpack('>QQQq', src[8:40])
            body = src[40:]
            d1 = bz2.BZ2Decompressor(); c = d1.decompress(body); r1 = d1.unused_data
            d2 = bz2.BZ2Decompressor(); df = d2.decompress(r1); r2 = d2.unused_data
            d3 = bz2.BZ2Decompressor(); ex = d3.decompress(r2); r3 = d3.unused_data
            if not (len(c) == ctrl_len and len(df) == diff_len and len(ex) == extra_len):
              raise ValueError('ukuran blok bsdiff gak cocok (%d/%d/%d vs %d/%d/%d)' % (len(c), ctrl_len, len(df), diff_len, len(ex), extra_len))
            l1 = len(body) - len(r1); l2 = len(r1) - len(r2); l3 = len(r2) - len(r3)
            out = b'DZRDELTA' + struct.pack('<I', 1) + struct.pack('<III', l1, l2, l3) + struct.pack('<q', newsize) + body[:l1] + body[l1:l1+l2] + body[l1+l2:l1+l2+l3]
            open('/tmp/delta.patch', 'wb').write(out)
            sha = hashlib.sha256(out).hexdigest()
            json.dump({'size': len(out), 'sha256': sha, 'newSize': newsize}, open('/tmp/delta-info.json', 'w'))
            print('DZR frame: ctrl=%d diff=%d extra=%d newSize=%d' % (l1, l2, l3, newsize))
          except Exception as _dlerr:
            print('WARNING: delta skip (parser bsdiff: %s)' % _dlerr)
            if 'src' in dir():
              print('diag: raw=%d B, hdr=%r' % (len(src), src[:40]))
            sys.exit(0)
          PYEOF2
              else
                echo "WARNING: bsdiff gagal — delta skip (non-fatal)"
              fi
            else
              echo "ℹ️ APK lama gak ketemu/gak valid — delta skip (build pertama kanal ini normal)"
            fi
            if [ -s /tmp/delta.patch ] && [ -s /tmp/delta-info.json ] && [ -n "$OLD_VC" ] && [ -z "$ENC_MODE" ]; then
              DELTA_SIZE=$(stat -c%s /tmp/delta.patch)
              if [ "$DELTA_SIZE" -lt $((APK_SIZE * 75 / 100)) ]; then
                DELTA_SHA=$(python3 -c "import json;print(json.load(open('/tmp/delta-info.json'))['sha256'])")
                DELTA_JSON=",\"delta\":{\"base\":$OLD_VC,\"url\":\"https://github.com/${GH_REPO}/releases/download/apk-$PKG/delta-${OLD_VC}-${RUN_NO}.patch\",\"sha256\":\"$DELTA_SHA\",\"size\":$DELTA_SIZE}"
                echo "🚀 Delta worth-it: $DELTA_SIZE byte = $((DELTA_SIZE * 100 / APK_SIZE))% dari penuh"
              else
                echo "ℹ️ Delta gak worth-it ($DELTA_SIZE byte) — skip, user unduh penuh"
                rm -f /tmp/delta.patch /tmp/delta-info.json
              fi
            fi
          else
            echo "WARNING: bsdiff gak ke-install — delta skip (non-fatal, update penuh tetap jalan)"
          fi

          printf '{"package":"%s","versionCode":%s,"versionName":"3.0.%s","sha256":"%s","builtAt":"%s","size":%s%s%s}\n' \
            "$PKG" "$RUN_NO" "$RUN_NO" "$APK_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$APK_SIZE" "$ENC_JSON" "$DELTA_JSON" > /tmp/build-info.json
          mkdir -p apk_out
          cp /tmp/build-info.json apk_out/build-info.json
          echo "🔧 build-info.json: v3.0.$RUN_NO sha256=$APK_SHA (nyempil di artifact buat bot)"

          # ── 🛡️ guard anti-race (identik build_kotlin.yml v3.3) ──
          CUR_VC=$(curl -sL --max-time 30 "https://github.com/${GH_REPO}/releases/download/apk-$PKG/build-info.json" 2>/dev/null | python3 -c "import json,sys;print(int(json.load(sys.stdin).get('versionCode',0)))" 2>/dev/null || echo 0)
          OTA_FRESH=1
          if [ "$CUR_VC" -ge "$RUN_NO" ] 2>/dev/null && [ "$CUR_VC" -gt 0 ]; then
            OTA_FRESH=0
            echo "⏭️ Kanal OTA udah di v$CUR_VC (>= run ini $RUN_NO) — build stale/rerun, kanal GAK disentuh"
          fi
          if [ "$OTA_FRESH" = "1" ] && gh release view "apk-$PKG" >/dev/null 2>&1; then
            if [ -n "$ENC_MODE" ]; then
              # 🔒 CRYPT VAULT: upload .enc + purge asset plain/delta lama
              gh release upload "apk-$PKG" /tmp/app.apk.enc --clobber \
                && echo "🔒 Kanal OTA updated: apk-$PKG → app.apk.enc (TERENKRIPSI)" \
                || echo "WARNING: gh upload .enc gagal (non-fatal)"
              gh api "repos/${GH_REPO}/releases/tags/apk-$PKG" --jq '.assets[] | select(.name == "app.apk" or (.name|test("^app-[0-9]+\\.[0-9]+\\.[0-9]+\\.apk$")) or (.name|test("^delta-"))) | [.id,.name] | @tsv' 2>/dev/null | \
              while IFS=$'\t' read -r vaid vname; do
                gh api -X DELETE "repos/${GH_REPO}/releases/assets/$vaid" >/dev/null 2>&1 || true
                echo "🧹 [CRYPT VAULT] asset plain dibuang: $vname"
              done
            else
            gh release upload "apk-$PKG" /tmp/app.apk --clobber \
              && echo "🔄 Kanal OTA updated: apk-$PKG → app.apk" \
              || echo "WARNING: gh upload gagal (non-fatal)"
            gh release upload "apk-$PKG" "/tmp/app-3.0.$RUN_NO.apk" --clobber \
              && echo "🗂️ APK ber-versi: app-3.0.$RUN_NO.apk (riwayat/rollback)" \
              || echo "WARNING: upload APK ber-versi gagal (non-fatal)"
            if [ -s /tmp/delta.patch ]; then
              gh release upload "apk-$PKG" /tmp/delta.patch --clobber \
                && echo "🚀 Delta asset: delta-${OLD_VC}-${RUN_NO}.patch" \
                || echo "WARNING: upload delta gagal (non-fatal)"
            fi
            fi
            gh release upload "apk-$PKG" /tmp/build-info.json --clobber \
              && echo "🔧 build-info.json ter-upload (bot pake ini buat manifest OTA)" \
              || echo "WARNING: upload build-info gagal (non-fatal)"
            if [ -n "$OLD_VC" ]; then
              gh api "repos/${GH_REPO}/releases/tags/apk-$PKG" --jq '.assets[] | select((.name|test("^delta-[0-9]+-[0-9]+\\.patch$"))) | [.id, .name] | @tsv' 2>/dev/null | \
              while IFS=$'\t' read -r aid aname; do
                if [ "$aname" != "delta-${OLD_VC}-${RUN_NO}.patch" ]; then
                  gh api -X DELETE "repos/${GH_REPO}/releases/assets/$aid" >/dev/null 2>&1 || true
                  echo "🧹 Delta lama dibuang: $aname"
                fi
              done
            fi
          elif [ "$OTA_FRESH" = "1" ]; then
            if [ -n "$ENC_MODE" ]; then
              gh release create "apk-$PKG" /tmp/app.apk.enc /tmp/build-info.json \
                --title "OTA $PKG" --notes "Build terbaru — kanal auto-update (terenkripsi CRYPT VAULT)" \
                && echo "🔒 Kanal OTA dibuat: apk-$PKG (app.apk.enc + build-info)" \
                || echo "WARNING: gh create gagal (non-fatal)"
            else
              gh release create "apk-$PKG" /tmp/app.apk "/tmp/app-3.0.$RUN_NO.apk" /tmp/build-info.json \
                --title "OTA $PKG" --notes "Build terbaru — kanal auto-update (Flutter)" \
                && echo "🔄 Kanal OTA dibuat: apk-$PKG (+ APK ber-versi + build-info)" \
                || echo "WARNING: gh create gagal (non-fatal)"
            fi
          fi

      - name: Patch Android + Build AAB
        if: inputs.build_format == 'aab' || inputs.build_format == 'both'
        run: |
          # ── 🆕 v5.6: second-chance bootstrap android/ (idempoten) ──
          if [ -d "android" ] && [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "🧹 [bootstrap-2] android/ shell kosong → dihapus"
            rm -rf android
          fi
          if [ ! -d "android" ] && [ -f "pubspec.yaml" ]; then
            echo "🔁 [bootstrap-2] android/ masih gak ada di step AAB → generate sekarang..."
            PKG_NAME=$(sed -n "s/^name:[[:space:]]*[\"']\{0,1\}\([a-zA-Z0-9_]\+\)[\"']\{0,1\}[[:space:]]*$/\1/p" pubspec.yaml | head -1)
            PKG_NAME=$(echo "$PKG_NAME" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9_]//g')
            case "$PKG_NAME" in "") PKG_NAME="app" ;; [0-9]*) PKG_NAME="a$PKG_NAME" ;; esac
            flutter create --platforms=android --org com.dzrbuild --project-name "$PKG_NAME" . || true
            if [ -d "android" ]; then echo "✅ [bootstrap-2] android/ generated"; else echo "❌ [bootstrap-2] flutter create gagal"; fi
          fi
          # ── 🩹 v6.9: V1-EMBEDDING + SCAFFOLD PRE-FLIGHT SWEEP ──
          # Kasus nyata (run #97 AI ASISTEN): ZIP bawa android/ SETENGAH JADI
          # — manifest jadul (meta-data flutterEmbedding cuma di COMMENT /
          # value bukan 2 / application class v1), kadang TANPA gradle config
          # sama sekali. flutter tool nolak instan (0.1s, sebelum gradle):
          # "Build failed due to use of deleted Android v1 embedding."
          # Auto-fix lama cuma nrima manifest polos → gagal ulang → mati.
          # Dua lapis self-heal SEBELUM build pertama:
          #   L1) scaffold invalid (gak ada settings/build.gradle(.kts)) →
          #       regenerate pake flutter create (lib/pubspec/assets aman)
          #   L2) manifest dinormalisasi ke embedding v2 + semua class v1 di
          #       .java/.kt ke-swap
          if [ -d "android" ] && [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ] && [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            echo "🩹 [v1-sweep L1] android/ gak punya gradle config = scaffold invalid → regenerate..."
            PKG_NAME=$(sed -n "s/^name:[[:space:]]*[\"']\{0,1\}\([a-zA-Z0-9_]\+\)[\"']\{0,1\}[[:space:]]*$/\1/p" pubspec.yaml | head -1)
            PKG_NAME=$(echo "$PKG_NAME" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9_]//g')
            case "$PKG_NAME" in "") PKG_NAME="app" ;; [0-9]*) PKG_NAME="a$PKG_NAME" ;; esac
            rm -rf android
            flutter create --platforms=android --org com.dzrbuild --project-name "$PKG_NAME" . || true
            if [ -d "android" ]; then
              echo "✅ [v1-sweep L1] android/ regenerated (v2 fresh)"
              touch /tmp/bldfix_v1_nuked
            else
              echo "⚠️ [v1-sweep L1] flutter create gagal — reactive nuke bakal nyoba lagi"
            fi
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            MANIFEST_V1="android/app/src/main/AndroidManifest.xml"
            python3 - "$MANIFEST_V1" <<'PYV1'
          import re, sys
          mani = sys.argv[1]
          with open(mani, encoding='utf-8', errors='replace') as f:
              t = f.read()
          orig = t
          def _strip_ce(m):
              c = m.group(0)
              return '' if 'flutterEmbedding' in c else c
          t = re.sub(r'<!--.*?-->', _strip_ce, t, flags=re.S)
          def _force2(m):
              return re.sub(r'android:value="[^"]*"', 'android:value="2"', m.group(0))
          t = re.sub(r'<meta-data\s+[^>]*android:name="flutterEmbedding"[^>]*/?>', _force2, t)
          if not re.search(r'<meta-data\s+[^>]*android:name="flutterEmbedding"', t):
              t = re.sub(r'(<application\b[^>]*>)', r'\1\n        <meta-data android:name="flutterEmbedding" android:value="2" />', t, count=1)
          t = t.replace(' android:name="io.flutter.app.FlutterApplication"', '').replace('android:name="io.flutter.app.FlutterApplication" ', '')
          if t != orig:
              with open(mani, 'w', encoding='utf-8') as f:
                  f.write(t)
              print('🩹 [v1-sweep L2] manifest dinormalisasi ke embedding v2')
          else:
              print('🔎 [v1-sweep L2] manifest udah v2-clean')
          PYV1
            for SRCF in $(find android/app/src/main \( -name "*.java" -o -name "*.kt" \) 2>/dev/null); do
              if grep -q "io\.flutter\.app\." "$SRCF" 2>/dev/null; then
                sed -i 's|io\.flutter\.app\.FlutterActivity|io.flutter.embedding.android.FlutterActivity|g; s|io\.flutter\.app\.FlutterApplication|android.app.Application|g; s|\bFlutterApplication\b|Application|g' "$SRCF"
                echo "🩹 [v1-sweep L2] $SRCF: class embedding v1 → v2"
              fi
            done
          fi
          SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && [ -n "$SAFE_APP_NAME" ] && [ "$SAFE_APP_NAME" != "MyApp" ]; then
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"$SAFE_APP_NAME\"|g" "$MANIFEST"
          fi
          # ── 🔐 v6.1: izin INTERNET buat project bootstrap ──
          # Template `flutter create` GAK naro uses-permission INTERNET di
          # main manifest (cuma di debug/profile) → APK release dari project
          # yang gak bawa android/ jalan TANPA izin internet → WebView blank
          # + fetch API/font gagal semua (kasus run #60: arshi layar item).
          # web2apk.yml udah lama inject; jalur ZIP project kelewat.
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <application|' "$MANIFEST"
            echo "🔐 [v6.1] Izin INTERNET + NETWORK_STATE + WIFI_STATE di-inject ke manifest"
          fi
          # ── 🔐 v4.11: PERIZINAN PILIHAN USER (fail-loud, gak ada silent no-op) ──
          if [ -n "$INPUT_PERMS" ] && [ -f "$MANIFEST" ]; then
            PERM_BEFORE=$(grep -o 'uses-permission' "$MANIFEST" | wc -l)
            PERM_INJECT=""
            PERM_NINS=0
            IFS=',' read -r -a PERM_ARR <<< "$INPUT_PERMS"
            for RP in "${PERM_ARR[@]}"; do
              RP=$(printf '%s' "$RP" | tr -cd 'a-zA-Z0-9._')
              [ -z "$RP" ] && continue
              case "$RP" in android.permission.*) : ;; *) RP="android.permission.$RP" ;; esac
              if ! grep -q "android:name=\"$RP\"" "$MANIFEST"; then
                PERM_INJECT="$PERM_INJECT    <uses-permission android:name=\"$RP\" />\\n"
                PERM_NINS=$((PERM_NINS+1))
              fi
            done
            if [ -n "$PERM_INJECT" ]; then
              if grep -q '<application' "$MANIFEST"; then
                sed -i "s|<application|$PERM_INJECT<application|" "$MANIFEST"
              else
                # ↩️ manifest tanpa <application> itu SAH (module non-app:
                # benchmark/test/library). uses-permission tetap valid di
                # root manifest → fallback anchor </manifest> (case nyata:
                # kotlin run #16 NanzTube, macrobenchmark manifest).
                sed -i "s|</manifest>|$PERM_INJECT</manifest>|" "$MANIFEST"
                echo "↩️ $MANIFEST: fallback anchor </manifest> (gak ada <application>)"
              fi
              PERM_AFTER=$(grep -o 'uses-permission' "$MANIFEST" | wc -l)
              if [ "$PERM_AFTER" -lt $((PERM_BEFORE + PERM_NINS)) ]; then
                echo "=== BUILD FAILED: inject perizinan gagal (anchor <application & </manifest> dua-duanya gak match) ==="
                exit 1
              fi
              echo "🔐 [v4.11] $PERM_NINS izin pilihan user ke-inject (total uses-permission: $PERM_AFTER)"
            else
              echo "🔐 [v4.11] semua izin pilihan user udah ada di manifest"
            fi
          fi
          # ── ⚙️ v4.8 AGP9 safety net (AAB step) — sama kayak step APK.
          find "$HOME/.pub-cache/hosted" -name "build.gradle" -path "*android*" \
            -exec sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" {} + 2>/dev/null || true
          echo "AGP9 proguard safety patch (AAB): OK"
          # ── 🆕 v5.6: launcher icon (idempoten — di-skip kalo APK step udah) ──
          if [ ! -f ".icons_generated" ] && [ -d "android" ] && grep -qP "^flutter_launcher_icons:\s*$" pubspec.yaml 2>/dev/null; then
            # v6.9: pre-check image_path — config nunjuk file yang gak ada =
            # PathNotFoundException (run #97 assets/icon.png) → skip bersih,
            # pake icon default (non-fatal, gak buang waktu dart run).
            ICON_PATH=$(sed -n "s/^\s*image_path:\s*[\"']\{0,1\}\([^\"'# ]\+\)[\"']\{0,1\}.*/\1/p" pubspec.yaml | head -1)
            if [ -n "$ICON_PATH" ] && [ ! -f "$ICON_PATH" ]; then
              echo "⚠️ flutter_launcher_icons nunjuk ke '$ICON_PATH' yang GAK ADA — skip generate (pake icon default, non-fatal)"
              touch .icons_generated
            else
              echo "🎨 config flutter_launcher_icons ketemu → generate icon launcher..."
              dart run flutter_launcher_icons || echo "⚠️ icon generation gagal (non-fatal) — build lanjut pake icon default"
              touch .icons_generated
            fi
          fi
          # ── 🩹 v6.9 RES-DUP SHIELD: resource nama-sama-ekstensi-beda di res
          # (klasik: ic_launcher.png + ic_launcher.jpg hasil eksport generator
          # icon) → "Duplicate resources" → task merge*Resources mati. Buang
          # dobelnya SEBELUM build (idempoten — jalan 2x hasil sama).
          rm -f /tmp/resdedup_removed
          python3 /tmp/resdedup.py || true
          # ── 🆕 v4.41 DESUGAR: pasca-scaffold/regen → pastikan config
          # desugaring nempel (idempoten; scaffold baru dari flutter create
          # gak bawa desugaring padahal pubspec butuh) ──
          python3 /tmp/desugarfix.py || true
          # ── ⚙️ v5.4/v5.5: build AAB + auto-fix reaktif (max 5 percobaan) ──
          # Sama kayak step APK: toolchain ke tua → bldfix.py, error Dart →
          # dartfix.py, terus retry.
          # ── ⚡ v4.40 OPTIMASI: scan dulu → apply R8/shrink (idempoten) ──
          if [ "$INPUT_OPTIMIZE" = "true" ]; then
            python3 /tmp/optscan.py || true
            python3 /tmp/optgradle.py apply || true
          fi
          rm -f /tmp/bldfix_applied /tmp/dartfix_applied /tmp/dartfix_pubspec
          BUILD_ATTEMPT=0
          BUILD_OK=false
          while [ "$BUILD_ATTEMPT" -lt 5 ]; do
            BUILD_ATTEMPT=$((BUILD_ATTEMPT+1))
            echo "🔨 flutter build appbundle — percobaan $BUILD_ATTEMPT/5 ($INPUT_BUILD_TYPE)"
            BUILD_RC=0
            if [ "$INPUT_BUILD_TYPE" = "release" ]; then
              if [ "$INPUT_OPTIMIZE" = "true" ] && [ ! -f /tmp/opt_gradle_undone ]; then
                echo "⚡ Optimasi ON — flutter build appbundle (obfuscate + tree-shake, percobaan $BUILD_ATTEMPT/5)"
                BUILD_OUT=$(flutter build appbundle --release --tree-shake-icons --obfuscate --split-debug-info=/tmp/dzr-symbols --build-number="${GITHUB_RUN_NUMBER:-1}" 2>&1) || BUILD_RC=$?
              else
                BUILD_OUT=$(flutter build appbundle --release --no-tree-shake-icons --build-number="${GITHUB_RUN_NUMBER:-1}" 2>&1) || BUILD_RC=$?
              fi
            else
              BUILD_OUT=$(flutter build appbundle --debug --no-tree-shake-icons --build-number="${GITHUB_RUN_NUMBER:-1}" 2>&1) || BUILD_RC=$?
            fi
            printf '%s\n' "$BUILD_OUT" | tee build_output_aab.txt
            if [ "$BUILD_RC" -eq 0 ]; then
              BUILD_OK=true
              break
            fi
            echo "⚠️ build AAB gagal (percobaan $BUILD_ATTEMPT/5) → cek toolchain auto-fix..."
            # ⚡ OPT-SELFHEAL v4.40: gagal pas optimasi aktif → rollback + retry polos
            if [ "$INPUT_OPTIMIZE" = "true" ] && [ ! -f /tmp/opt_gradle_undone ]; then
              echo "⚡ SELF-HEAL optimasi: rollback R8/shrink/tree-shake → retry tanpa optimasi"
              touch /tmp/opt_gradle_undone
              python3 /tmp/optgradle.py undo || true
              continue
            fi
            BLD_ERR="$BUILD_OUT" python3 /tmp/bldfix.py || true
            if [ -s /tmp/bldfix_applied ]; then
              echo "🔁 retry build setelah auto-fix: $(head -1 /tmp/bldfix_applied)"
              rm -f /tmp/bldfix_applied
            else
              # ── ⚙️ v5.5: coba heal error kompilasi Dart ──
              python3 /tmp/dartfix.py build_output_aab.txt || true
              if [ -s /tmp/dartfix_applied ]; then
                if [ -s /tmp/dartfix_pubspec ]; then
                  echo "🔁 pub get setelah dependency_overrides ditambahkan..."
                  flutter pub get || true
                fi
                echo "🔁 retry build setelah Dart auto-fix: $(head -1 /tmp/dartfix_applied)"
                rm -f /tmp/dartfix_applied /tmp/dartfix_pubspec
              else
                # ── 🩹 v6.9 RES-DUP reaktif: error "Duplicate resources" →
                # buang dobelnya lalu retry. Dupe gak ketemu di res project
                # (mis. dupe-nya di plugin AAR) → stop, biar bot laporin.
                if grep -qE "Duplicate resources|duplicate value for resource" build_output*.txt 2>/dev/null; then
                  rm -f /tmp/resdedup_removed
                  python3 /tmp/resdedup.py || true
                  if [ -s /tmp/resdedup_removed ]; then
                    echo "🔁 retry build setelah RES-DUP ($(wc -l < /tmp/resdedup_removed) file duplikat kehapus)"
                    rm -f /tmp/resdedup_removed
                    continue
                  fi
                fi
                echo "❌ gak ada auto-fix yang cocok — error asli ada di atas"
                break
              fi
            fi
          done
          rm -f /tmp/bldfix_applied /tmp/dartfix_applied /tmp/dartfix_pubspec
          if [ "$BUILD_OK" != "true" ]; then
            echo "=== AAB BUILD FAILED ==="
            tail -40 build_output_aab.txt
            exit 1
          fi
          AAB_PATH=$(find build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "AAB FAILED!"; exit 1
          fi

      # ── 🔒 v4.11 CRYPT VAULT — enkripsi artifact (APK/AAB yang nyisa di disk).
      # Kanal OTA udah ngurus release (upload .enc); step ini nyisa-nyisain
      # file plain di build dir → dienkripsi in-place (.enc), plain DIHAPUS.
      - name: Crypt Vault (artifact)
        env:
          ENC_KEY: ${{ inputs.enc_key }}
        run: |
          if [ -z "$ENC_KEY" ]; then
            echo "🔓 ENC_KEY kosong — artifact plain (mode lama, backward compat)"
            exit 0
          fi
          echo "::add-mask::$ENC_KEY"
          ENC_N=0
          while IFS= read -r -d '' VF; do
            if openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 -k "$ENC_KEY" -in "$VF" -out "${VF}.enc"; then
              rm -f "$VF"
              ENC_N=$((ENC_N+1))
              echo "🔒 $(basename "$VF") → $(basename "$VF").enc"
            else
              echo "=== BUILD FAILED: enkripsi artifact gagal buat $VF ==="
              exit 1
            fi
          done < <(find build/app/outputs apk_out -type f \( -name "*.apk" -o -name "*.aab" \) -print0 2>/dev/null)
          echo "🔒 [CRYPT VAULT] $ENC_N artifact dienkripsi"
      - name: Upload APK
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.apk.enc
            apk_out/build-info.json
            **/opt_report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload AAB
        if: inputs.build_format == 'aab' || inputs.build_format == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: aab-output
          path: |
            build/app/outputs/bundle/**/*.aab
            build/app/outputs/bundle/**/*.aab.enc
          retention-days: 7

      # NOTE: "Send to Telegram" step DIHAPUS — bot (index.js) yang handle kirim APK
      # ke user via client.sendFile() dengan format caption yang lebih informatif.
      # Workflow cuma upload artifact, bot yang deliver.
      # Ini mencegah DOUBLE APK (workflow kirim + bot kirim = user kirim 2x).

      # NOTE: "Notify Failure" step DIHAPUS — bot (index.js) yang handle error
      # notification ke user dengan detail error log + file attachment.
      # Workflow cuma build + upload artifact, bot yang handle semua notifikasi.
      # Ini mencegah DOUBLE error message (workflow kirim + bot kirim).
