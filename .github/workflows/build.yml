name: Deruzuan Dev Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter (dari GitHub Release)'
        required: true
      tag:
        description: 'Build tag / identifier'
        required: true
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      build_format:
        description: 'Output format'
        required: false
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      app_name:
        description: 'App Name (optional)'
        required: false
        default: 'MyApp'
      icon_url:
        description: 'Icon URL (optional)'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''
      flutter_version:
        description: 'Flutter SDK version (internal - do not change)'
        required: false
        default: '3.22.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - name: Download Project ZIP
        run: |
          echo "=== Download Project ZIP ==="
          echo "URL: ${{ inputs.zip_url }}"
          echo "Tag: ${{ inputs.tag }}"

          # Step 1: Download with auth + retry
          echo "[1/4] Downloading..."
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o project.zip \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${{ inputs.zip_url }}")

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Download failed! HTTP $HTTP_CODE"
            echo "Possible causes: URL expired, release not published, or auth failed."
            if [ -f project.zip ]; then
              FILE_TYPE=$(file project.zip 2>/dev/null || echo "unknown")
              echo "File type: $FILE_TYPE"
              if echo "$FILE_TYPE" | grep -qi "html\|text"; then
                echo "Downloaded file is NOT a ZIP - likely an HTML page."
                head -5 project.zip 2>/dev/null || true
              fi
            fi
            exit 1
          fi

          # Step 2: Verify file exists and is not empty
          echo "[2/4] Verifying file..."
          if [ ! -f project.zip ] || [ ! -s project.zip ]; then
            echo "ERROR: ZIP file is empty or missing!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s project.zip 2>/dev/null || echo "0")
          echo "File size: $FILE_SIZE bytes"

          # Step 3: Verify ZIP magic bytes (PK header = 50 4B)
          echo "[3/4] Checking ZIP magic bytes..."
          MAGIC=$(od -A n -t x1 -N 4 project.zip 2>/dev/null | tr -d ' ')
          echo "Magic bytes: $MAGIC"
          if ! echo "$MAGIC" | grep -qi "^504b"; then
            echo "ERROR: Not a valid ZIP file! (Missing PK magic header)"
            echo "First 16 bytes (hex):"
            od -A n -t x1 -N 16 project.zip 2>/dev/null || true
            echo "First 5 lines (text):"
            head -5 project.zip 2>/dev/null || true
            exit 1
          fi

          # Step 4: Verify with file command
          echo "[4/4] File type check..."
          FILE_TYPE=$(file project.zip 2>/dev/null || echo "unknown")
          echo "File type: $FILE_TYPE"
          if ! echo "$FILE_TYPE" | grep -qi "zip\|archive"; then
            echo "WARN: file command doesn't recognize as ZIP, but magic bytes OK. Continuing..."
          fi

          echo "SUCCESS: ZIP downloaded ($(du -sh project.zip | cut -f1))"

      - name: Extract Project
        run: |
          echo "=== Extract Project ==="

          # Verify ZIP integrity before extracting
          echo "Testing ZIP integrity..."
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "WARN: ZIP integrity test failed. Attempting repair..."
            zip -F project.zip --out project_fixed.zip 2>/dev/null || true
            if [ -f project_fixed.zip ] && [ -s project_fixed.zip ]; then
              mv project_fixed.zip project.zip
              echo "ZIP repaired successfully."
            else
              rm -f project_fixed.zip
              echo "ERROR: ZIP is corrupt and cannot be repaired."
              echo "This usually means the download was incomplete or the file was damaged during upload."
              exit 1
            fi
          fi

          # Extract
          mkdir -p project
          if ! unzip -q project.zip -d project; then
            echo "ERROR: Failed to extract ZIP!"
            echo "Trying with unzip -o (overwrite)..."
            if ! unzip -o project.zip -d project; then
              echo "ERROR: Extraction still failed. ZIP is likely corrupt."
              exit 1
            fi
          fi

          # Show what's inside
          echo "ZIP contents:"
          ls -la project/ | head -20

          # Find Flutter project root and copy ALL files to workspace root
          # (cd does NOT persist across GitHub Actions steps!)
          PROJECT_DIR=""
          if [ -f "project/pubspec.yaml" ]; then
            PROJECT_DIR="project"
          else
            INNER=$(find project -maxdepth 3 -name "pubspec.yaml" | head -1)
            if [ -n "$INNER" ]; then
              PROJECT_DIR=$(dirname "$INNER")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No pubspec.yaml found in ZIP!"
            echo "Make sure the ZIP contains a valid Flutter project."
            echo "ZIP contents:"
            find project -maxdepth 3 -type f | head -30
            exit 1
          fi

          echo "Flutter project found at: $PROJECT_DIR"
          echo "Copying project files to workspace root..."

          # Copy all files (including hidden like .dart_tool, .packages)
          rsync -a --remove-source-files "$PROJECT_DIR/" . 2>/dev/null || {
            # Fallback if rsync not available
            cp -r "$PROJECT_DIR"/* . 2>/dev/null || true
            cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
          }

          # Verify pubspec.yaml is now in workspace root
          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found in workspace after copy!"
            echo "Workspace contents:"
            ls -la | head -20
            exit 1
          fi

          echo "Project extracted successfully."
          echo "Workspace contents:"
          ls -la | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Verify Flutter Install
        run: |
          echo "Flutter path: $(which flutter 2>/dev/null || echo 'NOT FOUND')"
          if ! command -v flutter &> /dev/null; then
            echo "ERROR: Flutter not found after setup!"
            echo "JAVA_HOME: $JAVA_HOME"
            echo "PATH: $PATH"
            exit 1
          fi
          flutter --version
          flutter doctor -v || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/build.gradle*') }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Get Dependencies
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get || echo "WARN: pub get failed, trying to continue..."
          else
            echo "ERROR: No pubspec.yaml! Not a valid Flutter project."
            exit 1
          fi

      - name: Patch Android Config
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if [ -n "${{ inputs.app_name }}" ] && [ "${{ inputs.app_name }}" != "MyApp" ]; then
              sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ inputs.app_name }}\"|g" "$MANIFEST"
              echo "App name patched: ${{ inputs.app_name }}"
            fi
          fi

      - name: Decode Keystore (if configured)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          echo "Keystore decoded"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build APK
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        run: |
          echo "=== Build APK ==="
          echo "Flutter version: $(flutter --version 2>/dev/null | head -1)"
          echo "Project dir: $(pwd)"
          echo "pubspec.yaml exists: $(test -f pubspec.yaml && echo YES || echo NO)"
          echo ""

          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "Building RELEASE APK..."
            flutter build apk --release 2>&1 | tee build_output.txt
          else
            echo "Building DEBUG APK..."
            flutter build apk --debug 2>&1 | tee build_output.txt
          fi
          BUILD_EXIT=${PIPESTATUS[0]:-0}

          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "=== BUILD FAILED! ==="
            echo ""
            if [ -f build_output.txt ] && [ -s build_output.txt ]; then
              echo "Last 30 lines of build output:"
              tail -30 build_output.txt
              echo ""
              echo "Error lines:"
              grep -i "error\|failed\|exception" build_output.txt 2>/dev/null | tail -15 || echo "(no specific errors found)"
            else
              echo "No build output captured! flutter build may have failed to start."
              echo "This usually means:"
              echo "  1. Flutter SDK not properly installed"
              echo "  2. pubspec.yaml missing or invalid"
              echo "  3. flutter pub get failed earlier"
            fi
            exit 1
          fi

          echo "APK built: $APK_PATH ($(du -sh "$APK_PATH" | cut -f1))"

      - name: Build AAB (App Bundle)
        if: inputs.build_format == 'aab' || inputs.build_format == 'both'
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "Building RELEASE AAB..."
            flutter build appbundle --release 2>&1 | tee build_output_aab.txt
          else
            echo "Building DEBUG AAB..."
            flutter build appbundle --debug 2>&1 | tee build_output_aab.txt
          fi

          AAB_PATH=$(find build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "AAB not found!"
            grep -i "error\|failed\|exception" build_output_aab.txt 2>/dev/null | tail -10 || echo "(no specific errors found)"
            exit 1
          fi

          echo "AAB built: $AAB_PATH ($(du -sh "$AAB_PATH" | cut -f1))"

      - name: Upload APK Artifact
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Upload AAB Artifact
        if: inputs.build_format == 'aab' || inputs.build_format == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: aab-output
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 7

      - name: Send Output to Telegram
        if: inputs.chat_id != '' && inputs.bot_token != ''
        run: |
          BUILD_TYPE="${{ inputs.build_type }}"
          APP_NAME="${{ inputs.app_name }}"
          BUILD_FORMAT="${{ inputs.build_format }}"

          # Send APK
          if [ "$BUILD_FORMAT" = "apk" ] || [ "$BUILD_FORMAT" = "both" ]; then
            APK=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              SIZE=$(du -sh "$APK" | cut -f1)
              CAPTION=$(printf 'APK Build Selesai!\n\nApp: %s\nTipe: %s\nSize: %s\n\nby Deruzuan Dev' "$APP_NAME" "$BUILD_TYPE" "$SIZE")
              curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
                -F chat_id="${{ inputs.chat_id }}" \
                -F document=@"$APK" \
                -F parse_mode="HTML" \
                --form-string caption="$CAPTION"
            fi
          fi

          # Send AAB
          if [ "$BUILD_FORMAT" = "aab" ] || [ "$BUILD_FORMAT" = "both" ]; then
            AAB=$(find build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -1)
            if [ -n "$AAB" ]; then
              SIZE=$(du -sh "$AAB" | cut -f1)
              CAPTION=$(printf 'AAB Build Selesai!\n\nApp: %s\nTipe: %s\nSize: %s\n\nby Deruzuan Dev' "$APP_NAME" "$BUILD_TYPE" "$SIZE")
              curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
                -F chat_id="${{ inputs.chat_id }}" \
                -F document=@"$AAB" \
                -F parse_mode="HTML" \
                --form-string caption="$CAPTION"
            fi
          fi

      - name: Notify Failure
        if: failure()
        run: |
          # Collect error summary from available log files
          ERROR_SUMMARY="Build gagal"
          if [ -f build_output.txt ]; then
            ERROR_SUMMARY=$(grep -i "error\|failed\|exception" build_output.txt 2>/dev/null | head -5 | tr '\n' ' ')
            [ -z "$ERROR_SUMMARY" ] && ERROR_SUMMARY="Build gagal (no specific error in APK log)"
          fi
          if [ -z "$ERROR_SUMMARY" ] || [ "$ERROR_SUMMARY" = "Build gagal" ]; then
            if [ -f build_output_aab.txt ]; then
              ERROR_SUMMARY=$(grep -i "error\|failed\|exception" build_output_aab.txt 2>/dev/null | head -5 | tr '\n' ' ')
              [ -z "$ERROR_SUMMARY" ] && ERROR_SUMMARY="Build gagal (no specific error in AAB log)"
            fi
          fi

          # Also check if it's an early failure (download/extract)
          if [ ! -f build_output.txt ] && [ ! -f build_output_aab.txt ]; then
            ERROR_SUMMARY="Build gagal di tahap awal (download/extract/project setup). Cek workflow log untuk detail."
          fi

          # Truncate error summary to avoid Telegram API limits
          ERROR_SUMMARY=$(echo "$ERROR_SUMMARY" | cut -c1-500)

          if [ "${{ inputs.chat_id }}" != "" ] && [ "${{ inputs.bot_token }}" != "" ]; then
            # Build notification message safely (avoid emoji encoding issues in curl -d)
            # Use printf + --data-urlencode for proper UTF-8 handling
            MSG=$(printf 'Build Gagal!\n\nApp: %s\nTipe: %s\nError: %s' "${{ inputs.app_name }}" "${{ inputs.build_type }}" "$ERROR_SUMMARY")
            curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
              --data-urlencode "chat_id=${{ inputs.chat_id }}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=$MSG"
          fi

          # Always output to workflow log
          echo "BUILD FAILED"
          echo "Error summary: $ERROR_SUMMARY"
