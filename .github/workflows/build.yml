name: Deruzuan Dev Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter (dari GitHub Release)'
        required: true
      tag:
        description: 'Build tag / identifier'
        required: true
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      build_format:
        description: 'Output format'
        required: false
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      app_name:
        description: 'App Name (optional)'
        required: false
        default: 'MyApp'
      icon_url:
        description: 'Icon URL (optional)'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 Download Project ZIP
        run: |
          echo "📥 Mengunduh project dari Release..."
          echo "🔗 URL: ${{ inputs.zip_url }}"

          # Download with auth header for private repos, follow redirects
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o project.zip \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ inputs.zip_url }}")

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Gagal mengunduh ZIP! HTTP Status: $HTTP_CODE"
            echo "💡 Kemungkinan: URL expired, release belum publish, atau auth gagal."
            echo "📋 Cek apakah URL mengarah ke file ZIP langsung (bukan halaman HTML)."
            # Try to show what was downloaded
            if [ -f project.zip ]; then
              FILE_TYPE=$(file project.zip 2>/dev/null || echo "unknown")
              echo "📋 Tipe file: $FILE_TYPE"
              if echo "$FILE_TYPE" | grep -qi "html\|text"; then
                echo "⚠️ File yang diunduh bukan ZIP! Kemungkinan halaman HTML."
                echo "📋 5 baris pertama:"
                head -5 project.zip 2>/dev/null || true
              fi
            fi
            exit 1
          fi

          if [ ! -f project.zip ] || [ ! -s project.zip ]; then
            echo "❌ File ZIP kosong atau tidak ditemukan!"
            exit 1
          fi

          # Verify it's actually a ZIP file
          FILE_TYPE=$(file project.zip 2>/dev/null || echo "unknown")
          echo "📋 Tipe file: $FILE_TYPE"
          if ! echo "$FILE_TYPE" | grep -qi "zip\|archive"; then
            echo "❌ File yang diunduh bukan arsip ZIP!"
            echo "💡 Kemungkinan URL salah atau mengarah ke halaman HTML."
            echo "📋 5 baris pertama:"
            head -5 project.zip 2>/dev/null || true
            exit 1
          fi

          echo "✅ ZIP berhasil diunduh ($(du -sh project.zip | cut -f1))"

      - name: 📂 Extract Project
        run: |
          mkdir -p project
          if ! unzip -q project.zip -d project; then
            echo "❌ Gagal mengekstrak ZIP! File mungkin korup."
            exit 1
          fi

          # Show what's inside
          echo "📋 Isi ZIP:"
          ls -la project/ | head -20

          # Check if it's a Flutter project (handle nested structures)
          if [ -f "project/pubspec.yaml" ]; then
            cd project
          else
            INNER=$(find project -maxdepth 3 -name "pubspec.yaml" | head -1)
            if [ -n "$INNER" ]; then
              INNER_DIR=$(dirname "$INNER")
              echo "✅ Flutter project ditemukan di: $INNER_DIR"
              cp -r "$INNER_DIR"/* . 2>/dev/null || true
              cp -r "$INNER_DIR"/.* . 2>/dev/null || true
            else
              echo "❌ Tidak menemukan pubspec.yaml di dalam ZIP!"
              echo "💡 Pastikan ZIP berisi project Flutter yang valid."
              echo "📋 Isi ZIP:"
              ls -la project/ | head -20
              exit 1
            fi
          fi

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: 💾 Cache Flutter pub-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: flutter-pub-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-pub-

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/build.gradle*') }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: 📋 Flutter Info
        run: |
          flutter --version
          flutter doctor -v || true

      - name: 📦 Get Dependencies
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get || echo "⚠️ pub get gagal, mencoba lanjutkan..."
          else
            echo "❌ Tidak ada pubspec.yaml! Project bukan Flutter app yang valid."
            exit 1
          fi

      - name: 🔧 Patch Android Config
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if [ -n "${{ inputs.app_name }}" ] && [ "${{ inputs.app_name }}" != "MyApp" ]; then
              sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ inputs.app_name }}\"|g" "$MANIFEST"
              echo "✅ App name patched: ${{ inputs.app_name }}"
            fi
          fi

      - name: 🔑 Decode Keystore (if configured)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          echo "✅ Keystore decoded"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 🏗️ Build APK
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "🚀 Building RELEASE APK..."
            flutter build apk --release 2>&1 | tee build_output.txt
          else
            echo "🐞 Building DEBUG APK..."
            flutter build apk --debug 2>&1 | tee build_output.txt
          fi

          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "❌ BUILD GAGAL! APK tidak ditemukan di output."
            echo ""
            echo "📋 Kemungkinan penyebab:"
            echo "   • Error di kode Dart (cek error di atas)"
            echo "   • Dependency belum resolve (cek pubspec.yaml)"
            echo "   • Konfigurasi Android salah (cek build.gradle)"
            echo "   • Min SDK version tidak compatible"
            echo ""
            echo "📄 10 baris error terakhir:"
            grep -i "error\|failed\|exception" build_output.txt | tail -10 || echo "(tidak ada error spesifik)"
            exit 1
          fi

          echo "✅ APK berhasil: $APK_PATH ($(du -sh "$APK_PATH" | cut -f1))"

      - name: 📦 Build AAB (App Bundle)
        if: inputs.build_format == 'aab' || inputs.build_format == 'both'
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "📦 Building RELEASE AAB..."
            flutter build appbundle --release 2>&1 | tee build_output_aab.txt
          else
            echo "📦 Building DEBUG AAB..."
            flutter build appbundle --debug 2>&1 | tee build_output_aab.txt
          fi

          AAB_PATH=$(find build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "❌ AAB tidak ditemukan!"
            grep -i "error\|failed\|exception" build_output_aab.txt | tail -10 || echo "(tidak ada error spesifik)"
            exit 1
          fi

          echo "✅ AAB berhasil: $AAB_PATH ($(du -sh "$AAB_PATH" | cut -f1))"

      - name: 📤 Upload APK Artifact
        if: inputs.build_format == 'apk' || inputs.build_format == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: 📤 Upload AAB Artifact
        if: inputs.build_format == 'aab' || inputs.build_format == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: aab-output
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 7

      - name: 📱 Send Output to Telegram
        if: inputs.chat_id != '' && inputs.bot_token != ''
        run: |
          BUILD_TYPE="${{ inputs.build_type }}"
          APP_NAME="${{ inputs.app_name }}"
          BUILD_FORMAT="${{ inputs.build_format }}"

          # Send APK
          if [ "$BUILD_FORMAT" = "apk" ] || [ "$BUILD_FORMAT" = "both" ]; then
            APK=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              SIZE=$(du -sh "$APK" | cut -f1)
              curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
                -F chat_id="${{ inputs.chat_id }}" \
                -F document=@"$APK" \
                -F parse_mode="HTML" \
                -F caption="✅ <b>APK Build Selesai!</b>%0A%0A🏷️ <b>App:</b> ${APP_NAME}%0A🔨 <b>Tipe:</b> <code>${BUILD_TYPE}</code>%0A📁 <b>Size:</b> <code>${SIZE}</code>%0A%0A⚡ by Deruzuan Dev"
            fi
          fi

          # Send AAB
          if [ "$BUILD_FORMAT" = "aab" ] || [ "$BUILD_FORMAT" = "both" ]; then
            AAB=$(find build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -1)
            if [ -n "$AAB" ]; then
              SIZE=$(du -sh "$AAB" | cut -f1)
              curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
                -F chat_id="${{ inputs.chat_id }}" \
                -F document=@"$AAB" \
                -F parse_mode="HTML" \
                -F caption="✅ <b>AAB Build Selesai!</b>%0A%0A🏷️ <b>App:</b> ${APP_NAME}%0A🔨 <b>Tipe:</b> <code>${BUILD_TYPE}</code>%0A📁 <b>Size:</b> <code>${SIZE}</code>%0A%0A⚡ by Deruzuan Dev"
            fi
          fi

      - name: ❌ Notify Failure
        if: failure()
        run: |
          ERROR_SUMMARY="Build gagal"
          if [ -f build_output.txt ]; then
            ERROR_SUMMARY=$(grep -i "error\|failed\|exception" build_output.txt | head -5 | tr '\n' ' ')
          elif [ -f build_output_aab.txt ]; then
            ERROR_SUMMARY=$(grep -i "error\|failed\|exception" build_output_aab.txt | head -5 | tr '\n' ' ')
          fi

          if [ "${{ inputs.chat_id }}" != "" ] && [ "${{ inputs.bot_token }}" != "" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
              -d chat_id="${{ inputs.chat_id }}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>Build Gagal!</b>%0A%0A🏷️ App: <code>${{ inputs.app_name }}</code>%0A🔨 Tipe: <code>${{ inputs.build_type }}</code>%0A📋 Error: <code>${ERROR_SUMMARY}</code>"
          fi
