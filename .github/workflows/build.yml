                      mm = re.search(r'(?m)^[ \t]*[A-Za-z_][\w<>,? \t]*[ \t]+' + re.escape(mname) + r'[ \t]*\(', src2)
                      if not mm:
                          continue
                      mline = src2[mm.start():src2.find('\n', mm.start())]
                      # jangan sampe nyasar ke call site (await X(..) / return X(..) / X = ...)
                      if re.search(r'\b(?:await|return)\b', mline) or re.search(r'=\s*$', mline) or ('.' + mname) in mline:
                          continue
                      brace = src2.find('{', mm.end())
                      if brace == -1:
                          continue
                      depth = 0
                      end = -1
                      for i in range(brace, len(src2)):
                          if src2[i] == '{':
                              depth += 1
                          elif src2[i] == '}':
                              depth -= 1
                              if depth == 0:
