name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter'
        required: true
      tag:
        description: 'Build tag'
        required: true
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      build_format:
        description: 'Output format'
        required: false
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      app_name:
        description: 'App Name'
        required: false
        default: 'MyApp'
      icon_url:
        description: 'Icon URL'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''
      keystore_id:
        description: 'v6.2 ID keystore per user (mis. 12345 → keystores/u12345.jks). Kosong = keystore global.'
        required: false
        default: ''
      brand:
        description: 'v4.2 Brand whitelabel (dipake buat dname keystore BARU). Kosong = DZR.'
        required: false
        default: ''

      license:
        description: '🛡️ v4.3 Benteng Lisensi (anti-repack): "on" = pasang LicenseGuard (cek signature asli runtime). Kosong = off.'
        required: false
        default: ''
      enc_key:
        description: '🔒 v4.11 CRYPT VAULT: kunci enkripsi hasil build (password openssl). Kosong = plain (mode lama).'
        required: false
        default: ''
      perms:
        description: '🔐 v4.11 Perizinan: daftar izin Android dipisah koma (mis. CAMERA,RECORD_AUDIO). Kosong = tanpa tambahan.'
        required: false
        default: ''
      optimize:
        description: '⚡ v4.40 Optimasi build: scan dulu + R8/shrink + obfuscate + tree-shake (true/false)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    # v5.4: 18 menit — auto-fix toolchain bisa retry build beberapa kali
    # (gradle/AGP/kotlin bump + download dist gradle baru + full compile)
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      INPUT_APP_NAME: ${{ inputs.app_name }}
      INPUT_ZIP_URL: ${{ inputs.zip_url }}
      INPUT_CHAT_ID: ${{ inputs.chat_id }}
      INPUT_BOT_TOKEN: ${{ inputs.bot_token }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_ICON_URL: ${{ inputs.icon_url }}
      INPUT_BUILD_TYPE: ${{ inputs.build_type }}
      INPUT_BUILD_FORMAT: ${{ inputs.build_format }}
      INPUT_KEYSTORE_ID: ${{ inputs.keystore_id }}
      ENC_KEY: ${{ inputs.enc_key }}
      INPUT_PERMS: ${{ inputs.perms }}
      INPUT_OPTIMIZE: ${{ inputs.optimize }}

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # ── ⚠️ v4.8: WAJIB PIN VERSI! Flutter stable baru (AGP 9) nolak
          # plugin lama yang masih pake proguard-android.txt → build gagal massal.
          # 3.47.2 = versi deterministik, template & auto-fix sudah tervalidasi.
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      # ── ⚡ v6.2: ROLLING CACHE — fix cache beku ──
      # Dulu key = hashFiles(pubspec.yaml, ...) — TAPI step ini jalan SEBELUM
      # project di-download/extract, jadi file-nya GAK ADA → hash selalu
      # kosong → key konstan "gpub-" → build pertama nyimpen cache, build
      # berikutnya exact-match key yang sama → actions/cache GAK PERNAH
      # nyimpen ulang → cache beku di isi build pertama selamanya.
      # Sekarang: key rolling (per run_id) + restore prefix runner — tiap
      # run restore cache TERBARU, abis run nyimpen versi barunya. Dep baru
      # yang ke-download tetap ke-cache, build berikutnya makin cepat.
      # Catatan: .dart_tool pre-created dulu bikin bootstrap-check palsu —
      # udah di-guard di step Download (v5.6b), gak masalah.
      - name: Cache Gradle + Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
            .dart_tool
          key: gpub-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gpub-v2-${{ runner.os }}-

      # ── ⚡ v3.4: TUNE GRADLE (request owner: "build makin cepet") ──
      # gradle.properties global buat runner: parallel task + build cache +
      # heap pas (runner 2-core/7GB). Aman buat semua project Flutter,
      # dampak langsung ke fase configure/compile/dex Gradle.
      - name: Tune Gradle (speed)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'GPROP'
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          GPROP
          echo "⚡ gradle.properties tuning dipasang (parallel + caching + heap 3g)"

      - name: Download + Extract + Deps + Patch
        run: |
          # Download
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o project.zip \
            --retry 3 --retry-delay 2 --retry-connrefused \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "$INPUT_ZIP_URL")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Download failed! HTTP $HTTP_CODE"
            exit 1
          fi
          MAGIC=$(od -A n -t x1 -N 4 project.zip 2>/dev/null | tr -d ' ')
          if ! echo "$MAGIC" | grep -qi "^504b"; then
            echo "ERROR: Not a valid ZIP file!"
            exit 1
          fi
          echo "ZIP: $(du -sh project.zip | cut -f1)"

          # Extract
          mkdir -p project
          if ! unzip -q project.zip -d project; then
            echo "ERROR: Extraction failed!"
            exit 1
          fi
          PROJECT_DIR=""
          if [ -f "project/pubspec.yaml" ]; then
            PROJECT_DIR="project"
          else
            INNER=$(find project -maxdepth 3 -name "pubspec.yaml" | head -1)
            if [ -n "$INNER" ]; then
              PROJECT_DIR=$(dirname "$INNER")
            fi
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No pubspec.yaml found!"
            exit 1
          fi
          echo "Project: $PROJECT_DIR"
          rsync -a --remove-source-files "$PROJECT_DIR/" . 2>/dev/null || {
            cp -r "$PROJECT_DIR"/* . 2>/dev/null || true
            cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
          }
          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml missing!"
            exit 1
          fi
          rm -rf project project.zip

          # ── 🆕 v5.6: BOOTSTRAP android/ — banyak ZIP user cuma bawa lib/ + pubspec ──
          # Flutter 3.47+ kalo folder android/ gak ada langsung mati:
          #   "Build failed due to use of deleted Android v1 embedding."
          # (manifest flutterEmbedding gak ketemu = dianggap project jaman batu).
          # Solusi: generate android/ pake `flutter create` — file yang udah ada
          # (lib/, pubspec.yaml, test/, assets/) GAK ditimpa, cuma folder kurang
          # yang ditambah. Org/paket diambil dari name: pubspec (dibersihin).
          # NOTE: if bersarang + echo di tiap lapis — biar kalo kondisi nyangkut
          # kelihatan jelas di log (run #50/#51: blok ke-skip karena actions/
          # cache@v4 PRE-CREATE folder path cache → android/.gradle dibuatkan
          # walau project gak punya android/ → android-exists=YES palsu).
          # v5.6b: android/.gradle dicabut dari path cache + shell kosong
          # android/ (tanpa manifest) dihapus sebelum cek.
          if [ -d "android" ] && [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "🧹 [bootstrap] android/ cuma shell kosong (sisa pre-create cache path) → dihapus"
            rm -rf android
          fi
          echo "🔎 [bootstrap-check] pwd=$PWD | android-exists=$([ -d android ] && echo YES || echo NO) | pubspec=$([ -f pubspec.yaml ] && echo YES || echo NO)"
          if [ ! -d "android" ]; then
            echo "🔎 [bootstrap] android/ gak ada di workspace (pwd=$PWD) — cek pubspec..."
            if [ -f "pubspec.yaml" ] && grep -q "flutter" pubspec.yaml && grep -q "sdk:" pubspec.yaml; then
              PKG_NAME=$(sed -n "s/^name:[[:space:]]*[\"']\{0,1\}\([a-zA-Z0-9_]\+\)[\"']\{0,1\}[[:space:]]*$/\1/p" pubspec.yaml | head -1)
              PKG_NAME=$(echo "$PKG_NAME" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9_]//g')
              case "$PKG_NAME" in
                "") PKG_NAME="app" ;;
                [0-9]*) PKG_NAME="a$PKG_NAME" ;;
              esac
              echo "🆕 android/ gak ada di ZIP → generate pake flutter create (pkg: $PKG_NAME, org: com.dzrbuild)..."
              flutter create --platforms=android --org com.dzrbuild --project-name "$PKG_NAME" . || true
              if [ -d "android" ]; then
                echo "✅ android/ berhasil di-generate — file project existing gak disentuh"
              else
                echo "ERROR: android/ gak berhasil di-generate (flutter create gagal)"
                exit 1
              fi
            else
              echo "🔎 [bootstrap] pubspec gak nandain project Flutter (sdk:flutter) — skip bootstrap"
            fi
          fi

          # ── ⚙️ v5.2/v5.5 Pub get ANTI-CONFLICT ──
          # Project ZIP user sering ada konflik dependensi (mis. pubspec pin
          # package_info_plus ^9.0.0 tapi better_player dari git butuh ^10.1.0
          # via wakelock_plus) → pub get mati total. Sekarang: error dibaca,
          # constraint paket langsung yang bentrok di-BUMP otomatis ngikutin
          # versi yang diminta dependensi transitif, terus di-retry (max 4x).
          # v5.5: pola "is incompatible" (device_info_plus <13 vs win32 ^6
          # dari wakelock_plus) → dep langsung di-bump ke major setelah upper
          # bound-nya — biar GAK perlu fallback pub upgrade --major-versions
          # yang ngerewrite 25+ constraint dan bikin kode user gak kompil.
          rm -f /tmp/pubfix_applied
          PUB_ATTEMPT=0
          PUB_OK=false
          while [ "$PUB_ATTEMPT" -lt 8 ]; do
            PUB_ATTEMPT=$((PUB_ATTEMPT+1))
            if PUB_OUT=$(flutter pub get 2>&1); then
              PUB_OK=true
              echo "$PUB_OUT"
              break
            fi
            echo "$PUB_OUT"
            echo "⚠️ pub get gagal (percobaan $PUB_ATTEMPT/8) → auto-fix konflik dependensi..."
                      PUB_ERR="$PUB_OUT" python3 - <<'PYFIX' || true
          # ── v5.7 RESOLVER v2 (Flutter Medic) ──
          # Run #71/#73: (1) dulu cuma bump SATU paket per iterasi — konflik
          # 4 paket butuh 4 iterasi pas-pasan dari 4 slot; (2) dulu selalu
          # bump KE ATAS — better_player dari git (2023) minta *_plus versi
          # LEBIH RENDAH, bump ke atas malah makin jauh dari solusi.
          # Sekarang: (a) proses SEMUA kandidat per iterasi, (b) kandidat
          # yang udah di-bump tapi MASIH konflik → relax ke "any" (solver
          # pub yang milih versi kompatibel dua arah), (c) pola gak
          # dikenali → langsung relax. State antar-iterasi:
          # /tmp/pubfix_state.json (hidup sepanjang job).
          import os, re, json

          err = os.environ.get('PUB_ERR', '')
          with open('pubspec.yaml', encoding='utf-8') as f:
              content = f.read()
          fixed = []

          def rewrite(pkg, newval, note):
              global content
              pat = re.compile(r'(?m)^(\s*' + re.escape(pkg) + r':\s*)([^\n#]+?)(\s*#.*)?$')
              m = pat.search(content)
              if not m:
                  return False
              val = m.group(2).strip()
              if ':' in val or not re.search(r'\d', val):
                  return False
              if val == newval:
                  return False
              content = pat.sub(lambda mm: mm.group(1) + newval + (mm.group(3) or ''), content, count=1)
              fixed.append(pkg + ': ' + val + ' -> ' + newval + ((' (' + note + ')') if note else ''))
              return True

          def bump(pkg, newver):
              nv = newver if newver.startswith('^') else '^' + newver
              return rewrite(pkg, nv, '')

          def relax(pkg):
              return rewrite(pkg, 'any', 'relax ke any, solver pub yang milih')

          need = dict(re.findall(r'depends on ([a-z0-9_]+) \^(\d+\.\d+\.\d+)', err))
          for pkg, oldver in re.findall(r'depends on both ([a-z0-9_]+) \^(\d+\.\d+\.\d+)', err):
              if pkg in need and need[pkg] != oldver:
                  bump(pkg, need[pkg])
          for pkg, ver in re.findall(r'which requires ([a-z0-9_]+) \^(\d+\.\d+\.\d+)', err):
              bump(pkg, ver)
          for pkg, ver in re.findall(r'which depends on ([a-z0-9_]+) \^(\d+\.\d+\.\d+)', err):
              bump(pkg, ver)

          # v5.7.1: "which doesn't match any versions" — dep dipin ke versi
          # yang GAK ADA di pub.dev (khas pubspec generatoran/AI ngarang
          # versi, kena sendiri di E2E run #74) → relax ke any, solver pub
          # yang milih versi beneran ada & kompatibel.
          for pkg in dict.fromkeys(re.findall(r"depends on ([a-z0-9_]+) [^\s]+ which doesn't match any versions", err)):
              relax(pkg)
          # v5.7.1: saran resmi pub ("Consider downgrading/upgrading your
          # constraint on X: flutter pub add X:^9.0.1") → constraint pasti
          # jalan, dipake langsung.
          for pkg, ver in re.findall(r"Consider (?:downgrading|upgrading) your constraint on ([a-z0-9_]+): flutter pub add \1:([^\s,]+)", err):
              rewrite(pkg, ver, 'ikut saran pub')

          clauses = []
          for m in re.finditer(r'([a-z0-9_]+)((?:\s+[\^><=~]{0,2}[\d.]+)(?:\s*[<>]=?\s*[\d.]+)?)?(?:\s+from\s+git)?\s+(?:which\s+)?(?:depends on|requires)\s+([a-z0-9_]+)\s+([\^><=~]{0,2}[\d.]+(?:\s*[<>]=?\s*[\d.]+)?)', err):
              clauses.append((m.group(1), m.group(2) or '', m.group(3), m.group(4)))
          bothc = re.findall(r'depends on both ([a-z0-9_]+) [^\s]+(?: and ([a-z0-9_]+))?', err)
          cands = []
          for c in [x for tup in bothc for x in tup if x]:
              if c not in cands:
                  cands.append(c)

          def rlim(rng):
              parts = [int(x) for x in re.search(r'[\d.]+', rng).group(0).split('.') if x.isdigit()]
              lo = tuple((parts + [0, 0, 0])[:3])
              hi = None
              if rng.lstrip().startswith('^'):
                  hi = (lo[0] + 1, 0, 0)
              m2 = re.search(r'<\s*(\d+)\.(\d+)\.(\d+)', rng)
              if m2:
                  hi = (int(m2.group(1)), int(m2.group(2)), int(m2.group(3)))
              return (lo, hi)

          def disjoint(r1, r2):
              lo1, hi1 = rlim(r1)
              lo2, hi2 = rlim(r2)
              return (hi1 and lo2 >= hi1) or (hi2 and lo1 >= hi2)

          def caret_of(rng):
              m5 = re.search(r'[\^><=~]{0,2}(\d+(?:\.\d+){0,2})', rng)
              if not m5:
                  return None
              parts = [x for x in m5.group(1).split('.') if x != '']
              while len(parts) < 3:
                  parts.append('0')
              return '^' + '.'.join(parts[:3])

          def bump_target(cand):
              # Kasus 2: kandidat jadi OBJEK dua klausa rentangnya benturan
              # → ikut rentang sisi yang lebih tinggi
              rngs = [dr for (sp, sr, dp, dr) in clauses if dp == cand and sp != cand]
              for i in range(len(rngs)):
                  for j in range(i + 1, len(rngs)):
                      if disjoint(rngs[i], rngs[j]):
                          t = caret_of(rngs[i] if rlim(rngs[i])[0] >= rlim(rngs[j])[0] else rngs[j])
                          if t:
                              return t
              # Kasus 1: kandidat jadi SUBJEK klausa yang minta paket P di
              # rentang benturan sama klausa lain → major sesudah upper bound
              for (sp, sr, dp, dr) in clauses:
                  if sp != cand:
                      continue
                  if any(dp2 == dp and sp2 != cand and disjoint(dr, dr2) for (sp2, sr2, dp2, dr2) in clauses):
                      m3 = re.search(r'\^(\d+)', sr)
                      m4 = re.search(r'<\s*(\d+)\.', sr)
                      if m3:
                          return '^' + str(int(m3.group(1)) + 1) + '.0.0'
                      if m4:
                          return '^' + m4.group(1) + '.0.0'
              return None

          state = {}
          try:
              with open('/tmp/pubfix_state.json') as f:
                  state = json.load(f)
          except Exception:
              state = {}

          for cand in cands:
              times = state.get(cand, 0)
              tgt = bump_target(cand)
              if tgt and times == 0 and bump(cand, tgt):
                  state[cand] = times + 1
                  continue
              if relax(cand):
                  state[cand] = times + 1

          try:
              with open('/tmp/pubfix_state.json', 'w') as f:
                  json.dump(state, f)
          except Exception:
              pass

          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          if fixed:
              print('AUTO-FIX pubspec.yaml:', '; '.join(fixed))
              with open('/tmp/pubfix_applied', 'w') as f:
                  f.write('; '.join(fixed))
          else:
              print('AUTO-FIX: gak nemu constraint yang bisa di-bump otomatis')
          PYFIX
            if [ -s /tmp/pubfix_applied ]; then
              echo "🔁 retry pub get setelah auto-fix..."
              rm -f /tmp/pubfix_applied
            else
              echo "🔁 fallback: flutter pub upgrade --major-versions..."
              flutter pub upgrade --major-versions || true
            fi
          done
          # ── v5.7: upaya terakhir sebelum nyerah — pub upgrade
          # --major-versions di luar loop (dulu fallback ini cuma jalan kalau
          # fixer gak ngasilin apa-apa; kalau fixer jalan tapi salah arah,
          # semua attempt kebuang tanpa nyoba fallback — run #73).
          if [ "$PUB_OK" != "true" ]; then
            echo "🔁 upaya terakhir: flutter pub upgrade --major-versions..."
            if flutter pub upgrade --major-versions >/dev/null 2>&1 && flutter pub get >/dev/null 2>&1; then
              PUB_OK=true
              echo "✅ pub get sukses setelah fallback terakhir"
            fi
          fi
          if [ "$PUB_OK" != "true" ]; then
            echo "ERROR: pub get failed! Konflik dependensi gak bisa di-auto-fix — cek pubspec.yaml (paket dipin versi lama padahal plugin lain butuh versi lebih tinggi)"
            exit 1
          fi


      - name: Write Auto-Fix Helpers + Toolchain Check
        run: |
          # Step pemisah dari "Download + Extract + Deps + Patch": GitHub
          # Actions nolak run block > 21.000 char (max expression length).
          # Isi: helper python anti-stale toolchain (v5.4: gradlefix.py +
          # bldfix.py) + check gradle wrapper. dartfix.py + patch package
          # pindah ke step "Write Dart Auto-Fix Helper + Patch Packages"
          # (v5.6 — step 5-nya kebanyakan char lagi).
          # ── ⚙️ v5.4 TOOLCHAIN ANTI-STALE ──
          # Project ZIP user sering bawa toolchain Android ke tua, padahal
          # Flutter 3.47.2 (DependencyVersionChecker) nolak: Gradle < 8.14.0,
          # AGP < 8.11.1, Kotlin < 2.2.20, minSdk < 23 → build mati di
          # "Failed to apply plugin dev.flutter.flutter-gradle-plugin".
          # Dua lapis fix (pola sama kayak anti-conflict pub v5.2):
          #   (a) PROAKTIF — gradlefix.py: bump gradle-wrapper.properties ke
          #       minimum Flutter SEBELUM build (8.14.0 = min Flutter 3.47.2;
          #       kalau flutter-version di atas diganti, sesuaikan angka ini,
          #       lapis reaktif di step build tetap jadi jaring pengaman).
          #   (b) REAKTIF — bldfix.py: baca error build di step "Patch Android
          #       + Build", patch file toolchain yang ditolak, terus retry.
          cat > /tmp/gradlefix.py <<'PYGW'
          import os, re, sys

          min_ver = sys.argv[1] if len(sys.argv) > 1 else '8.14.0'
          min_ver = re.sub(r'\.0$', '', min_ver)  # dist gradle gak ada X.Y.0 (8.14.0 -> 8.14)
          path = 'android/gradle/wrapper/gradle-wrapper.properties'
          if not os.path.isfile(path):
              print('GRADLE-FIX: gak ada gradle-wrapper.properties, skip')
              sys.exit(0)
          with open(path, encoding='utf-8') as f:
              content = f.read()
          m = re.search(r'distributionUrl\s*=\s*\S*gradle-(\d+(?:\.\d+)*)-(bin|all)\.zip', content)
          if not m:
              print('GRADLE-FIX: distributionUrl gak kebaca, skip')
              sys.exit(0)

          def vkey(v):
              return [int(x) for x in v.split('.') if x.isdigit()]

          cur = m.group(1)
          if vkey(cur) >= vkey(min_ver):
              print('GRADLE-FIX: Gradle ' + cur + ' >= min ' + min_ver + ', aman')
          else:
              url = 'https\\://services.gradle.org/distributions/gradle-' + min_ver + '-' + m.group(2) + '.zip'
              content = re.sub(r'(?m)^distributionUrl\s*=.*$', lambda g: 'distributionUrl=' + url, content)
              content = re.sub(r'(?m)^distributionSha256Sum\s*=.*\n?', '', content)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('GRADLE-FIX: Gradle ' + cur + ' < min ' + min_ver + ' -> wrapper di-bump ke ' + min_ver)
          PYGW
          # ── ⚡ v4.40.0 OPTIMASI: helper python (scan dulu → apply → laporan) ──
          cat > /tmp/optscan.py <<'OPTSCAN'
          #!/usr/bin/env python3
          # OPT-SCAN v4.40.0 — scan project SEBELUM build optimasi (baca doang, non-destruktif).
          # Output: /tmp/opt_scan.json + log ringkas. Jenis project ke-detect otomatis.
          import glob, json, os, re
          
          SKIP = {".git", "build", ".dart_tool", ".gradle", "node_modules", ".idea", "buildSrc", "gradle"}
          files = []
          total = 0
          for root, dirs, fns in os.walk("."):
              dirs[:] = [d for d in dirs if d not in SKIP]
              for f in fns:
                  p = os.path.join(root, f)
                  try:
                      s = os.path.getsize(p)
                  except OSError:
                      continue
                  total += s
                  files.append((s, p.replace(os.sep, "/")))
          files.sort(reverse=True)
          dart = sum(1 for _, p in files if p.endswith(".dart"))
          native = sum(1 for _, p in files if p.endswith((".kt", ".java")))
          resf = sum(1 for _, p in files if "/res/" in p)
          big = [{"path": p, "mb": round(s / 1048576, 2)} for s, p in files[:5] if s >= 1048576]
          sc = {"files": len(files), "totalMB": round(total / 1048576, 1), "dartFiles": dart,
                "nativeFiles": native, "resFiles": resf, "bigFiles": big}
          acts = perms = 0
          dbg = False
