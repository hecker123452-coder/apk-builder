name: Deruzuan Dev Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter (dari GitHub Release)'
        required: true
      tag:
        description: 'Build tag / identifier'
        required: true
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      app_name:
        description: 'App Name (optional)'
        required: false
        default: 'MyApp'
      icon_url:
        description: 'Icon URL (optional, untuk web2apk)'
        required: false
        default: ''
      is_web2apk:
        description: 'Is Web2APK build?'
        required: false
        default: 'false'
      chat_id:
        description: 'Telegram Chat ID'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 Download Project ZIP
        run: |
          echo "📥 Mengunduh project dari Release..."
          curl -sL -o project.zip "${{ inputs.zip_url }}"
          if [ ! -f project.zip ] || [ ! -s project.zip ]; then
            echo "❌ Gagal mengunduh ZIP! File kosong atau tidak ditemukan."
            echo "💡 Kemungkinan: Release belum publish, atau URL expired."
            exit 1
          fi
          echo "✅ ZIP berhasil diunduh ($(du -sh project.zip | cut -f1))"

      - name: 📂 Extract Project
        run: |
          mkdir -p project
          unzip -q project.zip -d project
          echo "📦 Isi project:"
          ls -la project/ | head -20

          # Check if it's a Flutter project
          if [ -f "project/pubspec.yaml" ]; then
            echo "✅ Flutter project terdeteksi"
            cd project
          elif [ -f "project/android" ] || [ -d "project/android" ]; then
            echo "✅ Project Android terdeteksi"
            cd project
          else
            # Check nested structure
            INNER=$(find project -maxdepth 2 -name "pubspec.yaml" | head -1)
            if [ -n "$INNER" ]; then
              INNER_DIR=$(dirname "$INNER")
              echo "✅ Flutter project ditemukan di: $INNER_DIR"
              cp -r "$INNER_DIR"/* . 2>/dev/null || true
              cp -r "$INNER_DIR"/.* . 2>/dev/null || true
            else
              echo "⚠️ Tidak menemukan pubspec.yaml, mencoba lanjutkan..."
              cd project
            fi
          fi

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: 📋 Flutter Info
        run: |
          flutter --version
          flutter doctor -v || true

      - name: 📦 Get Dependencies
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get || echo "⚠️ pub get gagal, mencoba lanjutkan..."
          else
            echo "❌ Tidak ada pubspec.yaml! Project bukan Flutter app yang valid."
            echo "💡 Pastikan ZIP berisi project Flutter yang lengkap."
            exit 1
          fi

      - name: 🔧 Patch Android Config
        run: |
          # Patch AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if [ -n "${{ inputs.app_name }}" ] && [ "${{ inputs.app_name }}" != "MyApp" ]; then
              sed -i "s|android:label=\"[^\"]*\"|android:label=\"${{ inputs.app_name }}\"|g" "$MANIFEST"
              echo "✅ App name patched: ${{ inputs.app_name }}"
            fi
          fi

          # Patch build.gradle if needed
          GRADLE="android/app/build.gradle"
          if [ ! -f "$GRADLE" ]; then
            GRADLE="android/app/build.gradle.kts"
          fi
          if [ -f "$GRADLE" ]; then
            echo "✅ build.gradle ditemukan"
          fi

      - name: 🏗️ Build APK
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "🚀 Building RELEASE APK..."
            flutter build apk --release 2>&1 | tee build_output.txt
          else
            echo "🐞 Building DEBUG APK..."
            flutter build apk --debug 2>&1 | tee build_output.txt
          fi

          # Check if APK was built
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "❌ BUILD GAGAL! APK tidak ditemukan di output."
            echo ""
            echo "📋 Kemungkinan penyebab:"
            echo "   • Error di kode Dart (cek error di atas)"
            echo "   • Dependency belum resolve (cek pubspec.yaml)"
            echo "   • Konfigurasi Android salah (cek build.gradle)"
            echo "   • Min SDK version tidak compatible"
            echo ""
            echo "📄 10 baris error terakhir:"
            grep -i "error\|failed\|exception" build_output.txt | tail -10 || echo "(tidak ada error spesifik)"
            exit 1
          fi

          echo "✅ APK berhasil dibuat: $APK_PATH ($(du -sh "$APK_PATH" | cut -f1))"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: 📱 Send APK to Telegram
        if: inputs.chat_id != '' && inputs.bot_token != ''
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          fi
          SIZE=$(du -sh "$APK" | cut -f1)
          BUILD_TYPE="${{ inputs.build_type }}"
          APP_NAME="${{ inputs.app_name }}"

          curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
            -F chat_id="${{ inputs.chat_id }}" \
            -F document=@"$APK" \
            -F parse_mode="HTML" \
            -F caption="✅ <b>Build Selesai!</b>%0A%0A🏷️ <b>App:</b> ${APP_NAME}%0A🔨 <b>Tipe:</b> <code>${BUILD_TYPE}</code>%0A📁 <b>Size:</b> <code>${SIZE}</code>%0A%0A⚡ by Deruzuan Dev"

      - name: ❌ Notify Failure
        if: failure()
        run: |
          # Collect error details
          ERROR_SUMMARY="Build gagal"
          if [ -f build_output.txt ]; then
            ERROR_SUMMARY=$(grep -i "error\|failed\|exception" build_output.txt | head -5 | tr '\n' ' ')
          fi

          if [ "${{ inputs.chat_id }}" != "" ] && [ "${{ inputs.bot_token }}" != "" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
              -d chat_id="${{ inputs.chat_id }}" \
              -d parse_mode="HTML" \
              -d text="❌ <b>Build Gagal!</b>%0A%0A🏷️ App: <code>${{ inputs.app_name }}</code>%0A🔨 Tipe: <code>${{ inputs.build_type }}</code>%0A📋 Error: <code>${ERROR_SUMMARY}</code>"
          fi
