                  src = read_f(f)
                  # R7c: req.grant(req.resources) → return PermissionResponse(GRANT)
                  src2 = re.sub(r"\b(\w+)\.grant\(\s*\1\.resources\s*\)\s*;",
                                r"return PermissionResponse(resources: \1.resources, action: PermissionResponseAction.GRANT);", src)
                  grant_fixed = src2 != src
