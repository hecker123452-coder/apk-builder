          import os, re

          DESUGAR_PKGS = ('flutter_local_notifications', 'workmanager')
          DESUGAR_NEW = '2.1.4'
          DESUGAR_OLD = '1.1.5'

          def vkey(v):
              return [int(x) for x in v.split('.') if x.isdigit()]

          def desugar_version():
              ver = None
              for base in ('android/build.gradle.kts', 'android/build.gradle', 'android/settings.gradle.kts', 'android/settings.gradle'):
                  if os.path.isfile(base):
                      try:
                          with open(base, encoding='utf-8') as f:
                              t = f.read()
                      except Exception:
                          continue
                      m = (re.search(r'com\.android\.tools\.build:gradle:([\d.]+)', t)
                           or re.search(r'id\(\s*["\']com\.android\.application["\']\s*\)\s+version\s+["\']([\d.]+)', t)
                           or re.search(r'id\s+["\']com\.android\.application["\']\s+version\s+["\']([\d.]+)', t))
                      if m:
                          ver = m.group(1)
                          break
