                          '\n// [DZR dartfix] shim: tipe FileChooser* gak ada di flutter_inappwebview 6.x\n'
                          'enum FileChooserMode { OPEN, OPEN_MULTIPLE, OPEN_FOLDER, SAVE }\n\n'
                          'class FileChooserParams {\n'
                          '  final List<String> acceptTypes;\n'
                          '  final bool isCaptureEnabled;\n'
                          '  final FileChooserMode mode;\n'
                          '  const FileChooserParams(\n'
                          '      {this.acceptTypes = const <String>[],\n'
                          '      this.isCaptureEnabled = false,\n'
                          '      this.mode = FileChooserMode.OPEN});\n'
                          '}\n\n'
                          'class FileChooserResult {\n'
                          '  final List<String> filePaths;\n'
                          '  final FileChooserMode mode;\n'
                          '  const FileChooserResult({required this.filePaths, required this.mode});\n'
                          '}\n')
                      ims = list(re.finditer(r'(?m)^import\s[^;]+;\s*$', src2))
                      pos = ims[-1].end() if ims else 0
                      src2 = src2[:pos] + shim + src2[pos:]
