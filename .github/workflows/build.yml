              if os.path.isfile(f) and add_plain_import(f, 'package:file_picker/file_picker.dart'):
                  applied.append(f + ": import 'package:file_picker/file_picker.dart' ditambahin")
          for cls in dict.fromkeys(re.findall(r"(?:lib|test)/[\w./-]+\.dart:\d+:\d+: Error: The (?:method|getter) '(FilePicker[A-Z]\w*)' isn't defined", out)):
