                  if 'build' in parts or '.git' in parts:
                      dirs[:] = []
                      continue
                  groups = {}
                  for f in files:
                      if f.startswith('.') or '.' not in f:
                          continue
                      stem, ext = f.rsplit('.', 1)
                      if not stem or not ext:
                          continue
                      groups.setdefault(stem, []).append((f, '.' + ext.lower()))
