          def add_overrides(mapping):
              global pubspec_changed
              if not os.path.isfile('pubspec.yaml'):
                  return
              lines = read_f('pubspec.yaml').split('\n')
              done = set()
              res = []
              sec = False
              for ln in lines:
                  if re.match(r'^dependency_overrides\s*:', ln):
