                          notes.append('dep desugar_jdk_libs ' + tgt)
                      else:
                          g2 = g2.rstrip() + '\n' + blk_dep
                          notes.append('blok dependencies + dep ' + tgt)
                  if g2 != g:
                      try:
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(g2)
                          done.append(os.path.basename(path) + ' [' + ', '.join(notes) + ']')
                      except Exception:
                          pass
