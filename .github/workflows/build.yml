                      if re.search(r'compileOptions\s*\{', g2):
                          g2 = re.sub(r'compileOptions\s*\{', lambda mm: mm.group(0) + '\n        ' + flag, g2, count=1)
                          notes.append('flag compileOptions')
                      elif re.search(r'android\s*\{', g2):
                          g2 = re.sub(r'android\s*\{', lambda mm: mm.group(0) + '\n' + blk_copt, g2, count=1)
                          notes.append('blok compileOptions baru')
                  if not re.search(r'(?m)^\s*coreLibraryDesugaring(\s|\()', g2):
