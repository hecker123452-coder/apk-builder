          def fp_class_import(cls):
              if not _FP_ROOT:
                  return None
              _lib = os.path.join(_FP_ROOT, 'lib')
              for _root, _dirs, _fs in os.walk(_lib):
                  for _fn in _fs:
                      if not _fn.endswith('.dart'):
                          continue
                      _p = os.path.join(_root, _fn)
                      try:
                          with open(_p, encoding='utf-8') as _fh:
                              if re.search(r'\bclass\s+' + re.escape(cls) + r'\b', _fh.read()):
