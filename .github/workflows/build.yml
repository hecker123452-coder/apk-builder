                          return DESUGAR_OLD
                  except Exception:
                      pass
              return DESUGAR_NEW

          def apply_desugar():
              tgt = desugar_version()
              done = []
              for path in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
                  if not os.path.isfile(path):
                      continue
                  kts = path.endswith('.kts')
