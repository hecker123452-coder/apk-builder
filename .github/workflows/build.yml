          # → tambahin import alias. Kalau belum ada tapi masuk whitelist
          # umum → tambahin ke pubspec dulu. Pola lain GAK disentuh.
          def add_dependency(pkg, ver):
              global pubspec_changed
              if not os.path.isfile('pubspec.yaml'):
                  return False
              src = read_f('pubspec.yaml')
              if re.search(r'(?m)^\s+' + re.escape(pkg) + r':', src):
                  return True
              m = re.search(r'(?m)^dependencies:\s*$', src)
              if not m:
                  return False
              src2 = src[:m.end()] + '\n  ' + pkg + ': ' + ver + src[m.end():]
              write_f('pubspec.yaml', src2)
              pubspec_changed = True
              return True

          def add_import_prefix(f, ident, root_uri, verify=True):
              src = read_f(f)
              if re.search(r"^import\s+['\"]package:" + re.escape(ident) + r"/", src, re.M):
                  return False
              if re.search(r"\bimport\b[^;\n]*\bas\s+" + re.escape(ident) + r"\b", src):
                  return False
              if verify:
                  root = (root_uri or '').replace('file://', '')
                  if not root.startswith('/'):
                      root = os.path.normpath(os.path.join('.dart_tool', root))
                  hit = os.path.join(root, 'lib', ident + '.dart')
                  if not os.path.isfile(hit):
                      libdir = os.path.join(root, 'lib')
                      if os.path.isdir(libdir):
                          same = [x for x in sorted(os.listdir(libdir)) if x == ident + '.dart']
                          hit = os.path.join(libdir, same[0]) if same else None
                      else:
                          hit = None
                  if not hit:
                      return False
                  rel = os.path.relpath(hit, os.path.join(root, 'lib')).replace(os.sep, '/')
              else:
                  # dep baru ditambahin ke pubspec, belum ke-resolve — buat
                  # whitelist, layout lib/<nama>.dart standar semua
                  rel = ident + '.dart'
              line = "import 'package:" + ident + "/" + rel + "' as " + ident + ";"
              ms = list(re.finditer(r'(?m)^import\s[^;]+;\s*$', src))
              if ms:
                  src = src[:ms[-1].end()] + '\n' + line + src[ms[-1].end():]
              else:
                  src = line + '\n' + src
              write_f(f, src)
              return True

