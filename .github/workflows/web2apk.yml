                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, _) async {
                  if (didPop) return;
                  final web = _web;
                  if (web != null && await web.canGoBack() == true) {
                    await web.goBack();
                  } else {
                    await SystemNavigator.pop();
                  }
                },
                child: Scaffold(
                  backgroundColor: _bg,
                  body: SafeArea(
                    child: Column(
                      children: [
                        Expanded(
                          child: Stack(
                      children: [
                        // ── WebView utama (key ganti = load ulang) ──
                        InAppWebView(
                          key: ValueKey<int>(_reloadKey),
                          initialUrlRequest:
                              _isAssetMode ? null : URLRequest(url: WebUri(_currentTarget)),
                          initialSettings: _settings,
                          pullToRefreshController: _pullToRefresh,
                          onWebViewCreated: (controller) async {
                            _web = controller;
                            if (_isAssetMode) {
                              try {
                                final localUrl = await _ensureLocalhost();
                                if (localUrl != null) {
                                  await controller.loadUrl(
                                      urlRequest: URLRequest(url: localUrl));
                                }
                              } catch (e) {
                                _fail(e.toString());
                              }
                            }
                          },
                          shouldOverrideUrlLoading: (controller, action) async {
                            final url = action.request.url;
