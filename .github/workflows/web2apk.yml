              private fun applyDeltaPatch(oldPath: String, patchPath: String, outPath: String): String {
                  var old: RandomAccessFile? = null
                  var out: FileOutputStream? = null
                  try {
                      val pf = File(patchPath)
                      if (!pf.exists() || pf.length() < 32L) return "error:bad_patch"
