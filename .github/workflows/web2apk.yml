name: Web2APK

# ============================================================================
# DZR CloudBuilder — Web2APK Workflow v4.5 (HTML+URL, token-based, FIXED)
# ============================================================================
# FIX LOG v4.5 (FIX LAYAR PUTIH + BACKEND SUPPORT):
#   1. GANTI ENGINE WEBVIEW : webview_flutter -> flutter_inappwebview.
#      Website modern (SPA React/Vue, call API backend) sekarang jalan normal:
#      - mixedContentMode ALWAYS_ALLOW  -> halaman HTTPS boleh manggil API HTTP
#        (dulu: DIBLOKIR TOTAL -> layar putih / muter tanpa ujung)
#      - useHybridComposition           -> rendering anti layar-putih di
#        banyak device (dulu: TLHC default suka blank)
#      - DOM storage + database + cookie 3rd-party + cache AKTIF semua
#   2. ANTI-MUTER v2        : timer 25 detik. Backend lambat/down -> kartu
#      peringatan "Lama banget nge-load" + tombol Coba Lagi (bukan spinner
#      tanpa ujung). Splash branded max 6 detik pas cold start.
#   3. UPLOAD FILE          : <input type="file"> kebuka (gallery/kamera).
#   4. LINK EKSTERNAL       : tel:/mailto:/whatsapp:/geo:/intent: -> app
#      yang bener. target="_blank" kebuka di webview (dulu: gak kejadian apa2).
#   5. DOWNLOAD             : link download diterusin ke DownloadManager/
#      browser sistem.
#   6. TOMBOL BACK FIXED    : back = history webview, mentok = keluar app
#      (dulu: back nge-freeze, gak bisa keluar).
#   7. HTML MODE UPGRADE    : asset HTML disajikan via InAppLocalhostServer
#      (bukan file://) -> fetch()/CSS relatif/localStorage jalan normal.
#   8. MANIFEST             : + <queries> VIEW http/https/tel/mailto
#      (wajib Android 11+ biar url_launcher nemu app target).
#   Versi plugin di-PIN persis (flutter_inappwebview 6.1.5, url_launcher
#   6.3.2) biar build CI deterministik — API kevalidasi pake flutter analyze
#   3.47.2 (0 issue, mode URL & HTML dua-duanya).
#
# FIX LOG v4.4:
#   1. FIX ICON JEPIT : foto non-1:1 di-CROP TENGAH (auto-orient) sebelum
#      resize 512x512 — icon launcher bener-bener kotak & jelas.
#
# FIX LOG v4.3:
#   1. ANTI DOUBLE-Send : Step "Send to Telegram" DIHAPUS PERMANEN (bot yang
#      kirim APK).  2. Template WebView anti-muter + error screen.
#   3. Heredoc terminator kolom 0.  4. icon_url = direct download URL.
#
# Cara custom:
#   1. Cari token placeholder di file ini — semua ada di bagian "TOKENS".
#   2. Token ditulis kayak gini: __NAMA_TOKEN__ (double underscore depan+belakang).
#   3. Token di-replace otomatis pas build jalan (step "Apply Tokens").
#
# Mode yang didukung:
#   - URL mode   : web_url diisi, html_content kosong -> WebView loadRequest(url)
#   - HTML mode  : html_content diisi (base64 / plain), web_url kosong
#                  -> file disimpen ke assets/webapp/index.html, WebView load
#                  via InAppLocalhostServer (http://localhost:8080/index.html)
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website (kosongin kalo mau pake HTML file)'
        required: false
        default: ''
      html_content:
        description: 'Isi HTML (base64 atau plain text). Diutamain base64 biar gak ganggu YAML.'
        required: false
        default: ''
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'WebApp'
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.deruzuan.webapp'
      icon_url:
        description: 'Icon URL (direct download URL asset, bukan halaman release!)'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID (UNUSED — bot yang handle kirim APK)'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token (UNUSED — sengaja gak dipake lagi anti dobel)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      INPUT_WEB_URL: ${{ inputs.web_url }}
      INPUT_HTML_CONTENT: ${{ inputs.html_content }}
      INPUT_APP_NAME: ${{ inputs.app_name }}
      INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
      INPUT_ICON_URL: ${{ inputs.icon_url }}

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle + Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
            .dart_tool
          key: w2a-${{ hashFiles('**/gradle-wrapper.properties', '**/pubspec.yaml') }}
          restore-keys: |
            w2a-

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      # ─── DECODE HTML CONTENT (kalo ada) ───────────────────────────────────
      # Token: INPUT_HTML_CONTENT bisa base64 atau plain text.
      # Hasil decode disimpen ke /tmp/w2a/index.html buat di-paste ke assets.
      - name: Decode HTML content
        run: |
          mkdir -p /tmp/w2a
          if [ -n "$INPUT_HTML_CONTENT" ]; then
            echo "HTML content detected, decoding..."
            # ── Strategi decode yang robust ──
            # 1. Coba decode base64. Kalo sukses DAN hasilnya valid HTML → pake.
            # 2. Kalo input asli langsung keliatan kayak HTML (ada '<') → pake.
            # 3. Kalo decode sukses tapi gak ada '<' tetep pake hasil decode.
            # 4. Fallback terakhir: simpen input apa adanya.
            DECODED_OK=false
            DECODED=""
            if DECODED=$(printf '%s' "$INPUT_HTML_CONTENT" | base64 -d 2>/dev/null); then
              if printf '%s' "$DECODED" | grep -q '<'; then
                printf '%s' "$DECODED" > /tmp/w2a/index.html
                DECODED_OK=true
                echo "Decoded as base64"
              fi
            fi
            if [ "$DECODED_OK" = false ]; then
              if printf '%s' "$INPUT_HTML_CONTENT" | grep -q '<'; then
                printf '%s' "$INPUT_HTML_CONTENT" > /tmp/w2a/index.html
                echo "Saved as plain text"
              elif [ -n "$DECODED" ]; then
                printf '%s' "$DECODED" > /tmp/w2a/index.html
                echo "Decoded as base64 (no '<' tag, using decoded anyway)"
              else
                printf '%s' "$INPUT_HTML_CONTENT" > /tmp/w2a/index.html
                echo "Saved as plain text (fallback)"
              fi
            fi
            # Validasi minimal: file gak kosong
            if [ ! -s /tmp/w2a/index.html ]; then
              echo "ERROR: HTML content kosong setelah decode!"
              exit 1
            fi
            SIZE=$(wc -c < /tmp/w2a/index.html)
            echo "HTML size: $SIZE bytes"
            echo "W2A_MODE=html" >> $GITHUB_ENV
          else
            if [ -z "$INPUT_WEB_URL" ]; then
              echo "ERROR: harus isi web_url ATAU html_content!"
              exit 1
            fi
            echo "W2A_MODE=url" >> $GITHUB_ENV
          fi

      # ─── CREATE PROJECT + WEBVIEW + APPLY TOKENS + BUILD ──────────────────
      - name: Create Project + WebView + Icon + Build
        run: |
          # ── Sanitize inputs ──
          SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
          SAFE_PKG=$(echo "$INPUT_PACKAGE_NAME" | sed 's/[^a-zA-Z0-9.]//g' | sed 's/^\.*//' | sed 's/\.*$//')
          [ -z "$SAFE_PKG" ] && SAFE_PKG="com.deruzuan.webapp"
          [ -z "$SAFE_APP_NAME" ] && SAFE_APP_NAME="WebApp"

          PROJ_NAME=$(echo "$SAFE_PKG" | rev | cut -d. -f1 | rev | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_]//g')
          [ -z "$PROJ_NAME" ] && PROJ_NAME="webapp"

          echo "App: $SAFE_APP_NAME | Pkg: $SAFE_PKG | Proj: $PROJ_NAME | Mode: $W2A_MODE"

          flutter create --project-name "$PROJ_NAME" --org "$(echo "$SAFE_PKG" | rev | cut -d. -f2- | rev)" "$PROJ_NAME"
          cd "$PROJ_NAME"
          # Versi di-PIN persis biar build CI deterministik (udah divalidasi
          # pake flutter analyze 3.47.2 — 0 issue).
          flutter pub add flutter_inappwebview:6.1.5 url_launcher:6.3.2

          # ── HTML mode: siapin assets + daftarin ke pubspec ──
          if [ "$W2A_MODE" = "html" ]; then
            mkdir -p assets/webapp
            cp /tmp/w2a/index.html assets/webapp/index.html
          fi

          # ── Tulis Dart main.dart (template v4.5 flutter_inappwebview) ──
          # ⚠️ Heredoc: body & terminator DART_EOF wajib di base indent (kolom 0
          # setelah YAML strip). Jangan naikin indentasinya!
          # Fitur template:
          #   - mixed content ALWAYS_ALLOW (HTTPS page boleh call API HTTP)
          #   - Hybrid Composition (anti layar-putih) + DOM storage + cache
          #   - Timer 25 dtk: backend lambat/down → kartu peringatan, bukan muter
          #   - Upload file, link eksternal (wa/tel/mailto), download, tab baru
          #   - Tombol back = history webview, mentok = keluar app
          #   - HTML mode via InAppLocalhostServer (perilaku = website asli)
          cat > lib/main.dart << 'DART_EOF'
          // ============================================================================
          // Web2APK Template v4.5 — flutter_inappwebview ANTI-LAYAR-PUTIH
          // ============================================================================
          // Kenapa ganti engine ke flutter_inappwebview (dari webview_flutter)?
          //   1. LAYAR PUTIH / MUTER   : webview_flutter pake rendering TLHC yang sering
          //      blank + gak bisa atur mixed content. Website HTTPS yang manggil API
          //      HTTP (backend lokal/kampret) DIBLOKIR TOTAL → SPA putih/muter selamanya.
          //      Sekarang: mixedContentMode ALWAYS_ALLOW + Hybrid Composition.
          //   2. BACKEND FRIENDLY      : DOM storage, database, cookie 3rd-party, cache
          //      aktif semua → React/Vue/jQuery + API jalan kayak di Chrome.
          //   3. UPLOAD FILE           : <input type="file"> kebuka otomatis (gallery/
          //      kamera). Versi lama: dipencet gak kejadian apa-apa.
          //   4. LINK EKSTERNAL        : tel:, mailto:, whatsapp:, geo:, intent: →
          //      diterusin ke app yang bener. Link target="_blank" kebuka di webview.
          //   5. DOWNLOAD              : link download diterusin ke DownloadManager/
          //      browser sistem.
          //   6. ANTI-MUTER            : timer 25 detik — kalo backend lambat/down,
          //      muncul kartu peringatan + tombol Coba Lagi (bukan muter tanpa ujung).
          //   7. TOMBOL BACK           : navigasi balik history webview, kalo mentok
          //      keluar app (versi lama: tombol back nge-freeze di halaman).
          // Catatan token: __APP_NAME__ dan __WEB_URL__ di-replace saat build
          //   (mode HTML → __WEB_URL__ jadi 'assets/webapp/index.html').
          // ============================================================================

          import 'dart:async';

          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart' show SystemNavigator;
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            runApp(const WebViewApp());
          }

          class WebViewApp extends StatelessWidget {
            const WebViewApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '__APP_NAME__',
                theme: ThemeData(
                  colorSchemeSeed: Colors.blue,
                  useMaterial3: true,
                ),
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            // ── TARGET (diisi oleh token replacement saat build) ──
            // URL mode  : 'https://website-kamu.com'
            // HTML mode : 'assets/webapp/index.html' (dibundle, jalan offline)
            static const String _target = '__WEB_URL__';
            static final bool _isAssetMode = _target.startsWith('assets/');
            // HTML mode disajikan lewat server localhost built-in biar perilaku sama
            // kayak website asli (fetch()/CSS relatif/localStorage jalan normal).
            static const String _assetDocRoot = 'assets/webapp/';
            final InAppLocalhostServer _localhost =
                InAppLocalhostServer(documentRoot: _assetDocRoot);
            bool _localhostStarted = false;

            // ── State UI ──
            InAppWebViewController? _web;
            bool _isLoading = true;
            bool _hasError = false;
            bool _isSlow = false;
            bool _showSplash = true;
            int _progress = 0;
            String _errorMsg = '';
            int _reloadKey = 0;
            Timer? _slowTimer;

            // ── Settings max-compatibility (intinya: perlakuin webview kayak Chrome) ──
            final InAppWebViewSettings _settings = InAppWebViewSettings(
              javaScriptEnabled: true,
              domStorageEnabled: true,
              databaseEnabled: true,
              cacheEnabled: true,
              // FIX UTAMA "data kebalik/putih": HTTPS page boleh manggil API HTTP
              mixedContentMode: MixedContentMode.MIXED_CONTENT_ALWAYS_ALLOW,
              // FIX LAYAR PUTIH di banyak device: rendering hybrid composition
              useHybridComposition: true,
              transparentBackground: false,
              supportZoom: true,
              mediaPlaybackRequiresUserGesture: false,
              thirdPartyCookiesEnabled: true,
              useOnDownloadStart: true,
              allowFileAccess: true,
              allowFileAccessFromFileURLs: true,
              allowUniversalAccessFromFileURLs: true,
              javaScriptCanOpenWindowsAutomatically: true,
              disableDefaultErrorPage: true,
            );

            @override
            void initState() {
              super.initState();
              _armSlowTimer();
              // Splash hilang maksimal 6 detik, biar halaman lambat gak keliatan "mati"
              Future.delayed(const Duration(seconds: 6), () {
                if (mounted && _showSplash) {
                  setState(() => _showSplash = false);
                }
              });
            }

            @override
            void dispose() {
              _slowTimer?.cancel();
              super.dispose();
            }

            // ── ANTI-MUTER: kalo 25 detik belum selesai load, buka kartu peringatan ──
            void _armSlowTimer() {
              _slowTimer?.cancel();
              _slowTimer = Timer(const Duration(seconds: 25), () {
                if (mounted && _isLoading && !_hasError) {
                  setState(() => _isSlow = true);
                }
              });
            }

            void _fail(String msg) {
              _slowTimer?.cancel();
              if (!mounted) return;
              setState(() {
                _hasError = true;
                _isLoading = false;
                _showSplash = false;
                _isSlow = false;
                _errorMsg = msg;
              });
            }

            Future<void> _retry() async {
              if (!mounted) return;
              setState(() {
                _hasError = false;
                _isSlow = false;
                _isLoading = true;
                _progress = 0;
                _reloadKey++; // bikin ulang webview → load dari awal
              });
              _armSlowTimer();
            }

            // ── Link non-http (tel:/mailto:/whatsapp:/geo:/intent:) → app eksternal ──
            Future<void> _openExternal(WebUri url) async {
              try {
                await launchUrl(url, mode: LaunchMode.externalApplication);
              } catch (_) {
                // Gak ada app yang mau nerima link-nya — diemin aja, jangan crash.
              }
            }

            /// HTML mode: nyalain server localhost (sekali aja), balikin URL hasilnya.
            Future<WebUri?> _ensureLocalhost() async {
              if (!_isAssetMode) return null;
              if (!_localhostStarted) {
                await _localhost.start();
                _localhostStarted = true;
              }
              final rel = _target.startsWith(_assetDocRoot)
                  ? _target.substring(_assetDocRoot.length)
                  : _target.split('/').last;
              return WebUri('http://localhost:8080/$rel');
            }

            Widget _overlayCard({
              required IconData icon,
              required String title,
              required String message,
            }) {
              return Container(
                color: Colors.white,
                alignment: Alignment.center,
                padding: const EdgeInsets.all(24),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Icon(icon, size: 64, color: Colors.grey),
                    const SizedBox(height: 16),
                    Text(
                      title,
                      style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold),
                    ),
                    const SizedBox(height: 8),
                    Text(
                      message,
                      textAlign: TextAlign.center,
                      style: const TextStyle(color: Colors.grey),
                    ),
                    const SizedBox(height: 24),
                    FilledButton.icon(
                      onPressed: _retry,
                      icon: const Icon(Icons.refresh),
                      label: const Text('Coba Lagi'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, _) async {
                  if (didPop) return;
                  final web = _web;
                  if (web != null && await web.canGoBack() == true) {
                    await web.goBack();
                  } else {
                    await SystemNavigator.pop();
                  }
                },
                child: Scaffold(
                  backgroundColor: Colors.white,
                  body: SafeArea(
                    child: Stack(
                      children: [
                        // ── WebView utama (key ganti = load ulang) ──
                        InAppWebView(
                          key: ValueKey<int>(_reloadKey),
                          initialUrlRequest:
                              _isAssetMode ? null : URLRequest(url: WebUri(_target)),
                          initialSettings: _settings,
                          onWebViewCreated: (controller) async {
                            _web = controller;
                            if (_isAssetMode) {
                              try {
                                final localUrl = await _ensureLocalhost();
                                if (localUrl != null) {
                                  await controller.loadUrl(
                                      urlRequest: URLRequest(url: localUrl));
                                }
                              } catch (e) {
                                _fail(e.toString());
                              }
                            }
                          },
                          shouldOverrideUrlLoading: (controller, action) async {
                            final url = action.request.url;
                            final scheme = url?.scheme.toLowerCase() ?? '';
                            if (scheme == 'http' || scheme == 'https' || scheme.isEmpty) {
                              return NavigationActionPolicy.ALLOW;
                            }
                            if (url != null) await _openExternal(url);
                            return NavigationActionPolicy.CANCEL;
                          },
                          onCreateWindow: (controller, action) async {
                            // Link target="_blank" / window.open() → buka di webview ini
                            final url = action.request.url;
                            final scheme = url?.scheme.toLowerCase() ?? '';
                            if (url != null && (scheme == 'http' || scheme == 'https')) {
                              await controller.loadUrl(urlRequest: URLRequest(url: url));
                              return true;
                            }
                            if (url != null) await _openExternal(url);
                            return true;
                          },
                          onLoadStart: (controller, url) {
                            if (!mounted) return;
                            setState(() {
                              _isLoading = true;
                              _hasError = false;
                              _isSlow = false;
                              _progress = 0;
                            });
                            _armSlowTimer();
                          },
                          onLoadStop: (controller, url) {
                            if (!mounted) return;
                            _slowTimer?.cancel();
                            setState(() {
                              _isLoading = false;
                              _showSplash = false;
                              _isSlow = false;
                              _progress = 100;
                            });
                          },
                          onProgressChanged: (controller, p) {
                            if (!mounted) return;
                            setState(() => _progress = p);
                          },
                          onReceivedError: (controller, request, error) {
                            // Error sub-resource (iklan/gambar) gak nge-block halaman
                            if (request.isForMainFrame != true) return;
                            _fail(error.description);
                          },
                          onDownloadStartRequest: (controller, request) async {
                            // Link download → serahin ke browser/DownloadManager sistem
                            await _openExternal(request.url);
                          },
                        ),

                        // ── Progress bar tipis di atas ──
                        if (_isLoading && !_hasError)
                          Positioned(
                            top: 0,
                            left: 0,
                            right: 0,
                            child: LinearProgressIndicator(
                              value: _progress > 0 && _progress < 100
                                  ? _progress / 100
                                  : null,
                              minHeight: 3,
                            ),
                          ),

                        // ── Splash branded (cold start, max 6 detik) ──
                        if (_showSplash && !_hasError)
                          Container(
                            color: Colors.white,
                            alignment: Alignment.center,
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const CircularProgressIndicator(),
                                const SizedBox(height: 16),
                                Text(
                                  '__APP_NAME__',
                                  style: TextStyle(
                                    fontSize: 16,
                                    fontWeight: FontWeight.w600,
                                    color: Colors.grey.shade700,
                                  ),
                                ),
                              ],
                            ),
                          ),

                        // ── Kartu "lama banget" (backend lambat/down) ──
                        if (_isSlow && _isLoading && !_hasError)
                          _overlayCard(
                            icon: Icons.hourglass_top,
                            title: 'Lama banget nge-load...',
                            message:
                                'Koneksi ke website/backend-nya lambat atau gak merespons.\n'
                                'Pastikan server-nya online dan koneksi lu stabil.',
                          ),

                        // ── Kartu error (gagal load) ──
                        if (_hasError)
                          _overlayCard(
                            icon: Icons.wifi_off,
                            title: 'Gagal Memuat',
                            message: _errorMsg,
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART_EOF

          # ── APPLY TOKENS ──
          # ⚠️ Heredoc: body & terminator PYEOF wajib di base indent (kolom 0
          # setelah YAML strip). Single python buat SEMUA mode biar gak ada
          # duplikasi heredoc yang rawan salah indentasi kayak versi lama.
          python3 << 'PYEOF'
          import os, re

          app_name = os.environ.get('INPUT_APP_NAME', 'WebApp') or 'WebApp'
          web_url = os.environ.get('INPUT_WEB_URL', '') or ''
          mode = os.environ.get('W2A_MODE', 'url')

          # Normalisasi URL (defense-in-depth: bot udah normalize, sini jaga-jaga)
          if mode == 'url':
              web_url = web_url.strip()
              if web_url and not web_url.lower().startswith(('http://', 'https://')):
                  web_url = 'https://' + web_url
              if not web_url:
                  raise SystemExit('ERROR: URL mode tapi web_url kosong!')

          # Sanitize buat Dart string literal (escape backslash & single quote)
          app_name_safe = app_name.replace('\\', '\\\\').replace("'", "\\'")
          web_url_safe = web_url.replace('\\', '\\\\').replace("'", "\\'")

          with open('lib/main.dart', 'r', encoding='utf-8') as f:
              src = f.read()

          # Single-pass replacement (anti bug token-di-dalam-token)
          def repl(m):
              tok = m.group(0)
              if tok == '__APP_NAME__':
                  return app_name_safe
              if tok == '__WEB_URL__':
                  return 'assets/webapp/index.html' if mode == 'html' else web_url_safe
              return tok

          src = re.sub(r'__(?:APP_NAME|WEB_URL)__', repl, src)

          # Safety net: gak boleh ada token tersisa di main.dart
          leftover = re.findall(r'__(?:APP_NAME|WEB_URL)__', src)
          if leftover:
              raise SystemExit('ERROR: token tersisa di main.dart: %s' % leftover)

          with open('lib/main.dart', 'w', encoding='utf-8') as f:
              f.write(src)

          # HTML mode: daftarin assets/webapp/ ke pubspec.yaml
          if mode == 'html':
              with open('pubspec.yaml', 'r', encoding='utf-8') as f:
                  pubspec = f.read()
              if 'assets/webapp' not in pubspec:
                  if re.search(r'^flutter:\s*$', pubspec, re.M):
                      pubspec = re.sub(
                          r'^flutter:\s*$',
                          'flutter:\n  assets:\n    - assets/webapp/',
                          pubspec, count=1, flags=re.M,
                      )
                  else:
                      pubspec += '\nflutter:\n  assets:\n    - assets/webapp/\n'
                  with open('pubspec.yaml', 'w', encoding='utf-8') as f:
                      f.write(pubspec)
              print('Assets registered in pubspec.yaml')

          print('Token applied. Mode:', mode)
          if mode == 'url':
              print('URL set to:', web_url)
          PYEOF

          # ── Patch Android Manifest ──
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"$SAFE_APP_NAME\"|g" "$MANIFEST"
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <application|' "$MANIFEST"
            fi
            if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's|android:allowBackup="[^"]*"|android:allowBackup="false"\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
            fi
            # <queries> wajib di Android 11+ (package visibility) biar
            # url_launcher bisa buka browser/telpon/email buat link eksternal
            # & download. Tanpa ini launchUrl gagal senyap.
            if ! grep -q "<queries>" "$MANIFEST"; then
              QRY='<queries><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="http" /></intent><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="tel" /></intent><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="mailto" /></intent></queries>'
              sed -i "s|<application|$QRY\n    <application|" "$MANIFEST"
            fi
          fi

          # ── Icon processing ──
          # icon_url HARUS direct download URL (browser_download_url asset GitHub),
          # BUKAN URL halaman release. Bot (server.js publishRelease) udah difix
          # buat balikin direct URL — magic byte check di bawah tetap jaga-jaga.
          # v4.4: foto non-1:1 di-CROP TENGAH (bukan dijepit/letterbox) + auto-orient.
          ICON_APPLIED=false
          if [ -n "$INPUT_ICON_URL" ]; then
            echo "Nge-download icon dari: $INPUT_ICON_URL"
            HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/app_icon_raw --retry 3 --retry-delay 2 --max-time 15 "$INPUT_ICON_URL")
            if [ "$HTTP_CODE" -eq 200 ] && [ -s /tmp/app_icon_raw ]; then
              FILE_MAGIC=$(xxd -l 8 -p /tmp/app_icon_raw 2>/dev/null || echo "")
              FILE_TYPE=$(file -b /tmp/app_icon_raw 2>/dev/null || echo "unknown")
              echo "Magic: $FILE_MAGIC | Type: $FILE_TYPE"

              IS_IMAGE=false
              if echo "$FILE_MAGIC" | grep -qi "^89504e47"; then IS_IMAGE=true; fi   # PNG
              if echo "$FILE_MAGIC" | grep -qi "^ffd8ff"; then IS_IMAGE=true; fi    # JPEG
              if echo "$FILE_MAGIC" | grep -qi "^47494638"; then IS_IMAGE=true; fi # GIF
              if echo "$FILE_MAGIC" | grep -qi "^52494646"; then IS_IMAGE=true; fi  # WebP
              if echo "$FILE_MAGIC" | grep -qi "^424d"; then IS_IMAGE=true; fi      # BMP
              if echo "$FILE_TYPE"  | grep -qi "svg"; then IS_IMAGE=true; fi        # SVG

              if [ "$IS_IMAGE" = true ]; then
                echo "File valid sebagai image. Crop tengah 1:1 (fix icon jepit v4.4)..."
                # ── FIX ICON JEPIT (v4.4) ──
                # Dulu: convert -resize 512x512 -extent 512x512 → foto non-kotak
                # (mis. screenshot 572x1280) jadi thumbnail mini dgn pita kosong —
                # di launcher keliatan kayak "icon gak ke bikin".
                # Sekarang: auto-orient ( hormatin EXIF rotasi HP ) → hitung crop
                # kotak persis di TENGAH → resize 512x512. Icon bener-bener kotak.
                RAW_W=$(identify -format "%w" /tmp/app_icon_raw 2>/dev/null | head -1 | tr -dc '0-9')
                RAW_H=$(identify -format "%h" /tmp/app_icon_raw 2>/dev/null | head -1 | tr -dc '0-9')
                CROP_OK=false
                if [ -n "$RAW_W" ] && [ -n "$RAW_H" ] && [ "$RAW_W" -gt 0 ] && [ "$RAW_H" -gt 0 ] 2>/dev/null; then
                  if [ "$RAW_W" -ge "$RAW_H" ]; then
                    SIDE=$RAW_H; OFF_X=$(( (RAW_W - RAW_H) / 2 )); OFF_Y=0
                  else
                    SIDE=$RAW_W; OFF_X=0; OFF_Y=$(( (RAW_H - RAW_W) / 2 ))
                  fi
                  echo "Crop tengah: ${SIDE}x${SIDE}+${OFF_X}+${OFF_Y} (asli ${RAW_W}x${RAW_H})"
                  if convert /tmp/app_icon_raw -auto-orient -strip -crop "${SIDE}x${SIDE}+${OFF_X}+${OFF_Y}" +repage -resize 512x512 -extent 512x512 -background none -define png:compression-level=9 -define png:compression-filter=5 /tmp/app_icon_valid.png 2>/dev/null; then
                    CROP_OK=true
                  fi
                fi
                if [ "$CROP_OK" = false ]; then
                  echo "Crop pintar gagal (format aneh?), fallback cara lama..."
                  convert /tmp/app_icon_raw -auto-orient -background none -strip -resize 512x512 -gravity center -extent 512x512 -define png:compression-level=9 -define png:compression-filter=5 /tmp/app_icon_valid.png 2>/dev/null || true
                fi
                PNG_MAGIC=$(xxd -l 4 -p /tmp/app_icon_valid.png 2>/dev/null || echo "")
                if [ "$PNG_MAGIC" = "89504e47" ]; then
                    echo "PNG valid! Applying ke mipmap directories..."
                    for dir in android/app/src/main/res/mipmap-*; do
                      if [ -d "$dir" ]; then
                        dirname=$(basename "$dir")
                        case "$dirname" in
                          mipmap-mdpi)    SIZE=48  ;;
                          mipmap-hdpi)    SIZE=72  ;;
                          mipmap-xhdpi)   SIZE=96  ;;
                          mipmap-xxhdpi)  SIZE=144 ;;
                          mipmap-xxxhdpi) SIZE=192 ;;
                          *)              SIZE=96  ;;
                        esac
                        convert /tmp/app_icon_valid.png -resize ${SIZE}x${SIZE} -define png:compression-level=9 "$dir/ic_launcher.png" 2>/dev/null && \
                        echo "  $dirname -> ${SIZE}x${SIZE} OK" || echo "  $dirname -> GAGAL, pake default"
                      fi
                    done
                    ICON_APPLIED=true
                    echo "Icon berhasil di-apply!"
                  else
                    echo "Konversi PNG gagal (magic byte gak valid), pake icon default Flutter"
                fi
              else
                echo "File bukan image valid (magic: $FILE_MAGIC), pake icon default Flutter"
                echo "HINT: pastiin icon_url = direct download URL asset, bukan halaman release!"
              fi
            else
              echo "Download gagal (HTTP $HTTP_CODE atau file kosong), pake icon default Flutter"
            fi
          else
            echo "Gak ada icon URL, pake icon default Flutter"
          fi

          # ── Build ──
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.txt

          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1 || find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "=== BUILD FAILED ==="
            tail -30 build_output.txt
            exit 1
          fi
          echo "APK: $APK_PATH ($(du -sh "$APK_PATH" | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-output
          path: "**/build/app/outputs/flutter-apk/*.apk"
          retention-days: 7
          if-no-files-found: error

      # NOTE: "Send to Telegram" step DIHAPUS PERMANEN (fix APK dobel).
      # Bot (index.js) satu-satunya pengirim APK ke user via client.sendFile()
      # — dia yang pull artifact dari workflow ini terus kirim dengan caption
      # yang informatif. GAK ADA STEP KIRIM DI SINI, JANGAN DITAMBAHIN LAGI!
      #
      # NOTE: "Notify Failure" step juga DIHAPUS — bot yang handle semua
      # notifikasi error (dengan detail log dari getFailedStepLog).
