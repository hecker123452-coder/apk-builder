                      val diff = BZip2CompressorInputStream(ByteArrayInputStream(pb, off + ctrlLen, diffLen))
                      val extra = BZip2CompressorInputStream(ByteArrayInputStream(pb, off + ctrlLen + diffLen, extraLen))
