name: Web2APK

# ============================================================================
# DZR CloudBuilder — Web2APK Workflow v5.2 (🔄 OTA BALIK LAGI: UPDATE TANPA UNINSTALL)
# ============================================================================
# FIX LOG v5.2 (request owner: "apk yang di build bisa di update dan gak
#                harus uninstall ... bener2 bagus melebihi semua nya"):
#   1. KEYSTORE STABIL    : dulu build pake debug keystore yang BEDA tiap
#      runner → signature beda tiap build → Android PAKSA uninstall dulu
#      sebelum install APK baru. Sekarang: keystore release disimpan di
#      repo (signing/dzr-release.jks) — build pertama bikin + commit,
#      build berikutnya pake yang sama → signature SELALU identik.
#      APK di-re-sign pakai apksigner (zipalign dulu) setelah build.
#   2. VERSIONCODE NAIK   : --build-number=$GITHUB_RUN_NUMBER → versionCode
#      = run number (naik terus tiap build). Dulu selalu 1 → Android anggap
#      "sama aja"/downgrade. Sekarang update-over-install jalan mulus.
#   3. OTA IN-APP UPDATE  : app hasil build nge-fetch updates/<pkg>.json
#      (raw repo) pas start + tiap 6 jam. Kalo versionCode repo > punya
#      app → banner hijau "Update tersedia" → ketuk → download + install
#      langsung dari dalam app (REQUEST_INSTALL_PACKAGES + FileProvider +
#      MethodChannel installApk di MainActivity). GAK PERLU UNINSTALL.
#      Kanal APK-nya: release `apk-<pkg>` asset `app.apk` (di-upload
#      workflow ini tiap build, rolling/overwrite).
#   4. SISANYA SAMA       : pengumuman global (v5.1), situs offline ZIP +
#      multi-tab (v5.0), splash/dark/small_apk (v4.6-4.8), engine
#      flutter_inappwebview 6.1.5 + Flutter 3.47.2 + AGP9 safety net.
#
# FIX LOG v5.1 (request owner: "malas 2 nya lu gantiin aja" — OTA ditukar):
#   1. OTA IN-APP UPDATE DICABUT  : input update_url & version_code dihapus,
#      Dart _checkUpdate + banner update + manifest per-app (updates/<pkg>.json)
#      + release ota-<pkg> gak dipake lagi. Penggantinya di sisi BOT: tiap
#      build sukses, APK di-upload ke release `apk-<pkg>` (rolling) → bot
#      kirim 🔗 link download permanen + QR code (scan = download).
#   2. PENGUMUMAN GLOBAL (BARU)   : app ngefetch `announcements/global.json`
#      dari repo raw pas start + tiap 8 jam. Owner kirim `/pengumuman <teks>`
#      di bot → SEMUA app nampilin banner oranye (bisa dikasih link, bisa
#      ditutup, matiin pake `/pengumumanoff`). Tanpa FCM, tanpa Firebase.
#   Fitur v5.0 tetep: situs offline ZIP, multi-tab + bottom nav, splash
#   custom, tema gelap, APK hemat arm64. Fitur v4.5–v4.8 tetep:
#   flutter_inappwebview 6.1.5, pin Flutter 3.47.2 + AGP9 proguard safety net.
#
# FIX LOG v5.0:
#   1. SITUS OFFLINE (ZIP) : input html_zip_url (direct download URL release
#      ZIP situs statis: index.html+css+js+gambar, max ~25MB) → di-download &
#      di-unzip ke assets/webapp → APK jalan OFFLINE penuh via localhost server.
#   2. MULTI-TAB           : input tabs_json (JSON array [{label,url}], max 3)
#      → app dapat bottom navigation bar, swap URL antar tab.
#
# FIX LOG v4.6:
#   1. OPSI BUILD DI BOT  : sebelum build, user bisa atur:
#      - 🌙 Tema Gelap     (dark_mode) : splash/loading/error ikut gelap
#      - 👻 Splash on/off  (splash)    : matiin splash screen kalo gak mau
#      - 📦 APK Hemat      (small_apk) : build arm64-only, APK ~40% lebih kecil
#   2. SPLASH CUSTOM      : logo/icon user ditampilin di splash screen
#      (icon di-convert ke assets/splash_logo.png + didaftarin ke pubspec).
#      Gak ada icon = fallback spinner + nama app.
#   3. PULL-TO-REFRESH    : tarik ke bawah di app buat reload halaman.
#   4. SKIP ICON          : tombol skip di bot — build tanpa kirim icon
#      (pake icon default Flutter).
#   Semua fitur v4.5 tetep: flutter_inappwebview anti-layar-putih + backend
#   support (mixed content allow, hybrid composition, DOM storage, upload,
#   link eksternal, download, timeout anti-muter, back bener, HTML via
#   InAppLocalhostServer).
#
# FIX LOG v4.5:
#   Ganti engine WebView ke flutter_inappwebview 6.1.5 (di-pin) + url_launcher
#   6.3.2 — fix layar putih & support backend. Validasi flutter analyze 3.47.2.
# FIX LOG v4.4:
#   Icon crop tengah 1:1 + auto-orient.
# FIX LOG v4.3:
#   Anti dobel (step Telegram dihapus), template anti-muter, heredoc kolom 0.
#
# Cara custom: token placeholder __NAMA_TOKEN__ di-replace otomatis pas build.
# Mode: URL mode (web_url) / HTML mode (html_content → assets/webapp/).
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website (kosongin kalo mau pake HTML file)'
        required: false
        default: ''
      html_content:
        description: 'Isi HTML (base64 atau plain text). Diutamain base64 biar gak ganggu YAML.'
        required: false
        default: ''
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'WebApp'
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.deruzuan.webapp'
      icon_url:
        description: 'Icon URL (direct download URL asset, bukan halaman release!)'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID (UNUSED — bot yang handle kirim APK)'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token (UNUSED — sengaja gak dipake lagi anti dobel)'
        required: false
        default: ''
      splash:
        description: 'Splash screen (true/false)'
        required: false
        default: 'true'
      dark_mode:
        description: 'Tema gelap splash/loading/error (true/false)'
        required: false
        default: 'false'
      small_apk:
        description: 'APK hemat arm64-only (~40% lebih kecil) (true/false)'
        required: false
        default: 'false'
      html_zip_url:
        description: 'v5.0 Direct download URL ZIP situs statis (index.html di root)'
        required: false
        default: ''
      tabs_json:
        description: 'v5.0 JSON array [{label,url}] max 3 — bottom navigation'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      INPUT_WEB_URL: ${{ inputs.web_url }}
      INPUT_HTML_CONTENT: ${{ inputs.html_content }}
      INPUT_APP_NAME: ${{ inputs.app_name }}
      INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
      INPUT_ICON_URL: ${{ inputs.icon_url }}
      INPUT_SPLASH: ${{ inputs.splash }}
      INPUT_DARK_MODE: ${{ inputs.dark_mode }}
      INPUT_SMALL_APK: ${{ inputs.small_apk }}
      INPUT_HTML_ZIP_URL: ${{ inputs.html_zip_url }}
      INPUT_TABS_JSON: ${{ inputs.tabs_json }}
      # ── v5.1: slug "owner/repo" buat URL pengumuman global (tanpa input bot) ──
      GITHUB_SLUG: ${{ github.repository }}

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # ── ⚠️ v4.8: WAJIB PIN VERSI! ──
          # Dulu `channel: stable` doang → Flutter stable baru rilis bawa AGP 9
          # → plugin lama (flutter_inappwebview_android) kena hard-error
          # "proguard-android.txt is no longer supported" → build gagal massal.
          # 3.47.2 = versi yang template-nya lolos flutter analyze 0 issue.
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      # ── ⚡ v6.2: ROLLING CACHE — fix cache beku (sama kayak build.yml) ──
      # Dulu key = hashFiles(**/gradle-wrapper.properties, **/pubspec.yaml)
      # jalan SEBELUM project siap → hash kosong → key konstan "w2a-" →
      # exact-match terus → cache GAK PERNAH ke-update. Sekarang rolling
      # per run_id + restore prefix: tiap run restore cache terbaru.
      - name: Cache Gradle + Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
            .dart_tool
          key: w2a-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            w2a-v2-${{ runner.os }}-

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      # ─── DECODE HTML CONTENT (kalo ada) ───────────────────────────────────
      # Token: INPUT_HTML_CONTENT bisa base64 atau plain text.
      # Hasil decode disimpen ke /tmp/w2a/index.html buat di-paste ke assets.
      - name: Decode HTML content
        run: |
          mkdir -p /tmp/w2a
          if [ -n "$INPUT_HTML_CONTENT" ]; then
            echo "HTML content detected, decoding..."
            # ── Strategi decode yang robust ──
            # 1. Coba decode base64. Kalo sukses DAN hasilnya valid HTML → pake.
            # 2. Kalo input asli langsung keliatan kayak HTML (ada '<') → pake.
            # 3. Kalo decode sukses tapi gak ada '<' tetep pake hasil decode.
            # 4. Fallback terakhir: simpen input apa adanya.
            DECODED_OK=false
            DECODED=""
            if DECODED=$(printf '%s' "$INPUT_HTML_CONTENT" | base64 -d 2>/dev/null); then
              if printf '%s' "$DECODED" | grep -q '<'; then
                printf '%s' "$DECODED" > /tmp/w2a/index.html
                DECODED_OK=true
                echo "Decoded as base64"
              fi
            fi
            if [ "$DECODED_OK" = false ]; then
              if printf '%s' "$INPUT_HTML_CONTENT" | grep -q '<'; then
                printf '%s' "$INPUT_HTML_CONTENT" > /tmp/w2a/index.html
                echo "Saved as plain text"
              elif [ -n "$DECODED" ]; then
                printf '%s' "$DECODED" > /tmp/w2a/index.html
                echo "Decoded as base64 (no '<' tag, using decoded anyway)"
              else
                printf '%s' "$INPUT_HTML_CONTENT" > /tmp/w2a/index.html
                echo "Saved as plain text (fallback)"
              fi
            fi
            # Validasi minimal: file gak kosong
            if [ ! -s /tmp/w2a/index.html ]; then
              echo "ERROR: HTML content kosong setelah decode!"
              exit 1
            fi
            SIZE=$(wc -c < /tmp/w2a/index.html)
            echo "HTML size: $SIZE bytes"
            echo "W2A_MODE=html" >> $GITHUB_ENV
          elif [ -n "$INPUT_HTML_ZIP_URL" ]; then
            # ── 📦 v5.0: SITUS OFFLINE (ZIP statis dari release) ──
            echo "Offline site ZIP detected, downloading..."
            HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/w2a/site.zip --retry 3 --retry-delay 2 --max-time 120 "$INPUT_HTML_ZIP_URL")
            if [ "$HTTP_CODE" != "200" ] || [ ! -s /tmp/w2a/site.zip ]; then
              echo "ERROR: gagal download ZIP situs (HTTP $HTTP_CODE)!"
              exit 1
            fi
            rm -rf /tmp/w2a/site && mkdir -p /tmp/w2a/site
            if ! unzip -q /tmp/w2a/site.zip -d /tmp/w2a/site; then
              echo "ERROR: file bukan ZIP valid!"
              exit 1
            fi
            # index.html wajib ada di root; kalo di dalam folder (zip dari
            # "Extract All" Windows/macOS), angkat isinya ke root.
            if [ ! -f /tmp/w2a/site/index.html ]; then
              SUB=$(find /tmp/w2a/site -maxdepth 2 -name index.html | head -1)
              if [ -z "$SUB" ]; then
                echo "ERROR: index.html gak ketemu di ZIP!"
                exit 1
              fi
              SUBDIR=$(dirname "$SUB")
              if [ "$SUBDIR" != "/tmp/w2a/site" ]; then
                echo "index.html ketemu di $SUBDIR — diangkat ke root"
                mv "$SUBDIR"/* /tmp/w2a/site/ 2>/dev/null || true
              fi
            fi
            if [ ! -f /tmp/w2a/site/index.html ]; then
              echo "ERROR: index.html gak ketemu di ZIP!"
              exit 1
            fi
            echo "Site files: $(find /tmp/w2a/site -type f | wc -l)"
            echo "W2A_MODE=html" >> $GITHUB_ENV
            echo "W2A_HTML_ZIP=true" >> $GITHUB_ENV
          else
            if [ -z "$INPUT_WEB_URL" ]; then
              echo "ERROR: harus isi web_url ATAU html_content!"
              exit 1
            fi
            echo "W2A_MODE=url" >> $GITHUB_ENV
          fi

      # ─── CREATE PROJECT + WEBVIEW + APPLY TOKENS + BUILD ──────────────────
      - name: Create Project + WebView + Icon + Build
        run: |
          # ── Sanitize inputs ──
          SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
          SAFE_PKG=$(echo "$INPUT_PACKAGE_NAME" | sed 's/[^a-zA-Z0-9.]//g' | sed 's/^\.*//' | sed 's/\.*$//')
          [ -z "$SAFE_PKG" ] && SAFE_PKG="com.deruzuan.webapp"
          [ -z "$SAFE_APP_NAME" ] && SAFE_APP_NAME="WebApp"

          PROJ_NAME=$(echo "$SAFE_PKG" | rev | cut -d. -f1 | rev | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_]//g')
          [ -z "$PROJ_NAME" ] && PROJ_NAME="webapp"

          echo "App: $SAFE_APP_NAME | Pkg: $SAFE_PKG | Proj: $PROJ_NAME | Mode: $W2A_MODE"

          flutter create --project-name "$PROJ_NAME" --org "$(echo "$SAFE_PKG" | rev | cut -d. -f2- | rev)" "$PROJ_NAME"
          cd "$PROJ_NAME"
          # Versi di-PIN persis biar build CI deterministik (udah divalidasi
          # pake flutter analyze 3.47.2 — 0 issue).
          # ── v5.2: + package_info_plus (baca versionCode sendiri) &
          #    path_provider (folder cache buat download APK update) ──
          # ^8 / ^2.1 = pin MAJOR doang (solver pilih minor yg kompatibel) —
          # API-nya stabil lintas minor: PackageInfo.fromPlatform &
          # getTemporaryDirectory gak pernah berubah.
          flutter pub add flutter_inappwebview:6.1.5 url_launcher:6.3.2 'package_info_plus:^8.0.0' 'path_provider:^2.1.0'

          # ── HTML mode: siapin assets + daftarin ke pubspec ──
          # v5.0: ZIP situs offline = copy SELURUH isi site (css/js/img),
          #       HTML single = copy 1 file doang.
          if [ "$W2A_MODE" = "html" ]; then
            mkdir -p assets/webapp
            if [ "${W2A_HTML_ZIP:-false}" = "true" ]; then
              cp -r /tmp/w2a/site/. assets/webapp/
              echo "Offline site: $(find assets/webapp -type f | wc -l) files di-bundle ke APK"
            else
              cp /tmp/w2a/index.html assets/webapp/index.html
            fi
          fi

          # ── Icon processing ──
          # icon_url HARUS direct download URL (browser_download_url asset GitHub),
          # BUKAN URL halaman release. Bot (server.js publishRelease) udah difix
          # buat balikin direct URL — magic byte check di bawah tetap jaga-jaga.
          # v4.4: foto non-1:1 di-CROP TENGAH (bukan dijepit/letterbox) + auto-orient.
          ICON_APPLIED=false
          if [ -n "$INPUT_ICON_URL" ]; then
            echo "Nge-download icon dari: $INPUT_ICON_URL"
            HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/app_icon_raw --retry 3 --retry-delay 2 --max-time 15 "$INPUT_ICON_URL")
            if [ "$HTTP_CODE" -eq 200 ] && [ -s /tmp/app_icon_raw ]; then
              FILE_MAGIC=$(xxd -l 8 -p /tmp/app_icon_raw 2>/dev/null || echo "")
              FILE_TYPE=$(file -b /tmp/app_icon_raw 2>/dev/null || echo "unknown")
              echo "Magic: $FILE_MAGIC | Type: $FILE_TYPE"

              IS_IMAGE=false
              if echo "$FILE_MAGIC" | grep -qi "^89504e47"; then IS_IMAGE=true; fi   # PNG
              if echo "$FILE_MAGIC" | grep -qi "^ffd8ff"; then IS_IMAGE=true; fi    # JPEG
              if echo "$FILE_MAGIC" | grep -qi "^47494638"; then IS_IMAGE=true; fi # GIF
              if echo "$FILE_MAGIC" | grep -qi "^52494646"; then IS_IMAGE=true; fi  # WebP
              if echo "$FILE_MAGIC" | grep -qi "^424d"; then IS_IMAGE=true; fi      # BMP
              if echo "$FILE_TYPE"  | grep -qi "svg"; then IS_IMAGE=true; fi        # SVG

              if [ "$IS_IMAGE" = true ]; then
                echo "File valid sebagai image. Crop tengah 1:1 (fix icon jepit v4.4)..."
                # ── FIX ICON JEPIT (v4.4) ──
                # Dulu: convert -resize 512x512 -extent 512x512 → foto non-kotak
                # (mis. screenshot 572x1280) jadi thumbnail mini dgn pita kosong —
                # di launcher keliatan kayak "icon gak ke bikin".
                # Sekarang: auto-orient ( hormatin EXIF rotasi HP ) → hitung crop
                # kotak persis di TENGAH → resize 512x512. Icon bener-bener kotak.
                RAW_W=$(identify -format "%w" /tmp/app_icon_raw 2>/dev/null | head -1 | tr -dc '0-9')
                RAW_H=$(identify -format "%h" /tmp/app_icon_raw 2>/dev/null | head -1 | tr -dc '0-9')
                CROP_OK=false
                if [ -n "$RAW_W" ] && [ -n "$RAW_H" ] && [ "$RAW_W" -gt 0 ] && [ "$RAW_H" -gt 0 ] 2>/dev/null; then
                  if [ "$RAW_W" -ge "$RAW_H" ]; then
                    SIDE=$RAW_H; OFF_X=$(( (RAW_W - RAW_H) / 2 )); OFF_Y=0
                  else
                    SIDE=$RAW_W; OFF_X=0; OFF_Y=$(( (RAW_H - RAW_W) / 2 ))
                  fi
                  echo "Crop tengah: ${SIDE}x${SIDE}+${OFF_X}+${OFF_Y} (asli ${RAW_W}x${RAW_H})"
                  if convert /tmp/app_icon_raw -auto-orient -strip -crop "${SIDE}x${SIDE}+${OFF_X}+${OFF_Y}" +repage -resize 512x512 -extent 512x512 -background none -define png:compression-level=9 -define png:compression-filter=5 /tmp/app_icon_valid.png 2>/dev/null; then
                    CROP_OK=true
                  fi
                fi
                if [ "$CROP_OK" = false ]; then
                  echo "Crop pintar gagal (format aneh?), fallback cara lama..."
                  convert /tmp/app_icon_raw -auto-orient -background none -strip -resize 512x512 -gravity center -extent 512x512 -define png:compression-level=9 -define png:compression-filter=5 /tmp/app_icon_valid.png 2>/dev/null || true
                fi
                PNG_MAGIC=$(xxd -l 4 -p /tmp/app_icon_valid.png 2>/dev/null || echo "")
                if [ "$PNG_MAGIC" = "89504e47" ]; then
                    echo "PNG valid! Applying ke mipmap directories..."
                    for dir in android/app/src/main/res/mipmap-*; do
                      if [ -d "$dir" ]; then
                        dirname=$(basename "$dir")
                        case "$dirname" in
                          mipmap-mdpi)    SIZE=48  ;;
                          mipmap-hdpi)    SIZE=72  ;;
                          mipmap-xhdpi)   SIZE=96  ;;
                          mipmap-xxhdpi)  SIZE=144 ;;
                          mipmap-xxxhdpi) SIZE=192 ;;
                          *)              SIZE=96  ;;
                        esac
                        convert /tmp/app_icon_valid.png -resize ${SIZE}x${SIZE} -define png:compression-level=9 "$dir/ic_launcher.png" 2>/dev/null && \
                        echo "  $dirname -> ${SIZE}x${SIZE} OK" || echo "  $dirname -> GAGAL, pake default"
                      fi
                    done
                    ICON_APPLIED=true
                    echo "Icon berhasil di-apply!"
                  else
                    echo "Konversi PNG gagal (magic byte gak valid), pake icon default Flutter"
                fi
              else
                echo "File bukan image valid (magic: $FILE_MAGIC), pake icon default Flutter"
                echo "HINT: pastiin icon_url = direct download URL asset, bukan halaman release!"
              fi
            else
              echo "Download gagal (HTTP $HTTP_CODE atau file kosong), pake icon default Flutter"
            fi
          else
            echo "Gak ada icon URL, pake icon default Flutter"
          fi

          # ── Splash logo: icon jadi asset buat splash screen (v4.6) ──
          if [ "$ICON_APPLIED" = true ]; then
            cp /tmp/app_icon_valid.png assets/splash_logo.png && echo "Splash logo asset siap"
          fi

          # ── Tulis Dart main.dart (template v4.6: opsi splash/dark + pull-to-refresh) ──
          # ⚠️ Heredoc: body & terminator DART_EOF wajib di base indent (kolom 0
          # setelah YAML strip). Jangan naikin indentasinya!
          cat > lib/main.dart << 'DART_EOF'
          // ============================================================================
          // Web2APK Template v4.6 — flutter_inappwebview + OPSI BUILD
          // ============================================================================
          // Baru di v4.6 (di atas fix v4.5 anti-layar-putih + backend support):
          //   1. SPLASH CUSTOM   : logo/icon user ditampilin pas app dibuka (bukan
          //      spinner polos). Kalo gak ada icon → fallback spinner + nama app.
          //      Bisa di-MATIIN via opsi "Splash" di bot (__SHOW_SPLASH__ = false).
          //   2. TEMA GELAP      : splash + loading + error card ikut mode gelap
          //      (__DARK_THEME__ = true).
          //   3. PULL-TO-REFRESH : tarik ke bawah buat reload halaman.
          // Fitur v4.5 (tetap): mixed content allow (HTTPS page manggil API HTTP jalan),
          //   hybrid composition (anti layar putih), DOM storage/cache/cookie,
          //   timer 25 dtk anti-muter, upload file, link eksternal (wa/tel/mailto),
          //   download ke sistem, target=_blank, back button bener,
          //   HTML mode via InAppLocalhostServer.
          // Catatan token (di-replace saat build):
          //   __APP_NAME__ __WEB_URL__ __SHOW_SPLASH__ (true/false) __DARK_THEME__ (true/false)
          // ============================================================================

          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';

          import 'package:flutter/material.dart';
          // v5.2: MethodChannel = jalur ke native buat install APK (OTA update)
          import 'package:flutter/services.dart' show SystemNavigator, MethodChannel;
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';
          import 'package:package_info_plus/package_info_plus.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() {
            runApp(const WebViewApp());
          }

          // ── Opsi dari bot (diisi token replacement saat build) ──
          const bool kSplashEnabled = __SHOW_SPLASH__;
          const bool kDarkTheme = __DARK_THEME__;
          const Color kBgColor = kDarkTheme ? Color(0xFF121212) : Colors.white;

          // ── v5.1: pengumuman & multi-tab (diisi token replacement saat build) ──
          // kAnnounceUrl : raw URL announcements/global.json ('' = fitur off)
          // kTabsJson : JSON [{label,url}] (max 3) — '[]' = 1 tab (tanpa nav bawah)
          const String kAnnounceUrl = '__ANNOUNCE_URL__';
          const String kTabsJson = '__TABS_JSON__';

          // ── 🔄 v5.2: OTA UPDATE TANPA UNINSTALL ──
          // kUpdateUrl = raw URL updates/<pkg>.json di repo ('' = fitur off).
          // Isi manifest (ditulis bot tiap build sukses):
          //   {"versionCode": <run number naik terus>, "versionName": "1.0.N",
          //    "apk": "<url release apk-<pkg>/app.apk>", "notes": "..."}
          // App bandingin versionCode → banner update → download → install
          // in-app. Signature dijaga sama (stable keystore di workflow) →
          // Android nganggep update, data aman, GAK PERLU UNINSTALL.
          const String kUpdateUrl = '__UPDATE_URL__';

          class WebViewApp extends StatelessWidget {
            const WebViewApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '__APP_NAME__',
                theme: ThemeData(
                  colorSchemeSeed: Colors.blue,
                  brightness: kDarkTheme ? Brightness.dark : Brightness.light,
                  useMaterial3: true,
                ),
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            // ── TARGET & OPSI (diisi oleh token replacement saat build) ──
            // URL mode  : 'https://website-kamu.com'
            // HTML mode : 'assets/webapp/index.html' (dibundle, jalan offline)
            static const String _target = '__WEB_URL__';
            static final bool _isAssetMode = _target.startsWith('assets/');
            // HTML mode disajikan lewat server localhost built-in biar perilaku sama
            // kayak website asli (fetch()/CSS relatif/localStorage jalan normal).
            static const String _assetDocRoot = 'assets/webapp/';
            // Opsi dari bot: splash on/off & tema gelap (konstanta top-level)
            static const bool _splashEnabled = kSplashEnabled;
            static const bool _dark = kDarkTheme;
            static const Color _bg = kBgColor;

            final InAppLocalhostServer _localhost =
                InAppLocalhostServer(documentRoot: _assetDocRoot);
            bool _localhostStarted = false;

            // ── State UI ──
            InAppWebViewController? _web;
            PullToRefreshController? _pullToRefresh;
            bool _isLoading = true;
            bool _hasError = false;
            bool _isSlow = false;
            bool _showSplash = _splashEnabled;
            int _progress = 0;
            String _errorMsg = '';
            int _reloadKey = 0;
            Timer? _slowTimer;

            // ── 📑 v5.0: multi-tab & 📢 v5.1: pengumuman state ──
            List<Map<String, String>> _tabs = const [];
            int _tabIndex = 0;
            String _currentTarget = _target;
            Timer? _announceTimer;
            bool _announceVisible = false;
            String _announceMsg = '';
            String _announceLink = '';

            // ── 🔄 v5.2: OTA update state ──
            static const MethodChannel _updateChannel =
                MethodChannel('dzr.cloudbuilder/update');
            Timer? _updateTimer;
            bool _updateVisible = false;
            int _updateRemoteCode = 0;
            String _updateApkUrl = '';
            bool _updateDownloading = false;
            double _updateProgress = 0;
            String? _updateApkPath;

            // ── Settings max-compatibility (intinya: perlakuin webview kayak Chrome) ──
            final InAppWebViewSettings _settings = InAppWebViewSettings(
              javaScriptEnabled: true,
              domStorageEnabled: true,
              databaseEnabled: true,
              cacheEnabled: true,
              // FIX UTAMA layar putih/muter: HTTPS page boleh manggil API HTTP
              mixedContentMode: MixedContentMode.MIXED_CONTENT_ALWAYS_ALLOW,
              // FIX LAYAR PUTIH di banyak device: rendering hybrid composition
              useHybridComposition: true,
              transparentBackground: false,
              supportZoom: true,
              mediaPlaybackRequiresUserGesture: false,
              thirdPartyCookiesEnabled: true,
              useOnDownloadStart: true,
              allowFileAccess: true,
              allowFileAccessFromFileURLs: true,
              allowUniversalAccessFromFileURLs: true,
              javaScriptCanOpenWindowsAutomatically: true,
              disableDefaultErrorPage: true,
            );

            @override
            void initState() {
              super.initState();
              _pullToRefresh = PullToRefreshController(
                onRefresh: () {
                  _web?.reload();
                },
                settings: PullToRefreshSettings(
                  color: _dark ? Colors.white : Colors.blue,
                ),
              );
              _armSlowTimer();
              // ── 📑 v5.0: parse tab dari bot — cuma aktif kalo ada >1 tab valid ──
              try {
                final parsed = (jsonDecode(kTabsJson) as List)
                    .map((e) => {
                      'label': (e['label'] ?? 'Tab').toString(),
                      'url': (e['url'] ?? '').toString(),
                    })
                    .where((t) => t['url']!.startsWith('http'))
                    .toList();
                if (parsed.length > 1) {
                  _tabs = parsed;
                  _currentTarget = parsed.first['url']!;
                }
              } catch (_) {
                _tabs = const [];
              }
              // ── 📢 v5.1: tarik pengumuman pas start + tiap 8 jam selagi app buka ──
              _fetchAnnouncement();
              _announceTimer = Timer.periodic(const Duration(hours: 8), (_) => _fetchAnnouncement());
              // ── 🔄 v5.2: cek update pas start (delay 5 dtk biar UI lancar)
              //    + tiap 6 jam selagi app kebuka ──
              Future.delayed(const Duration(seconds: 5), _checkUpdate);
              _updateTimer = Timer.periodic(const Duration(hours: 6), (_) => _checkUpdate());
              // Splash hilang maksimal 6 detik, biar halaman lambat gak keliatan "mati"
              Future.delayed(const Duration(seconds: 6), () {
                if (mounted && _showSplash) {
                  setState(() => _showSplash = false);
                }
              });
            }

            @override
            void dispose() {
              _slowTimer?.cancel();
              _announceTimer?.cancel();
              _updateTimer?.cancel();
              super.dispose();
            }

            // ── ANTI-MUTER: kalo 25 detik belum selesai load, buka kartu peringatan ──
            void _armSlowTimer() {
              _slowTimer?.cancel();
              _slowTimer = Timer(const Duration(seconds: 25), () {
                if (mounted && _isLoading && !_hasError) {
                  setState(() => _isSlow = true);
                }
              });
            }

            void _fail(String msg) {
              _slowTimer?.cancel();
              _pullToRefresh?.endRefreshing();
              if (!mounted) return;
              setState(() {
                _hasError = true;
                _isLoading = false;
                _showSplash = false;
                _isSlow = false;
                _errorMsg = msg;
              });
            }

            Future<void> _retry() async {
              if (!mounted) return;
              setState(() {
                _hasError = false;
                _isSlow = false;
                _isLoading = true;
                _progress = 0;
                _reloadKey++; // bikin ulang webview → load dari awal
              });
              _armSlowTimer();
            }

            // ── Link non-http (tel:/mailto:/whatsapp:/geo:/intent:) → app eksternal ──
            Future<void> _openExternal(WebUri url) async {
              try {
                await launchUrl(url, mode: LaunchMode.externalApplication);
              } catch (_) {
                // Gak ada app yang mau nerima link-nya — diemin aja, jangan crash.
              }
            }

            // ── 📢 v5.1: tarik pengumuman global (raw.githubusercontent).
            // Format file: {"id": <unix-ms>, "message": "teks", "url": "https://..."}
            // message kosong / gagal / offline = senyap, jangan ganggu user.
            Future<void> _fetchAnnouncement() async {
              if (kAnnounceUrl.isEmpty) return;
              HttpClient? hc;
              try {
                hc = HttpClient();
                hc.connectionTimeout = const Duration(seconds: 10);
                final req = await hc.getUrl(Uri.parse(kAnnounceUrl));
                final resp = await req.close();
                if (resp.statusCode != 200) return;
                final body = await resp.transform(utf8.decoder).join();
                final data = jsonDecode(body);
                final msg = data['message'];
                if (msg is String && msg.trim().isNotEmpty && mounted) {
                  final link = data['url'];
                  setState(() {
                    _announceVisible = true;
                    _announceMsg = msg.trim();
                    _announceLink = (link is String) ? link : '';
                  });
                }
              } catch (_) {
                // Offline / file belum ada / JSON rusak — diemin aja.
              } finally {
                hc?.close();
              }
            }

            // ── 🔄 v5.2: cek update OTA (raw repo updates/<pkg>.json).
            // versionCode = GitHub run number (naik tiap rebuild). Kalo lebih
            // besar dari versionCode app ini → banner update muncul.
            // Gagal/offline/manifest belum ada = senyap, gak ganggu user.
            Future<void> _checkUpdate() async {
              if (kUpdateUrl.isEmpty) return;
              HttpClient? hc;
              try {
                hc = HttpClient();
                hc.connectionTimeout = const Duration(seconds: 10);
                final req = await hc.getUrl(Uri.parse(kUpdateUrl));
                final resp = await req.close();
                if (resp.statusCode != 200) return;
                final body = await resp.transform(utf8.decoder).join();
                final data = jsonDecode(body);
                final remote = int.tryParse("${data['versionCode'] ?? ''}") ?? 0;
                final rawApk = data['apk'];
                final apkUrl = (rawApk is String) ? rawApk : '';
                if (remote <= 0 || !apkUrl.startsWith('http')) return;
                final info = await PackageInfo.fromPlatform();
                final local = int.tryParse(info.buildNumber) ?? 0;
                if (remote > local && mounted) {
                  setState(() {
                    _updateVisible = true;
                    _updateRemoteCode = remote;
                    _updateApkUrl = apkUrl;
                  });
                }
              } catch (_) {
                // Offline / manifest belum ada / JSON rusak — diemin aja.
              } finally {
                hc?.close();
              }
            }

            // ── 🔄 v5.2: download APK update ke cache → buka installer sistem.
            // Signature APK dijamin sama (stable keystore) → Android nganggep
            // UPDATE di atas app lama: data & setting AMAN, GAK PERLU UNINSTALL.
            Future<void> _startUpdate() async {
              if (_updateDownloading) return;
              // Udah pernah ke-download sesi ini → langsung buka installer lagi
              if (_updateApkPath != null) {
                await _installUpdateApk();
                return;
              }
              setState(() => _updateDownloading = true);
              HttpClient? hc;
              try {
                hc = HttpClient();
                hc.connectionTimeout = const Duration(seconds: 15);
                final req = await hc.getUrl(Uri.parse(_updateApkUrl));
                final resp = await req.close();
                if (resp.statusCode != 200) {
                  throw Exception('HTTP ${resp.statusCode}');
                }
                final total = resp.contentLength ?? -1;
                final dir = await getTemporaryDirectory();
                final f = File('${dir.path}/update_v${_updateRemoteCode}.apk');
                final sink = f.openWrite();
                var got = 0;
                await for (final chunk in resp) {
                  got += chunk.length;
                  sink.add(chunk);
                  if (total > 0 && mounted) {
                    setState(() => _updateProgress = got / total);
                  }
                }
                await sink.close();
                _updateApkPath = f.path;
                if (mounted) setState(() => _updateDownloading = false);
                await _installUpdateApk();
              } catch (_) {
                _updateApkPath = null;
                if (mounted) setState(() => _updateDownloading = false);
                // Fallback: buka link di browser (install manual tetep bisa).
                await _openExternal(WebUri(_updateApkUrl));
              } finally {
                hc?.close();
              }
            }

            // Panggil native (MainActivity) buat nampilin installer sistem.
            // "ok" = installer kebuka | "settings" = user belum izinkan
            // install aplikasi tak dikenal → dibukain halaman izinnya.
            Future<void> _installUpdateApk() async {
              final p = _updateApkPath;
              if (p == null) return;
              try {
                final res = await _updateChannel.invokeMethod('installApk', {'path': p});
                if (res == 'settings' && mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text(
                          'Aktifin "Install aplikasi tak dikenal" buat app ini, lalu pencet banner update lagi ya'),
                    ),
                  );
                  try {
                    await _updateChannel.invokeMethod('openInstallPermSettings');
                  } catch (_) {}
                }
              } catch (_) {
                // Channel gagal → fallback: buka link di browser.
                await _openExternal(WebUri(_updateApkUrl));
              }
            }

            // ── 📑 v5.0: pindah tab — webview di-rebuild ke URL tab baru ──
            void _switchTab(int i) {
              if (i == _tabIndex || i < 0 || i >= _tabs.length) return;
              setState(() {
                _tabIndex = i;
                _currentTarget = _tabs[i]['url'] ?? _target;
                _reloadKey++;
                _isLoading = true;
                _hasError = false;
                _isSlow = false;
                _progress = 0;
                _showSplash = false;
              });
              _armSlowTimer();
            }

            /// HTML mode: nyalain server localhost (sekali aja), balikin URL hasilnya.
            Future<WebUri?> _ensureLocalhost() async {
              if (!_isAssetMode) return null;
              if (!_localhostStarted) {
                await _localhost.start();
                _localhostStarted = true;
              }
              final rel = _target.startsWith(_assetDocRoot)
                  ? _target.substring(_assetDocRoot.length)
                  : _target.split('/').last;
              return WebUri('http://localhost:8080/$rel');
            }

            Widget _overlayCard({
              required IconData icon,
              required String title,
              required String message,
            }) {
              return Container(
                color: _bg,
                alignment: Alignment.center,
                padding: const EdgeInsets.all(24),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Icon(icon, size: 64, color: Colors.grey),
                    const SizedBox(height: 16),
                    Text(
                      title,
                      style: TextStyle(
                        fontSize: 20,
                        fontWeight: FontWeight.bold,
                        color: _dark ? Colors.white : Colors.black87,
                      ),
                    ),
                    const SizedBox(height: 8),
                    Text(
                      message,
                      textAlign: TextAlign.center,
                      style: TextStyle(color: _dark ? Colors.grey.shade400 : Colors.grey),
                    ),
                    const SizedBox(height: 24),
                    FilledButton.icon(
                      onPressed: _retry,
                      icon: const Icon(Icons.refresh),
                      label: const Text('Coba Lagi'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, _) async {
                  if (didPop) return;
                  final web = _web;
                  if (web != null && await web.canGoBack() == true) {
                    await web.goBack();
                  } else {
                    await SystemNavigator.pop();
                  }
                },
                child: Scaffold(
                  backgroundColor: _bg,
                  body: SafeArea(
                    child: Column(
                      children: [
                        Expanded(
                          child: Stack(
                      children: [
                        // ── WebView utama (key ganti = load ulang) ──
                        InAppWebView(
                          key: ValueKey<int>(_reloadKey),
                          initialUrlRequest:
                              _isAssetMode ? null : URLRequest(url: WebUri(_currentTarget)),
                          initialSettings: _settings,
                          pullToRefreshController: _pullToRefresh,
                          onWebViewCreated: (controller) async {
                            _web = controller;
                            if (_isAssetMode) {
                              try {
                                final localUrl = await _ensureLocalhost();
                                if (localUrl != null) {
                                  await controller.loadUrl(
                                      urlRequest: URLRequest(url: localUrl));
                                }
                              } catch (e) {
                                _fail(e.toString());
                              }
                            }
                          },
                          shouldOverrideUrlLoading: (controller, action) async {
                            final url = action.request.url;
                            final scheme = url?.scheme.toLowerCase() ?? '';
                            if (scheme == 'http' || scheme == 'https' || scheme.isEmpty) {
                              return NavigationActionPolicy.ALLOW;
                            }
                            if (url != null) await _openExternal(url);
                            return NavigationActionPolicy.CANCEL;
                          },
                          onCreateWindow: (controller, action) async {
                            // Link target="_blank" / window.open() → buka di webview ini
                            final url = action.request.url;
                            final scheme = url?.scheme.toLowerCase() ?? '';
                            if (url != null && (scheme == 'http' || scheme == 'https')) {
                              await controller.loadUrl(urlRequest: URLRequest(url: url));
                              return true;
                            }
                            if (url != null) await _openExternal(url);
                            return true;
                          },
                          onLoadStart: (controller, url) {
                            if (!mounted) return;
                            setState(() {
                              _isLoading = true;
                              _hasError = false;
                              _isSlow = false;
                              _progress = 0;
                            });
                            _armSlowTimer();
                          },
                          onLoadStop: (controller, url) {
                            if (!mounted) return;
                            _slowTimer?.cancel();
                            _pullToRefresh?.endRefreshing();
                            setState(() {
                              _isLoading = false;
                              _showSplash = false;
                              _isSlow = false;
                              _progress = 100;
                            });
                          },
                          onProgressChanged: (controller, p) {
                            if (!mounted) return;
                            setState(() => _progress = p);
                          },
                          onReceivedError: (controller, request, error) {
                            // Error sub-resource (iklan/gambar) gak nge-block halaman
                            if (request.isForMainFrame != true) return;
                            _pullToRefresh?.endRefreshing();
                            _fail(error.description);
                          },
                          onDownloadStartRequest: (controller, request) async {
                            // Link download → serahin ke browser/DownloadManager sistem
                            await _openExternal(request.url);
                          },
                        ),

                        // ── Progress bar tipis di atas ──
                        if (_isLoading && !_hasError)
                          Positioned(
                            top: 0,
                            left: 0,
                            right: 0,
                            child: LinearProgressIndicator(
                              value: _progress > 0 && _progress < 100
                                  ? _progress / 100
                                  : null,
                              minHeight: 3,
                            ),
                          ),

                        // ── 📢 v5.1: banner pengumuman owner + 🔄 v5.2: banner OTA update ──
                        if (_announceVisible || _updateVisible)
                          Positioned(
                            top: 0,
                            left: 0,
                            right: 0,
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                if (_announceVisible)
                                  Material(
                                    color: Colors.deepOrange,
                                    child: InkWell(
                                      onTap: _announceLink.isEmpty
                                          ? null
                                          : () => _openExternal(WebUri(_announceLink)),
                                      child: Padding(
                                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                                        child: Row(
                                          children: [
                                            const Icon(Icons.campaign, color: Colors.white, size: 20),
                                            const SizedBox(width: 8),
                                            Expanded(
                                              child: Text(
                                                _announceMsg,
                                                maxLines: 3,
                                                overflow: TextOverflow.ellipsis,
                                                style: const TextStyle(color: Colors.white, fontSize: 13),
                                              ),
                                            ),
                                            GestureDetector(
                                              onTap: () => setState(() => _announceVisible = false),
                                              child: const Icon(Icons.close, color: Colors.white70, size: 18),
                                            ),
                                          ],
                                        ),
                                      ),
                                    ),
                                  ),
                                if (_updateVisible)
                                  Material(
                                    color: Colors.green.shade700,
                                    child: InkWell(
                                      onTap: _updateDownloading ? null : _startUpdate,
                                      child: Column(
                                        mainAxisSize: MainAxisSize.min,
                                        children: [
                                          Padding(
                                            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                                            child: Row(
                                              children: [
                                                const Icon(Icons.system_update_alt, color: Colors.white, size: 20),
                                                const SizedBox(width: 8),
                                                Expanded(
                                                  child: Text(
                                                    _updateDownloading
                                                        ? 'Mengunduh update... ${(_updateProgress * 100).toStringAsFixed(0)}%'
                                                        : 'Update baru tersedia — ketuk buat install (gak perlu uninstall!)',
                                                    maxLines: 2,
                                                    overflow: TextOverflow.ellipsis,
                                                    style: const TextStyle(
                                                      color: Colors.white,
                                                      fontSize: 13,
                                                      fontWeight: FontWeight.w600,
                                                    ),
                                                  ),
                                                ),
                                                if (!_updateDownloading)
                                                  const Padding(
                                                    padding: EdgeInsets.only(left: 8),
                                                    child: Text(
                                                      'UPDATE',
                                                      style: TextStyle(
                                                        color: Colors.white,
                                                        fontSize: 12,
                                                        fontWeight: FontWeight.bold,
                                                        letterSpacing: 1,
                                                      ),
                                                    ),
                                                  ),
                                                GestureDetector(
                                                  onTap: () => setState(() => _updateVisible = false),
                                                  child: const Icon(Icons.close, color: Colors.white70, size: 18),
                                                ),
                                              ],
                                            ),
                                          ),
                                          if (_updateDownloading)
                                            const LinearProgressIndicator(
                                              minHeight: 2,
                                              backgroundColor: Colors.white24,
                                              valueColor: AlwaysStoppedAnimation<Color>(Colors.white),
                                            ),
                                        ],
                                      ),
                                    ),
                                  ),
                              ],
                            ),
                          ),

                        // ── Splash branded (logo icon user, max 6 detik) ──
                        if (_showSplash && !_hasError)
                          Container(
                            color: _bg,
                            alignment: Alignment.center,
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                // Logo custom (dari icon APK). Kalo gak ada → kosong,
                                // spinner di bawah yang jadi indikator load.
                                Image.asset(
                                  'assets/splash_logo.png',
                                  width: 110,
                                  height: 110,
                                  errorBuilder: (_, _, _) => const SizedBox.shrink(),
                                ),
                                const SizedBox(height: 16),
                                Text(
                                  '__APP_NAME__',
                                  style: TextStyle(
                                    fontSize: 18,
                                    fontWeight: FontWeight.w700,
                                    color: _dark ? Colors.white : Colors.grey.shade800,
                                  ),
                                ),
                                const SizedBox(height: 20),
                                const SizedBox(
                                  width: 28,
                                  height: 28,
                                  child: CircularProgressIndicator(strokeWidth: 3),
                                ),
                              ],
                            ),
                          ),

                        // ── Kartu "lama banget" (backend lambat/down) ──
                        if (_isSlow && _isLoading && !_hasError)
                          _overlayCard(
                            icon: Icons.hourglass_top,
                            title: 'Lama banget nge-load...',
                            message:
                                'Koneksi ke website/backend-nya lambat atau gak merespons.\n'
                                'Tarik ke bawah ato pencet Coba Lagi buat reload.',
                          ),

                        // ── Kartu error (gagal load) ──
                        if (_hasError)
                          _overlayCard(
                            icon: Icons.wifi_off,
                            title: 'Gagal Memuat',
                            message: _errorMsg,
                          ),
                      ],
                        ),
                        ),
                        // ── 📑 v5.0: navigasi bawah antar tab (muncul kalo >1 tab) ──
                        if (_tabs.length > 1)
                          NavigationBar(
                            selectedIndex: _tabIndex,
                            onDestinationSelected: _switchTab,
                            destinations: [
                              for (final t in _tabs)
                                NavigationDestination(
                                  icon: const Icon(Icons.public_outlined),
                                  selectedIcon: const Icon(Icons.public),
                                  label: t['label'] ?? 'Tab',
                                ),
                            ],
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART_EOF

          # ── APPLY TOKENS ──
          # ⚠️ Heredoc: body & terminator PYEOF wajib di base indent (kolom 0).
          python3 << 'PYEOF'
          import os, re, json

          app_name = os.environ.get('INPUT_APP_NAME', 'WebApp') or 'WebApp'
          web_url = os.environ.get('INPUT_WEB_URL', '') or ''
          mode = os.environ.get('W2A_MODE', 'url')
          splash = (os.environ.get('INPUT_SPLASH', 'true') or 'true').strip().lower()
          dark = (os.environ.get('INPUT_DARK_MODE', 'false') or 'false').strip().lower()
          # ── v5.0: tabs ──
          tabs_raw = os.environ.get('INPUT_TABS_JSON', '') or ''
          # ── v5.1: URL pengumuman global dari slug repo (tanpa input bot) ──
          slug = os.environ.get('GITHUB_SLUG', '') or ''

          # Normalisasi bool (true/1/yes/on = true, sisanya false)
          splash = 'true' if splash in ('1', 'true', 'yes', 'on') else 'false'
          dark = 'true' if dark in ('1', 'true', 'yes', 'on') else 'false'

          # Normalisasi URL (defense-in-depth: bot udah normalize, sini jaga-jaga)
          if mode == 'url':
              web_url = web_url.strip()
              if web_url and not web_url.lower().startswith(('http://', 'https://')):
                  web_url = 'https://' + web_url
              if not web_url:
                  raise SystemExit('ERROR: URL mode tapi web_url kosong!')

          # Sanitize buat Dart string literal (escape backslash & single quote)
          app_name_safe = app_name.replace('\\', '\\\\').replace("'", "\\'")
          web_url_safe = web_url.replace('\\', '\\\\').replace("'", "\\'")

          # ── v5.0: tabs (validasi JSON dulu; rusak → kosong aja, app tetap 1 tab) ──
          tabs_safe = '[]'
          if tabs_raw.strip():
              try:
                  arr = json.loads(tabs_raw)
                  clean = []
                  for t in arr:
                      if not isinstance(t, dict):
                          continue
                      u = str(t.get('url', '')).strip()
                      l = str(t.get('label', 'Tab')).strip()[:16] or 'Tab'
                      if u.lower().startswith(('http://', 'https://')):
                          clean.append({'label': l, 'url': u[:1000]})
                  if len(clean) >= 2:
                      # Escape buat Dart single-quoted literal: backslash DULU, lalu '
                      # (json.dumps bisa mengandung \ dan label bisa mengandung ' —
                      #  tanpa escape, main.dart gagal compile / string kepotong)
                      tabs_safe = json.dumps(clean, ensure_ascii=False).replace('\\', '\\\\').replace("'", "\\'")
              except Exception:
                  tabs_safe = '[]'
          announce_url_safe = ''
          if slug.strip():
              # raw.githubusercontent cache ±5 menit — banner muncul maks 5 mnt
              # setelah owner /pengumuman. Escape buat Dart single-quoted literal.
              announce_url_safe = ('https://raw.githubusercontent.com/' + slug.strip()
                                   + '/main/announcements/global.json')
              announce_url_safe = announce_url_safe.replace('\\', '\\\\').replace("'", "\\'")

          # ── 🔄 v5.2: URL manifest OTA update — updates/<pkg>.json di repo.
          # Bot nulis file ini tiap build sukses (versionCode = run number).
          pkg_raw = os.environ.get('INPUT_PACKAGE_NAME', '') or ''
          pkg_clean = re.sub(r'[^A-Za-z0-9.]', '', pkg_raw).strip('.')
          if not pkg_clean:
              pkg_clean = 'com.deruzuan.webapp'
          update_url_safe = ''
          if slug.strip():
              update_url_safe = ('https://raw.githubusercontent.com/' + slug.strip()
                                 + '/main/updates/' + pkg_clean + '.json')
              update_url_safe = update_url_safe.replace('\\', '\\\\').replace("'", "\\'")

          with open('lib/main.dart', 'r', encoding='utf-8') as f:
              src = f.read()

          # Single-pass replacement (anti bug token-di-dalam-token)
          def repl(m):
              tok = m.group(0)
              if tok == '__APP_NAME__':
                  return app_name_safe
              if tok == '__WEB_URL__':
                  return 'assets/webapp/index.html' if mode == 'html' else web_url_safe
              if tok == '__SHOW_SPLASH__':
                  return splash
              if tok == '__DARK_THEME__':
                  return dark
              if tok == '__TABS_JSON__':
                  return tabs_safe
              if tok == '__ANNOUNCE_URL__':
                  return announce_url_safe
              if tok == '__UPDATE_URL__':
                  return update_url_safe
              return tok

          src = re.sub(r'__(?:APP_NAME|WEB_URL|SHOW_SPLASH|DARK_THEME|TABS_JSON|ANNOUNCE_URL|UPDATE_URL)__', repl, src)

          # Safety net: gak boleh ada token tersisa di main.dart
          leftover = re.findall(r'__(?:APP_NAME|WEB_URL|SHOW_SPLASH|DARK_THEME|TABS_JSON|ANNOUNCE_URL|UPDATE_URL)__', src)
          if leftover:
              raise SystemExit('ERROR: token tersisa di main.dart: %s' % leftover)

          with open('lib/main.dart', 'w', encoding='utf-8') as f:
              f.write(src)

          # ── Daftarin assets ke pubspec.yaml ──
          assets = []
          if mode == 'html':
              assets.append('assets/webapp/')
          if os.path.exists('assets/splash_logo.png'):
              assets.append('assets/splash_logo.png')

          if assets:
              with open('pubspec.yaml', 'r', encoding='utf-8') as f:
                  pubspec = f.read()
              need = [a for a in assets if a not in pubspec]
              if need:
                  if re.search(r'^flutter:\s*$', pubspec, re.M):
                      if re.search(r'^\s+assets:', pubspec, re.M):
                          # assets section udah ada — nambahin entri di bawahnya
                          pubspec = re.sub(
                              r'^(\s+assets:)$',
                              lambda mm: mm.group(1) + ''.join('\n    - ' + a for a in need),
                              pubspec, count=1, flags=re.M,
                          )
                      else:
                          pubspec = re.sub(
                              r'^flutter:\s*$',
                              'flutter:\n  assets:\n' + ''.join('    - ' + a + '\n' for a in need),
                              pubspec, count=1, flags=re.M,
                          )
                  else:
                      pubspec += '\nflutter:\n  assets:\n' + ''.join('    - ' + a + '\n' for a in need)
                  with open('pubspec.yaml', 'w', encoding='utf-8') as f:
                      f.write(pubspec)
              print('Assets registered:', need)

          print('Token applied. Mode:', mode, '| splash:', splash, '| dark:', dark)
          print('v5.1:', 'tabs=' + tabs_safe if tabs_safe != '[]' else 'tabs=off', '| announce=' + ('on' if announce_url_safe else 'off'))
          print('v5.2:', 'ota=' + ('on' if update_url_safe else 'off'), '| pkg=' + pkg_clean)
          if mode == 'url':
              print('URL set to:', web_url)

          PYEOF

          # ── Patch Android Manifest ──
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"$SAFE_APP_NAME\"|g" "$MANIFEST"
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <application|' "$MANIFEST"
            fi
            if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's|android:allowBackup="[^"]*"|android:allowBackup="false"\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
            fi
            # <queries> wajib di Android 11+ (package visibility) biar
            # url_launcher bisa buka browser/telpon/email buat link eksternal
            # & download. Tanpa ini launchUrl gagal senyap.
            if ! grep -q "<queries>" "$MANIFEST"; then
              QRY='<queries><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="http" /></intent><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="tel" /></intent><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="mailto" /></intent></queries>'
              sed -i "s|<application|$QRY\n    <application|" "$MANIFEST"
            fi
            # ── 🔄 v5.2: izin + provider buat OTA UPDATE (install APK dari app) ──
            # REQUEST_INSTALL_PACKAGES = boleh memicu installer sistem.
            if ! grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application|' "$MANIFEST"
            fi
            # FileProvider = nyalain app kasih file APK ke installer dgn aman
            # (content:// URI — wajib di Android 7+).
            if ! grep -q "androidx.core.content.FileProvider" "$MANIFEST"; then
              PRV='<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileProvider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>'
              sed -i "s|</application>|    $PRV\n    </application>|" "$MANIFEST"
            fi
          fi

          # ── 🔄 v5.2: MainActivity + file_paths.xml (ota in-app update) ──
          # ⚠️ Heredoc: body & terminator PYEOF2 wajib di base indent (kolom 0).
          python3 << 'PYEOF2'
          import glob, os

          # 1) Timpa MainActivity.kt — tambah channel "dzr.cloudbuilder/update"
          #    (installApk + openInstallPermSettings) buat OTA update.
          cands = glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True)
          if cands:
              mp = cands[0]
              parts = mp.replace('\\', '/').split('/')
              ki = parts.index('kotlin')
              app_pkg = '.'.join(parts[ki + 1:-1])
              kotlin = '''package __APP_PKG__

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          /// v5.2 DZR CloudBuilder — channel OTA update.
          /// installApk(path) -> buka installer sistem. Karena workflow jaga
          /// signature APK tetap sama (stable keystore), Android menganggap ini
          /// UPDATE di atas app lama: data & setting aman, TANPA uninstall.
          class MainActivity : FlutterActivity() {
              private val channelName = "dzr.cloudbuilder/update"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "installApk" -> result.success(installApk(call.argument<String>("path") ?: ""))
                              "openInstallPermSettings" -> result.success(openInstallPermSettings())
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun canInstall(): Boolean =
                  Build.VERSION.SDK_INT < Build.VERSION_CODES.O ||
                      packageManager.canRequestPackageInstalls()

              private fun installApk(path: String): String {
                  return try {
                      val f = File(path)
                      if (!f.exists()) return "error:file_not_found"
                      if (!canInstall()) return "settings"
                      val uri = FileProvider.getUriForFile(
                          this, packageName + ".fileProvider", f
                      )
                      val i = Intent(Intent.ACTION_VIEW)
                      i.setDataAndType(uri, "application/vnd.android.package-archive")
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                      "ok"
                  } catch (e: Exception) {
                      "error:" + (e.message ?: "unknown")
                  }
              }

              private fun openInstallPermSettings(): Boolean {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  Uri.parse("package:" + packageName)
                              )
                          )
                      }
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          '''
              # CATATAN: gak perlu strip indent manual — YAML block scalar
              # udah ngelepas 10 spasi base, jadi python nerima konten string
              # persis dgn indent Kotlin yang bener (class=0, member=4, dst).
              kotlin = kotlin.replace('__APP_PKG__', app_pkg)
              open(mp, 'w', encoding='utf-8').write(kotlin)
              print('MainActivity patched:', app_pkg)
          else:
              print('WARNING: MainActivity.kt gak ketemu — OTA install channel off')

          # 2) res/xml/file_paths.xml — path yang boleh dibagi FileProvider
          os.makedirs('android/app/src/main/res/xml', exist_ok=True)
          with open('android/app/src/main/res/xml/file_paths.xml', 'w', encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n'
                      '<paths>\n'
                      '    <cache-path name="cache" path="." />\n'
                      '    <files-path name="files" path="." />\n'
                      '    <external-cache-path name="ext_cache" path="." />\n'
                      '</paths>\n')
          print('file_paths.xml OK')

          PYEOF2

          # ── Icon processing ──
          # icon_url HARUS direct download URL (browser_download_url asset GitHub),
          # BUKAN URL halaman release. Bot (server.js publishRelease) udah difix
          # buat balikin direct URL — magic byte check di bawah tetap jaga-jaga.
          # v4.4: foto non-1:1 di-CROP TENGAH (bukan dijepit/letterbox) + auto-orient.
          ICON_APPLIED=false
          if [ -n "$INPUT_ICON_URL" ]; then
            echo "Nge-download icon dari: $INPUT_ICON_URL"
            HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/app_icon_raw --retry 3 --retry-delay 2 --max-time 15 "$INPUT_ICON_URL")
            if [ "$HTTP_CODE" -eq 200 ] && [ -s /tmp/app_icon_raw ]; then
              FILE_MAGIC=$(xxd -l 8 -p /tmp/app_icon_raw 2>/dev/null || echo "")
              FILE_TYPE=$(file -b /tmp/app_icon_raw 2>/dev/null || echo "unknown")
              echo "Magic: $FILE_MAGIC | Type: $FILE_TYPE"

              IS_IMAGE=false
              if echo "$FILE_MAGIC" | grep -qi "^89504e47"; then IS_IMAGE=true; fi   # PNG
              if echo "$FILE_MAGIC" | grep -qi "^ffd8ff"; then IS_IMAGE=true; fi    # JPEG
              if echo "$FILE_MAGIC" | grep -qi "^47494638"; then IS_IMAGE=true; fi # GIF
              if echo "$FILE_MAGIC" | grep -qi "^52494646"; then IS_IMAGE=true; fi  # WebP
              if echo "$FILE_MAGIC" | grep -qi "^424d"; then IS_IMAGE=true; fi      # BMP
              if echo "$FILE_TYPE"  | grep -qi "svg"; then IS_IMAGE=true; fi        # SVG

              if [ "$IS_IMAGE" = true ]; then
                echo "File valid sebagai image. Crop tengah 1:1 (fix icon jepit v4.4)..."
                # ── FIX ICON JEPIT (v4.4) ──
                # Dulu: convert -resize 512x512 -extent 512x512 → foto non-kotak
                # (mis. screenshot 572x1280) jadi thumbnail mini dgn pita kosong —
                # di launcher keliatan kayak "icon gak ke bikin".
                # Sekarang: auto-orient ( hormatin EXIF rotasi HP ) → hitung crop
                # kotak persis di TENGAH → resize 512x512. Icon bener-bener kotak.
                RAW_W=$(identify -format "%w" /tmp/app_icon_raw 2>/dev/null | head -1 | tr -dc '0-9')
                RAW_H=$(identify -format "%h" /tmp/app_icon_raw 2>/dev/null | head -1 | tr -dc '0-9')
                CROP_OK=false
                if [ -n "$RAW_W" ] && [ -n "$RAW_H" ] && [ "$RAW_W" -gt 0 ] && [ "$RAW_H" -gt 0 ] 2>/dev/null; then
                  if [ "$RAW_W" -ge "$RAW_H" ]; then
                    SIDE=$RAW_H; OFF_X=$(( (RAW_W - RAW_H) / 2 )); OFF_Y=0
                  else
                    SIDE=$RAW_W; OFF_X=0; OFF_Y=$(( (RAW_H - RAW_W) / 2 ))
                  fi
                  echo "Crop tengah: ${SIDE}x${SIDE}+${OFF_X}+${OFF_Y} (asli ${RAW_W}x${RAW_H})"
                  if convert /tmp/app_icon_raw -auto-orient -strip -crop "${SIDE}x${SIDE}+${OFF_X}+${OFF_Y}" +repage -resize 512x512 -extent 512x512 -background none -define png:compression-level=9 -define png:compression-filter=5 /tmp/app_icon_valid.png 2>/dev/null; then
                    CROP_OK=true
                  fi
                fi
                if [ "$CROP_OK" = false ]; then
                  echo "Crop pintar gagal (format aneh?), fallback cara lama..."
                  convert /tmp/app_icon_raw -auto-orient -background none -strip -resize 512x512 -gravity center -extent 512x512 -define png:compression-level=9 -define png:compression-filter=5 /tmp/app_icon_valid.png 2>/dev/null || true
                fi
                PNG_MAGIC=$(xxd -l 4 -p /tmp/app_icon_valid.png 2>/dev/null || echo "")
                if [ "$PNG_MAGIC" = "89504e47" ]; then
                    echo "PNG valid! Applying ke mipmap directories..."
                    for dir in android/app/src/main/res/mipmap-*; do
                      if [ -d "$dir" ]; then
                        dirname=$(basename "$dir")
                        case "$dirname" in
                          mipmap-mdpi)    SIZE=48  ;;
                          mipmap-hdpi)    SIZE=72  ;;
                          mipmap-xhdpi)   SIZE=96  ;;
                          mipmap-xxhdpi)  SIZE=144 ;;
                          mipmap-xxxhdpi) SIZE=192 ;;
                          *)              SIZE=96  ;;
                        esac
                        convert /tmp/app_icon_valid.png -resize ${SIZE}x${SIZE} -define png:compression-level=9 "$dir/ic_launcher.png" 2>/dev/null && \
                        echo "  $dirname -> ${SIZE}x${SIZE} OK" || echo "  $dirname -> GAGAL, pake default"
                      fi
                    done
                    ICON_APPLIED=true
                    echo "Icon berhasil di-apply!"
                  else
                    echo "Konversi PNG gagal (magic byte gak valid), pake icon default Flutter"
                fi
              else
                echo "File bukan image valid (magic: $FILE_MAGIC), pake icon default Flutter"
                echo "HINT: pastiin icon_url = direct download URL asset, bukan halaman release!"
              fi
            else
              echo "Download gagal (HTTP $HTTP_CODE atau file kosong), pake icon default Flutter"
            fi
          else
            echo "Gak ada icon URL, pake icon default Flutter"
          fi

          # ── ⚙️ v4.8 AGP9 safety net: patch plugin pub-cache yang masih pake
          # getDefaultProguardFile('proguard-android.txt') — di-blok AGP 9+.
          # pub get eksplisit dulu biar plugin udah ada di pub-cache sebelum dipatch.
          flutter pub get || true
          find "$HOME/.pub-cache/hosted" -name "build.gradle" -path "*android*" \
            -exec sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" {} + 2>/dev/null || true
          echo "AGP9 proguard safety patch: OK"

          # ── Build ──
          # v5.2: --build-number = GITHUB_RUN_NUMBER → versionCode NAIK tiap
          # build (run number monoton). Ini syarat WAJIB update-over-install:
          # Android nolak install versionCode lebih rendah/sama dari lama.
          # --build-name cuma kosmetik (tampil di info versi app).
          BUILD_ARGS="--release --no-tree-shake-icons --build-number=${GITHUB_RUN_NUMBER:-1} --build-name=1.0.${GITHUB_RUN_NUMBER:-1}"
          if [ "$INPUT_SMALL_APK" = "true" ]; then
            # APK hemat: cuma compile buat arm64-v8a (HP modern sejak ~2015) —
            # ukuran ~40% lebih kecil dibanding universal.
            BUILD_ARGS="$BUILD_ARGS --target-platform android-arm64"
            echo "Small APK mode: arm64-only"
          fi
          flutter build apk $BUILD_ARGS 2>&1 | tee build_output.txt

          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1 || find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "=== BUILD FAILED ==="
            tail -30 build_output.txt
            exit 1
          fi
          echo "APK: $APK_PATH ($(du -sh "$APK_PATH" | cut -f1))"

      # ─── 🔐 v5.2: STABLE SIGNING + OTA RELEASE (update tanpa uninstall) ────
      # 1. Keystore release disimpan di repo (signing/dzr-release.jks):
      #    build pertama bikin + commit, build berikutnya pake yang sama →
      #    signature SEMUA build identik → Android mau install di atas app
      #    lama (update) TANPA uninstall.
      # 2. APK di zipalign + re-sign pakai apksigner (gak usah utak-atik
      #    gradle Flutter — anti-rusak lintas versi Flutter/AGP).
      # 3. APK hasil sign di-upload ke release `apk-<pkg>` asset `app.apk`
      #    (rolling) — kanal download buat OTA in-app update.
      # Semua best-effort NON-FATAL: gagal di sini gak buang hasil build.
      - name: Stable signing + OTA release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KS_PASS: dzr-stable-2026
        run: |
          APK=$(find . -name "*.apk" -path "*flutter-apk*" 2>/dev/null | head -1 || find . -name "*.apk" -path "*outputs/apk*" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "WARNING: APK gak ketemu buat re-sign (skip, non-fatal)"
            exit 0
          fi
          echo "APK target: $APK"

          REPO_API="https://api.github.com/repos/${GH_REPO}"
          AUTHH="Authorization: Bearer ${GH_TOKEN}"
          APPH="Accept: application/vnd.github+json"
          KS=/tmp/dzr-release.jks

          fetch_ks() {
            local HTTP
            HTTP=$(curl -sL -w "%{http_code}" -H "$AUTHH" -H "$APPH" \
              -o /tmp/ks_meta.json "${REPO_API}/contents/signing/dzr-release.jks?ref=main")
            if [ "$HTTP" = "200" ]; then
              python3 -c "import json,base64;open('/tmp/dzr-release.jks.fromrepo','wb').write(base64.b64decode(json.load(open('/tmp/ks_meta.json'))['content']))" 2>/dev/null \
                && mv /tmp/dzr-release.jks.fromrepo "$KS"
            fi
            echo "$HTTP"
          }

          KS_OK=false
          [ -s "$KS" ] || fetch_ks > /dev/null
          if [ -s "$KS" ] && keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias dzr >/dev/null 2>&1; then
            KS_OK=true
            echo "Keystore stabil: DIPAKE dari repo (signature sama kayak build kemarin)"
          fi
          if [ "$KS_OK" = false ]; then
            echo "Keystore belum ada / gak valid — generate BARU..."
            rm -f "$KS"
            keytool -genkeypair -v -keystore "$KS" -alias dzr -keyalg RSA -keysize 2048 \
              -validity 10950 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=DZR CloudBuilder, OU=Deruzuan, O=DZR, L=Jakarta, C=ID" >/dev/null 2>&1
            # Commit ke repo → build berikutnya pake keystore yang SAMA
            PAYLOAD=$(python3 -c "import base64,json;print(json.dumps({'message':'chore: stable signing keystore (auto-generate)','content':base64.b64encode(open('/tmp/dzr-release.jks','rb').read()).decode(),'branch':'main'}))")
            PUT_HTTP=$(curl -sL -o /tmp/ks_put.json -w "%{http_code}" -X PUT \
              -H "$AUTHH" -H "$APPH" -d "$PAYLOAD" "${REPO_API}/contents/signing/dzr-release.jks")
            if [ "$PUT_HTTP" != "200" ] && [ "$PUT_HTTP" != "201" ]; then
              echo "Commit keystore gagal (HTTP $PUT_HTTP) — race guard: pake yang di repo..."
              fetch_ks > /dev/null || true
            fi
          fi

          if [ -s "$KS" ] && ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* >/dev/null 2>&1; then
            BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)
            if [ -x "$BT/zipalign" ] && [ -x "$BT/apksigner" ]; then
              cp "$APK" /tmp/pre_sign.apk
              "$BT/zipalign" -f -p 4 /tmp/pre_sign.apk /tmp/aligned.apk
              "$BT/apksigner" sign --ks "$KS" --ks-key-alias dzr \
                --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
                --out "$APK" /tmp/aligned.apk
              "$BT/apksigner" verify "$APK" \
                && echo "✅ APK ke-sign keystore stabil — update tanpa uninstall AKTIF" \
                || echo "WARNING: verify gagal (non-fatal, APK tetep ke-upload)"
            else
              echo "WARNING: zipalign/apksigner gak ada di $BT (skip re-sign)"
            fi
          else
            echo "WARNING: keystore/build-tools gak siap (skip re-sign, non-fatal)"
          fi

          # ── Kanal OTA: release apk-<pkg> asset app.apk (rolling) ──
          PKG="$(echo "${INPUT_PACKAGE_NAME:-}" | sed 's/[^a-zA-Z0-9.]//g' | sed 's/^\.*//' | sed 's/\.*$//')"
          [ -z "$PKG" ] && PKG="com.deruzuan.webapp"
          cp "$APK" /tmp/app.apk
          if gh release view "apk-$PKG" >/dev/null 2>&1; then
            gh release upload "apk-$PKG" /tmp/app.apk --clobber \
              && echo "🔄 Kanal OTA updated: apk-$PKG → app.apk" \
              || echo "WARNING: gh upload gagal (non-fatal)"
          else
            gh release create "apk-$PKG" /tmp/app.apk \
              --title "OTA $PKG" --notes "Build terbaru — kanal auto-update" \
              && echo "🔄 Kanal OTA dibuat: apk-$PKG" \
              || echo "WARNING: gh create gagal (non-fatal)"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-output
          path: "**/build/app/outputs/flutter-apk/*.apk"
          retention-days: 7
          if-no-files-found: error

      # NOTE: "Send to Telegram" step DIHAPUS PERMANEN (fix APK dobel).
