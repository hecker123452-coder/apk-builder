name: Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'WebApp'
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.deruzuan.webapp'
      icon_url:
        description: 'Icon URL'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      INPUT_WEB_URL: ${{ inputs.web_url }}
      INPUT_APP_NAME: ${{ inputs.app_name }}
      INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
      INPUT_ICON_URL: ${{ inputs.icon_url }}
      INPUT_CHAT_ID: ${{ inputs.chat_id }}
      INPUT_BOT_TOKEN: ${{ inputs.bot_token }}

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle + Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
            .dart_tool
          key: w2a-${{ hashFiles('**/gradle-wrapper.properties', '**/pubspec.yaml') }}
          restore-keys: |
            w2a-

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Create Project + WebView + Icon + Build
        run: |
          SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
          SAFE_PKG=$(echo "$INPUT_PACKAGE_NAME" | sed 's/[^a-zA-Z0-9.]//g' | sed 's/^\.*//' | sed 's/\.*$//')
          [ -z "$SAFE_PKG" ] && SAFE_PKG="com.deruzuan.webapp"
          [ -z "$SAFE_APP_NAME" ] && SAFE_APP_NAME="WebApp"

          PROJ_NAME=$(echo "$SAFE_PKG" | rev | cut -d. -f1 | rev | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_]//g')
          [ -z "$PROJ_NAME" ] && PROJ_NAME="webapp"

          echo "App: $SAFE_APP_NAME | Pkg: $SAFE_PKG | Proj: $PROJ_NAME | URL: $INPUT_WEB_URL"

          flutter create --project-name "$PROJ_NAME" --org "$(echo "$SAFE_PKG" | rev | cut -d. -f2- | rev)" "$PROJ_NAME"
          cd "$PROJ_NAME"
          flutter pub add webview_flutter

          cat > lib/main.dart << 'DART_EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            runApp(const WebViewApp());
          }

          class WebViewApp extends StatelessWidget {
            const WebViewApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorSchemeSeed: Colors.blue,
                  useMaterial3: true,
                ),
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController controller;
            bool isLoading = true;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0x00000000))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (_) => setState(() => isLoading = true),
                    onPageFinished: (_) => setState(() => isLoading = false),
                  ),
                )
                ..loadRequest(Uri.parse('WEBURL_PLACEHOLDER'));
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, _) async {
                  if (didPop) return;
                  if (await controller.canGoBack()) {
                    controller.goBack();
                  }
                },
                child: Scaffold(
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: controller),
                        if (isLoading)
                          const Center(child: CircularProgressIndicator()),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART_EOF

          sed -i "s|WEBURL_PLACEHOLDER|$(echo "$INPUT_WEB_URL" | sed 's/[&/\]/\\&/g')|g" lib/main.dart

          # Patch Android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"$SAFE_APP_NAME\"|g" "$MANIFEST"
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application|' "$MANIFEST"
            fi
            if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's|android:allowBackup="[^"]*"|android:allowBackup="false"\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
            fi
          fi

          # ── Icon processing with ImageMagick + PNG validation ──
          ICON_APPLIED=false
          if [ -n "$INPUT_ICON_URL" ]; then
            echo "Nge-download icon dari: $INPUT_ICON_URL"
            HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/app_icon_raw --retry 3 --retry-delay 2 --max-time 15 "$INPUT_ICON_URL")
            if [ "$HTTP_CODE" -eq 200 ] && [ -s /tmp/app_icon_raw ]; then
              # Check file is actually an image via magic bytes
              FILE_MAGIC=$(xxd -l 8 -p /tmp/app_icon_raw 2>/dev/null || echo "")
              FILE_TYPE=$(file -b /tmp/app_icon_raw 2>/dev/null || echo "unknown")
              echo "Magic: $FILE_MAGIC | Type: $FILE_TYPE"

              IS_IMAGE=false
              # PNG: 89504e47
              if echo "$FILE_MAGIC" | grep -qi "^89504e47"; then IS_IMAGE=true; fi
              # JPEG: ffd8ff
              if echo "$FILE_MAGIC" | grep -qi "^ffd8ff"; then IS_IMAGE=true; fi
              # GIF: 47494638
              if echo "$FILE_MAGIC" | grep -qi "^47494638"; then IS_IMAGE=true; fi
              # WebP: 52494646...57454250
              if echo "$FILE_MAGIC" | grep -qi "^52494646"; then IS_IMAGE=true; fi
              # BMP: 424d
              if echo "$FILE_MAGIC" | grep -qi "^424d"; then IS_IMAGE=true; fi
              # SVG (text-based, check file type)
              if echo "$FILE_TYPE" | grep -qi "svg"; then IS_IMAGE=true; fi

              if [ "$IS_IMAGE" = true ]; then
                echo "File valid sebagai image, konversi ke PNG..."
                # Convert to proper PNG with ImageMagick
                # -strip removes metadata, -resize fits, -define png:compression-level=9 optimizes
                if convert /tmp/app_icon_raw -strip -resize 512x512 -gravity center -extent 512x512 -define png:compression-level=9 -define png:compression-filter=5 /tmp/app_icon_valid.png 2>/dev/null; then
                  # Double-check: verify the converted PNG magic bytes
                  PNG_MAGIC=$(xxd -l 4 -p /tmp/app_icon_valid.png 2>/dev/null || echo "")
                  if [ "$PNG_MAGIC" = "89504e47" ]; then
                    echo "PNG valid! Applying ke mipmap directories..."
                    # Android mipmap sizes: mdpi=48, hdpi=72, xhdpi=96, xxhdpi=144, xxxhdpi=192
                    for dir in android/app/src/main/res/mipmap-*; do
                      if [ -d "$dir" ]; then
                        dirname=$(basename "$dir")
                        case "$dirname" in
                          mipmap-mdpi)    SIZE=48  ;;
                          mipmap-hdpi)    SIZE=72  ;;
                          mipmap-xhdpi)   SIZE=96  ;;
                          mipmap-xxhdpi)  SIZE=144 ;;
                          mipmap-xxxhdpi) SIZE=192 ;;
                          *)              SIZE=96  ;;
                        esac
                        convert /tmp/app_icon_valid.png -resize ${SIZE}x${SIZE} -define png:compression-level=9 "$dir/ic_launcher.png" 2>/dev/null && \
                        echo "  $dirname -> ${SIZE}x${SIZE} OK" || echo "  $dirname -> GAGAL, pake default"
                      fi
                    done
                    ICON_APPLIED=true
                    echo "Icon berhasil di-apply!"
                  else
                    echo "Konversi PNG gagal (magic byte gak valid), pake icon default Flutter"
                  fi
                else
                  echo "ImageMagick convert gagal, pake icon default Flutter"
                fi
              else
                echo "File bukan image valid (magic: $FILE_MAGIC), pake icon default Flutter"
              fi
            else
              echo "Download gagal (HTTP $HTTP_CODE atau file kosong), pake icon default Flutter"
            fi
          else
            echo "Gak ada icon URL, pake icon default Flutter"
          fi

          # Build
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.txt

          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1 || find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "=== BUILD FAILED ==="
            tail -30 build_output.txt
            exit 1
          fi
          echo "APK: $APK_PATH ($(du -sh "$APK_PATH" | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-output
          path: "**/build/app/outputs/flutter-apk/*.apk"
          retention-days: 7
          if-no-files-found: error

      - name: Send to Telegram
        if: inputs.chat_id != '' && inputs.bot_token != ''
        run: |
          SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
          APK=$(find . -path "*/flutter-apk/*.apk" 2>/dev/null | head -1 || find . -path "*/apk/*.apk" -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            CAPTION=$(printf '✅ Web2APK Udah Jadi!\n%s | %s | %s' "$SAFE_APP_NAME" "$INPUT_WEB_URL" "$SIZE")
            curl -s -X POST "https://api.telegram.org/bot${INPUT_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${INPUT_CHAT_ID}" -F "document=@$APK" --form-string "caption=$CAPTION"
          fi

      - name: Notify Failure
        if: failure()
        run: |
          ERROR_SUMMARY="Web2APK gagal"
          if [ -f build_output.txt ]; then
            ERROR_SUMMARY=$(grep -i "error\|failed\|exception" build_output.txt 2>/dev/null | head -5 | tr '\n' ' ')
          fi
          [ -z "$ERROR_SUMMARY" ] && ERROR_SUMMARY="Web2APK gagal di awal."
          ERROR_SUMMARY=$(echo "$ERROR_SUMMARY" | cut -c1-500)
          if [ -n "$INPUT_CHAT_ID" ] && [ -n "$INPUT_BOT_TOKEN" ]; then
            SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
            MSG=$(printf '❌ Web2APK Gagal\n%s | %s\n%s' "$SAFE_APP_NAME" "$INPUT_WEB_URL" "$ERROR_SUMMARY")
            curl -s -X POST "https://api.telegram.org/bot${INPUT_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${INPUT_CHAT_ID}" --data-urlencode "text=$MSG"
          fi
