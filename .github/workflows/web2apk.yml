                      out = FileOutputStream(File(outPath))
                      var newPos = 0L
                      var oldPos = 0L
                      val hdr = ByteArray(24)
                      val bufD = ByteArray(65536)
                      val bufO = ByteArray(65536)
                      while (true) {
                          if (!readFully(ctrl, hdr, 24)) break
                          val add = beLong(hdr, 0)
                          val copy = beLong(hdr, 8)
                          val seek = beLong(hdr, 16)
                          if (add < 0 || copy < 0) return "error:bad_ctrl"
                          if (oldPos + add + copy > old.length()) return "error:old_too_short"
                          var rem = add
                          while (rem > 0L) {
                              val n = if (rem > 65536L) 65536 else rem.toInt()
                              if (!readFully(diff, bufD, n)) return "error:patch_truncated"
                              old.seek(oldPos)
                              old.readFully(bufO, 0, n)
                              for (i in 0 until n) bufO[i] = (bufO[i] + bufD[i]).toByte()
                              out.write(bufO, 0, n)
                              oldPos += n
                              newPos += n
                              rem -= n
                          }
                          rem = copy
                          while (rem > 0L) {
                              val n = if (rem > 65536L) 65536 else rem.toInt()
                              if (!readFully(extra, bufD, n)) return "error:patch_truncated"
                              out.write(bufD, 0, n)
                              newPos += n
                              rem -= n
                          }
                          oldPos += seek
                      }
                      out.flush()
                      old.close(); old = null
                      out.close(); out = null
                      ctrl.close(); diff.close(); extra.close()
                      val outLen = File(outPath).length()
                      if (newSize <= 0L) return "error:bad_newsize"
                      return if (outLen == newSize) "ok" else "error:size_mismatch"
                  } catch (e: Exception) {
                      return "error:" + (e.message ?: "unknown")
                  } finally {
                      try { old?.close() } catch (e: Exception) {}
                      try { out?.close() } catch (e: Exception) {}
                  }
              }

              private fun readFully(inp: InputStream, buf: ByteArray, len: Int): Boolean {
                  var off = 0
                  while (off < len) {
                      val n = inp.read(buf, off, len - off)
                      if (n < 0) return false
                      off += n
                  }
                  return true
              }

              /// Decode 8 byte BIG-endian → signed Long (bit pattern two's
              /// complement — persis format triple kontrol bsdiff).
              private fun beLong(b: ByteArray, o: Int): Long {
                  var v = 0L
                  for (i in 0 until 8) v = (v shl 8) or (b[o + i].toLong() and 0xFF)
                  return v
              }

              // ─── 🔔 v5.6: NOTIFIKASI SISTEM (progress + "update selesai") ───
              private fun notifChannels() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      if (nm.getNotificationChannel("dzr_update") == null) {
                          val ch = NotificationChannel(
                              "dzr_update", "Pembaruan Aplikasi",
                              NotificationManager.IMPORTANCE_LOW
                          )
                          ch.setShowBadge(false)
                          nm.createNotificationChannel(ch)
                      }
                      if (nm.getNotificationChannel("dzr_update_done") == null) {
                          nm.createNotificationChannel(
                              NotificationChannel(
                                  "dzr_update_done", "Pembaruan Selesai",
                                  NotificationManager.IMPORTANCE_DEFAULT
                              )
                          )
                      }
                  }
              }

              private fun canShowNotif(): Boolean =
                  Build.VERSION.SDK_INT < 33 ||
                      checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) ==
                          PackageManager.PERMISSION_GRANTED

              /// Minta izin notifikasi (Android 13+) — fire & forget dari Dart.
              private fun ensureNotifPerm(): Boolean {
                  return try {
                      if (Build.VERSION.SDK_INT >= 33 && !canShowNotif()) {
                          requestPermissions(
                              arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 9001
                          )
                      }
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              /// Notif progress download/patch (ongoing + silent). pct < 0 = spinner.
              private fun notifProgress(pct: Int, text: String): Boolean {
                  return try {
                      notifChannels()
                      if (!canShowNotif()) return false
                      val b = NotificationCompat.Builder(this, "dzr_update")
                          .setSmallIcon(android.R.drawable.stat_sys_download)
                          .setContentTitle("Lagi update aplikasi...")
                          .setContentText(text)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setProgress(100, if (pct < 0) 0 else pct, pct < 0)
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                          .notify(4201, b.build())
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              /// Notif "selesai diunduh — ketuk buat install" (ala Play Store).
              private fun notifDone(title: String, text: String, path: String): Boolean {
                  return try {
                      notifChannels()
                      if (!canShowNotif()) return false
                      val b = NotificationCompat.Builder(this, "dzr_update")
                          .setSmallIcon(android.R.drawable.stat_sys_download_done)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setAutoCancel(true)
                      if (path.isNotEmpty() && File(path).exists()) {
                          b.setContentIntent(PendingIntent.getActivity(
                              this, 4203, installIntent(File(path)),
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      }
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                          .notify(4202, b.build())
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun notifDismiss(): Boolean {
                  return try {
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).cancel(4201)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          }
