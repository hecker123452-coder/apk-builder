name: Web2APK

# ============================================================================
# DZR CloudBuilder — Web2APK Workflow v5.8 (👻 GAYA SPLASH SCREEN —
#                            CLEAN / DARK / GRADIENT / PULSE)
# ============================================================================
# FITUR LOG v5.8 (request owner: "splash screen nya ada banyak biar user
#                 bisa pilih tapi buat web view aja sama html"):
#   1. INPUT splash_style     : clean | dark | gradient | pulse (default clean).
#     Khusus workflow Web2APK ini (URL + HTML mode) — jalur Flutter/Kotlin
#     native GAK KENA, tetap pola lama.
#   2. SPLASH 4 GAYA          : clean (putih/tema + logo + spinner — pola lama),
#     dark (gelap pekat), gradient (ungu-biru), pulse (logo berdenyut animasi).
#     Bot: tombol 👻 Splash di menu opsi sekarang CYCLE 5 state
#     (Klasik → Gelap → Gradient → Pulse → Mati) + preferensi tersimpan.
#
# FITUR LOG v5.7 (request owner: "saat update apk jangan dikasih link apk
#                 sama donlot nya ... kalo selesai tulisan berhasil
#                 mengupdate aja ... dari v7 ganti ke v3 aja semua"):
#   1. SCHEMA VERSI 3.0       : versionName app & APK ber-versi naik ke
#      3.0.N (dulu 1.0.N). versionCode TETAP = run number (rantai update
#      aman — Android cek versionCode, bukan versionName). Rollback URL
#      bot jadi DINAMIS (nemuin asset app-*.apk by code, kompatibel 1.0.N lama).
#   (bot side v3.0: rebuild APK sama = cukup pesan "Berhasil Mengupdate"
#   tanpa file/link/QR di chat — OTA yang ngurus. Build baru tetep dikasih.)
#
# FITUR LOG v5.6 (request owner: "pas mau di update cuma nambah 4mb atau kb
#                 jangan kayak di suruh ulang dari 44 lagi kelamaan biar
#                 kayak di PlayStore ... nanti muncul notif perbarui nya
#                 udah selesai" — sinkron dgn bot v7.1):
#   1. DELTA PATCH (bsdiff)   : build baru bandingin APK lama (versi terakhir
#      yang ke-install user) vs APK baru → patch KECIL (biasanya 10-30%
#      ukuran penuh; bagian Flutter engine/lib yang sama = copy murah).
#      Patch di-upload sebagai asset delta-<old>-<new>.patch + info masuk
#      build-info.json (delta:{base,url,sha256,size}) → manifest. App yang
#      versionCode-nya PAS dgn base → cukup unduh patch → dipasang
#      on-device (bspatch streaming di Kotlin) → APK baru UTUH, byte-identik
#      dgn APK resmi (bsdiff lossless) → hash cocok → install. Gak cocok /
#      gagal di step mana pun = fallback OTOMATIS unduh penuh (aman selalu).
#   2. FORMAT DZRDELTA        : output bsdiff dibingkai ulang (magic DZRDELTA
#      + 3 blok bzip2 berbatas pasti + newSize) biar app bisa decode
#      streaming hemat memori (commons-compress 1.21, dependency murni).
#   3. NOTIF SISTEM           : download = notifikasi progress (persen+MB,
#      tetep keliatan walau app di-background) → selesai unduh = notif
#      "Pembaruan siap — ketuk buat install" → install sukses = notif
#      "Update selesai" (receiver MY_PACKAGE_REPLACED, ketuk = buka app).
#      Izin POST_NOTIFICATIONS diminta otomatis (Android 13+).
#   4. CLEANUP DELTA LAMA     : asset delta-*.patch versi lama dibuang
#      otomatis (cuma jaga patch transisi terbaru) — release gak bengkak.
#   Fitur v5.5 tetep: build-info.json, SHA-256 manifest, APK ber-versi
#   (riwayat/rollback), force update, auto-update.
#
# FITUR LOG v5.5 (request owner: "1 2 3 4 5 boleh deh gas semua" — 5 fitur
#                 update sekaligus, sinkron dgn bot v7.0):
#   1. BUILD-INFO.JSON        : workflow nulis {versionCode, versionName,
#      sha256, builtAt} sebagai asset release `apk-<pkg>` → bot (v7.0) tarik
#      file ini buat manifest v2 + monitor auto-heal. Kecil (200 byte),
#      hemat — bot GAK perlu download APK utuh cuma buat baca hash.
#   2. SHA-256 DI MANIFEST    : hash APK signed masuk manifest
#      updates/<pkg>.json → app verifikasi file download SEBELUM install.
#      Hash gak cocok = otomatis download ulang 1x, masih gagal = error jelas
#      (bukan "App not installed" misterius). Manifest tanpa sha256 (workflow
#      lama) = app skip verifikasi → backward compatible.
#   3. APK BER-VERSI          : build sukses nyimpen app-1.0.N.apk di release
#      (selain app.apk rolling) → riwayat versi + rollback dari bot. Retensi
#      3 terakhir (bot v7.0 yang buang sisanya).
#   4. FORCE + AUTO-UPDATE    : manifest field baru minVersionCode (dialog
#      update tanpa tombol [Nanti]) & auto (langsung download tanpa dialog).
#      Diatur dari bot (⚙️ Kelola APK), app baca otomatis.
#   Fitur v5.3 tetep: dialog update langsung, auto-resume install, retry awal,
#   anti APK corrupt (magic byte), progress persen+MB, keystore stabil.
#
# FIX LOG v5.3 (request owner: "pas user pakek trus ada yang versi terbaru
#                langsung di suruh update trus nanti update selesai jangan
#                pakek tutor update gak berfungsi gak kayak di apk2 lain"):
#   1. DIALOG UPDATE LANGSUNG  : dulu cuma banner tipis (gampang kelewat).
#      Sekarang pas app dibuka & ada versi baru → DIALOG besar muncul otomatis:
#      "Update Tersedia v1.0.N" + tombol [Update Sekarang] / [Nanti]. User
#      LANGSUNG disuruh update, gak perlu tau-tau apa-apa.
#   2. AUTO-RESUME INSTALL     : dulu setelah izin "install aplikasi tak
#      dikenal" dikasih, user HARUS pencet banner lagi (rasanya kayak
#      "update gak berfungsi"). Sekarang: begitu user balik ke app setelah
#      kasih izin, install LANGSUNG dilanjutin otomatis
#      (WidgetsBindingObserver) → nol langkah ekstra, nol tutorial.
#   3. RE-CHECK ON RESUME      : update dicek ulang tiap app dibuka lagi
#      (throttle 15 menit) + retry awal 20s/45s kalo cek pertama gagal
#      (HP baru nyala, WiFi belum konek) → update gak "kaget ilang".
#   4. ANTI APK CORRUPT        : download divalidasi — content-type harus
#      application/vnd.android.package-archive (tolak halaman HTML error) +
#      cek magic byte "PK" (zip) → installer gak pernah dibukain file rusak
#      ("App not installed" misterius hilang).
#   5. PROGRESS LEBIH JELAS    : banner nampilin persen + MB ter-download,
#      dialog & banner nunjukin nama versi (versionName dari manifest).
#   Fitur v5.2 tetep: keystore stabil (update tanpa uninstall), versionCode =
#   run number, manifest updates/<pkg>.json, kanal release apk-<pkg>.
#
# FIX LOG v5.2 (request owner: "apk yang di build bisa di update dan gak
#                harus uninstall ... bener2 bagus melebihi semua nya"):
#   1. KEYSTORE STABIL    : dulu build pake debug keystore yang BEDA tiap
#      runner → signature beda tiap build → Android PAKSA uninstall dulu
#      sebelum install APK baru. Sekarang: keystore release disimpan di
#      repo (signing/dzr-release.jks) — build pertama bikin + commit,
#      build berikutnya pake yang sama → signature SELALU identik.
#      APK di-re-sign pakai apksigner (zipalign dulu) setelah build.
#   2. VERSIONCODE NAIK   : --build-number=$GITHUB_RUN_NUMBER → versionCode
#      = run number (naik terus tiap build). Dulu selalu 1 → Android anggap
#      "sama aja"/downgrade. Sekarang update-over-install jalan mulus.
#   3. OTA IN-APP UPDATE  : app hasil build nge-fetch updates/<pkg>.json
#      (raw repo) pas start + tiap 6 jam. Kalo versionCode repo > punya
#      app → banner hijau "Update tersedia" → ketuk → download + install
#      langsung dari dalam app (REQUEST_INSTALL_PACKAGES + FileProvider +
#      MethodChannel installApk di MainActivity). GAK PERLU UNINSTALL.
#      Kanal APK-nya: release `apk-<pkg>` asset `app.apk` (di-upload
#      workflow ini tiap build, rolling/overwrite).
#   4. SISANYA SAMA       : pengumuman global (v5.1), situs offline ZIP +
#      multi-tab (v5.0), splash/dark/small_apk (v4.6-4.8), engine
#      flutter_inappwebview 6.1.5 + Flutter 3.47.2 + AGP9 safety net.
#
# FIX LOG v5.1 (request owner: "malas 2 nya lu gantiin aja" — OTA ditukar):
#   1. OTA IN-APP UPDATE DICABUT  : input update_url & version_code dihapus,
#      Dart _checkUpdate + banner update + manifest per-app (updates/<pkg>.json)
#      + release ota-<pkg> gak dipake lagi. Penggantinya di sisi BOT: tiap
#      build sukses, APK di-upload ke release `apk-<pkg>` (rolling) → bot
#      kirim 🔗 link download permanen + QR code (scan = download).
#   2. PENGUMUMAN GLOBAL (BARU)   : app ngefetch `announcements/global.json`
#      dari repo raw pas start + tiap 8 jam. Owner kirim `/pengumuman <teks>`
#      di bot → SEMUA app nampilin banner oranye (bisa dikasih link, bisa
#      ditutup, matiin pake `/pengumumanoff`). Tanpa FCM, tanpa Firebase.
#   Fitur v5.0 tetep: situs offline ZIP, multi-tab + bottom nav, splash
#   custom, tema gelap, APK hemat arm64. Fitur v4.5–v4.8 tetep:
#   flutter_inappwebview 6.1.5, pin Flutter 3.47.2 + AGP9 proguard safety net.
#
# FIX LOG v5.0:
#   1. SITUS OFFLINE (ZIP) : input html_zip_url (direct download URL release
#      ZIP situs statis: index.html+css+js+gambar, max ~25MB) → di-download &
#      di-unzip ke assets/webapp → APK jalan OFFLINE penuh via localhost server.
#   2. MULTI-TAB           : input tabs_json (JSON array [{label,url}], max 3)
#      → app dapat bottom navigation bar, swap URL antar tab.
#
# FIX LOG v4.6:
#   1. OPSI BUILD DI BOT  : sebelum build, user bisa atur:
#      - 🌙 Tema Gelap     (dark_mode) : splash/loading/error ikut gelap
#      - 👻 Splash on/off  (splash)    : matiin splash screen kalo gak mau
#      - 📦 APK Hemat      (small_apk) : build arm64-only, APK ~40% lebih kecil
#   2. SPLASH CUSTOM      : logo/icon user ditampilin di splash screen
#      (icon di-convert ke assets/splash_logo.png + didaftarin ke pubspec).
#      Gak ada icon = fallback spinner + nama app.
#   3. PULL-TO-REFRESH    : tarik ke bawah di app buat reload halaman.
#   4. SKIP ICON          : tombol skip di bot — build tanpa kirim icon
#      (pake icon default Flutter).
#   Semua fitur v4.5 tetep: flutter_inappwebview anti-layar-putih + backend
#   support (mixed content allow, hybrid composition, DOM storage, upload,
#   link eksternal, download, timeout anti-muter, back bener, HTML via
#   InAppLocalhostServer).
#
# FIX LOG v4.5:
#   Ganti engine WebView ke flutter_inappwebview 6.1.5 (di-pin) + url_launcher
#   6.3.2 — fix layar putih & support backend. Validasi flutter analyze 3.47.2.
# FIX LOG v4.4:
#   Icon crop tengah 1:1 + auto-orient.
# FIX LOG v4.3:
#   Anti dobel (step Telegram dihapus), template anti-muter, heredoc kolom 0.
#
# Cara custom: token placeholder __NAMA_TOKEN__ di-replace otomatis pas build.
# Mode: URL mode (web_url) / HTML mode (html_content → assets/webapp/).
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website (kosongin kalo mau pake HTML file)'
        required: false
        default: ''
      html_content:
        description: 'Isi HTML (base64 atau plain text). Diutamain base64 biar gak ganggu YAML.'
        required: false
        default: ''
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'WebApp'
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.deruzuan.webapp'
      icon_url:
        description: 'Icon URL (direct download URL asset, bukan halaman release!)'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID (UNUSED — bot yang handle kirim APK)'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token (UNUSED — sengaja gak dipake lagi anti dobel)'
        required: false
        default: ''
      splash:
        description: 'Splash screen (true/false)'
        required: false
        default: 'true'
      splash_style:
        description: 'v5.8 Gaya splash: clean|dark|gradient|pulse|off (khusus Web2APK)'
        required: false
        default: 'clean'
      dark_mode:
        description: 'Tema gelap splash/loading/error (true/false)'
        required: false
        default: 'false'
      small_apk:
        description: 'APK hemat arm64-only (~40% lebih kecil) (true/false)'
        required: false
        default: 'false'
      html_zip_url:
        description: 'v5.0 Direct download URL ZIP situs statis (index.html di root)'
        required: false
        default: ''
      tabs_json:
        description: 'v5.0 JSON array [{label,url}] max 3 — bottom navigation'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      INPUT_WEB_URL: ${{ inputs.web_url }}
      INPUT_HTML_CONTENT: ${{ inputs.html_content }}
      INPUT_APP_NAME: ${{ inputs.app_name }}
      INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
      INPUT_ICON_URL: ${{ inputs.icon_url }}
      INPUT_SPLASH: ${{ inputs.splash }}
      INPUT_SPLASH_STYLE: ${{ inputs.splash_style }}
      INPUT_DARK_MODE: ${{ inputs.dark_mode }}
      INPUT_SMALL_APK: ${{ inputs.small_apk }}
      INPUT_HTML_ZIP_URL: ${{ inputs.html_zip_url }}
      INPUT_TABS_JSON: ${{ inputs.tabs_json }}
      # ── v5.1: slug "owner/repo" buat URL pengumuman global (tanpa input bot) ──
      GITHUB_SLUG: ${{ github.repository }}

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # ── ⚠️ v4.8: WAJIB PIN VERSI! ──
          # Dulu `channel: stable` doang → Flutter stable baru rilis bawa AGP 9
          # → plugin lama (flutter_inappwebview_android) kena hard-error
          # "proguard-android.txt is no longer supported" → build gagal massal.
          # 3.47.2 = versi yang template-nya lolos flutter analyze 0 issue.
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      # ── ⚡ v6.2: ROLLING CACHE — fix cache beku (sama kayak build.yml) ──
      # Dulu key = hashFiles(**/gradle-wrapper.properties, **/pubspec.yaml)
      # jalan SEBELUM project siap → hash kosong → key konstan "w2a-" →
      # exact-match terus → cache GAK PERNAH ke-update. Sekarang rolling
      # per run_id + restore prefix: tiap run restore cache terbaru.
      - name: Cache Gradle + Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
            .dart_tool
          key: w2a-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            w2a-v2-${{ runner.os }}-

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      # ─── DECODE HTML CONTENT (kalo ada) ───────────────────────────────────
      # Token: INPUT_HTML_CONTENT bisa base64 atau plain text.
      # Hasil decode disimpen ke /tmp/w2a/index.html buat di-paste ke assets.
      - name: Decode HTML content
        run: |
          mkdir -p /tmp/w2a
          if [ -n "$INPUT_HTML_CONTENT" ]; then
            echo "HTML content detected, decoding..."
            # ── Strategi decode yang robust ──
            # 1. Coba decode base64. Kalo sukses DAN hasilnya valid HTML → pake.
            # 2. Kalo input asli langsung keliatan kayak HTML (ada '<') → pake.
            # 3. Kalo decode sukses tapi gak ada '<' tetep pake hasil decode.
            # 4. Fallback terakhir: simpen input apa adanya.
            DECODED_OK=false
            DECODED=""
            if DECODED=$(printf '%s' "$INPUT_HTML_CONTENT" | base64 -d 2>/dev/null); then
              if printf '%s' "$DECODED" | grep -q '<'; then
                printf '%s' "$DECODED" > /tmp/w2a/index.html
                DECODED_OK=true
                echo "Decoded as base64"
              fi
            fi
            if [ "$DECODED_OK" = false ]; then
              if printf '%s' "$INPUT_HTML_CONTENT" | grep -q '<'; then
                printf '%s' "$INPUT_HTML_CONTENT" > /tmp/w2a/index.html
                echo "Saved as plain text"
              elif [ -n "$DECODED" ]; then
                printf '%s' "$DECODED" > /tmp/w2a/index.html
                echo "Decoded as base64 (no '<' tag, using decoded anyway)"
              else
                printf '%s' "$INPUT_HTML_CONTENT" > /tmp/w2a/index.html
                echo "Saved as plain text (fallback)"
              fi
            fi
            # Validasi minimal: file gak kosong
            if [ ! -s /tmp/w2a/index.html ]; then
              echo "ERROR: HTML content kosong setelah decode!"
              exit 1
            fi
            SIZE=$(wc -c < /tmp/w2a/index.html)
            echo "HTML size: $SIZE bytes"
            echo "W2A_MODE=html" >> $GITHUB_ENV
          elif [ -n "$INPUT_HTML_ZIP_URL" ]; then
            # ── 📦 v5.0: SITUS OFFLINE (ZIP statis dari release) ──
            echo "Offline site ZIP detected, downloading..."
            HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/w2a/site.zip --retry 3 --retry-delay 2 --max-time 120 "$INPUT_HTML_ZIP_URL")
            if [ "$HTTP_CODE" != "200" ] || [ ! -s /tmp/w2a/site.zip ]; then
              echo "ERROR: gagal download ZIP situs (HTTP $HTTP_CODE)!"
              exit 1
            fi
            rm -rf /tmp/w2a/site && mkdir -p /tmp/w2a/site
            if ! unzip -q /tmp/w2a/site.zip -d /tmp/w2a/site; then
              echo "ERROR: file bukan ZIP valid!"
              exit 1
            fi
            # index.html wajib ada di root; kalo di dalam folder (zip dari
            # "Extract All" Windows/macOS), angkat isinya ke root.
            if [ ! -f /tmp/w2a/site/index.html ]; then
              SUB=$(find /tmp/w2a/site -maxdepth 2 -name index.html | head -1)
              if [ -z "$SUB" ]; then
                echo "ERROR: index.html gak ketemu di ZIP!"
                exit 1
              fi
              SUBDIR=$(dirname "$SUB")
              if [ "$SUBDIR" != "/tmp/w2a/site" ]; then
                echo "index.html ketemu di $SUBDIR — diangkat ke root"
                mv "$SUBDIR"/* /tmp/w2a/site/ 2>/dev/null || true
              fi
            fi
            if [ ! -f /tmp/w2a/site/index.html ]; then
              echo "ERROR: index.html gak ketemu di ZIP!"
              exit 1
            fi
            echo "Site files: $(find /tmp/w2a/site -type f | wc -l)"
            echo "W2A_MODE=html" >> $GITHUB_ENV
            echo "W2A_HTML_ZIP=true" >> $GITHUB_ENV
          else
            if [ -z "$INPUT_WEB_URL" ]; then
              echo "ERROR: harus isi web_url ATAU html_content!"
              exit 1
            fi
            echo "W2A_MODE=url" >> $GITHUB_ENV
          fi

      # ─── CREATE PROJECT + WEBVIEW + APPLY TOKENS + BUILD ──────────────────
      - name: Create Project + WebView + Icon + Build
        run: |
          # ── Sanitize inputs ──
          SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
          SAFE_PKG=$(echo "$INPUT_PACKAGE_NAME" | sed 's/[^a-zA-Z0-9.]//g' | sed 's/^\.*//' | sed 's/\.*$//')
          [ -z "$SAFE_PKG" ] && SAFE_PKG="com.deruzuan.webapp"
          [ -z "$SAFE_APP_NAME" ] && SAFE_APP_NAME="WebApp"

          PROJ_NAME=$(echo "$SAFE_PKG" | rev | cut -d. -f1 | rev | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_]//g')
          [ -z "$PROJ_NAME" ] && PROJ_NAME="webapp"

          echo "App: $SAFE_APP_NAME | Pkg: $SAFE_PKG | Proj: $PROJ_NAME | Mode: $W2A_MODE"

          flutter create --project-name "$PROJ_NAME" --org "$(echo "$SAFE_PKG" | rev | cut -d. -f2- | rev)" "$PROJ_NAME"
          cd "$PROJ_NAME"
          # Versi di-PIN persis biar build CI deterministik (udah divalidasi
          # pake flutter analyze 3.47.2 — 0 issue).
          # ── v5.2: + package_info_plus (baca versionCode sendiri) &
          #    path_provider (folder cache buat download APK update) ──
          # ^8 / ^2.1 = pin MAJOR doang (solver pilih minor yg kompatibel) —
          # API-nya stabil lintas minor: PackageInfo.fromPlatform &
          # getTemporaryDirectory gak pernah berubah.
          flutter pub add flutter_inappwebview:6.1.5 url_launcher:6.3.2 'package_info_plus:^8.0.0' 'path_provider:^2.1.0' 'crypto:^3.0.3'

          # ── HTML mode: siapin assets + daftarin ke pubspec ──
          # v5.0: ZIP situs offline = copy SELURUH isi site (css/js/img),
          #       HTML single = copy 1 file doang.
          if [ "$W2A_MODE" = "html" ]; then
            mkdir -p assets/webapp
            if [ "${W2A_HTML_ZIP:-false}" = "true" ]; then
              cp -r /tmp/w2a/site/. assets/webapp/
              echo "Offline site: $(find assets/webapp -type f | wc -l) files di-bundle ke APK"
            else
              cp /tmp/w2a/index.html assets/webapp/index.html
            fi
          fi

          # ── Icon processing ──
          # icon_url HARUS direct download URL (browser_download_url asset GitHub),
          # BUKAN URL halaman release. Bot (server.js publishRelease) udah difix
          # buat balikin direct URL — magic byte check di bawah tetap jaga-jaga.
          # v4.4: foto non-1:1 di-CROP TENGAH (bukan dijepit/letterbox) + auto-orient.
          ICON_APPLIED=false
          if [ -n "$INPUT_ICON_URL" ]; then
            echo "Nge-download icon dari: $INPUT_ICON_URL"
            HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/app_icon_raw --retry 3 --retry-delay 2 --max-time 15 "$INPUT_ICON_URL")
            if [ "$HTTP_CODE" -eq 200 ] && [ -s /tmp/app_icon_raw ]; then
              FILE_MAGIC=$(xxd -l 8 -p /tmp/app_icon_raw 2>/dev/null || echo "")
              FILE_TYPE=$(file -b /tmp/app_icon_raw 2>/dev/null || echo "unknown")
              echo "Magic: $FILE_MAGIC | Type: $FILE_TYPE"

              IS_IMAGE=false
              if echo "$FILE_MAGIC" | grep -qi "^89504e47"; then IS_IMAGE=true; fi   # PNG
              if echo "$FILE_MAGIC" | grep -qi "^ffd8ff"; then IS_IMAGE=true; fi    # JPEG
              if echo "$FILE_MAGIC" | grep -qi "^47494638"; then IS_IMAGE=true; fi # GIF
              if echo "$FILE_MAGIC" | grep -qi "^52494646"; then IS_IMAGE=true; fi  # WebP
              if echo "$FILE_MAGIC" | grep -qi "^424d"; then IS_IMAGE=true; fi      # BMP
              if echo "$FILE_TYPE"  | grep -qi "svg"; then IS_IMAGE=true; fi        # SVG

              if [ "$IS_IMAGE" = true ]; then
                echo "File valid sebagai image. Crop tengah 1:1 (fix icon jepit v4.4)..."
                # ── FIX ICON JEPIT (v4.4) ──
                # Dulu: convert -resize 512x512 -extent 512x512 → foto non-kotak
                # (mis. screenshot 572x1280) jadi thumbnail mini dgn pita kosong —
                # di launcher keliatan kayak "icon gak ke bikin".
                # Sekarang: auto-orient ( hormatin EXIF rotasi HP ) → hitung crop
                # kotak persis di TENGAH → resize 512x512. Icon bener-bener kotak.
                RAW_W=$(identify -format "%w" /tmp/app_icon_raw 2>/dev/null | head -1 | tr -dc '0-9')
                RAW_H=$(identify -format "%h" /tmp/app_icon_raw 2>/dev/null | head -1 | tr -dc '0-9')
                CROP_OK=false
                if [ -n "$RAW_W" ] && [ -n "$RAW_H" ] && [ "$RAW_W" -gt 0 ] && [ "$RAW_H" -gt 0 ] 2>/dev/null; then
                  if [ "$RAW_W" -ge "$RAW_H" ]; then
                    SIDE=$RAW_H; OFF_X=$(( (RAW_W - RAW_H) / 2 )); OFF_Y=0
                  else
                    SIDE=$RAW_W; OFF_X=0; OFF_Y=$(( (RAW_H - RAW_W) / 2 ))
                  fi
                  echo "Crop tengah: ${SIDE}x${SIDE}+${OFF_X}+${OFF_Y} (asli ${RAW_W}x${RAW_H})"
                  if convert /tmp/app_icon_raw -auto-orient -strip -crop "${SIDE}x${SIDE}+${OFF_X}+${OFF_Y}" +repage -resize 512x512 -extent 512x512 -background none -define png:compression-level=9 -define png:compression-filter=5 /tmp/app_icon_valid.png 2>/dev/null; then
                    CROP_OK=true
                  fi
                fi
                if [ "$CROP_OK" = false ]; then
                  echo "Crop pintar gagal (format aneh?), fallback cara lama..."
                  convert /tmp/app_icon_raw -auto-orient -background none -strip -resize 512x512 -gravity center -extent 512x512 -define png:compression-level=9 -define png:compression-filter=5 /tmp/app_icon_valid.png 2>/dev/null || true
                fi
                PNG_MAGIC=$(xxd -l 4 -p /tmp/app_icon_valid.png 2>/dev/null || echo "")
                if [ "$PNG_MAGIC" = "89504e47" ]; then
                    echo "PNG valid! Applying ke mipmap directories..."
                    for dir in android/app/src/main/res/mipmap-*; do
                      if [ -d "$dir" ]; then
                        dirname=$(basename "$dir")
                        case "$dirname" in
                          mipmap-mdpi)    SIZE=48  ;;
                          mipmap-hdpi)    SIZE=72  ;;
                          mipmap-xhdpi)   SIZE=96  ;;
                          mipmap-xxhdpi)  SIZE=144 ;;
                          mipmap-xxxhdpi) SIZE=192 ;;
                          *)              SIZE=96  ;;
                        esac
                        convert /tmp/app_icon_valid.png -resize ${SIZE}x${SIZE} -define png:compression-level=9 "$dir/ic_launcher.png" 2>/dev/null && \
                        echo "  $dirname -> ${SIZE}x${SIZE} OK" || echo "  $dirname -> GAGAL, pake default"
                      fi
                    done
                    ICON_APPLIED=true
                    echo "Icon berhasil di-apply!"
                  else
                    echo "Konversi PNG gagal (magic byte gak valid), pake icon default Flutter"
                fi
              else
                echo "File bukan image valid (magic: $FILE_MAGIC), pake icon default Flutter"
                echo "HINT: pastiin icon_url = direct download URL asset, bukan halaman release!"
              fi
            else
              echo "Download gagal (HTTP $HTTP_CODE atau file kosong), pake icon default Flutter"
            fi
          else
            echo "Gak ada icon URL, pake icon default Flutter"
          fi

          # ── Splash logo: icon jadi asset buat splash screen (v4.6) ──
          if [ "$ICON_APPLIED" = true ]; then
            cp /tmp/app_icon_valid.png assets/splash_logo.png && echo "Splash logo asset siap"
          fi

          # ── Tulis Dart main.dart (template v4.6: opsi splash/dark + pull-to-refresh) ──
          # ⚠️ Heredoc: body & terminator DART_EOF wajib di base indent (kolom 0
          # setelah YAML strip). Jangan naikin indentasinya!
          cat > lib/main.dart << 'DART_EOF'
          // ============================================================================
          // Web2APK Template v4.6 — flutter_inappwebview + OPSI BUILD
          // ============================================================================
          // Baru di v4.6 (di atas fix v4.5 anti-layar-putih + backend support):
          //   1. SPLASH CUSTOM   : logo/icon user ditampilin pas app dibuka (bukan
          //      spinner polos). Kalo gak ada icon → fallback spinner + nama app.
          //      Bisa di-MATIIN via opsi "Splash" di bot (__SHOW_SPLASH__ = false).
          //   2. TEMA GELAP      : splash + loading + error card ikut mode gelap
          //      (__DARK_THEME__ = true).
          //   3. PULL-TO-REFRESH : tarik ke bawah buat reload halaman.
          // Fitur v4.5 (tetap): mixed content allow (HTTPS page manggil API HTTP jalan),
          //   hybrid composition (anti layar putih), DOM storage/cache/cookie,
          //   timer 25 dtk anti-muter, upload file, link eksternal (wa/tel/mailto),
          //   download ke sistem, target=_blank, back button bener,
          //   HTML mode via InAppLocalhostServer.
          // Catatan token (di-replace saat build):
          //   __APP_NAME__ __WEB_URL__ __SHOW_SPLASH__ (true/false) __DARK_THEME__ (true/false)
          // ============================================================================

          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';

          import 'package:flutter/material.dart';
          // v5.2: MethodChannel = jalur ke native buat install APK (OTA update)
          import 'package:flutter/services.dart' show SystemNavigator, MethodChannel;
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';
          import 'package:package_info_plus/package_info_plus.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:crypto/crypto.dart';   // 🔄 v5.5: verifikasi SHA-256 APK update

          void main() {
            runApp(const WebViewApp());
          }

          // ── Opsi dari bot (diisi token replacement saat build) ──
          const bool kSplashEnabled = __SHOW_SPLASH__;
          // ── 👻 v5.8: gaya splash screen — clean | dark | gradient | pulse ──
          // Khusus Web2APK (URL + HTML). Kalo splash off, gaya diabaikan.
          const String kSplashStyle = '__SPLASH_STYLE__';
          const bool kDarkTheme = __DARK_THEME__;
          const Color kBgColor = kDarkTheme ? Color(0xFF121212) : Colors.white;

          // ── v5.1: pengumuman & multi-tab (diisi token replacement saat build) ──
          // kAnnounceUrl : raw URL announcements/global.json ('' = fitur off)
          // kTabsJson : JSON [{label,url}] (max 3) — '[]' = 1 tab (tanpa nav bawah)
          const String kAnnounceUrl = '__ANNOUNCE_URL__';
          const String kTabsJson = '__TABS_JSON__';

          // ── 🔄 v5.2: OTA UPDATE TANPA UNINSTALL ──
          // kUpdateUrl = raw URL updates/<pkg>.json di repo ('' = fitur off).
          // Isi manifest v2 (ditulis bot v7.x tiap build sukses — semua field
          // baru OPSIONAL, manifest lama tetep kebaca):
          //   {"versionCode": <run number naik terus>, "versionName": "3.0.N",
          //    "apk": "<url release apk-<pkg>/app.apk>", "notes": "...",
          //    "sha256": "<hex64 — kosong = skip verifikasi>",
          //    "minVersionCode": 0,   // >0 & app lebih lama = update WAJIB
          //    "auto": false,         // true = langsung download tanpa dialog
          //    "size": 46000000,      // 🚀 v5.6: ukuran APK (byte, opsional)
          //    "delta": {"base": 11, "url": "...delta-11-12.patch",
          //              "sha256": "...", "size": 1200000}}
          //    // 🚀 v5.6: patch delta ala Play Store — cuma aktif kalo
          //    // versionCode app PAS sama dgn delta.base; gagal = fallback
          //    // otomatis unduh APK penuh. Lihat _tryDeltaUpdate.
          // App bandingin versionCode → banner update → download → verifikasi
          // SHA-256 → install in-app. Signature dijaga sama (stable keystore di
          // workflow) → Android nganggep update, data aman, GAK PERLU UNINSTALL.
          const String kUpdateUrl = '__UPDATE_URL__';

          // ── 👻 v5.8: logo splash BERDENYUT (gaya 'pulse') ──
          // StatefulWidget kecil yang self-contained: controller 900ms
          // repeat-reverse, scale 0.92 → 1.08. Auto-berhenti pas splash
          // hilang dari tree (dispose dipanggil otomatis).
          class _PulseLogo extends StatefulWidget {
            const _PulseLogo({required this.child});
            final Widget child;
            @override
            State<_PulseLogo> createState() => _PulseLogoState();
          }

          class _PulseLogoState extends State<_PulseLogo>
              with SingleTickerProviderStateMixin {
            late final AnimationController _c = AnimationController(
              vsync: this,
              duration: const Duration(milliseconds: 900),
            )..repeat(reverse: true);
            late final Animation<double> _scale =
                Tween(begin: 0.92, end: 1.08).animate(
              CurvedAnimation(parent: _c, curve: Curves.easeInOut),
            );

            @override
            void dispose() {
              _c.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) =>
                ScaleTransition(scale: _scale, child: widget.child);
          }

          class WebViewApp extends StatelessWidget {
            const WebViewApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '__APP_NAME__',
                theme: ThemeData(
                  colorSchemeSeed: Colors.blue,
                  brightness: kDarkTheme ? Brightness.dark : Brightness.light,
                  useMaterial3: true,
                ),
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen>
              with WidgetsBindingObserver {
            // ── TARGET & OPSI (diisi oleh token replacement saat build) ──
            // URL mode  : 'https://website-kamu.com'
            // HTML mode : 'assets/webapp/index.html' (dibundle, jalan offline)
            static const String _target = '__WEB_URL__';
            static final bool _isAssetMode = _target.startsWith('assets/');
            // HTML mode disajikan lewat server localhost built-in biar perilaku sama
            // kayak website asli (fetch()/CSS relatif/localStorage jalan normal).
            static const String _assetDocRoot = 'assets/webapp/';
            // Opsi dari bot: splash on/off & tema gelap (konstanta top-level)
            static const bool _splashEnabled = kSplashEnabled;
            static const bool _dark = kDarkTheme;
            static const Color _bg = kBgColor;

            final InAppLocalhostServer _localhost =
                InAppLocalhostServer(documentRoot: _assetDocRoot);
            bool _localhostStarted = false;

            // ── State UI ──
            InAppWebViewController? _web;
            PullToRefreshController? _pullToRefresh;
            bool _isLoading = true;
            bool _hasError = false;
            bool _isSlow = false;
            bool _showSplash = _splashEnabled;
            int _progress = 0;
            String _errorMsg = '';
            int _reloadKey = 0;
            Timer? _slowTimer;

            // ── 📑 v5.0: multi-tab & 📢 v5.1: pengumuman state ──
            List<Map<String, String>> _tabs = const [];
            int _tabIndex = 0;
            String _currentTarget = _target;
            Timer? _announceTimer;
            bool _announceVisible = false;
            String _announceMsg = '';
            String _announceLink = '';

            // ── 🔄 v5.2: OTA update state ──
            static const MethodChannel _updateChannel =
                MethodChannel('dzr.cloudbuilder/update');
            Timer? _updateTimer;
            bool _updateVisible = false;
            int _updateRemoteCode = 0;
            String _updateApkUrl = '';
            bool _updateDownloading = false;
            double _updateProgress = 0;
            String? _updateApkPath;
            String _updateVerName = '';      // "3.0.N" dari manifest (dialog/banner)
            String _updateNotes = '';        // 📝 v6.6 "apa yang baru" dari manifest (dialog update)
            String _updateProgressTxt = '';  // teks progres: "Mengunduh 8.1 MB (42%)"
            int _updateDialogShownFor = 0;   // dialog per versi cuma sekali per sesi
            bool _updatePermPrompted = false; // lagi nunggu user kasih izin install?
            bool _updateRetrying = false;    // guard auto-resume install
            bool _checkingUpdate = false;    // guard biar cek gak tumpang tindih
            DateTime? _lastUpdateOk;         // cek sukses terakhir (throttle resume)

            // ── 🔄 v5.5: OTA superset state (sinkron bot v7.0) ──
            String _updateSha256 = '';       // hash APK dari manifest (kosong = skip verifikasi)
            bool _updateForce = false;       // minVersionCode > local → dialog GAK bisa di-skip
            bool _updateAuto = false;        // manifest auto:true → langsung download tanpa dialog
            int _updateAutoStartedFor = 0;   // auto mode: versi yang udah dicoba (anti loop)

            // ── 🚀 v5.6: delta update (ala Play Store) + notif sistem ──
            Map<String, dynamic>? _updateDelta; // {base,url,sha256,size} dari manifest (null = gak ada)
            int _localCode = 0;              // versionCode app ini (cache buat cek delta.base)
            int _lastNotifPct = -999;        // throttle notif progress (min 3% antar update)

            // ── Settings max-compatibility (intinya: perlakuin webview kayak Chrome) ──
            final InAppWebViewSettings _settings = InAppWebViewSettings(
              javaScriptEnabled: true,
              domStorageEnabled: true,
              databaseEnabled: true,
              cacheEnabled: true,
              // FIX UTAMA layar putih/muter: HTTPS page boleh manggil API HTTP
              mixedContentMode: MixedContentMode.MIXED_CONTENT_ALWAYS_ALLOW,
              // FIX LAYAR PUTIH di banyak device: rendering hybrid composition
              useHybridComposition: true,
              transparentBackground: false,
              supportZoom: true,
              mediaPlaybackRequiresUserGesture: false,
              thirdPartyCookiesEnabled: true,
              useOnDownloadStart: true,
              allowFileAccess: true,
              allowFileAccessFromFileURLs: true,
              allowUniversalAccessFromFileURLs: true,
              javaScriptCanOpenWindowsAutomatically: true,
              disableDefaultErrorPage: true,
            );

            @override
            void initState() {
              super.initState();
              _pullToRefresh = PullToRefreshController(
                onRefresh: () {
                  _web?.reload();
                },
                settings: PullToRefreshSettings(
                  color: _dark ? Colors.white : Colors.blue,
                ),
              );
              _armSlowTimer();
              // ── 📑 v5.0: parse tab dari bot — cuma aktif kalo ada >1 tab valid ──
              try {
                final parsed = (jsonDecode(kTabsJson) as List)
                    .map((e) => {
                      'label': (e['label'] ?? 'Tab').toString(),
                      'url': (e['url'] ?? '').toString(),
                    })
                    .where((t) => t['url']!.startsWith('http'))
                    .toList();
                if (parsed.length > 1) {
                  _tabs = parsed;
                  _currentTarget = parsed.first['url']!;
                }
              } catch (_) {
                _tabs = const [];
              }
              // ── 📢 v5.1: tarik pengumuman pas start + tiap 8 jam selagi app buka ──
              _fetchAnnouncement();
              _announceTimer = Timer.periodic(const Duration(hours: 8), (_) => _fetchAnnouncement());
              // ── 🔄 v5.3: cek update pas start (delay 5 dtk biar UI lancar)
              //    + retry awal 45s/120s (buat HP yang WiFi-nya belum siap)
              //    + tiap 1 jam selagi app kebuka + tiap app dibuka lagi ──
              // ⚡ v6.7: interval DIPERCEPAT (5s/20s/45s + periodik 1 jam,
              // sebelumnya 45s/120s + 6 jam) — update kerasa instan, tetap
              // hemat baterai (cuma 1 GET JSON kecil per interval).
              WidgetsBinding.instance.addObserver(this);
              Future.delayed(const Duration(seconds: 5), () => _checkUpdate());
              Future.delayed(const Duration(seconds: 20), () => _checkUpdate());
              Future.delayed(const Duration(seconds: 45), () => _checkUpdate());
              _updateTimer = Timer.periodic(const Duration(hours: 1), (_) => _checkUpdate());
              // Splash hilang maksimal 6 detik, biar halaman lambat gak keliatan "mati"
              Future.delayed(const Duration(seconds: 6), () {
                if (mounted && _showSplash) {
                  setState(() => _showSplash = false);
                }
              });
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _slowTimer?.cancel();
              _announceTimer?.cancel();
              _updateTimer?.cancel();
              super.dispose();
            }

            // ── 🔄 v5.3: app dibuka lagi (resume) → cek update + lanjutin
            //    install yang lagi nunggu izin — OTOMATIS, tanpa pencet ulang ──
            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state != AppLifecycleState.resumed) return;
              _autoResumeInstall();
              _checkUpdate();
            }

            // ── ANTI-MUTER: kalo 25 detik belum selesai load, buka kartu peringatan ──
            void _armSlowTimer() {
              _slowTimer?.cancel();
              _slowTimer = Timer(const Duration(seconds: 25), () {
                if (mounted && _isLoading && !_hasError) {
                  setState(() => _isSlow = true);
                }
              });
            }

            void _fail(String msg) {
              _slowTimer?.cancel();
              _pullToRefresh?.endRefreshing();
              if (!mounted) return;
              setState(() {
                _hasError = true;
                _isLoading = false;
                _showSplash = false;
                _isSlow = false;
                _errorMsg = msg;
              });
            }

            Future<void> _retry() async {
              if (!mounted) return;
              setState(() {
                _hasError = false;
                _isSlow = false;
                _isLoading = true;
                _progress = 0;
                _reloadKey++; // bikin ulang webview → load dari awal
              });
              _armSlowTimer();
            }

            // ── Link non-http (tel:/mailto:/whatsapp:/geo:/intent:) → app eksternal ──
            Future<void> _openExternal(WebUri url) async {
              try {
                await launchUrl(url, mode: LaunchMode.externalApplication);
              } catch (_) {
                // Gak ada app yang mau nerima link-nya — diemin aja, jangan crash.
              }
            }

            // ── 📢 v5.1: tarik pengumuman global (raw.githubusercontent).
            // Format file: {"id": <unix-ms>, "message": "teks", "url": "https://..."}
            // message kosong / gagal / offline = senyap, jangan ganggu user.
            Future<void> _fetchAnnouncement() async {
              if (kAnnounceUrl.isEmpty) return;
              HttpClient? hc;
              try {
                hc = HttpClient();
                hc.connectionTimeout = const Duration(seconds: 10);
                final req = await hc.getUrl(Uri.parse(kAnnounceUrl));
                final resp = await req.close();
                if (resp.statusCode != 200) return;
                final body = await resp.transform(utf8.decoder).join();
                final data = jsonDecode(body);
                final msg = data['message'];
                if (msg is String && msg.trim().isNotEmpty && mounted) {
                  final link = data['url'];
                  setState(() {
                    _announceVisible = true;
                    _announceMsg = msg.trim();
                    _announceLink = (link is String) ? link : '';
                  });
                }
              } catch (_) {
                // Offline / file belum ada / JSON rusak — diemin aja.
              } finally {
                hc?.close();
              }
            }

            // ── 🔄 v5.3: cek update OTA (raw repo updates/<pkg>.json).
            // versionCode = GitHub run number (naik tiap rebuild). Kalo lebih
            // besar dari versionCode app ini → banner + DIALOG update muncul.
            // Throttle 15 menit sejak sukses terakhir (resume gak nge-fetch
            // mulu). Gagal/offline/manifest belum ada = senyap, gak ganggu.
            Future<void> _checkUpdate() async {
              if (kUpdateUrl.isEmpty || _checkingUpdate) return;
              final last = _lastUpdateOk;
              if (last != null &&
                  DateTime.now().difference(last) < const Duration(minutes: 15)) {
                return;
              }
              _checkingUpdate = true;
              HttpClient? hc;
              try {
                hc = HttpClient();
                hc.connectionTimeout = const Duration(seconds: 10);
                final req = await hc.getUrl(Uri.parse(kUpdateUrl));
                final resp = await req.close();
                if (resp.statusCode != 200) return;
                final body = await resp.transform(utf8.decoder).join();
                final data = jsonDecode(body);
                final remote = int.tryParse("${data['versionCode'] ?? ''}") ?? 0;
                final rawApk = data['apk'];
                final apkUrl = (rawApk is String) ? rawApk : '';
                if (remote <= 0 || !apkUrl.startsWith('http')) return;
                final rawName = data['versionName'];
                final verName = (rawName is String && rawName.isNotEmpty)
                    ? rawName
                    : '3.0.$remote';
                final rawNotes = data['notes'];
                final updNotes = (rawNotes is String) ? rawNotes.trim() : '';
                // ── 🔄 v5.5: field manifest v2 (semua opsional = kompatibel) ──
                final rawSha = data['sha256'];
                final updSha = (rawSha is String && rawSha.length == 64)
                    ? rawSha.toLowerCase() : '';
                final rawMin = int.tryParse("${data['minVersionCode'] ?? ''}") ?? 0;
                final updAuto = data['auto'] == true;
                // ── 🚀 v5.6: field delta (opsional — update ala Play Store) ──
                final rawDelta = data['delta'];
                Map<String, dynamic>? delta;
                if (rawDelta is Map) {
                  final db = int.tryParse('${rawDelta['base'] ?? ''}') ?? 0;
                  final du = (rawDelta['url'] is String)
                      ? rawDelta['url'] as String : '';
                  final ds = (rawDelta['sha256'] is String)
                      ? (rawDelta['sha256'] as String).toLowerCase() : '';
                  final dz = int.tryParse('${rawDelta['size'] ?? ''}') ?? 0;
                  if (db > 0 && du.startsWith('http')) {
                    delta = {'base': db, 'url': du, 'sha256': ds, 'size': dz};
                  }
                }
                _lastUpdateOk = DateTime.now();
                final info = await PackageInfo.fromPlatform();
                final local = int.tryParse(info.buildNumber) ?? 0;
                if (remote > local && mounted) {
                  setState(() {
                    _updateVisible = true;
                    _updateRemoteCode = remote;
                    _updateApkUrl = apkUrl;
                    _updateVerName = verName;
                    _updateNotes = updNotes;
                    _updateSha256 = updSha;
                    _updateDelta = delta;   // 🚀 v5.6
                    _localCode = local;     // 🚀 v5.6 (buat cek delta.base)
                    // 🔒 FORCE: developer pasang versi minimum & app ini di
                    // bawahnya → update wajib (gak bisa nolak).
                    _updateForce = rawMin > 0 && local < rawMin;
                    // 🤖 AUTO kalah sama FORCE (yang wajib, tetap dialog).
                    _updateAuto = updAuto && !_updateForce;
                  });
                  if (_updateAuto) {
                    // 🤖 v5.5 AUTO: user udah set auto-update → tanpa dialog,
                    // langsung download (progress keliatan di banner hijau).
                    // Satu percobaan per versi per sesi (anti loop kalau
                    // install ditolak terus-menerus).
                    if (_updateAutoStartedFor < remote) {
                      _updateAutoStartedFor = remote;
                      await _startUpdate();
                    }
                  } else {
                    // 🚀 v5.3: bukan cuma banner — user LANGSUNG disuruh update
                    _maybeShowUpdateDialog();
                  }
                }
              } catch (_) {
                // Offline / manifest belum ada / JSON rusak — diemin aja.
              } finally {
                _checkingUpdate = false;
                hc?.close();
              }
            }

            // ── 🔄 v5.3: DIALOG "Update Tersedia" — muncul otomatis pas ada
            //    versi baru (gak cuma banner tipis yang gampang kelewat).
            //    Sekali per versi per sesi biar gak nge-spam user.
            void _maybeShowUpdateDialog() {
              if (!mounted || !_updateVisible || _updateDownloading) return;
              // 🔒 v5.5 FORCE: dialog GAK diinget per versi → kalau ditutup
              // (back button), cek berikutnya muncul LAGI. Gak ada jalan kabur.
              if (!_updateForce && _updateDialogShownFor >= _updateRemoteCode) return;
              if (!_updateForce) _updateDialogShownFor = _updateRemoteCode;
              showDialog<void>(
                context: context,
                barrierDismissible: !_updateForce,
                builder: (ctx) => AlertDialog(
                  backgroundColor: _dark ? const Color(0xFF1E1E1E) : null,
                  title: Row(
                    children: [
                      Icon(Icons.system_update_alt,
                          color: Colors.green.shade600),
                      const SizedBox(width: 8),
                      const Expanded(
                        child: Text('Update Tersedia',
                            style: TextStyle(
                                fontSize: 18, fontWeight: FontWeight.bold)),
                      ),
                    ],
                  ),
                  content: Text(
                    'Versi baru v$_updateVerName siap di-install.\n\n'
                    '• Gak perlu uninstall\n'
                    '• Data & login kamu aman\n'
                    '• Ketuk Update Sekarang — app download sendiri terus '
                    'bukain installer'
                    '${_updateNotes.isEmpty ? "" : "\n\n📝 Apa yang baru:\n$_updateNotes"}',
                    style: TextStyle(
                        height: 1.5,
                        color: _dark ? Colors.grey.shade200 : Colors.black87),
                  ),
                  actions: [
                    // 🔒 v5.5 FORCE: tanpa tombol [Nanti] — satu-satunya jalan
                    // keluar adalah update-nya sendiri.
                    if (!_updateForce)
                      TextButton(
                        onPressed: () => Navigator.of(ctx).pop(),
                        child: const Text('Nanti'),
                      ),
                    FilledButton.icon(
                      onPressed: () {
                        Navigator.of(ctx).pop();
                        _startUpdate();
                      },
                      icon: const Icon(Icons.download),
                      label: const Text('Update Sekarang'),
                    ),
                  ],
                ),
              );
            }

            // ── 🔄 v5.3: AUTO-RESUME — begitu user balik ke app setelah
            //    ngasih izin "install aplikasi tak dikenal", install
            //    dilanjutin OTOMATIS. Dulu user disuruh pencet banner lagi
            //    (itu yang bikin kerasa "update gak berfungsi"). Sekarang
            //    nol langkah ekstra, nol tutorial.
            Future<void> _autoResumeInstall() async {
              if (_updateApkPath == null || _updateRetrying) return;
              if (!_updatePermPrompted) return; // gak lagi nunggu izin → skip
              _updateRetrying = true;
              try {
                final res = await _updateChannel
                    .invokeMethod('installApk', {'path': _updateApkPath!});
                if (res == 'ok') _updatePermPrompted = false;
                // res == 'settings' → izin masih dimatiin. GAK di-loop buka
                // settings — user bisa ketuk banner/dialog lagi kapan aja.
              } catch (_) {}
              _updateRetrying = false;
            }

            // ── 🔄 v5.3: download APK update ke cache → validasi → buka
            //    installer sistem. Signature APK dijamin sama (stable keystore)
            //    → Android nganggep UPDATE di atas app lama: data & setting
            //    AMAN, GAK PERLU UNINSTALL. File divalidasi (content-type +
            //    magic byte "PK") biar installer gak pernah dibukain file
            //    rusak / halaman HTML error ("App not installed" misterius
            //    hilang).
            Future<void> _startUpdate() async {
              if (_updateDownloading) return;
              // Udah pernah ke-download sesi ini → langsung buka installer lagi
              if (_updateApkPath != null) {
                await _installUpdateApk();
                return;
              }
              setState(() {
                _updateDownloading = true;
                _updateProgress = 0;
                _updateProgressTxt = 'Nyambung...';
              });
              // ── 🔔 v5.6: izin notifikasi (Android 13+) — fire & forget.
              //    Notif progress bikin update tetep keliatan walau user
              //    mindahin app ke background (ala Play Store).
              try { await _updateChannel.invokeMethod('ensureNotifPerm'); } catch (_) {}
              // ── 🚀 v5.6: DELTA UPDATE dulu (ala Play Store) — kalo manifest
              //    nyediain patch & versionCode app PAS sama dgn base-nya,
              //    cukup unduh PATCH KECIL (biasanya 10-30% ukuran penuh) +
              //    pasang on-device → APK baru utuh. Gagal di step mana pun
              //    (_tryDeltaUpdate balikin null) = jatuh ke unduh penuh di
              //    bawah — AMAN SELALU, gak ada skenario stuck.
              try {
                final patched = await _tryDeltaUpdate();
                if (patched != null) {
                  _updateApkPath = patched;
                  if (mounted) setState(() => _updateDownloading = false);
                  await _notifDismiss();
                  await _notifDone(
                      'Pembaruan siap di-install',
                      '✅ v$_updateVerName selesai diunduh (hemat kuota!) — '
                          'ketuk buat install',
                      patched);
                  await _installUpdateApk();
                  return;
                }
              } catch (_) { /* fallback unduh penuh */ }
              HttpClient? hc;
              try {
                hc = HttpClient();
                hc.connectionTimeout = const Duration(seconds: 15);
                _notifProgress(-1, 'Mengunduh pembaruan v$_updateVerName...');
                // ── 🔄 v5.5: download + verifikasi, maksimal 2 percobaan ──
                // Hash gak cocok (download korup / putus di tengah) = otomatis
                // download ulang 1x. Masih gagal juga = error jelas, installer
                // GAK dibukain file rusak (bukan "App not installed" misterius).
                String? savedPath;
                for (int attempt = 1; attempt <= 2 && savedPath == null; attempt++) {
                  if (attempt == 2 && mounted) {
                    setState(() => _updateProgressTxt = 'File gak valid — download ulang...');
                  }
                  savedPath = await _downloadAndVerifyApk(hc);
                }
                if (savedPath == null) {
                  // 2x hash mismatch → stop, jangan buka installer
                  if (mounted) {
                    setState(() => _updateDownloading = false);
                    ScaffoldMessenger.of(context).showSnackBar(
                      const SnackBar(
                          content: Text('File update gak valid (hash beda) — '
                              'server lagi bermasalah mungkin. Coba lagi '
                              'beberapa menit lagi ya')),
                    );
                  }
                  return;
                }
                _updateApkPath = savedPath;
                if (mounted) setState(() => _updateDownloading = false);
                // 🔔 v5.6: progress notif diganti notif "siap install"
                await _notifDismiss();
                await _notifDone(
                    'Pembaruan siap di-install',
                    '✅ v$_updateVerName selesai diunduh — ketuk buat install',
                    savedPath);
                await _installUpdateApk();
              } catch (_) {
                _updateApkPath = null;
                if (mounted) {
                  setState(() => _updateDownloading = false);
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                        content: Text('Download gagal — cek koneksi internet, '
                            'terus coba lagi ya')),
                  );
                }
                // Fallback terakhir: buka link di browser (install manual
                // tetep bisa dari notifikasi download).
                await _openExternal(WebUri(_updateApkUrl));
              } finally {
                hc?.close();
              }
            }

            /// ── 🔄 v5.5: download APK + validasi berlapis ──
            /// 1. HTTP 200 (bukan error page)
            /// 2. Content-type bukan HTML (guard v5.3)
            /// 3. Magic byte "PK" (zip/APK valid — guard v5.3)
            /// 4. SHA-256 sesuai manifest (BARU — streamed, hemat memori)
            /// Balikin path file kalau SEMUA lolos, null kalau hash beda
            /// (biar caller nge-retry 1x), lempar exception kalau jaringan
            /// / HTTP gagal total.
            Future<String?> _downloadAndVerifyApk(HttpClient hc) async {
              final req = await hc.getUrl(Uri.parse(_updateApkUrl));
              final resp = await req.close();
              if (resp.statusCode != 200) {
                throw Exception('HTTP ${resp.statusCode}');
              }
              // Guard v5.3: GitHub kadang bales HTML (error page) — jangan
              // disimpen jadi .apk terus install gagal misterius.
              final ctype =
                  (resp.headers.value('content-type') ?? '').toLowerCase();
              if (ctype.contains('text/html')) {
                throw Exception('respons HTML, bukan APK');
              }
              final total = resp.contentLength ?? -1;
              final totalTxt =
                  total > 0 ? ' dari ${((total / 1048576) * 10).round() / 10} MB' : '';
              final dir = await getTemporaryDirectory();
              final f = File('${dir.path}/update_v${_updateRemoteCode}.apk');
              final sink = f.openWrite();
              var got = 0;
              await for (final chunk in resp) {
                got += chunk.length;
                sink.add(chunk);
                if (mounted) {
                  var pct = '';
                  var part = '';
                  if (total > 0) {
                    _updateProgress = got / total;
                    pct = ' — ${(_updateProgress * 100).toStringAsFixed(0)}%';
                    part = totalTxt;
                  }
                  final mb = ((got / 1048576) * 10).round() / 10;
                  final txt = 'Mengunduh $mb MB$part$pct';
                  setState(() => _updateProgressTxt = txt);
                  // 🔔 v5.6: notif progress sistem — throttle min 3% antar
                  // update biar gak spam (in-app banner tetap real-time).
                  final pct100 =
                      total > 0 ? ((got / total) * 100).floor() : -1;
                  if (pct100 < 0 || pct100 - _lastNotifPct >= 3) {
                    _lastNotifPct = pct100;
                    _notifProgress(pct100, txt);
                  }
                }
              }
              await sink.close();
              // Magic byte check v5.3: APK valid selalu mulai "PK" (zip).
              final raf = await f.open(mode: FileMode.read);
              final head = await raf.read(2);
              await raf.close();
              if (head.length < 2 || head[0] != 0x50 || head[1] != 0x4B) {
                try { await f.delete(); } catch (_) {}
                throw Exception('file download rusak');
              }
              // ── 🔄 v5.5: verifikasi SHA-256 (kalau manifest ngasih hash) ──
              // Streamed hash → APK 50MB+ gak di-read utuh ke memori.
              // Manifest tanpa sha256 (workflow lama) = verifikasi di-skip.
              if (_updateSha256.length == 64) {
                var digestHex = '';
                try {
                  final digest = await sha256.bind(f.openRead()).first;
                  digestHex = digest.toString();
                } catch (_) {
                  digestHex = '';
                }
                if (digestHex != _updateSha256) {
                  try { await f.delete(); } catch (_) {}
                  return null;   // hash beda → caller nge-retry 1x
                }
              }
              return f.path;
            }

            // ── 🚀 v5.6: DELTA UPDATE (ala Play Store) ──
            // Ide: APK baru itu 90%+ isinya SAMA dgn APK yang lagi ke-install
            // (engine Flutter, lib, resource). Jadi cukup UNDUH PATCH KECIL
            // (beda-nya doang), terus patch di-aplikasiin ON-DEVICE ke APK
            // lama (bspatch di Kotlin, streaming hemat memori) → hasilnya
            // APK baru UTUH yang byte-identik dgn APK resmi (bsdiff itu
            // lossless) → SHA-256 cocok → install. K hemat kuota & waktu.
            // Syarat: manifest.delta.base == versionCode app ini (patch cuma
            // cocok dgn satu versi dasar). Gagal di step mana pun = balikin
            // null → caller fallback unduh APK penuh. AMAN SELALU.
            Future<String?> _tryDeltaUpdate() async {
              final d = _updateDelta;
              if (d == null) return null;
              final base = (d['base'] is int) ? d['base'] as int : 0;
              final url = (d['url'] is String) ? d['url'] as String : '';
              final dsha = (d['sha256'] is String) ? d['sha256'] as String : '';
              // Patch cuma valid buat 1 versi dasar — versi kita harus PAS.
              if (base <= 0 || base != _localCode || !url.startsWith('http')) {
                return null;
              }
              // APK lama = file APK yang lagi ke-install (sourceDir — kebaca
              // sama app sendiri, gak butuh root). Ini dasar patch-nya.
              String src = '';
              try {
                src = await _updateChannel.invokeMethod('apkSourceDir') ?? '';
              } catch (_) {}
              if (src.isEmpty || !File(src).existsSync()) return null;
              if (mounted) {
                setState(() => _updateProgressTxt =
                    'Mode hemat: unduh patch kecil dulu...');
              }
              _notifProgress(-1, 'Mengunduh pembaruan (delta)...');
              HttpClient? hc;
              try {
                hc = HttpClient();
                hc.connectionTimeout = const Duration(seconds: 15);
                final patchPath = await _downloadPatch(hc, url, dsha);
                if (patchPath == null) return null;
                if (mounted) {
                  setState(() => _updateProgressTxt = 'Memasang pembaruan...');
                }
                _notifProgress(-1, 'Memasang pembaruan...');
                final dir = await getTemporaryDirectory();
                final outPath = '${dir.path}/update_v$_updateRemoteCode.apk';
                try {
                  final old = File(outPath);
                  if (old.existsSync()) await old.delete();
                } catch (_) {}
                // bspatch streaming di native (Kotlin) — balikin "ok" cuma
                // kalo ukuran hasil PAS dgn APK resmi.
                final res = await _updateChannel.invokeMethod('applyDeltaPatch',
                    {'old': src, 'patch': patchPath, 'out': outPath});
                if (res != 'ok') return null;
                final outFile = File(outPath);
                if (!outFile.existsSync() || outFile.lengthSync() < 4) {
                  return null;
                }
                // Verifikasi hasil patch = verifikasi yang SAMA kenceng dgn
                // unduh penuh: magic byte PK + SHA-256 harus cocok manifest.
                final raf = await outFile.open(mode: FileMode.read);
                final head = await raf.read(2);
                await raf.close();
                if (head.length < 2 || head[0] != 0x50 || head[1] != 0x4B) {
                  try { await outFile.delete(); } catch (_) {}
                  return null;
                }
                if (_updateSha256.length == 64) {
                  var hex = '';
                  try {
                    hex = (await sha256.bind(outFile.openRead()).first).toString();
                  } catch (_) {}
                  if (hex != _updateSha256) {
                    try { await outFile.delete(); } catch (_) {}
                    return null;
                  }
                }
                return outPath;
              } catch (_) {
                return null;   // kapan pun gagal → caller pakai unduh penuh
              } finally {
                hc?.close();
              }
            }

            /// Unduh file patch delta (+ verifikasi SHA-256 patch kalau
            /// manifest ngasih) → path file, atau null kalo gak valid.
            Future<String?> _downloadPatch(
                HttpClient hc, String url, String wantSha) async {
              try {
                final req = await hc.getUrl(Uri.parse(url));
                final resp = await req.close();
                if (resp.statusCode != 200) return null;
                final ctype =
                    (resp.headers.value('content-type') ?? '').toLowerCase();
                if (ctype.contains('text/html')) return null;
                final total = resp.contentLength ?? -1;
                final dir = await getTemporaryDirectory();
                final f = File(
                    '${dir.path}/delta_v${_updateDelta?['base'] ?? 0}_v$_updateRemoteCode.patch');
                final sink = f.openWrite();
                var got = 0;
                await for (final chunk in resp) {
                  got += chunk.length;
                  sink.add(chunk);
                  if (total > 0 && mounted) {
                    final pct = got / total;
                    final mb =
                        ((got / 1048576) * 10).round() / 10;
                    final totalMb =
                        ((total / 1048576) * 10).round() / 10;
                    setState(() => _updateProgressTxt =
                        'Delta: $mb/$totalMb MB — ${(pct * 100).toStringAsFixed(0)}%');
                    final pct100 = (pct * 100).floor();
                    if (pct100 - _lastNotifPct >= 3) {
                      _lastNotifPct = pct100;
                      _notifProgress(pct100, _updateProgressTxt);
                    }
                  }
                }
                await sink.close();
                if (wantSha.length == 64) {
                  var hex = '';
                  try {
                    hex = (await sha256.bind(f.openRead()).first).toString();
                  } catch (_) {}
                  if (hex != wantSha) {
                    try { await f.delete(); } catch (_) {}
                    return null;
                  }
                }
                return f.path;
              } catch (_) {
                return null;
              }
            }

            // ── 🔔 v5.6: notifikasi sistem (progress + "selesai") ──
            // Semua lewat channel native (MainActivity). Gagal = diemin aja —
            // notif itu bonus, banner in-app tetap sumber utama.
            Future<void> _notifProgress(int pct, String text) async {
              try {
                await _updateChannel
                    .invokeMethod('notifProgress', {'pct': pct, 'text': text});
              } catch (_) {}
            }

            Future<void> _notifDone(
                String title, String text, String path) async {
              try {
                await _updateChannel.invokeMethod(
                    'notifDone', {'title': title, 'text': text, 'path': path});
              } catch (_) {}
            }

            Future<void> _notifDismiss() async {
              try { await _updateChannel.invokeMethod('notifDismiss'); } catch (_) {}
            }

            // Panggil native (MainActivity) buat nampilin installer sistem.
            // "ok" = installer kebuka | "settings" = user belum izinkan
            // install aplikasi tak dikenal → dibukain halaman izinnya, dan
            // begitu izin dikasih + balik ke app → install dilanjutin
            // OTOMATIS (lihat _autoResumeInstall). GAK ADA TUTORIAL.
            Future<void> _installUpdateApk() async {
              final p = _updateApkPath;
              if (p == null) return;
              try {
                final res = await _updateChannel.invokeMethod('installApk', {'path': p});
                if (res == 'ok') {
                  _updatePermPrompted = false;
                } else if (res == 'settings' && mounted) {
                  _updatePermPrompted = true;
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text(
                          'Aktifin "Install aplikasi tak dikenal" — abis itu '
                          'balik ke app, update diterusin otomatis'),
                    ),
                  );
                  try {
                    await _updateChannel.invokeMethod('openInstallPermSettings');
                  } catch (_) {}
                }
              } catch (_) {
                // Channel gagal → fallback: buka link di browser.
                await _openExternal(WebUri(_updateApkUrl));
              }
            }

            // ── 📑 v5.0: pindah tab — webview di-rebuild ke URL tab baru ──
            void _switchTab(int i) {
              if (i == _tabIndex || i < 0 || i >= _tabs.length) return;
              setState(() {
                _tabIndex = i;
                _currentTarget = _tabs[i]['url'] ?? _target;
                _reloadKey++;
                _isLoading = true;
                _hasError = false;
                _isSlow = false;
                _progress = 0;
                _showSplash = false;
              });
              _armSlowTimer();
            }

            /// HTML mode: nyalain server localhost (sekali aja), balikin URL hasilnya.
            Future<WebUri?> _ensureLocalhost() async {
              if (!_isAssetMode) return null;
              if (!_localhostStarted) {
                await _localhost.start();
                _localhostStarted = true;
              }
              final rel = _target.startsWith(_assetDocRoot)
                  ? _target.substring(_assetDocRoot.length)
                  : _target.split('/').last;
              return WebUri('http://localhost:8080/$rel');
            }

            // ── 👻 v5.8: SPLASH SCREEN 4 GAYA (khusus Web2APK) ───────────────
            // clean (default, pola lama) | dark | gradient | pulse (animasi).
            // Gaya dipilih user di bot (tombol 👻 Splash), dikirim sebagai
            // input splash_style → token __SPLASH_STYLE__.
            Widget _splashLogo(double size) {
              // Logo custom (dari icon APK). Gak ada icon = kotak kosong —
              // nama app + spinner/denyut yang jadi identitas.
              return Image.asset(
                'assets/splash_logo.png',
                width: size,
                height: size,
                errorBuilder: (_, _, _) => const SizedBox.shrink(),
              );
            }

            Widget _buildSplash() {
              const style = kSplashStyle;
              const name = '__APP_NAME__';

              // ── Gaya 'dark': gelap pekat, apapun tema app ──
              if (style == 'dark') {
                return Container(
                  color: const Color(0xFF0F1420),
                  alignment: Alignment.center,
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      _splashLogo(110),
                      const SizedBox(height: 16),
                      const Text(name,
                          style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.w700,
                              color: Colors.white)),
                      const SizedBox(height: 20),
                      const SizedBox(
                          width: 28,
                          height: 28,
                          child: CircularProgressIndicator(
                              strokeWidth: 3, color: Color(0xFF7C8CF8))),
                    ],
                  ),
                );
              }

              // ── Gaya 'gradient': ungu → biru → cyan, logo di lingkaran kaca ──
              if (style == 'gradient') {
                return Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                      colors: [
                        Color(0xFF6D5DF6),
                        Color(0xFF3B82F6),
                        Color(0xFF22D3EE),
                      ],
                    ),
                  ),
                  alignment: Alignment.center,
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(18),
                        decoration: BoxDecoration(
                          color: Colors.white.withValues(alpha: 0.18),
                          shape: BoxShape.circle,
                        ),
                        child: _splashLogo(96),
                      ),
                      const SizedBox(height: 18),
                      const Text(name,
                          style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.w700,
                              color: Colors.white)),
                      const SizedBox(height: 22),
                      const SizedBox(
                          width: 28,
                          height: 28,
                          child: CircularProgressIndicator(
                              strokeWidth: 3, color: Colors.white70)),
                    ],
                  ),
                );
              }

              // ── Gaya 'pulse': logo berdenyut halus, tanpa spinner ──
              if (style == 'pulse') {
                return Container(
                  color: _bg,
                  alignment: Alignment.center,
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      _PulseLogo(child: _splashLogo(120)),
                      const SizedBox(height: 18),
                      Text(name,
                          style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.w700,
                              color:
                                  _dark ? Colors.white : Colors.grey.shade800)),
                    ],
                  ),
                );
              }

              // ── Gaya 'clean' (default): pola lama v4.6 ──
              return Container(
                color: _bg,
                alignment: Alignment.center,
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    _splashLogo(110),
                    const SizedBox(height: 16),
                    Text(name,
                        style: TextStyle(
                            fontSize: 18,
                            fontWeight: FontWeight.w700,
                            color:
                                _dark ? Colors.white : Colors.grey.shade800)),
                    const SizedBox(height: 20),
                    const SizedBox(
                      width: 28,
                      height: 28,
                      child: CircularProgressIndicator(strokeWidth: 3),
                    ),
                  ],
                ),
              );
            }

            Widget _overlayCard({
              required IconData icon,
              required String title,
              required String message,
            }) {
              return Container(
                color: _bg,
                alignment: Alignment.center,
                padding: const EdgeInsets.all(24),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Icon(icon, size: 64, color: Colors.grey),
                    const SizedBox(height: 16),
                    Text(
                      title,
                      style: TextStyle(
                        fontSize: 20,
                        fontWeight: FontWeight.bold,
                        color: _dark ? Colors.white : Colors.black87,
                      ),
                    ),
                    const SizedBox(height: 8),
                    Text(
                      message,
                      textAlign: TextAlign.center,
                      style: TextStyle(color: _dark ? Colors.grey.shade400 : Colors.grey),
                    ),
                    const SizedBox(height: 24),
                    FilledButton.icon(
                      onPressed: _retry,
                      icon: const Icon(Icons.refresh),
                      label: const Text('Coba Lagi'),
