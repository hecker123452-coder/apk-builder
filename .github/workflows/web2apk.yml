name: Deruzuan Dev Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website yang ingin dijadikan APK'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'WebApp'
      package_name:
        description: 'Package Name (com.xxx.xxx)'
        required: false
        default: 'com.deruzuan.webapp'
      icon_url:
        description: 'Icon URL (opsional)'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      # ── Pass ALL free-text inputs through env to prevent script injection ──
      INPUT_WEB_URL: ${{ inputs.web_url }}
      INPUT_APP_NAME: ${{ inputs.app_name }}
      INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
      INPUT_ICON_URL: ${{ inputs.icon_url }}
      INPUT_CHAT_ID: ${{ inputs.chat_id }}
      INPUT_BOT_TOKEN: ${{ inputs.bot_token }}

    steps:
      - name: Generate WebView Flutter Project
        run: |
          echo "=== Generating WebView Flutter Project ==="

          # Sanitize app_name and package_name
          SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
          SAFE_PKG=$(echo "$INPUT_PACKAGE_NAME" | sed 's/[^a-zA-Z0-9.]//g' | sed 's/^\.*//' | sed 's/\.*$//')
          [ -z "$SAFE_PKG" ] && SAFE_PKG="com.deruzuan.webapp"

          echo "App Name: $SAFE_APP_NAME"
          echo "Package:  $SAFE_PKG"
          echo "Web URL:  $INPUT_WEB_URL"

          # Create Flutter project structure
          mkdir -p lib android/app/src/main/res/mipmap-hdpi \
                     android/app/src/main/res/mipmap-mdpi \
                     android/app/src/main/res/mipmap-xhdpi \
                     android/app/src/main/res/mipmap-xxhdpi \
                     android/app/src/main/res/values \
                     android/app/src/main/res/drawable \
                     android/app/src/main/kotlin/app \
                     android/gradle/wrapper \
                     android/app/src/main/res/drawable-v21

          # ── pubspec.yaml ──
          cat > pubspec.yaml << 'PUBSPEC'
          name: webview_app
          description: WebView APK generated by Deruzuan Dev
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.10.0
            webview_flutter_android: ^3.16.0
            webview_flutter_wkwebview: ^3.13.0

          flutter:
            uses-material-design: true
          PUBSPEC

          # ── main.dart with WebView ──
          cat > lib/main.dart << DARTCODE
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:webview_flutter_wkwebview/webview_flutter_wkwebview.dart';

          void main() {
            runApp(const WebViewApp());
          }

          class WebViewApp extends StatelessWidget {
            const WebViewApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '$SAFE_APP_NAME',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorSchemeSeed: Colors.blue,
                  useMaterial3: true,
                ),
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();

              late final PlatformWebViewControllerCreationParams params;
              if (WebViewPlatform.instance is AndroidWebViewPlatform) {
                params = AndroidWebViewControllerCreationParams(
                  autoMediaPlaybackPolicy: AutoMediaPlaybackPolicy.always_allow,
                );
              } else {
                params = const PlatformWebViewControllerCreationParams();
              }

              _controller = WebViewController.fromPlatformCreationParams(params)
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0x00000000))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onProgress: (int progress) {},
                    onPageStarted: (String url) {
                      setState(() => _isLoading = true);
                    },
                    onPageFinished: (String url) {
                      setState(() => _isLoading = false);
                    },
                    onWebResourceError: (WebResourceError error) {},
                  ),
                )
                ..loadRequest(Uri.parse('$INPUT_WEB_URL'));

              if (_controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(true);
                (_controller.platform as AndroidWebViewController)
                    .setMediaPlaybackState(AndroidMediaPlaybackState.allow);
              }
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  if (await _controller.canGoBack()) {
                    _controller.goBack();
                    return false;
                  }
                  return true;
                },
                child: Scaffold(
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),
                        if (_isLoading)
                          const Center(
                            child: CircularProgressIndicator(),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DARTCODE

          # ── AndroidManifest.xml ──
          PKG_PATH=$(echo "$SAFE_PKG" | tr '.' '/')
          mkdir -p "android/app/src/main/kotlin/$PKG_PATH"

          cat > android/app/src/main/AndroidManifest.xml << MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$SAFE_PKG">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="$SAFE_APP_NAME"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:theme="@style/LaunchTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          MANIFEST

          # ── MainActivity.kt ──
          cat > "android/app/src/main/kotlin/$PKG_PATH/MainActivity.kt" << KTCODE
          package $SAFE_PKG

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          KTCODE

          # ── build.gradle (Project) ──
          cat > android/build.gradle << 'GRADLE_PROJ'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          GRADLE_PROJ

          # ── build.gradle (App) ──
          cat > android/app/build.gradle << GRADLE_APP
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localProperties.load(localPropertiesFile.newDataInputStream())
          }

          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              flutterRoot = System.env.FLUTTER_ROOT
          }
          if (flutterRoot == null) {
              throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file or with a FLUTTER_ROOT environment variable.")
          }

          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "\$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

          android {
              namespace "$SAFE_PKG"
              compileSdkVersion 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "$SAFE_PKG"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:\$kotlin_version"
          }
          GRADLE_APP

          # ── gradle-wrapper.properties ──
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'GRADLE_WRAPPER'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.3-all.zip
          GRADLE_WRAPPER

          # ── settings.gradle ──
          cat > android/settings.gradle << 'SETTINGS'
          include ':app'

          def flutterProjectRoot = rootProject.projectDir.parentFile.toPath()

          def plugins = new Properties()
          def pluginsFile = new File(flutterProjectRoot.toFile(), '.flutter-plugins')
          if (pluginsFile.exists()) {
              plugins.load(pluginsFile.newDataInputStream())
          }

          plugins.each { name, path ->
              def pluginDirectory = flutterProjectRoot.resolve(path).resolve('android').toFile()
              include ":\$name"
              project(":\$name").projectDir = pluginDirectory
          }
          SETTINGS

          # ── styles.xml ──
          cat > android/app/src/main/res/values/styles.xml << 'STYLES'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          STYLES

          # ── launch_background.xml ──
          cat > android/app/src/main/res/drawable/launch_background.xml << 'LAUNCH_BG'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <color android:color="#FFFFFF" />
              </item>
          </layer-list>
          LAUNCH_BG

          # ── proguard-rules.pro ──
          cat > android/app/proguard-rules.pro << 'PROGUARD'
          # WebView rules
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepclassmembers class * extends android.webkit.WebViewClient {
              public *(android.webkit.WebView, java.lang.String, android.graphics.Bitmap);
          }
          -keepclassmembers class * extends android.webkit.WebChromeClient {
              public *(android.webkit.WebView, java.lang.String);
          }
          PROGUARD

          echo ""
          echo "=== Flutter WebView project generated successfully ==="
          echo "Project structure:"
          find . -type f | grep -v '^\./\.' | head -20

      - name: Download Icon (if provided)
        run: |
          echo "=== Download Icon ==="
          if [ -z "$INPUT_ICON_URL" ]; then
            echo "No icon URL provided. Using default Flutter icon."
            exit 0
          fi

          echo "Downloading icon from: $INPUT_ICON_URL"
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/app_icon.png --retry 2 --retry-delay 3 "$INPUT_ICON_URL")
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ] || [ ! -s /tmp/app_icon.png ]; then
            echo "WARN: Icon download failed. Using default icon."
            exit 0
          fi

          FILE_TYPE=$(file /tmp/app_icon.png 2>/dev/null || echo "unknown")
          echo "File type: $FILE_TYPE"

          if ! echo "$FILE_TYPE" | grep -qi "png\|jpeg\|image\|bitmap"; then
            echo "WARN: Downloaded file is not an image. Using default icon."
            exit 0
          fi

          # Copy icon to mipmap directories (use as-is, let Flutter handle sizing)
          for dir in android/app/src/main/res/mipmap-hdpi \
                     android/app/src/main/res/mipmap-mdpi \
                     android/app/src/main/res/mipmap-xhdpi \
                     android/app/src/main/res/mipmap-xxhdpi; do
            cp /tmp/app_icon.png "$dir/ic_launcher.png" 2>/dev/null || true
          done

          echo "Icon applied successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Install
        run: |
          flutter --version
          flutter doctor -v || true

      - name: Get Dependencies
        run: |
          echo "=== Getting Flutter dependencies ==="
          flutter pub get
          echo "Dependencies resolved."

      - name: Build APK
        run: |
          echo "=== Building WebView APK ==="
          echo "App Name: $INPUT_APP_NAME"
          echo "Web URL:  $INPUT_WEB_URL"

          flutter build apk --release 2>&1 | tee build_output.txt

          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "=== BUILD FAILED! ==="
            echo ""
            if [ -f build_output.txt ] && [ -s build_output.txt ]; then
              echo "Last 30 lines of build output:"
              tail -30 build_output.txt
              echo ""
              echo "Error lines:"
              grep -i "error\|failed\|exception" build_output.txt 2>/dev/null | tail -15 || echo "(no specific errors found)"
            else
              echo "No build output captured!"
            fi
            exit 1
          fi

          echo "APK built: $APK_PATH ($(du -sh "$APK_PATH" | cut -f1))"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-output
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Send APK to Telegram
        if: inputs.chat_id != '' && inputs.bot_token != ''
        run: |
          SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            CAPTION=$(printf 'Web2APK Build Selesai!\n\nApp: %s\nURL: %s\nSize: %s\n\nby Deruzuan Dev' "$SAFE_APP_NAME" "$INPUT_WEB_URL" "$SIZE")
            curl -s -X POST "https://api.telegram.org/bot${INPUT_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${INPUT_CHAT_ID}" \
              -F "document=@$APK" \
              -F "parse_mode=HTML" \
              --form-string "caption=$CAPTION"
          fi

      - name: Notify Failure
        if: failure()
        run: |
          ERROR_SUMMARY="Web2APK Build gagal"
          if [ -f build_output.txt ]; then
            ERROR_SUMMARY=$(grep -i "error\|failed\|exception" build_output.txt 2>/dev/null | head -5 | tr '\n' ' ')
            [ -z "$ERROR_SUMMARY" ] && ERROR_SUMMARY="Web2APK Build gagal (no specific error in log)"
          fi
          ERROR_SUMMARY=$(echo "$ERROR_SUMMARY" | cut -c1-500)

          if [ -n "$INPUT_CHAT_ID" ] && [ -n "$INPUT_BOT_TOKEN" ]; then
            SAFE_APP_NAME=$(echo "$INPUT_APP_NAME" | sed 's/[^a-zA-Z0-9 _.-]//g')
            MSG=$(printf 'Web2APK Build Gagal!\n\nApp: %s\nURL: %s\nError: %s' "$SAFE_APP_NAME" "$INPUT_WEB_URL" "$ERROR_SUMMARY")
            curl -s -X POST "https://api.telegram.org/bot${INPUT_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${INPUT_CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=$MSG"
          fi

          echo "BUILD FAILED"
          echo "Error summary: $ERROR_SUMMARY"
